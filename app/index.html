"Entre os carros.","A ultrapassagem pela direita é gravíssima e perigosa."],["p1m3q65",3,1,"O que deve fazer o condutor ao ver um ônibus parado para embarque ou desembarque de passageiros?","","Reduzir a velocidade e ficar atento a pedestres.","Passar rapidamente para não atrasar o trânsito.","Buzinar para alertar os passageiros.","Passar bem próximo do ônibus.","Quando um ônibus está parado para embarque ou desembarque de passageiros, o condutor deve ter atenção redobrada, reduzindo a velocidade e, se necessário, parando, para garantir a segurança dos pedestres e dos passageiros que estão no processo de embarque ou desembarque."],["p1m3q66",3,1,"O que é Licença de Aprendizagem?","","Licença que autoriza o candidato a começar as aulas práticas nas ruas, com instrutor.","Carteira definitiva que substitui a CNH.","Documento para comprar veículo com desconto.","Aplicativo para pagar multa.","A licença de aprendizagem é um documento que permite ao candidato dirigir sob a supervisão de um instrutor credenciado durante o processo de aprendizagem para obtenção da CNH"],["p1m3q67",3,0,"O que é manter distância segura?","","Deixar espaço suficiente na lateral e frontal entre o seu veículo e os demais, bem como em relação ao bordo da pista.","Andar muito próximo ao veículo da frente.","Reduzir a distância apenas em congestionamentos.","Ignorar o espaço lateral.","Conforme estabelece o Art. 29, inciso II do CTB, o condutor deverá guardar distância de segurança lateral e frontal entre o seu e os demais veículos, levando em conta, no momento, a velocidade e as condições do local, da circulação, do veículo e as condições climáticas. A técnica mais comum para garantir essa margem é a regra dos dois segundos, que assegura o tempo necessário para reação e frenagem sob condições normais, o que é fundamental para a Direção Defensiva."],["p1m3q68",3,0,"O que fazer ao avistar veículo de emergência com sirene e luz ligada?","","Dar passagem imediata e manter distância.","Acelerar para não atrapalhar.","Parar no meio da pista.","Continuar normalmente.","É obrigação dar prioridade aos veículos em serviço de urgência. Conforme estabelece o Art. 29, inciso VII do CTB, quando os dispositivos de alarme sonoro e iluminação intermitente estiverem acionados, os condutores dos demais veículos deverão deixar livre a passagem pela faixa da esquerda, deslocando-se para a direita da via e parando se for preciso. Além disso, o Art. 189 estabelece que não ceder passagem a veículos de emergência com prioridade é infração gravíssima."],["p1m3q69",3,0,"O que o condutor deve fazer antes de acessar uma garagem pela calçada?","","Reduzir a velocidade, sinalizar e garantir que não há pedestres.","Acelerar para entrar rápido.","Buzinar para avisar.","Parar sobre a calçada.","Os condutores devem sinalizar antes de conversões, bem como observar as preferências do trânsito."],["p1m3q70",3,0,"O que o condutor deve fazer ao dirigir em via com várias faixas no mesmo sentido?","","Circular pela faixa da direita se for mais lento e deixar a esquerda para ultrapassagens.","Circular sempre pela faixa da esquerda.","Alternar de faixa a todo momento para avançar mais rápido.","Seguir pelo meio da via, ignorando as faixas.","A faixa da direita é destinada aos veículos mais lentos, a da esquerda, às ultrapassagens."],["p1m3q71",3,0,"O que o condutor deve fazer ao sair de um imóvel para acessar a via pública?","","Ceder passagem aos veículos que estão na via e para os pedestres que já circulam.","Acelerar para entrar antes.","Ultrapassar pela calçada.","Forçar a entrada.","Ao acessar uma via, o condutor deve observar as regras de preferência e realizar as devidas sinalizações."],["p1m3q72",3,0,"O que o condutor deve fazer ao sair de uma vaga próxima à escola, com muitos pedestres por perto?","","Sinalizar antes, sair devagar e garantir que não há pedestres atrás ou na lateral.","Sair rápido para não travar o fluxo.","Buzinar antes de arrancar.","Ir de ré até o cruzamento.","A sinalização e a saída lenta reduzem o risco de atropelamento."],["p1m3q73",3,0,"O que o condutor deve fazer ao ver um agente de trânsito controlando o fluxo em frente à escola?","","Obedecer ao agente, mesmo que o semáforo indique o contrário.","Ignorar o agente e seguir o semáforo.","Buzinar para pedir passagem.","Fazer retorno e evitar o local.","A autoridade do agente prevalece temporariamente sobre a sinalização."],["p1m3q74",3,0,"O que significa conduta segura no trânsito?","","Agir com atenção, cortesia e respeito às normas.","Fazer manobras rápidas para ganhar tempo.","Seguir apenas o fluxo dos outros.","Dirigir com pressa sempre que possível.","A segurança depende do comportamento de todos no trânsito."],["p1m3q75",3,0,"O ônibus sinalizou que vai sair do ponto, e você está na faixa ao lado. Qual deve ser a sua conduta?","","Reduzir, permitir a saída com segurança e retomar o fluxo.","Acelerar para impedir a saída.","Fechar a frente do ônibus.","Buzinar para ele esperar.","Prerrogativa operacional favorece a fluidez do sistema."],["p1m3q76",3,0,"Para que servem os bolsões destinados a motociclistas nos semáforos?","","Para oferecer um espaço seguro à frente dos demais veículos, facilitando a visualização e a partida na abertura do sinal.","Para permitir que os motociclistas avancem o sinal vermelho com mais rapidez.","Para estacionar as motocicletas enquanto o condutor realiza pequenas tarefas.","Para separar motociclistas dos demais veículos apenas por estética ou organização visual.","Aumenta a segurança e a visibilidade no cruzamento."],["p1m3q77",3,0,"Para conduzir um ciclomotor, qual é a habilitação mínima exigida?","","ACC ou Categoria A, conforme o veículo.","Não precisa de habilitação.","Qualquer documento serve.","Somente categoria B.","Exigência legal de ACC/A."],["p1m3q78",3,0,"No Brasil, o que a pessoa precisa possuir para poder dirigir carro ou motocicleta?","","Precisa ter documento de habilitação válido: CNH ou Permissão para dirigir.","Precisa só saber dirigir de ouvido, sem documento.","Precisa da nota fiscal do veículo no porta-luvas.","Precisa de uma autorização escrita do vizinho.","Habilitação é de porte obrigatório."],["p1m3q79",3,1,"Para que serve a faixa da esquerda em uma via de múltiplas faixas de rolamento?","","Para ultrapassar e para quem circula mais rápido, respeitando a lei e a sinalização.","Para estacionar rápido.","Para pedestres andarem.","Para bicicletas apenas.","Uso correto das faixas."],["p1m3q80",3,1,"João está conduzindo um carro em uma rotatória. O que ele deve fazer para sair na avenida desejada?","","Ligar a seta com antecedência e deslocar-se para a faixa da saída com cuidado.","Cortar todas as faixas de uma vez.","Parar dentro da rotatória e pensar.","Sair sem seta, pois todos vão entender.","Ao se aproximar de uma rotatória e desejar sair nela, o motorista deve sinalizar a sua intenção com a seta. Isso é fundamental para garantir a segurança, permitindo que os outros motoristas e pedestres saibam para qual direção o veículo vai seguir, evitando colisões e promovendo o fluxo ordenado do trânsito."],["p1m3q81",3,0,"Pedro conduz sua motocicleta em uma via quando um pedestre sinaliza que vai atravessar na faixa de pedestres. O que Pedro deve fazer?","","Parar e dar a preferência, esperando a travessia segura.","Passar rápido antes do pedestre atravessar a via.","Desviar pela calçada.","Buzinar para ele correr.","Os pedestres que estiverem atravessando a via sobre as faixas delimitadas para esse fim terão prioridade de passagem, exceto nos locais com sinalização semafórica, onde deverão ser respeitadas as disposições deste Código. Art. 70 do CTB"],["p1m3q82",3,0,"Uma pessoa com deficiência pode dirigir?","","Sim, se forem habilitadas e o veículo tiver as adaptações necessárias.","Não, elas não podem dirigir veículos.","Não, a legislação não permite.","Sim, mas somente em estradas vazias.","Acessibilidade garantida."],["p1m3q83",3,2,"Por que é importante saber em qual tipo de via você está?","","Porque isso define a velocidade máxima, a forma de circular, a atenção a pedestres/ciclistas e as regras de segurança.","Só para escolher música.","Só para pagar pedágio.","Só para decorar nomes de ruas.","É fundamental saber em qual tipo de via você está, pois isso define as regras de trânsito que devem ser seguidas, como os limites de velocidade, a necessidade de observar sinais específicos (como os de parada obrigatória ou faixas exclusivas), além de outras regulamentações. Cada tipo de via tem regras próprias para garantir a segurança no trânsito e o fluxo adequado de veículos."],["p1m3q84",3,0,"Por que é perigoso estacionar muito próximo à esquina?","","Porque dificulta a visão de quem sai da via transversal.","Porque atrapalha apenas pedestres.","Porque é mais difícil sair da vaga.","Porque gasta mais combustível.","A falta de visibilidade aumenta o risco de colisões."],["p1m3q85",3,0,"Por que o motociclista deve evitar andar ao lado de caminhões e ônibus?","","Porque esses veículos têm pontos cegos, onde o condutor não vê a moto.","Porque é mais devagar.","Porque gasta mais combustível.","Porque o barulho é alto.","Ficar fora do campo de visão dos motoristas é perigoso."],["p1m3q86",3,0,"Qual a função da via arterial?","","Conecta regiões, possui semáforos e cruzamentos, tem velocidade máxima de 60 km/h","Nenhum cruzamento e acesso proibido.","Aquela utilizada apenas por pedestres.","É a via de terra sem sinalização.","Função definida no anexo do CTB."],["p1m3q87",3,1,"Qual a validade da Permissão Para Dirigir ?","","1 ano, depois será expedida a CNH ou ACC, se o condutor preencher os requisitos.","6 meses, desde que o condutor não tenha cometida uma infração leve.","5 anos para qualquer pessoa.","Só até passar na prova de direção.","Art. 148, § 2º do CTB."],["p1m3q88",3,0,"Qual comportamento é esperado perto de escolas nos horários de entrada e saída dos alunos?","","Dirigir devagar, sem ultrapassar, e prestar atenção na travessia dos alunos.","Buzinar para abrir caminho.","Parar em fila dupla pelo tempo necessário.","Estacionar sobre a faixa de pedestres.","O condutor deve observar as regras específicas para locais determinados."],["p1m3q89",3,0,"Qual deve ser a atitude do condutor ao ver crianças perto de uma faixa de pedestres?","","Reduzir imediatamente e preparar-se para parar.","Seguir normalmente porque elas ainda não estão na faixa.","Buzinar para acelerar a travessia.","Acelerar antes que atravessem.","O condutor deve estar sempre atento aos arredores e garantir a segurnaça da via."],["p1m3q90",3,0,"Qual atitude deve ser tomada pelo condutor que vai virar à direita?","","Permanecer próximo à borda direita da pista.","Ficar no centro da via.","Ficar na faixa da esquerda.","Ficar em qualquer faixa.","O condutor deve se aproximar do lado direito com antecedência."],["p1m3q91",3,0,"Qual é a atitude correta ao ser ultrapassado?","","Manter a velocidade ou reduzir, sem acelerar.","Aumentar a velocidade para impedir a ultrapassagem.","Fechar a passagem.","Mudar de faixa repentinamente.","A cortesia e o respeito à segurança exigem manter ou reduzir a velocidade."],["p1m3q92",3,2,"Qual é a conduta incorreta do motociclista ao se aproximar de pedestres na via?","","Buzinar alto para avisar.","Reduzir e dar passagem.","Manter distância lateral.","Sinalizar qualquer manobra.","O uso agressivo da buzina causa susto e aumenta o risco de sinistros."],["p1m3q93",3,2,"Qual é a diferença entre parada e estacionamento?","","A parada é rápida para embarque ou desembarque, o estacionamento é por tempo maior.","A parada é quando se apaga o motor.","O estacionamento é feito só em garagens.","Não há diferença.","A parada é momentânea, o estacionamento é mais demorado. Glossário do CTB"],["p1m3q94",3,1,"Quando há chuva forte, o condutor deve:","","Aumentar a distância do veículo que trafega à sua frente e reduzir a velocidade.","Manter a velocidade normal.","Ultrapassar rápido para não ficar atrás.","Parar no meio da via.","A distância e o controle do veículo são fundamentais em condições adversas."],["p1m3q95",3,1,"Quando há ciclovia ou ciclofaixa, o motociclista deve:","","Respeitar o espaço, sem trafegar nem estacionar sobre ela.","Passar devagar pela ciclofaixa.","Usar para desviar do trânsito.","Parar para esperar o sinal.","Transitar com o veículo em calçadas, passeios, passarelas, ciclovias, ciclofaixas, ilhas, refúgios, ajardinamentos, canteiros centrais e divisores de pista de rolamento, acostamentos, marcas de canalização, gramados e jardins públicos. Art. 193 do CTB"],["p1m3q96",3,1,"Quando há faixa da direita exclusiva para ônibus, o ciclomotor deve circular:","","Na faixa ao lado, adjacente à exclusiva.","Na faixa do ônibus.","No corredor entre faixas.","Na calçada.","O ciclomotor não pode usar a faixa exclusiva."],["p1m3q97",3,0,"Quando o condutor deve usar a seta?","","Sempre que for mudar de faixa, de direção ou entrar/sair de uma via.","Apenas em avenidas.","Só quando houver pedestres.","Apenas durante o dia.","A seta é um instrumento essencial de comunicação."],["p1m3q98",3,2,"Quando termina a validade da Permissão para Dirigir, o que acontece?","","Se tudo estiver correto, é emitida a CNH ou a ACC, conforme o caso","O condutor deve repetir todo o processo de habilitação.","A permissão perde a validade e o condutor fica impedido de dirigir por um ano.","A Permissão vira documento de identidade do carro.","Essa regra está prevista no art. 148 do CTB e tem como objetivo avaliar o comportamento do novo condutor, garantindo que apenas quem demonstrou responsabilidade no trânsito receba a CNH definitiva."],["p1m3q99",3,1,"Quando um ônibus está parado para embarque ou desembarque, o que o condutor deve fazer ao passar ao lado?","","Reduzir a velocidade, ficar atento e parar, se necessário, para proteger pedestres.","Acelerar para sair logo.","Buzinar para o pedestre correr.","Passar colado ao ônibus.","Prevenção de atropelamentos."],["p1m3q100",3,0,"Quando um pedestre inicia a travessia na faixa de pedestres, o condutor deve:","","Parar o veículo e aguardar o pedestre concluir a travessia.","Acelerar para passar antes.","Buzinar e seguir.","Ignorar se estiver com pressa.","Os pedestres que estiverem atravessando a via sobre as faixas delimitadas para esse fim terão prioridade de passagem, exceto nos locais com sinalização semafórica, onde deverão ser respeitadas as disposições do CTB. Art. 70 do CTB"],["p1m3q101",3,0,"Quem deve usar as faixas da direita em vias com várias faixas no mesmo sentido?","","Veículos mais lentos e de maior porte.","Motocicletas sempre.","Quem estiver com pressa.","Só ônibus.","Forma de respeitar o fluxo e evitar conflitos."],["p1m3q102",3,0,"Quem tem a preferência de passagem em uma rotatória?","","Quem já está circulando dentro dela.","Quem está se aproximando da entrada.","O veículo maior.","O mais rápido.","A prioridade é de quem já circula dentro da rotatória. Art. 29, inciso III, alínea b."],["p1m3q103",3,0,"Quem tem prioridade numa rotatória?","","Os veículos que já estão circulando na rotatória.","Quem está chegando mais rápido.","Quem vem da esquerda.","Quem liga o pisca-alerta.","A prioridade é de quem já circula dentro da rotatória. Art. 29, inciso III, alínea b."],["p1m3q104",3,1,"Ao sair de uma via de trânsito rápido para uma via arterial com semáforo e área comercial, o que deve ser feito?","","Reduzir, preparar-se para parar em semáforos, observar acessos laterais e travessias, e adequar-se à velocidade da arterial (60 km/h).","Manter 80 km/h e passar no semáforo com a luz amarela sempre.","Ligar farol alto e buzinar para os outros veículos.","Seguir no acostamento para ir mais rápido.","Transição exige mudança de comportamento e velocidade."],["p1m3q105",3,0,"O semáforo está verde, mas um pedestre atravessa correndo em frente a uma escola. O que o condutor deve fazer?","","Parar o veículo e deixar o pedestre concluir a travessia.","Seguir porque o sinal está verde.","Acelerar para não perder o tempo.","Buzinar para ele correr mais rápido.","O condutor deve observar as preferências da via."],["p1m3q106",3,0,"Se um condutor quiser mudar de direção, ele deve:","","Sinalizar com antecedência e reduzir a velocidade.","Sinalizar só no momento da curva.","Acelerar e virar rápido.","Parar antes da curva.","Antecipar a intenção evita acidentes."],["p1m3q107",3,1,"Você comprou um carro usado e se mudou para outro município. Qual é o procedimento correto a seguir?","","Transferir a propriedade em até 30 dias e comunicar imediatamente a mudança de município para expedição do novo Certificado de Registro do Veículo.","Trocar os pneus e avisar todos os parentes.","Esperar completar um ano para avisar aos órgãos de trânsito.","Não precisa fazer nada se já pagou o IPVA do veículo.","Combina dois deveres previsto no CTB, transferência de propriedade e mudança de residência."],["p1m3q108",3,1,"A Permissão para Dirigir de João venceu após um ano, e ele teve uma infração leve nesse período. O que acontece agora?","","Por não ter comitido nenhuma infração de natureza grave ou gravíssima ou seja reincidente em infração média, será emitida a CNH de João.","Ele perde todo o processo de habilitação e volta ao início automaticamente.","Ele precisa refazer o curso teórico e as aulas práticas obrigatoriamente.","A PPD vale para sempre, mesmo sem receber a CNH.","Permissão para dirigir é etapa anterior à CNH. Art. 148, § 3º do CTB."],["p1m3q109",3,0,"Trafegar com motocicleta pelo acostamento é:","","Proibido e considerado infração gravíssima.","Permitido se for por pouco tempo.","Permitido em rodovia.","Permitido se não houver trânsito.","Acostamento não é área de circulação, sendo infração, nos termos do art. 193 do CTB."],["p1m3q110",3,1,"Um condutor de ciclomotor deve ter:","","ACC ou habilitação de categoria A.","Qualquer tipo de documento.","Somente RG e CPF.","CNH na categoria C, D ou E.","A categoria ACC é específica para ciclomotores."],["p1m3q111",3,0,"Um motorista entra em uma rotatória sem reduzir a velocidade e causa um sinistro. Qual regra ele descumpriu?","","Deve ceder a passagem a quem já está circulando dentro dela.","A de sinalizar a saída.","A de manter distância lateral.","A de usar o farol baixo.","A prioridade pertence a quem já estava na rotatória. Art. 29, inciso III, alínea b."],["p1m3q112",3,0,"Um veículo de emergência se aproxima com sirene e luzes ligados. O que o condutor deve fazer?","","Dar passagem e facilitar a manobra com segurança.","Continuar com a mesma velocidade e não dar passagem.","Acelerar para ir na frente.","Parar no meio da pista.","Veículos destinados a socorro de incêndio e salvamento possuem preferência no trânsito. Art. 29, VII, do CTB."],["p1m3q113",3,0,"Um veículo de emergência se aproxima por trás com sirene e luzes ligados. Qual é a atitude correta do condutor?","","Reduzir a velocidade e dar preferência de passagem.","Seguir na mesma faixa e velocidade.","Acelerar para abrir caminho.","Buzinar para os outros veículos.","Veículos destinados a socorro de incêndio e salvamento possuem preferência no trânsito. Art. 29, VII, do CTB."],["p1m3q114",3,1,"Veículos sobre trilhos (bonde/VLT) em cruzamento têm:","","Preferência de passagem, os condutores devem parar e aguardar.","Não possuem prioridade, quem chegar primeiro pode passar.","Menor prioridade por serem grandes.","Prioridade só se houver passageiros.","Veículos que se deslocam por trilho têm preferência no trânsito, conforme art. 29, XII, do CTB."],["p1m3q115",3,2,"Via arterial e via coletora. Qual a principal diferença para o condutor?","","Na arterial a velocidade é maior (60 km/h) e há grande fluxo, na coletora a velocidade é 40 km/h e ela distribui o trânsito para vias locais.","As duas são iguais, com as mesmas regras de condução.","A via coletora é mais rápida que a arterial.","Via arterial é a via rural, geralmente de terra.","Função e velocidade distintas, conforme anexo do CTB."],["p1m3q116",3,2,"Você vai fazer retorno em avenida com canteiro central e retorno sinalizado com faixa de desaceleração. Um motorista corta pela direita, fora da faixa, para entrar antes. Qual é a avaliação correta?","","Conduta errada e perigosa, o acesso deve ser apenas pela faixa de desaceleração.","Correta, pois chega mais rápido.","Correta, se der seta.","Correta, se olhar só o retrovisor.","Deve ser respeitado o desenho das vias para evitar colisões."],["p1m3q117",3,1,"A prática de costurar no trânsito com a motocicleta, realizando manobras em zigue-zague entre os veículos, representa:","","Um risco, pois urpreende os outros condutores, invade pontos cegos e aumenta muito o risco de batida lateral.","Economia de tempo, por que vai mais rápido em relação aos outros veículos.","Habilidade do condutor.","A preferência por estar mais rápido, obrigado os demais veículos a abrir espaço.","O condutor deve obsrevar as preferências da via e seguir na velocidade permitida."],["p1m3q118",3,2,"Em quais situações o condutor é obrigado a realizar o Curso de Reciclagem, além daquelas decorrentes de uma penalidade de suspensão ou cassação?","","Quando ele comete infração cuja penalidade é a suspensão da CNH- quando se envolve em sinistro grave- quando é condenado por crime de trânsito- quando é flagrado colocando o trânsito em risco.","Só quando fizer prova teórica.","Em multas leves.","Somente a cada 5 anos.","Conforme estabelece o Art. 268 do CTB, o condutor será submetido a curso de reciclagem e a exame de avaliação não apenas quando suspenso do direito de dirigir, mas também quando se envolver em acidente grave (sinistro) para o qual tenha contribuído, ou quando for condenado judicialmente por delito de trânsito."],["p1m3q119",3,1,"Antes de iniciar uma manobra de ultrapassagem, quais são as principais verificações que o condutor deve realizar?","","Se ninguém atrás iniciou ultrapassagem, se o da frente não vai ultrapassar outro, e se a faixa oposta está livre a distância segura.","Só se o carro é potente.","Se há vaga para parar após a manobra.","Se a música está alta.","A ultrapassagem deve ser feita obedecendo à sinalização regulamentar (locais permitidos). Além disso,mexige que o condutor que queira executar uma manobra deve certificar-se de que pode executá-la sem perigo para os demais usuários da via. A Direção Defensiva exige que se verifique o tráfego à frente (espaço e tempo) e o tráfego atrás (se outro veículo já iniciou a ultrapassagem) antes de sinalizar e iniciar a manobra."],["p1m3q120",3,2,"Ao entrar em uma rodovia, vindo de uma via de acesso ou via secundária, quem possui a obrigatoriedade de ceder a passagem, conforme o CTB?","","Quem está entrando- deve aguardar a brecha segura.","Quem já está na rodovia.","Caminhões sempre.","Ninguém- é disputa.","Conforme estabelece o Art. 29, inciso III, alínea \"a\" do CTB, nos locais não sinalizados, a preferência de passagem é de quem estiver circulando pela rodovia. O condutor que ingressa na rodovia, vindo da via de acesso ou vicinal, deve usar a faixa de aceleração (se houver) e aguardar o momento seguro para se integrar ao fluxo, cedendo a preferência aos veículos que já estão circulando na via principal."],["p1m3q121",3,2,"Em uma via de dois sentidos de circulação, ao realizar a conversão à direita, qual deve ser o posicionamento correto do veículo na pista?","","Aproximar do bordo direito, sinalizar e reduzir a velocidade.","Ficar no meio e virar de repente.","Aproximar do eixo da pista.","Entrar sem sinalizar.","Conforme estabelece o Art. 38, inciso I do CTB, antes de realizar a manobra de conversão à direita, o condutor deverá aproximar-se o máximo possível da margem direita da pista, garantindo que a manobra seja feita com segurança e de forma a não obstruir a circulação dos demais veículos."],["p1m3q122",3,2,"Em uma via de dois sentidos de circulação, ao realizar a conversão à esquerda, onde o veículo deve ser posicionado na pista?","","Próximo ao eixo da pista, sinalizando e aguardando brecha segura.","Colado no meio-fio direito.","Em qualquer lugar, se for rápido.","Em cima da faixa de pedestres.","Antes de virar à esquerda em uma via de sentido duplo, o condutor deverá aproximar-se o máximo possível do eixo central da pista, respeitando a sinalização. Esse posicionamento é crucial para realizar a conversão com segurança e em ângulo correto, sem invadir indevidamente a contramão."],["p1m3q123",3,1,"Qual é a conduta obrigatória do motorista ao realizar a manobra de ultrapassagem de um ciclista na via?","","Reduzir a velocidade, manter distância lateral segura e retomar a faixa sem apertar o ciclista.","Passar colado para “ensinar”.","Buzinar atrás até ele sair.","Forçar para ele ir para a calçada.","Proteção ao vulnerável e respeito ao espaço. Conforme estabelece o Art. 201 do CTB, deixar de guardar a distância lateral de um metro e cinquenta centímetros ao ultrapassar bicicleta é infração média, sujeita a multa. Adicionalmente, o Art. 29, § 2º, reforça que os veículos de maior porte (o motorizado) são responsáveis pela segurança dos menores (a bicicleta), o que exige a redução de velocidade e a máxima cautela na manobra."],["p1m3q124",3,2,"Em um bairro residencial, onde há crianças brincando e pessoas circulando de bicicleta, qual é o tipo de via?","","Via local","Via rápida","Via coletora","Rodovia","a via local é aquela destinada ao acesso a residências, comércios ou propriedades, onde o fluxo de veículos é baixo e a prioridade é a segurança dos pedestres e ciclistas."],["p1m3q125",3,2,"Um motorista para o carro sobre o canteiro central para atender o celular. A conduta do motorista está correta?","","Não. Pois é proibido parar sobre o canteiro central","Sim, porque o canteiro é gramado.","Sim, desde que ele esteja com o pisca-alerta ligado.","Sim, mas somente se for rápido.","É proibido estacionar no passeio ou sobre faixa destinada a pedestre, sobre ciclovia ou ciclofaixa, bem como nas ilhas, refúgios, ao lado ou sobre canteiros centrais, divisores de pista de rolamento, marcas de canalização, gramados ou jardim público. Art. 181, inciso VIII do CTB"],["p1m3q126",3,1,"Em uma rodovia sinalizada com velocidade máxima de 100 km/h, começa a chover forte. O que o condutor deve fazer?","","Reduzir a velocidade, aumentar distância e manter farol baixo, mesmo que o limite da placa seja maior.","Manter 100 km/h porque a placa obriga.","Ligar farol alto e acelerar.","Parar no canteiro central.","O condutor deve manter velocidade compatível com as condições."],["p1m3q127",3,1,"Em uma rodovia, o pneu do veículo fura. Onde o condutor deve parar com segurança?","","No acostamento, sinalizar e resolver a emergência em segurança.","No meio da faixa rápida.","Em cima do canteiro central.","Na faixa de pedestre.","O condutor deve usar acostamentos para emergências."],["p1m3q128",3,1,"Em uma via local, um carro utiliza o acostamento para realizar uma ultrapassagem. Essa atitude é:","","Errada e perigosa. Acostamento não é faixa de ultrapassagem.","Correta, porque é mais rápido.","Correta, se der seta.","Correta, se buzinar.","Acotamento não são utilizados para circulação, apenas para emergências."],["p1m3q129",3,2,"Ao sair de uma via coletora e acessar uma via local, o que muda para o condutor?","","O limite de velocidade diminui e o motorista deve redobrar a atenção aos pedestres e ciclistas","O limite de velocidade aumenta, pois há menos pedestres.","O trânsito se torna mais rápido e com menos regras de circulação.","Não há nenhuma mudança nas condições de tráfego.","Ao passar de uma via coletora (que distribui o tráfego das vias arteriais para as vias locais) para uma via local, o condutor entra em uma área de menor fluxo de veículos e maior presença de pedestres, ciclistas e acessos a residências."],["p1m3q130",3,1,"Ao avistar faixas brancas, em formato de “zebra”, à sua frente, o que o condutor deve fazer?","","Diminuir a velocidade e parar o veículo para permitir a travessia do pedestre.","Acelerar para passar antes do pedestre.","Parar sobre a faixa para “marcar lugar”.","Buzinar para apressar os pedestres","Preferência do pedestre na faixa."],["p1m3q131",3,2,"Quando um ciclista cruza a rua na faixa de pedestres empurrando a bicicleta, o que o condutor deve fazer?","","Parar o veículo e permitir que o ciclista conclua a travessia com segurança.","Buzinar para ele correr.","Acelerar para passar antes.","Passar “colado” para assustar.","Quando o ciclista desmonta da bicicleta e a empurra, ele passa a ser considerado pedestre, conforme o artigo 68, §1º do Código de Trânsito Brasileiro (CTB)."],["p1m3q132",3,1,"Durante a ultrapassagem, o que o condutor deve fazer?","","Sinalizar, manter distância lateral, e retornar à faixa de origem com segurança, sinalizando de novo.","Apagar as luzes para não ser visto.","Passar com veículo bem próximo ao outro para ganhar tempo.","Retornar imediatamente sem olhar para os arredores.","O condutor deve sinalizar as manobras e manter espaço para evitar colisões."],["p1m3q133",3,1,"Durante o período de um ano da Permissão para Dirigir, o que o novo condutor pode fazer?","","Pode dirigir o veículo da categoria para qual se habilitou, sem instrutor, cumprindo todas as leis de trânsito.","Pode ensinar outras pessoas a dirigir, mesmo sem autorização do órgão de trânsito.","Pode dirigir sem documentos porque é novo no trânsito.","Pode ignorar as infrações de trânsito, pois foi recém habilitado.","Permissão para dirigir concede condição de condutor."],["p1m3q134",3,1,"É correto parar na contramão para desembarcar passageiro?","","Não. Além de ser perigoso, é configurado como infração de trânsito.","Sim, se for rápido.","É permitido, desde que ligue o pisca-alerta.","É permitido após as 22h.","Parada e estacionamento devem respeitar o sentido da via."],["p1m3q135",3,1,"Em área urbana sem calçada, há pedestres no bordo da pista. O condutor deve:","","Reduzir, manter distância lateral e passar com muito cuidado.","Acelerar para passar rápido.","Buzinar alto até o pedestre sair.","Forçar o pedestre a subir no meio-fio.","O condutor deve proteger os mais vulneráveis."],["p1m3q136",3,1,"Em estrada rural, um grupo caminha no sentido contrário ao tráfego. O que o motorista deve fazer?","","Reduzir, manter distância lateral e seguir só quando houver espaço seguro.","Passar perto para “não sujar do lado esquerdo”.","Buzinar e manter a mesma velocidade.","Passar pelo acostamento em alta velocidade.","Conforme estabelece o Art. 68, § 3º do CTB, nas vias rurais, quando não houver acostamento ou quando não for possível utilizá-lo, a circulação de pedestres na pista de rolamento deve ser feita com prioridade sobre os veículos, pelos bordos da pista, em fila única e em sentido contrário ao deslocamento dos veículos. Dessa forma, o motorista deve reduzir a velocidade (Art. 220, XIII) e ter máxima cautela, deslocando-se de forma segura para a faixa oposta (se livre) para ceder a passagem e manter a distância de segurança."],["p1m3q137",3,2,"Em uma via com faixa dupla onde uma motocicleta está lado a lado com um ônibus e a pista afunila à frente, qual é a decisão mais segura que o motociclista deve tomar?","","Reduzir e ficar atrás do ônibus, saindo do ponto cego e evitando ser comprimido no estreitamento.","Acelerar para “fechar” o ônibus.","Ficar ao lado, entre a guia e o ônibus.","Subir no canteiro para escapar.","O condutor deve guardar distância de segurança lateral e frontal, levando em conta as condições da via. A manobra lado a lado (ultrapassagem ou \"corredor\" inadequado) em um afunilamento cria um risco iminente de colisão lateral, onde o veículo maior (ônibus) leva vantagem. A decisão segura e legal exige que o motociclista cesse o movimento lado a lado e retome a distância de segurança, cedendo espaço ao veículo maior."],["p1m3q138",3,1,"João chega a um cruzamento sem sinalização. À direita, há um carro parado aguardando, e à esquerda, um veículo se aproxima. O que João deve fazer?","","Aguardar o da direita passar- depois, se seguro, seguir.","Passar na frente do da direita porque ele está parado.","Forçar a passagem porque o da esquerda está longe.","Ir devagar no meio para ver quem cede.","Conforme estabelece o Art. 29, inciso III, alínea \"c\" do CTB, em um cruzamento não sinalizado onde nenhuma das regras de preferência (rodovia ou rotatória) se aplique, a preferência de passagem é do veículo que vier pela direita do condutor. Portanto, João deve parar e ceder a preferência ao carro que está à sua direita, independentemente do carro à esquerda."],["p1m3q139",3,2,"Cenário: Maria trafega na faixa da esquerda acompanhando o fluxo. Outro veículo se aproxima por trás, sinaliza e pede passagem. De acordo com o CTB, qual é a conduta obrigatória de Maria nesse momento?","","Sinaliza e vai para a direita quando houver espaço seguro, sem acelerar.","Acelera para “segurar a faixa”.","Freia de propósito.","Joga o carro para o acostamento.","Conforme estabelece o Art. 198 do CTB, deixar de dar passagem pela faixa da esquerda, quando solicitado, é infração média, sujeita a multa. A regra de circulação fundamental, prevista no Art. 29, inciso IV, é que \"quando uma pista de rolamento comportar várias faixas de circulação no mesmo sentido, as da direita são destinadas ao deslocamento dos veículos mais lentos e de maior porte, e as da esquerda, destinadas à ultrapassagem e aos veículos de maior velocidade.\" Assim, Maria tem a obrigação legal de desocupar a faixa da esquerda para o veículo que demonstra maior velocidade."],["p1m3q140",3,1,"Maria quer apresentar documento de habilitação digital ao agente. Ela pode?","","Sim. O documento de habilitação pode ser apresentado no celular, desde que válido e legível.","Não. Só papel plastificado é aceito.","Somente foto do documento vale.","Só vale se mandar por mensagem depois.","Versão digital tem validade legal."],["p1m3q141",3,0,"Na pista de rolamento você deve:","","Circular respeitando faixas e regras de ultrapassagem.","Parar para conversar no meio.","Usar para vender produtos.","Brincar com crianças.","Faixa destinada ao movimento dos veículos."],["p1m3q142",3,1,"Em um cruzamento com semáforo que possui uma área de espera avançada (bolsão) destinada a motociclistas, qual é a conduta correta do motociclista ao parar no sinal vermelho?","","Avançar até o bolsão quando o sinal estiver vermelho, parar dentro dele e sair na abertura do verde com atenção aos pedestres.","Parar sobre a faixa de pedestres.","Ultrapassar pela calçada para chegar primeiro.","Ficar entre os carros, com o guidão sobre os retrovisores.","Conforme estabelecido pela engenharia de tráfego e pela regulamentação do CONTRAN (que trata da sinalização horizontal), o bolsão é uma área de segurança e ordenamento criada para que as motocicletas se posicionem à frente dos carros enquanto aguardam o sinal verde. O objetivo é aumentar a visibilidade dos motociclistas e evitar que fiquem espremidos entre veículos maiores, minimizando riscos de acidentes e promovendo a fluidez no início do movimento. Utilizar o bolsão corretamente é uma obrigação de circulação para a categoria, visando sua própria segurança."],["p1m3q143",3,1,"No sinal vermelho, onde a motocicleta deve parar?","","Antes da linha de retenção, sem ocupar a faixa de pedestres.","Em cima da faixa de pedestres.","Já dentro da travessia, para sair mais rápido.","No meio da interseção.","Linha de retenção protege a travessia."],["p1m3q144",3,2,"O ciclomotor pode entrar em via de trânsito rápido ou rodovia?","","Não. Deve evitar essas vias- use vias locais/coletoras- bordo direito quando não houver espaço próprio.","Pode, se tiver ACC.","Pode, se estiver de colete refletivo.","Pode, se ficar no corredor.","Conforme estabelece o Art. 57 do CTB, os ciclomotores devem ser conduzidos pela direita da pista de rolamento, de preferência no centro da faixa mais à direita ou no acostamento, quando houver. Contudo, o Parágrafo único do mesmo artigo proíbe expressamente a circulação de ciclomotores nas vias de trânsito rápido e nas rodovias, salvo onde houver acostamento e se houver autorização da autoridade de trânsito."],["p1m3q145",3,1,"O motociclista pode ultrapassar pelo acostamento?","","Não. É infração gravíssima e muito perigoso.","Sim, se estiver com pressa.","Sim, se não houver fiscalização.","Sim, desde que use buzina.","Conforme estabelece o Art. 202, inciso I do CTB, ultrapassar veículos pelo acostamento em estradas ou rodovias é considerado infração gravíssima, sujeita a multa e suspensão do direito de dirigir. O acostamento é destinado apenas à parada ou estacionamento de veículos em emergência (Art. 46) e deve ser utilizado pelos veículos que precisam ceder passagem ou pelo trânsito de pedestres e bicicletas, mas nunca para manobras de ultrapassagem."],["p1m3q146",3,1,"O motociclista vai virar à direita cruzando uma ciclofaixa. Qual passo seguro?","","Sinalizar, reduzir e só cruzar a ciclofaixa quando não vier ciclista.","Acelerar para “ganhar a frente”.","Cortar a ciclofaixa sem olhar.","Usar a ciclofaixa como faixa de espera.","Conforme estabelece o Art. 38, Parágrafo único do CTB, o condutor que for realizar manobra de mudança de direção (conversão à direita) deve ceder passagem aos pedestres e ciclistas que estejam atravessando a via. Além disso, o Art. 214, inciso I, define como infração gravíssima não dar preferência ao ciclista que estiver em sua faixa (ciclofaixa). Portanto, o motociclista deve obrigatoriamente parar ou reduzir, sinalizar a intenção e só realizar a conversão após ter certeza de que a ciclofaixa está livre."],["p1m3q147",3,1,"O motorista precisa invadir parcialmente a outra faixa para manter 1,5 m do ciclista. O que fazer?","","Só ultrapassar quando houver espaço e visibilidade, sinalizando- se não houver, aguarde.","Passar espremendo o ciclista.","Buzinar e seguir colado.","Subir no canteiro.","Conforme estabelece o Art. 201 do CTB, a obrigatoriedade de manter a distância lateral mínima de 1,50 m ao ultrapassar ciclista deve ser cumprida. Se a faixa de trânsito não permitir essa margem de segurança dentro dos seus limites, o condutor deve utilizar parte da faixa adjacente ou até mesmo mudar integralmente de faixa (Art. 29, IX) após sinalizar e verificar que a manobra é segura e não prejudica o fluxo dos demais veículos (Art. 34 e Art. 35 do CTB)."],["p1m3q148",3,1,"O que é ACC?","","Autorização para Conduzir Ciclomotor- é um tipo de documento de habilitação.","Autorização para Conduzir Caminhão.","Autorização para Comprar Carro.","Autorização para Correr em pista.","Conforme estabelece o Art. 140, § 2º do CTB, os condutores de ciclomotores (veículos de duas ou três rodas com até cinquenta centímetros cúbicos) devem possuir Autorização para Conduzir Ciclomotor (ACC) ou a Carteira Nacional de Habilitação na Categoria A. A ACC é um documento específico para esta categoria de veículo, sendo um dos requisitos para a condução legal."],["p1m3q149",3,1,"O que é uma estrada?","","Via rural sem pavimentação (terra/cascalho)- usada para áreas rurais- máxima 60 km/h.","É avenida com semáforo.","Rodovia com pedágio.","Rua de bairro.","Estrada é classificada como uma via rural não pavimentada. Sua distinção principal em relação à Rodovia (que é a via rural pavimentada) reside justamente na ausência de revestimento asfáltico ou de concreto."],["p1m3q150",3,1,"O que é uma rodovia?","","Via rural pavimentada (asfalto/concreto) que liga cidades e estados- velocidades costumam ser de 80 a 110 km/h, conforme sinalização.","Rua de bairro sem calçada.","Via rural de terra.","Calçada larga para pedestres.","Rodovia é classificada como uma via rural pavimentada. Sua distinção fundamental em relação à Estrada é a presença de pavimentação, o que implica, geralmente, maiores limites de velocidade e uma engenharia que permite maior fluxo e segurança."],["p1m3q151",3,1,"Marcos está trafegando por uma área escolar quando vê algumas crianças próximas à calçada. O que Marcos deve fazer?","","Reduzir ainda mais a velocidade e ficar pronto para parar caso seja necessário.","Buzinar para as crianças saírem.","Passar colado para não perder tempo.","Acelerar antes que atravessem.","Em áreas escolares, há maior circulação de crianças e pedestres, o que exige prudência e velocidade reduzida por parte do condutor."],["p1m3q152",3,1,"Durante uma parada rápida, Marcos estacionou sua motocicleta sobre a calçada. Essa atitude está correta?","","Não, pois motocicletas não podem parar nem estacionar sobre calçadas.","Sim, se ele não atrapalhar a passagem de pedestres.","Sim, desde que o motor esteja desligado.","Sim, mas apenas se for por menos de cinco minutos.","Segundo o CTB, é proibido transitar, parar ou estacionar motocicletas sobre calçadas, ciclovias ou áreas de pedestres, mesmo que por pouco tempo. Essa conduta prejudica a segurança e a livre circulação de pedestres, configurando infração gravíssima."],["p1m3q153",3,2,"O que um condutor deve fazer quando outro veículo tenta ultrapassá-lo na rodovia?","","Mudar para a faixa da direita, se possível, para facilitar a ultrapassagem.","Acelerar para evitar a ultrapassagem.","Manter a velocidade constante e não mudar de faixa.","Reduzir a velocidade e não mudar de faixa.","A conduta correta ao ser ultrapassado é mudar para a faixa da direita, se possível, respeitando a legislação e permitindo que o outro veículo ultrapasse de forma segura. A ultrapassagem deve ser facilitada, não bloqueada."],["p1m3q154",3,1,"Pedro vai entrar na garagem atravessando a calçada, mas uma criança se aproxima correndo. Qual é a decisão mais segura a ser adotada por Pedro?","","Parar antes da calçada, esperar a passagem da criança e entrar só quando estiver livre.","Acelerar para entrar logo.","Buzinar e avançar.","Entrar pela contramão.","Prioridade do pedestre e prevenção."],["p1m3q155",3,2,"Perto da saída da rotatória, há faixa de pedestres com pessoas iniciando a travessia. O que fazer?","","Sinalizar a saída e dar preferência aos pedestres, saindo só quando a travessia estiver segura.","Buzinar e sair rápido.","Parar dentro da rotatória.","Cortar pela calçada para evitar parar.","Prioridade ao pedestre em área crítica."],["p1m3q156",3,1,"Cecília dirige seu veículo em uma via e deseja realizar uma ultrapassagem. Como essa ação deve ser realizada?","","A ultrapassagem deve ser feita pela esquerda, quando possível, respeitando as condições da via.","Sempre pela direita.","Qualquer lado, se couber.","Pelo acostamento.","Regra geral com exceção prevista."],["p1m3q157",3,1,"Qual documento o condutor deve portar quando está dirigindo?","","O documento de habilitação correspondente (CNH, PPD ou ACC), físico ou digital.","Apenas a conta de luz.","Somente o Certificado de Registro e Licenciamento de Veículo","Uma foto do carro no celular.","Porte obrigatório do documento de habilitação. Art. 159 § 1 do CTB"],["p1m3q158",3,2,"Qual é a distância segura entre veículos?","","A que permite parar o veículo com segurança. Varia de acordo com a velocidade, a pista, o clima e o tipo de veículo.","Sempre um metro.","Sempre três metros","Não importa em baixa velocidade.","O condutor deverá guardar distância de segurança lateral e frontal entre o seu e os demais veículos, bem como em relação ao bordo da pista, considerando-se, no momento, a velocidade e as condições do local, da circulação, do veículo e as condições climáticas. Art 29, inciso II do CTB"],["p1m3q159",3,1,"Qual é a função dos exames médico e psicológico?","","Verificar as condições físicas e mentais para dirigir com segurança.","Descobrir a profissão da pessoa.","Medir se a pessoa gosta de carro.","Ver se a pessoa tem carro próprio.","Durante o processo de habilitação, deve ser verificada a aptidão do condutor."],["p1m3q160",3,1,"Qual o comportamento seguro ao se avistar animais na pista?","","Reduzir a velocidade, sinalizar, manter distância e só prosseguir quando for seguro para todos.","Buzinar para o animal e avançar.","Acelerar para assustar.","Jogar farol alto e seguir.","O condutor deve manter a segurança no trânsito."],["p1m3q161",3,1,"Qual o prazo de validade da CNH ou da ACC:","","Do prazo do exame de aptidão física e mental que estiver vigente.","Varia de acordo com o interesse do condutor.","Depende do preço do veículo.","Depende do Estado em que o condutor foi habilitado.","O exame define a validade da habilitação, conforme art. 159, § 10 do CTB."],["p1m3q162",3,1,"Quando é permitido ultrapassar pela direita?","","Somente se o veículo da frente sinalizou que vai virar à esquerda, e houver espaço seguro.","Sempre que houver espaço.","Nunca, em hipótese alguma.","Sempre que for motocicleta.","Art. 199 do CTB."],["p1m3q163",3,1,"O semáforo mudou para luz verde e ainda há pedestres finalizando a travessia. O que deve ser feito?","","Aguardar a finalização da travessia e depois partir com calma.","Acelerar e forçar passagem.","Buzinar até saírem correndo.","Contornar pela calçada.","O condutor deve observar as preferências da via."],["p1m3q164",3,1,"Sobre embarque e desembarque em frente à escola, qual é o comportamento correto?","","Usar os locais indicados pela sinalização e nunca parar em fila dupla.","Parar em qualquer lugar porque é rápido.","Estacionar sobre a faixa porque é mais perto.","Bloquear a garagem do vizinho por no máximo 5 minutos.","Paradas irregulares aumentam o risco de atropelamento e congestionamento."],["p1m3q165",3,1,"Um pedestre atravessa fora da faixa em uma via com pouco fluxo. Qual atitude do condutor?","","Reduzir a velocidade e manter o controle do veículo.","Acelerar para dar um susto no pedestre.","Continuar conduzindo normalmente.","Buzinar sem diminuir a velocidade.","O condutor deve observar as preferências da via."],["p1m3q166",3,2,"Em uma via estreita com ciclovia ao lado e grande movimentação de pedestres, o que o condutor deve fazer ao virar à direita?","","Sinalizar com antecedência, reduzir, checar ciclovia e pedestres, e só virar quando a passagem estiver livre e segura.","Virar rápido para não perder a vez.","Buzinar e entrar sobre a ciclovia.","Virar pela calçada com luz alta.","O condutor deve observar as preferências da via."],["p1m3q167",3,2,"Você chega a um cruzamento sem sinalização. À direita vem um carro em baixa velocidade e, à esquerda, outro se aproxima rapidamente. O que deve fazer?","","Dar a preferência ao da direita, mesmo que ele esteja mais devagar.","Dar preferência a quem é mais rápido.","Forçar a passagem porque você freou.","Parar no meio para ver quem vem.","Regra da direita não depende da velocidade."],["p1m3q168",3,1,"Você perdeu a saída da rodovia. O que fazer?","","Seguir até o próximo acesso, sem frear ou cortar pela direita de forma perigosa.","Parar no acostamento e dar ré.","Cruzar a pista de última hora.","Cortar por cima do canteiro.","O condutor deve seguir as regras das vias e garantir a segurança de todos."],["p1m3q169",3,2,"Com pista escorregadia por óleo, a decisão segura é:","","Reduzir a velocidade e evitar manobras bruscas.","Acelerar para passar rápido.","Frear no último momento.","Virar o volante de uma vez.","Aderência baixa por conta do óleo exige condução mais lenta e suave."],["p1m3q170",3,2,"Durante uma chuva intensa em uma rodovia de pista simples, o motorista aciona o farol alto para enxergar melhor. Essa atitude:","","Está incorreta, pois o farol alto ofusca a visão dos outros condutores e aumenta o risco de sinistro.","Está correta, desde que a pista tenha baixa iluminação.","É aceitável, se não houver veículos no sentido contrário.","É obrigatória, conforme o CTB, para compensar a falta de visibilidade.","Sob chuva intensa, o correto é o uso do farol baixo. O ofuscamento causa perda de visibilidade e risco de colisão."],["p1m3q171",3,2,"Durante uma ultrapassagem em pista simples, o condutor sinaliza e inicia a manobra mesmo sem visibilidade completa do trecho à frente. Essa conduta:","","É perigosa, pois viola o dever de assegurar condições de segurança antes de ultrapassar.","É aceitável se o outro veículo mantiver velocidade constante.","É permitida quando não há sinalização proibitiva.","É uma infração leve, sem risco relevante.","A ultrapassagem sem visibilidade é uma das causas mais graves de colisões frontais. O CTB exige total certeza da segurança da manobra, sob pena de infração gravíssima."],["p1m3q172",3,2,"Em noite chuvosa com tráfego denso, qual conduta combina múltiplas boas práticas para o motociclista?","","Posição visível, setas claras, frenagem progressiva e evitar corredor.","Corredor rápido, farol apagado, frenagem tardia.","Movimento alternado (zig-zag) com buzina longa.","Posição colada ao meio-fio.","Somar técnicas fortalece a defesa contra riscos de sinistro."],["p1m3q173",3,2,"O que diferencia a direção segura de uma simples reação a perigos?","","A capacidade de prever e agir antes do risco.","A sorte de escapar dos sinistros.","O uso de equipamentos caros.","Frear sem observar os arredores.","A direção segura é antecipatória, não apenas instintiva."],["p1m3q174",3,2,"O que melhor define a integração entre técnica e atitude na condução segura?","","Aplicar habilidades com responsabilidade, calma e empatia.","Acelerar para demonstrar domínio do veículo.","Confiar apenas nos reflexos automáticos.","Seguir o fluxo mesmo em situações de risco.","A direção segura combina técnica, ética e controle emocional — essência do Sistema Seguro."],["p1m3q175",3,2,"Qual posicionamento do encosto de cabeça é adequado para reduzir “golpe de chicote”?","","Topo alinhado ao topo da cabeça e próximo à nuca.","Abaixo da nuca e distante.","No meio das costas.","Sempre retirado.","Limita hiperextensão cervical na colisão traseira."],["p1m3q176",3,2,"Qual sequência reduz ruído e riscos na condução da motocicleta?","","Condução suave, manter escapamento original, evitar buzina indevida.","Acelerações bruscas, descarga aberta, buzina longa.","Marcha lenta prolongada em fila.","Trocar silencioso por esportivo.","Menos poluição sonora e mais segurança."],["p1m3q177",3,2,"Quando a manutenção preventiva é negligenciada, o risco aumenta principalmente por:","","Redução da capacidade de resposta do veículo.","Excesso de confiança do condutor.","Melhora do desempenho mecânico.","Menor consumo de combustível.","O veículo deve estar em perfeitas condições para responder às ações do condutor."],["p1m3q178",3,2,"Um motorista mantém o farol de neblina aceso em dia claro e ensolarado. Além de ser inadequado, esse comportamento:","","É infração prevista no CTB, pois o farol de neblina só pode ser usado em condições climáticas adversas.","É aceitável para aumentar a visibilidade do veículo em áreas urbanas.","É obrigatório para veículos de passeio modernos.","É uma boa prática de direção preventiva.","O uso indevido do farol de neblina é proibido pelo CTB, pois pode ofuscar outros condutores e causar distrações visuais, contrariando o princípio da direção segura."],["p1m3q179",3,0,"A buzina deve ser usada:","","Em toques breves para evitar sinistros.","Para expressar raiva.","De forma prolongada sempre.","Para abrir caminho na cidade.","Uso é restrito a alertas, em breves toques. Art. 41 do CTB."],["p1m3q180",3,0,"A condução segura começa com:","","Perceber, interpretar e agir corretamente.","Dirigir apenas em ruas conhecidas.","Evitar sair à noite.","Manter o carro limpo e vistoso.","O tripé percepção–interpretação–ação forma a base da direção segura."],["p1m3q181",3,0,"Altura correta do apoio de cabeça:","","Entre o topo da cabeça e a nuca.","No meio das costas.","Abaixo da nuca, distante.","Sempre retirado.","Posicionamento adequado evita entorse cervical."],["p1m3q182",3,0,"Antes de colocar o veículo em via pública, é determinado pelo CTB:","","Verificar equipamentos obrigatórios e combustível suficiente.","Acelerar para aquecer.","Desligar luzes.","Ignorar o manual do veículo.","Exigência legal de segurança básica, conforme art. 27 do CTB."],["p1m3q183",3,0,"Antes de uma curva, a sequência segura para o motociclista é:","","Sinalizar, reduzir marcha e velocidade, acelerar levemente na entrada.","Acelerar forte e frear dentro da curva.","Frear no meio da curva e reduzir depois.","Não sinalizar para surpreender para não assustar os outros condutores.","Preparação fora da curva mantém tração."],["p1m3q184",3,0,"Ao mudar de faixa, qual é a ação essencial?","","Acionar a seta com antecedência.","Aproximar muito do veículo ao lado.","Olhar só para frente.","Acelerar para ganhar espaço.","Sinalizar com antecedência comunica a manobra e reduz risco de sinistro."],["p1m3q185",3,0,"Ao perceber pedestres agitados próximos à calçada, o condutor atento deve:","","Reduzir a velocidade e manter atenção redobrada.","Aumentar a velocidade para evitar parar.","Ignorar, pois estão na calçada.","Buzinar e seguir adiante.","Antecipar riscos é parte da função cognitiva e evita sinistros."],["p1m3q186",3,0,"Após afivelar o cinto de segurança, o que fazer?","","Puxar ligeiro para cima e deixar bem justo ao corpo.","Deixar folgado para conforto.","Torcer a fita para prender mais.","Deixar o fecho sem travar.","Folgas aumentam deslocamento e impactos internos."],["p1m3q187",3,0,"Qual é o calçado adequado para dirigir ou pilotar?","","Que se firme no pé e não escorregue.","Chinelo solto.","Sandália sem fixação no calcanhar.","Salto alto.","Calçados instáveis comprometem o uso dos pedais."],["p1m3q188",3,2,"O que o condutor deve fazer primeiro quando está dirigindo enquanto chove forte na cidade?","","Reduzir a velocidade e manter o farol baixo aceso.","Ligar o farol alto para “abrir” visão.","Acelerar para sair rápido da chuva.","Frear forte para enxergar melhor.","Chuva reduz aderência e visibilidade. A conduta segura é diminuir a velocidade e usar farol baixo."],["p1m3q189",3,2,"Com airbag dianteiro ativo, é proibido:","","Colocar bebê conforto de costas no banco da frente.","Recuar o banco.","Usar cinto no passageiro.","Fechar os vidros.","A abertura do airbag pode ferir o bebê."],["p1m3q190",3,2,"Como a carga altera a condução da moto?","","Muda respostas conforme peso e volume.","Não altera nada se for leve.","Melhora curvas por “lastro”.","Permite frear mais tarde.","A carga na motocicleta pode afetar a estabilidade e o equilíbrio, especialmente se não for distribuída corretamente. Isso pode tornar a condução mais difícil, dificultando a manobrabilidade, a frenagem e o controle da moto. Além disso, o peso excessivo ou mal posicionado pode aumentar o risco de acidentes, especialmente em curvas ou durante frenagens."],["p1m3q191",3,2,"Como devem ser ajustados os espelhos laterais?","","Devem exibir só uma pequena parte da lateral do carro.","Devem mostrar grande parte da própria porta.","Devem apontar para o chão.","Devem mostrar apenas o céu.","Referência mínima do próprio veículo sem perder o entorno."],["p1m3q192",3,1,"Como deve estar ajustado o espelho interno?","","Mostrando todo o vidro traseiro.","Mostrando metade do teto.","Mostrando apenas o banco traseiro.","Voltado para o passageiro.","Posicionamento correto amplia visão traseira."],["p1m3q193",3,1,"O que pode ajudar pedestres e ciclistas a serem mais visíveis à noite para os motoristas?","","Roupas claras, faixas refletivas ou luzes.","Roupas escuras","Fones de ouvido altos.","Falta de iluminação","À noite, para garantir a segurança no trânsito, é fundamental que pedestres e ciclistas usem roupas claras e equipamentos refletivos, como faixas luminosas ou refletores, para serem vistos com maior facilidade pelos motoristas. Essa atitude reduz o risco de acidentes, tornando-os mais visíveis no escuro."],["p1m3q194",3,1,"O que caracteriza uma comunicação segura entre os condutores?","","Setas antecipadas e buzina com moderação.","Buzina longa para abrir caminho.","Sinalizar só depois da manobra.","Evitar contato visual.","A comunicação segura no trânsito envolve o uso correto de sinais de trânsito, dispositivos de iluminação (como setas de direção) e buzinas apenas quando necessário. O objetivo é garantir que todos os motoristas e pedestres possam antecipar as ações uns dos outros, evitando acidentes e promovendo a segurança nas vias. O uso inadequado de sinais, ou ignorar a sinalização, pode causar confusão e aumentar o risco de colisões."],["p1m3q195",3,1,"Uma condução segura no trânsito envolve:","","Manter distância segura, usar os sinais corretamente e respeitar a velocidade.","Frear e acelerar forte.","Ignorar os limites de velocidade e a sinalização para ganhar tempo.","Usar marcha lenta prolongada.","condução segura depende de atitudes como manter distância adequada, usar os sinais de forma correta, como luzes e setas, e respeitar os limites de velocidade. Esses comportamentos garantem que o condutor possa reagir a tempo e prevenir acidentes."],["p1m3q196",3,1,"Condução eficiente significa:","","Usar menos combustível e poluir menos com pequenas mudanças de hábito.","Dirigir rápido sempre.","Frear e acelerar forte.","Descartar óleo no ralo.","A condução eficiente está relacionada à redução do consumo de combustível e à diminuição da poluição, o que pode ser alcançado com hábitos de direção mais suaves, como evitar acelerações e frenagens bruscas, manter uma velocidade constante e realizar manutenções regulares no veículo."],["p1m3q197",3,2,"Por que é mais arriscado dirigir com os faróis apagados ao entardecer?","","Pois diminui a capacidade dos outros motoristas de verem o veículo.","Pois melhora o consumo de energia elétrica.","Pois indica economia de lâmpadas.","Pois só causa risco em rodovias.","Ao dirigir ao entardecer, a visibilidade começa a diminuir, e os faróis são essenciais para garantir que o motorista possa ver e ser visto com clareza. Sem os faróis acesos, o risco de não perceber outros veículos, pedestres ou obstáculos aumenta significativamente, tornando a condução mais perigosa."],["p1m3q198",3,1,"Quais são as consequências de dirigir de forma agressiva?","","Pode aumentar o risco de acidentes e colocar em perigo outros motoristas e pedestres.","Pode reduzir consumo de combustível.","Ajuda a limpar o motor.","Ajuda a diminuir emissões de gases poluentes.","Dirigir de forma agressiva, como acelerar bruscamente, realizar frenagens fortes e mudanças repentinas de direção, aumenta o risco de acidentes e compromete a segurança de todos no trânsito. Essas atitudes colocam em perigo outros motoristas, pedestres e o próprio condutor."],["p1m3q199",3,1,"Como a direção agressiva afeta a segurança no trânsito?","","Aumenta o risco de acidentes e coloca a segurança de todos em risco.","Torna o trânsito mais rápido e menos congestionado.","Ajuda a diminuir emissões de gases poluentes.","Proporciona mais controle sobre o veículo em condições adversas.","A direção agressiva, caracterizada por manobras rápidas e bruscas, aumenta o risco de acidentes e prejudica a segurança de todos no trânsito. Esse comportamento aumenta a probabilidade de colisões, afetando a integridade física de motoristas, passageiros e pedestres."],["p1m3q200",3,1,"Como um motorista deve se compartar durante uma chuva forte?","","Diminuir a velocidade, ligar farol baixo e limpador.","Acelerar para escapar da chuva.","Frear de forma brusca.","Usar farol alto.","Durante chuvas fortes, a visibilidade e a aderência dos pneus à pista podem ser comprometidas. O motorista deve reduzir a velocidade para manter o controle do veículo e aumentar a distância de segurança dos outros veículos, já que a pista fica mais escorregadia e o tempo de frenagem aumenta. O uso de faróis baixos é fundamental para melhorar a visibilidade."],["p1m3q201",3,2,"Durante o percurso, o passageiro da motocicleta deve:","","Segurar-se de forma segura e permanecer com os pés sobre os pedais.","Usar o celular para se distrair durante a viagem.","Sentar solto e relaxado demais.","Apoiar peso nos ombros do piloto.","O passageiro de motocicleta deve sempre segurar-se adequadamente e manter os pés sobre os pedais para garantir a sua segurança e o equilíbrio do veículo. Manter uma postura correta ajuda a evitar quedas e contribui para a estabilidade durante o percurso"],["p1m3q202",3,1,"Qual deve ser a atitude básica do condutor em caso de chuva?","","Reduzir velocidade e manter o limpador ligado.","Acelerar para sair logo.","Usar farol alto.","Ligar o pisca-alerta em movimento.","Chuva reduz visibilidade, condução deve ser compatível."],["p1m3q203",3,1,"Qual deve ser a atitude a ser tomada por um condutor quando dirige em condições adversas?","","Reduzir velocidade e aumentar a atenção.","Manter a mesma velocidade.","Desligar os faróis.","Ultrapassar para “sair logo”.","Em condições adversas de trânsito ou clima, como chuva, neblina ou má visibilidade, o motorista deve diminuir a velocidade e aumentar a atenção. Isso permite reagir com segurança a imprevistos, compensando a redução da aderência dos pneus e a dificuldade de enxergar a via e outros veículos. Essa é a atitude preventiva mais importante para evitar acidentes."],["p1m3q204",3,1,"Em cruzamentos, para ser visto e evitar sinistro, o motociclista deve:","","Posicionar-se visível, sinalizar e buscar contato visual.","Parar no ponto cego do carro.","Passar sem reduzir.","Acelerar para “ganhar a frente”.","Nos cruzamentos, onde o risco de colisões é maior, o motociclista deve reduzir a velocidade, manter os faróis ligados e usar corretamente as setas para indicar suas intenções. Essas atitudes aumentam a visibilidade e permitem que os outros condutores antecipem suas ações, evitando sinistros. A condução defensiva e previsível é essencial para a segurança no trânsito."],["p1m3q205",3,2,"Qual é a recomendação quando um motoclista está conduzindo em uma via com piso molhado?","","Antecipar freadas e evitar travamentos.","Frear tarde e forte.","Acelerar para “secar” o pneu.","Inclinar mais nas curvas.","No piso molhado, a aderência dos pneus diminui, aumentando o risco de derrapagens e perda de controle do veículo. Por isso, o condutor deve reduzir a velocidade, manter distância de segurança e evitar manobras bruscas."],["p1m3q206",3,1,"Quando o condutor de motocicleta é obrigado a manter a viseira do capacete abaixada?","","Sempre que a motocicleta estiver em movimento.","Apenas quando chover.","Só em rodovia.","Nunca é necessário.","A viseira do capacete deve permanecer abaixada enquanto a motocicleta estiver em movimento, garantindo a proteção dos olhos e do rosto contra vento, poeira, pedras e insetos. Essa medida é essencial para a segurança e visibilidade do condutor, evitando distrações ou lesões que possam causar acidentes."],["p1m3q207",3,0,"Qual das opções representa uma condição adversa do veículo?","","Pneus carecas","Revisão em dia.","Freios regulados.","Limpadores novos.","As condições adversas do veículo são aquelas que afetam sua segurança e desempenho, aumentando o risco de acidentes. Freios com defeito, pneus carecas, direção desregulada ou faróis queimados são exemplos claros. Manter a manutenção em dia é essencial para evitar falhas mecânicas e garantir uma condução segura."],["p1m3q208",3,0,"Por que é importante frear o veículo de forma gradual?","","Pois alerta quem vem atrás e evita sustos.","Pois faz o carro andar sozinho.","Pois aumenta o desgaste de pneus.","Pois substitui o uso das setas.","Frear de forma gradual e antecipada é uma prática essencial de direção defensiva, pois mantém o controle do veículo e permite que o motorista que vem atrás perceba a redução de velocidade e reaja a tempo."],["p1m3q209",3,0,"Qual a principal função principal do cinto de segurança em um veículo?","","Conter o corpo e reduzir lesões graves.","Evitar multas apenas.","Aumentar conforto do banco.","Substituir o airbag.","A principal função do cinto de segurança é reter o corpo dos ocupantes em caso de acidente ou frenagem repentina, evitando que sejam arremessados contra o painel, o para-brisa ou para fora do veículo. Seu uso é obrigatório por lei (art. 65 do CTB) e é um dos equipamentos mais eficazes na redução de mortes e ferimentos graves no trânsito. Portanto, o cinto é um dispositivo de segurança vital, tanto para o condutor quanto para os passageiros."],["p1m3q210",3,0,"As luzes do veículo têm como uma de suas principais funções:","","Garantir a visibilidade do veículo e permitir a comunicação com outros condutores.","Decorar o carro.","Aumentar potência do motor.","Reduzir o consumo de combustível","As luzes do veículo — como faróis, lanternas, luz de freio e setas — têm a função de tornar o veículo visível e indicar suas intenções de manobra aos demais usuários da via. Elas são fundamentais para a segurança e comunicação no trânsito, especialmente à noite ou em condições de baixa visibilidade."],["p1m3q211",3,0,"Quando o motociclista está parado em um cruzamento, qual deve ser sua postura correta?","","Posicionar-se para ser visto nos espelhos do carro à frente.","Parar colado ao meio-fio.","Ficar no ponto cego do ônibus.","Ficar com o motor desligado até que o trânsito volte a fluir.","Posicionamento visível reduz riscos de arranque inesperado e atropelamento."],["p1m3q212",3,0,"Durante uma chuva intensa, qual deve ser a atitude correta do condutor?","","Aumentar distância e evitar frear bruscamente.","Ligar farol alto e acelerar.","Usar buzina contínua.","Andar no “vácuo” de caminhões.","m chuvas intensas, a visibilidade e a aderência dos pneus diminuem, aumentando o risco de aquaplanagem e colisões. Por isso, o condutor deve reduzir a velocidade, aumentar a distância do veículo à frente e manter os faróis baixos acesos para ser visto por outros motoristas."],["p1m3q213",3,2,"Ao se aproximar de uma curva, qual deve ser o comportamento correto do motociclista?","","Reduzir antes e manter aceleração constante na curva.","Frear forte dentro da curva.","Acelerar bruscamente somente na saída.","Olhar para o obstáculo.","Em curvas, o motociclista deve reduzir a velocidade antes de entrar, mantendo o controle e a estabilidade da moto. Durante a curva, deve inclinar o corpo junto com o veículo, mantendo o olhar voltado para a saída da curva. Frear ou acelerar bruscamente dentro da curva pode causar perda de aderência dos pneus e quedas, por isso a antecipação e o equilíbrio corporal são fundamentais para uma pilotagem segura."],["p1m3q214",3,0,"O que é o airbag?","","Uma bolsa que infla em milésimos de segundo após impacto.","Um sensor que freia o carro sozinho.","Um tipo de freio ABS.","Um enfeite do volante.","Dispositivo de segurança passiva para reduzir lesões. É um equipamento de segurança complementar ao cinto de segurança, projetado para amortecer o impacto em caso de colisões, reduzindo o risco de ferimentos graves."],["p1m3q215",3,0,"O apoio de cabeça serve para:","","Proteger o pescoço contra o efeito chicote.","Apoiar para dormir.","Deixar o banco mais bonito.","Aumentar espaço no carro.","Reduz hiperextensão cervical em colisão traseira."],["p1m3q216",3,0,"O cinto de segurança deve ser usado:","","Por todos os ocupantes, inclusive atrás.","Só pelo motorista.","Apenas no banco dianteiro.","Apenas em rodovias.","Reduz lesões em sinistros. Sendo de uso obrigatório em todo territorio nacional, conforme art. 65 do CTB."],["p1m3q217",3,0,"O para-brisa deve estar:","","Limpo e sem películas escuras que prejudiquem a visão.","Com películas escuras para reduzir luz.","Úmido para cortar reflexo.","Sempre entreaberto.","Transparência melhora a percepção, especialmente à noite."],["p1m3q218",3,0,"O passageiro deve subir na motocicleta:","","Pelo lado oposto ao escapamento.","Pelo lado do escapamento.","Pela frente da moto.","Por trás, segurando o baú.","Evita queimaduras e desequilíbrios."],["p1m3q219",3,0,"O posicionamento correto do carro na via é:","","Centralizado na faixa, com distância lateral.","Colado no meio-fio.","Avançando sobre faixas vizinhas.","“Costurando” o trânsito.","Centralizar melhora controle e previsibilidade."],["p1m3q220",3,1,"O que é distância de reação?","","Espaço percorrido até o cérebro perceber o perigo e acionar o freio.","Distância do carro até o pedestre.","Espaço entre duas faixas.","Tamanho do veículo.","Dura cerca de 1 segundo e varia conforme a atenção do condutor."],["p1m3q221",3,0,"O que o motorista deve observar antes da curva?","","Condições da pista, tipo de curva e aderência.","Apenas o velocímetro.","Só o retrovisor interno.","A cor do carro da frente.","A prevenção começa pela leitura do ambiente viário."],["p1m3q222",3,0,"Onde o uso indevido da buzina é proibido?","","Áreas urbanas entre 22h e 6h e zonas de silêncio.","Rodovias sem moradores.","Estacionamentos particulares.","Apenas próximo a escolas.","Art. 227 do CTB."],["p1m3q223",3,0,"Ouvir uma sirene enquanto dirige é um alerta para:","","Redobrar a atenção e facilitar a passagem do veículo de emergência.","Aumentar a velocidade para sair rápido.","Ligar o pisca-alerta e continuar na mesma faixa.","Ignorar o som se estiver na sua pista.","A audição faz parte da função sensorial e ajuda na prevenção de sinistros."],["p1m3q224",3,0,"O que deve ser feito antes de mudar de faixa.","","Acionar a seta com antecedência.","Buzinar longamente.","Apagar os faróis.","Fechar os retrovisores.","A seta comunica intenção do condutor e evita conflitos."],["p1m3q225",3,0,"Para checar pontos cegos ao mudar de faixa, faça:","","Olhe espelhos e vire levemente a cabeça.","Confie só no espelho interno.","Use apenas os ouvidos.","Mude sem sinalizar.","Há áreas sem visão direta, devendo sempre serem verificadas."],["p1m3q226",3,0,"Para manter estabilidade, recomenda-se ao motociclista:","","Usar sempre o freio motor.","Só frear a roda dianteira.","Desligar a marcha.","Travar roda traseira.","Desaceleração mecânica é progressiva e segura."],["p1m3q227",3,0,"Para o airbag ser eficaz, é essencial:","","Usar o cinto de segurança corretamente.","Desligar todas as luzes.","Andar só devagar.","Tirar o encosto de cabeça.","Sem cinto, o airbag pode ferir o condutor ou passageiros."],["p1m3q228",3,0,"Para prevenir sinistros, a atitude básica do bom condutor é:","","Antecipar riscos e decidir com calma.","Confiar só na experiência.","Acelerar para sair do perigo.","Usar o celular com discrição.","Previsão e decisão segura são princípios da direção defensiva e preventiva."],["p1m3q229",3,0,"Para ser visto à noite como pedestre ou ciclista, o que ajuda?","","Usar roupas claras ou faixas refletivas.","Evitar qualquer iluminação.","Caminhar na pista sem atenção.","Desligar a lanterna da bicicleta.","Visibilidade salva vidas, materiais refletivos aumentam detecção por motoristas."],["p1m3q230",3,0,"Para ser visto no cruzamento, o motociclista deve:","","Posicionar-se onde apareça nos retrovisores dos veículos à frente.","Ficar atrás do para-choque do carro.","Apagar o farol.","Andar pelo acostamento.","Importante evitar pontos cegos para garantir a segurança de todos."],["p1m3q231",3,0,"Por que ver e ser visto é essencial no trânsito?","","Porque se você não vê ou não é visto, o risco de sinistro aumenta.","Porque melhora apenas o conforto do motorista.","Porque serve só para rodovias.","Porque evita gastar com manutenção.","Visibilidade mútua evita surpresas e previne sinistros."],["p1m3q232",3,0,"Por que a condução segura é também um ato social?","","Porque cada decisão afeta a vida dos outros usuários da via.","Porque dirigir é um direito individual absoluto.","Porque todos devem seguir o mesmo ritmo.","Porque quem dirige mal é mais respeitado.","O trânsito é um espaço coletivo, a segurança depende da convivência responsável."],["p1m3q233",3,0,"Por que a velocidade é um dos fatores mais críticos da segurança viária?","","Porque afeta diretamente a gravidade dos sinistros.","Porque melhora o conforto.","Porque reduz a atenção.","Porque evita derrapagens.","Mesmo pequenas variações de velocidade alteram totalmente as consequências de um impacto."],["p1m3q234",3,0,"Por que ajustar os espelhos antes de sair?","","Para ampliar o campo de visão e reduzir pontos cegos.","Para ver apenas o interior do veículo.","Para não precisar olhar a via.","Para dirigir sem cintos.","Ajustes corretos aumentam percepção lateral e traseira e evitam surpresas."],["p1m3q235",3,0,"Por que evitar pontos cegos de caminhões e ônibus?","","Porque o condutor desses veículos pode não enxergar você.","Porque a multa é maior.","Porque economiza combustível.","Porque facilita ouvir música.","Posição fora do campo visual reduz risco de colisão."],["p1m3q236",3,1,"Por que evitar roupas largas ao pilotar?","","Podem enroscar na corrente ou pedais.","Esfriam o corpo.","Melhoram aerodinâmica.","Deixam a viseira limpa.","Risco mecânico e de queda."],["p1m3q237",3,1,"Por que não deixar objetos soltos no carro?","","Podem virar projéteis em sinistros.","Atrapalham a limpeza.","Aumentam conforto.","Melhoram consumo.","Objetos arremessados agravam ferimentos."],["p1m3q238",3,0,"Por que o condutor deve observar os pedestres antes de ligar o veículo?","","Porque pode haver alguém atravessando à frente ou atrás do veículo.","Porque o motor frio gasta mais combustível.","Porque é exigência apenas para carros novos.","Porque evita multas de estacionamento.","Observar o entorno é parte da função sensorial e reduz sinistros ao iniciar a condução."],["p1m3q239",3,0,"Por que o motociclista é mais vulnerável no trânsito?","","Porque não é protegido por carroceria e é pouco visível.","Tem freios mais fracos.","Anda sempre mais rápido.","Usa pistas exclusivas.","A exposição direta aumenta o risco e exige atenção constante."],["p1m3q240",3,1,"Previsão, na direção defensiva, significa:","","Imaginar o que pode acontecer e agir antes do risco.","Reagir apenas após o perigo.","Confiar no olhar dos outros.","Andar sempre mais rápido.","Prevenção pode evitar sinistros no trânsito."],["p1m3q241",3,0,"Qual atitude demonstra a união entre direção defensiva e preventiva?","","Manter distância segura e prever erros dos outros.","Acelerar para evitar colisão.","Frear de forma repentina.","Ignorar riscos quando está certo.","A união entre prevenção e defesa cria o comportamento seguro ideal."],["p1m3q242",3,0,"Qual atitude evita derrapagens em curvas?","","Reduzir a velocidade antes da curva.","Frear bruscamente dentro da curva.","Acelerar forte na saída.","Girar o volante rapidamente.","Redução antecipada mantém a aderência dos pneus."],["p1m3q243",3,0,"Qual atitude reduz falhas do veículo?","","Checar pneus, freios, luzes, óleo e arrefecimento antes de sair com o veículo.","Apenas encher combustível.","Conferir som e tapetes.","Ignorar sinais no painel.","A verificação prévia é dever legal e salva vidas."],["p1m3q244",3,0,"Qual conjunto de calçados/roupas mais reduz riscos na motocicleta?","","Bota fechada com sola antiderrapante + calça e jaqueta resistentes + luvas.","Chinela + bermuda + regata.","Sandália sem calcanhar + moletom fino.","Tênis leve aberto + camisa social.","Protege pele, articulações e melhora controle."],["p1m3q245",3,0,"Qual deve ser o posicionamento do motociclista na via?","","Centro da faixa ou levemente à esquerda.","Colado ao meio-fio.","Entre os carros em movimento.","Na contramão para ser visto.","Manter-se no centro ou levemente à esquerda aumenta visibilidade e espaço de fuga."],["p1m3q246",3,0,"Qual é a principal atitude do condutor ao cuidar do veículo antes de sair?","","Verificar as condições de funcionamento dos equipamentos de segurança.","Ligar o som e ajustar o banco.","Apenas abastecer o carro.","Testar a buzina e sair.","Manutenção preventiva é parte da direção defensiva."],["p1m3q247",3,0,"Qual é a regra de frenagem segura para o motociclista?","","Usar os dois freios, com força gradual.","Usar só o traseiro.","Usar só o dianteiro.","Travar a roda para parar rápido.","Ação progressiva evita travamentos e quedas."],["p1m3q248",3,0,"Qual é o uso correto da buzina no trânsito?","","Toques breves para advertir sobre risco.","Pressionar longo para abrir caminho.","Usar à noite para avisar presença.","Pressionar forte, mesmo em área de silência, para cumprimentar outras pessoas.","A buzina é instrumento de alerta, não de reprimenda. Há restrições de horário e local."],["p1m3q249",3,0,"Qual é o objetivo da condução segura?","","Evitar sinistros e preservar vidas.","Chegar mais rápido ao destino.","Mostrar habilidade no volante.","Usar o freio o mínimo possível.","A condução segura tem como foco a prevenção de sinistros e a proteção de todos os usuários da via."],["p1m3q250",3,0,"Qual exemplo é condição adversa de luz?","","Ofuscamento ao sair de túnel.","Pista seca e clara.","Dia nublado sem chuva.","Via duplicada e limpa.","Mudança brusca de luminosidade reduz visão."],["p1m3q251",3,0,"Qual fator do condutor aumenta o risco no trânsito?","","Sono e uso de celular ao volante.","Pausas regulares.","Hidratação e calma.","Planejamento de rota.","Distração e fadiga atrasam reação."],["p1m3q252",3,0,"Qual hábito aumenta muito o risco ao pilotar uma motocicleta?","","Mudar de faixa constantemente.","Manter posição estável.","Usar setas sempre.","Planejar rotas seguras.","Movimentos alternados reduz previsibilidade e espaço de reação."],["p1m3q253",3,0,"Qual luz é obrigatória à noite?","","Farol baixo.","Farol alto sempre.","Apenas DRL.","Lanternas traseiras apagadas.","Ilumina sem ofuscar."],["p1m3q254",3,0,"Qual ação representa a condução segura?","","Todo motorista deve manter atenção e vigilância sempre.","Basta experiência para evitar riscos.","O carro protege de qualquer erro.","A CNH garante preparo total.","Atenção contínua reduz erros humanos."],["p1m3q255",3,0,"Qual vestimenta ajuda a reduzir danos na queda de motocicleta?","","Jaqueta e calça resistentes, com reforços, luvas protetoras e calçados adequados.","Regata e bermuda.","Camiseta leve e calça fina.","Tecido sintético frágil.","O motociclista deve utilizar roupas apropriadas para condizir motocicletas."],["p1m3q256",3,0,"Quando o veículo entra rápido demais em uma curva, o que tende a acontecer?","","Seguir reto, por causa da inércia.","Ele faz a curva com mais facilidade.","Ele freia automaticamente.","Nada. A curva independe da velocidade.","A inércia mantém o movimento em linha reta e o controle depende do motorista."],["p1m3q257",3,0,"Quando um condutor visualiza uma bola rolando para a via, ele deve:","","Reduzir e preparar-se para possível travessia de criança.","Manter velocidade constante.","Desviar rapidamente da bola.","Acionar a buzina para alertar.","Antecipar o perigo é ação cognitiva fundamental da direção segura."],["p1m3q258",3,0,"Quando você assume o volante, o que realmente significa dirigir com segurança?","","Proteger a própria vida e a de todos ao redor.","Andar rápido, mas com atenção.","Dominar o carro em alta velocidade.","Seguir apenas o fluxo dos outros veículos.","Dirigir com segurança é um ato de responsabilidade e respeito à vida. O foco é preservar vidas, não apenas controlar o veículo."],["p1m3q259",3,0,"Quem deve usar cinto no veículo?","","Todos os ocupantes, inclusive no banco traseiro.","Só o motorista.","Apenas motorista e passageiro da frente.","O motorista, mas somente em rodovias.","Obrigatório para todos os assentos, conforme art. 65 do CTB."],["p1m3q260",3,0,"Ser um bom condutor é principalmente:","","Dominar suas emoções antes de dominar a máquina.","Aprender a acelerar com rapidez.","Saber fazer manobras difíceis.","Conhecer atalhos e rotas curtas.","A condução segura exige controle emocional, atenção e equilíbrio, não apenas técnica."],["p1m3q261",3,0,"Um motorista sente o volante vibrar fortemente ao frear. O que essa percepção indica?","","Possível irregularidade na pista ou falha no sistema de freios.","Normalidade do piso e dos pneus.","Que deve acelerar para estabilizar.","Que o veículo precisa de alinhamento apenas.","A vibração é um sinal sensorial que deve ser interpretado como alerta para risco."],["p1m3q262",3,0,"Uma atitude essencial do motociclista defensivo é:","","Prever portas abrindo e a movimentação de pedestres.","Passar perto dos carros estacionados.","Ignorar manchas no asfalto.","Focar só no veículo à frente.","Ant
