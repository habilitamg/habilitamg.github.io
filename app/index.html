const MOD=[
{id:'leg',t:'Legislação de trânsito',sub:'CTB, habilitação, veículo, normas, infrações, multas e recursos.',secs:[
{h:'Como é a prova teórica',b:`<p>A prova de legislação é a etapa teórica da primeira habilitação. Pela <strong>Resolução CONTRAN 1.020/2025</strong>, ela tem <strong>30 questões de múltipla escolha</strong>, com <strong>4 alternativas</strong> e só uma correta.</p>
<ul><li>Para ser aprovado, é preciso acertar <strong>no mínimo 20 questões</strong>.</li><li>A prova dura <strong>no mínimo 1 hora</strong>. Candidatos com dislexia, TDAH ou TEA têm o tempo dobrado.</li><li>Quem é reprovado pode refazer a prova sem limite de tentativas.</li></ul>
<p>O conteúdo cobre legislação, sinalização, direção defensiva, primeiros socorros, meio ambiente e cidadania, relacionamento no trânsito e noções de mecânica.</p>
<div class="tip"><b>Dica</b>Os simulados deste site seguem o mesmo formato: 30 questões, 60 minutos e aprovação a partir de 20 acertos.</div>`},
{h:'Etapas para tirar a CNH',b:`<ol><li><strong>Abertura do processo</strong> no DETRAN-MG, com documento de identidade, CPF e comprovante de residência. O candidato precisa ter 18 anos e saber ler e escrever.</li><li><strong>Exame de aptidão física e mental</strong> e <strong>avaliação psicológica</strong>.</li><li><strong>Curso teórico</strong>, que pode ser feito em autoescola ou pelo aplicativo oficial do governo.</li><li><strong>Prova teórica</strong> (a que você estuda aqui).</li><li><strong>Aulas práticas</strong> com instrutor.</li><li><strong>Exame de direção</strong> (prova prática).</li><li>Aprovado, você recebe a <strong>Permissão para Dirigir</strong>, válida por 1 ano.</li></ol>
<div class="tip"><b>Atenção</b>Durante as aulas práticas, o candidato precisa portar a Licença de Aprendizagem e estar acompanhado do instrutor.</div>`},
{h:'Sistema Nacional de Trânsito',b:`<p>O <strong>Código de Trânsito Brasileiro (CTB, Lei 9.503/1997)</strong> rege o trânsito em todo o país e é aplicado por um conjunto de órgãos, o Sistema Nacional de Trânsito (SNT).</p>
<ul><li><strong>CONTRAN</strong>: órgão máximo normativo e consultivo. Cria as resoluções.</li><li><strong>SENATRAN</strong>: órgão máximo executivo da União.</li><li><strong>CETRAN</strong>: conselho estadual. Julga recursos em segunda instância.</li><li><strong>DETRAN</strong>: órgão executivo estadual. Cuida da habilitação, do registro e do licenciamento de veículos.</li><li><strong>JARI</strong>: juntas que julgam recursos contra multas em primeira instância.</li><li><strong>PRF</strong>: fiscaliza as rodovias federais.</li><li><strong>Órgãos municipais</strong>: fiscalizam e operam o trânsito nas cidades.</li><li><strong>Polícia Militar</strong>: pode fiscalizar por convênio com os órgãos de trânsito.</li></ul>`},
{h:'Classificação das vias',b:`<div class="tbl"><table><tr><th>Via</th><th>Características</th></tr>
<tr><td><strong>Trânsito rápido</strong></td><td>Sem interseções em nível, sem travessia de pedestres em nível e sem acesso direto aos lotes.</td></tr>
<tr><td><strong>Arterial</strong></td><td>Interseções em nível, geralmente com semáforo. Liga regiões da cidade.</td></tr>
<tr><td><strong>Coletora</strong></td><td>Recebe o trânsito das vias locais e o distribui para as arteriais.</td></tr>
<tr><td><strong>Local</strong></td><td>Interseções sem semáforo. Acesso a áreas residenciais.</td></tr>
<tr><td><strong>Rodovia</strong></td><td>Via rural pavimentada.</td></tr><tr><td><strong>Estrada</strong></td><td>Via rural não pavimentada.</td></tr></table></div>`},
{h:'Habilitação e categorias',b:`<p>O primeiro documento é a <strong>Permissão para Dirigir</strong>, válida por <strong>1 ano</strong>. A CNH definitiva só vem se o condutor não cometer infração grave ou gravíssima, nem for reincidente em infração média.</p>
<div class="tbl"><table><tr><th>Categoria</th><th>O que dirige</th><th>Requisito extra</th></tr>
<tr><td class="n">ACC</td><td>Ciclomotores (até 50 cc)</td><td>—</td></tr>
<tr><td class="n">A</td><td>Motocicletas, motonetas e triciclos</td><td>—</td></tr>
<tr><td class="n">B</td><td>Veículos até 3.500 kg e até 8 lugares além do motorista</td><td>—</td></tr>
<tr><td class="n">C</td><td>Transporte de carga acima de 3.500 kg</td><td>1 ano na categoria B</td></tr>
<tr><td class="n">D</td><td>Transporte de passageiros acima de 8 lugares</td><td>21 anos; 2 anos na B ou 1 ano na C</td></tr>
<tr><td class="n">E</td><td>Combinações com unidade acoplada acima de 6.000 kg</td><td>21 anos; 1 ano na C</td></tr></table></div>
<p>A renovação do exame médico é a cada <strong>10 anos</strong> até os 50 anos, a cada <strong>5 anos</strong> dos 50 aos 69 e a cada <strong>3 anos</strong> a partir dos 70. O exame toxicológico é obrigatório para as categorias C, D e E.</p>`},
{h:'Documentos e licenciamento do veículo',b:`<ul><li><strong>Documentos de porte obrigatório</strong>: CNH ou Permissão para Dirigir e o CRLV (Certificado de Registro e Licenciamento). As versões digitais valem.</li><li><strong>Licenciamento</strong>: é anual. Veículo não licenciado é infração gravíssima, com remoção.</li><li><strong>Compra de veículo</strong>: o comprador tem <strong>30 dias</strong> para transferir a propriedade. Não transferir é infração grave.</li><li><strong>Venda de veículo</strong>: o vendedor deve comunicar a venda ao DETRAN para não responder por multas futuras.</li><li><strong>Mudança de endereço</strong>: também deve ser informada ao DETRAN.</li></ul>`},
{h:'Normas de circulação e preferência',b:`<ul><li>Circule pelo lado direito da via. Em vias com várias faixas, a da esquerda é para ultrapassagem e veículos mais rápidos.</li><li>A ultrapassagem é feita <strong>pela esquerda</strong>, com visibilidade, espaço e sinalização.</li><li>Guarde distância de segurança lateral e frontal. Ao passar por um ciclista, mantenha <strong>1,5 m</strong>.</li><li>Em cruzamento sem sinalização, a preferência é de quem vem <strong>pela direita</strong>.</li><li>Em rotatória, a preferência é de quem <strong>já está circulando</strong> nela.</li><li>Quem está na rodovia tem preferência sobre quem vem de outra via.</li><li>Veículos de emergência com sirene e luz ligadas têm prioridade: libere a faixa da esquerda, indo para a direita.</li><li>O pedestre na faixa tem preferência. Não respeitar é infração gravíssima.</li><li>Os veículos maiores são responsáveis pela segurança dos menores, os motorizados pelos não motorizados e todos pela dos pedestres (art. 29, § 2º).</li></ul>
<p><strong>Ordem de prevalência (art. 89):</strong> 1º ordens do agente de trânsito; 2º sinais do semáforo; 3º demais sinais; 4º normas de circulação.</p>
<div class="tip"><b>Faróis</b>Luz baixa à noite, em túneis e sob chuva, neblina ou cerração. De dia, em rodovias de pista simples fora da cidade (para veículos sem DRL). O farol alto não pode ser usado com veículos vindo em sentido contrário ou quando você segue outro veículo. O pisca-alerta é para imobilização ou emergência.</div>`},
{h:'Parada e estacionamento',b:`<p><strong>Parar</strong> é a imobilização pelo tempo de embarque ou desembarque. <strong>Estacionar</strong> é ficar parado por mais tempo que isso.</p>
<div class="tbl"><table><tr><th>Estacionar…</th><th>Natureza</th></tr>
<tr><td>Afastado da guia de 50 cm a 1 m</td><td>Leve</td></tr><tr><td>Afastado da guia mais de 1 m</td><td>Grave</td></tr>
<tr><td>Na esquina ou a menos de 5 m do alinhamento da via transversal</td><td>Média</td></tr>
<tr><td>Em fila dupla</td><td>Grave</td></tr><tr><td>Na contramão</td><td>Média</td></tr>
<tr><td>Em ponto de embarque de ônibus</td><td>Média</td></tr>
<tr><td>Em frente a guia rebaixada de entrada de veículos</td><td>Média</td></tr>
<tr><td>Em vaga de idoso ou pessoa com deficiência sem credencial</td><td>Gravíssima</td></tr>
<tr><td>Sobre a calçada ou faixa de pedestres</td><td>Grave</td></tr>
<tr><td>Em ciclovia ou ciclofaixa</td><td>Grave</td></tr>
<tr><td>No acostamento, fora de emergência</td><td>Leve</td></tr></table></div>`},
{h:'Limites de velocidade',b:`<p>Quando não há placa, valem os limites do art. 61:</p>
<div class="tbl"><table><tr><th>Tipo de via</th><th>Limite</th></tr>
<tr><td>Urbana · trânsito rápido</td><td class="n">80 km/h</td></tr><tr><td>Urbana · arterial</td><td class="n">60 km/h</td></tr><tr><td>Urbana · coletora</td><td class="n">40 km/h</td></tr><tr><td>Urbana · local</td><td class="n">30 km/h</td></tr>
<tr><td>Rodovia pista dupla · automóveis, camionetas e motos</td><td class="n">110 km/h</td></tr><tr><td>Rodovia pista dupla · demais veículos</td><td class="n">90 km/h</td></tr>
<tr><td>Rodovia pista simples · automóveis, camionetas e motos</td><td class="n">100 km/h</td></tr><tr><td>Rodovia pista simples · demais veículos</td><td class="n">90 km/h</td></tr>
<tr><td>Estrada (não pavimentada)</td><td class="n">60 km/h</td></tr></table></div>
<p>Excesso de até 20%: média. De 20% a 50%: grave. Acima de 50%: gravíssima ×3, com suspensão do direito de dirigir.</p>`},
{h:'Infrações, pontos e penalidades',b:`<div class="tbl"><table><tr><th>Natureza</th><th>Pontos</th><th>Multa</th></tr>
<tr><td>Leve</td><td class="n">3</td><td class="n">R$ 88,38</td></tr><tr><td>Média</td><td class="n">4</td><td class="n">R$ 130,16</td></tr><tr><td>Grave</td><td class="n">5</td><td class="n">R$ 195,23</td></tr><tr><td>Gravíssima</td><td class="n">7</td><td class="n">R$ 293,47</td></tr></table></div>
<p><strong>Suspensão por pontos em 12 meses (art. 261):</strong> 20 pontos com duas ou mais gravíssimas; 30 pontos com uma gravíssima; 40 pontos sem gravíssimas.</p>
<p><strong>Penalidades (art. 256):</strong> advertência por escrito, multa, suspensão do direito de dirigir, cassação da habilitação e frequência obrigatória em curso de reciclagem.</p>
<p><strong>Medidas administrativas (art. 269):</strong> retenção e remoção do veículo, recolhimento do documento de habilitação, teste de alcoolemia, entre outras. Elas não são penalidades.</p>
<div class="tbl"><table><tr><th>Infrações que mais caem</th><th>Natureza</th></tr>
<tr><td>Dirigir sob efeito de álcool ou recusar o bafômetro</td><td>Gravíssima ×10 + suspensão 12 meses</td></tr>
<tr><td>Segurar ou manusear celular</td><td>Gravíssima</td></tr><tr><td>Avançar sinal vermelho</td><td>Gravíssima</td></tr>
<tr><td>Dirigir sem habilitação</td><td>Gravíssima ×3</td></tr><tr><td>Moto sem capacete</td><td>Gravíssima + suspensão</td></tr>
<tr><td>Transitar pelo acostamento</td><td>Gravíssima ×3</td></tr><tr><td>Ultrapassar em faixa contínua</td><td>Gravíssima ×5</td></tr>
<tr><td>Não dar preferência ao pedestre na faixa</td><td>Gravíssima</td></tr>
<tr><td>Não usar cinto</td><td>Grave</td></tr><tr><td>Estacionar em fila dupla</td><td>Grave</td></tr>
<tr><td>Jogar lixo pela janela</td><td>Média</td></tr><tr><td>Buzinar entre 22h e 6h</td><td>Leve</td></tr></table></div>`},
{h:'Multas, recursos e defesa',b:`<ol><li><strong>Notificação de autuação</strong>: deve ser enviada em até 30 dias após a infração. Nela consta o prazo para indicar o condutor que dirigia e para apresentar <strong>defesa prévia</strong>.</li><li><strong>Notificação de penalidade</strong>: se a defesa não for aceita, chega a multa com o prazo para pagar ou recorrer.</li><li><strong>Recurso em 1ª instância</strong>: à <strong>JARI</strong>.</li><li><strong>Recurso em 2ª instância</strong>: ao <strong>CETRAN</strong> (infrações estaduais e municipais) ou ao colegiado federal competente.</li></ol>
<p><strong>Descontos:</strong> pagar até o vencimento dá 20% de desconto. Quem reconhece a infração pelo sistema de notificação eletrônica (SNE) e abre mão de recorrer pode ter até 40%.</p>`},
{h:'Motocicletas',b:`<ul><li>Condutor e passageiro devem usar <strong>capacete</strong> com viseira ou óculos de proteção.</li><li>O passageiro deve ir no assento próprio, atrás do condutor.</li><li>É proibido transportar criança menor de 10 anos ou que não tenha condições de cuidar da própria segurança.</li><li>É proibido fazer malabarismo ou andar em uma roda só.</li><li>Os faróis devem ficar acesos.</li><li>Rebocar outro veículo ou transportar carga incompatível é proibido.</li></ul>`},
{h:'Glossário do CTB',b:`<p>Definições do Anexo I do CTB que mais aparecem nas questões.</p><div class="tbl"><table><tr><th>Termo</th><th>Significado</th></tr><tr><td><strong>Via</strong></td><td>Superfície por onde transitam veículos, pessoas e animais. Inclui pista, calçada, acostamento, ilha e canteiro central.</td></tr><tr><td><strong>Pista</strong></td><td>Parte da via normalmente usada para a circulação de veículos.</td></tr><tr><td><strong>Faixa de rolamento</strong></td><td>Cada uma das áreas longitudinais em que a pista se divide, larga o bastante para a circulação de veículos.</td></tr><tr><td><strong>Acostamento</strong></td><td>Parte da via ao lado da pista, para parada ou estacionamento em emergência e para pedestres e bicicletas quando não houver local próprio.</td></tr><tr><td><strong>Calçada</strong></td><td>Parte da via, em geral em nível diferente, reservada a pedestres e ao mobiliário urbano. Não é para veículos.</td></tr><tr><td><strong>Passeio</strong></td><td>Parte da calçada ou da pista, livre de interferências, destinada só a pedestres e, excepcionalmente, a ciclistas.</td></tr><tr><td><strong>Ciclovia</strong></td><td>Pista própria para bicicletas, separada fisicamente do trânsito comum.</td></tr><tr><td><strong>Ciclofaixa</strong></td><td>Parte da pista de rolamento reservada a bicicletas, delimitada apenas por sinalização.</td></tr><tr><td><strong>Canteiro central</strong></td><td>Obstáculo físico que separa duas pistas de rolamento.</td></tr><tr><td><strong>Ilha</strong></td><td>Obstáculo físico na pista que ordena os fluxos de uma interseção.</td></tr><tr><td><strong>Refúgio</strong></td><td>Área sinalizada e protegida onde o pedestre aguarda durante a travessia.</td></tr><tr><td><strong>Interseção</strong></td><td>Todo cruzamento em nível, entroncamento ou bifurcação, incluindo a área formada por eles.</td></tr><tr><td><strong>Passagem de nível</strong></td><td>Cruzamento no mesmo nível entre uma via e uma linha férrea.</td></tr><tr><td><strong>Parada</strong></td><td>Imobilização do veículo só pelo tempo necessário para embarque ou desembarque.</td></tr><tr><td><strong>Estacionamento</strong></td><td>Imobilização do veículo por tempo maior que o necessário para embarque ou desembarque.</td></tr><tr><td><strong>Conversão</strong></td><td>Movimento em ângulo, à esquerda ou à direita, que muda a direção original do veículo.</td></tr><tr><td><strong>Retorno</strong></td><td>Movimento de inversão total do sentido de circulação.</td></tr><tr><td><strong>Ultrapassagem</strong></td><td>Passar à frente de outro veículo mais lento, no mesmo sentido, saindo e voltando à faixa de origem.</td></tr><tr><td><strong>Ciclomotor</strong></td><td>Veículo de duas ou três rodas com motor de até 50 cc (ou elétrico de até 4 kW) e velocidade máxima de fabricação de até 50 km/h.</td></tr><tr><td><strong>Motoneta</strong></td><td>Veículo de duas rodas em que o condutor vai sentado (tipo scooter).</td></tr><tr><td><strong>Motocicleta</strong></td><td>Veículo de duas rodas em que o condutor vai montado.</td></tr><tr><td><strong>Camioneta</strong></td><td>Veículo misto que leva passageiros e carga no mesmo compartimento.</td></tr><tr><td><strong>Caminhonete</strong></td><td>Veículo de carga com peso bruto total de até 3.500 kg.</td></tr><tr><td><strong>Micro-ônibus / ônibus</strong></td><td>Micro-ônibus leva até 20 passageiros; ônibus, mais de 20.</td></tr><tr><td><strong>Lotação</strong></td><td>Carga útil máxima, incluindo condutor e passageiros.</td></tr><tr><td><strong>Peso bruto total (PBT)</strong></td><td>Peso máximo que o veículo transmite ao pavimento: tara (peso próprio) mais lotação.</td></tr><tr><td><strong>Veículo articulado</strong></td><td>Combinação de veículos acoplados, sendo um deles automotor.</td></tr><tr><td><strong>Trânsito</strong></td><td>Movimentação e imobilização de veículos, pessoas e animais nas vias terrestres.</td></tr><tr><td><strong>Logradouro público</strong></td><td>Espaço livre destinado pelo município à circulação de veículos ou pedestres, como ruas, praças e calçadões.</td></tr><tr><td><strong>Freio de estacionamento</strong></td><td>Dispositivo que mantém o veículo imóvel na ausência do condutor.</td></tr></table></div>`},
{h:'Crimes de trânsito',b:`<p>Alguns comportamentos são crimes, além de infrações:</p>
<ul><li>Homicídio e lesão corporal culposos na direção de veículo (art. 302 e 303).</li><li><strong>Omissão de socorro</strong> (art. 304), mesmo que outra pessoa preste o socorro.</li><li>Fugir do local do acidente para evitar responsabilidade (art. 305).</li><li><strong>Embriaguez ao volante</strong> (art. 306): a partir de 0,3 mg/L de ar alveolar ou 6 dg/L de sangue.</li><li>Violar a suspensão do direito de dirigir (art. 307).</li><li>Participar de racha (art. 308).</li><li>Dirigir sem habilitação gerando perigo de dano (art. 309).</li><li>Entregar a direção a pessoa não habilitada ou embriagada (art. 310).</li><li>Velocidade incompatível perto de escolas, hospitais e aglomerações (art. 311).</li><li>Fraudar provas em caso de acidente (art. 312).</li></ul>`}
]},
{id:'prep',t:'Preparação e dia da prova',sub:'Plano de estudo, técnicas de resposta e o que fazer depois da aprovação.',secs:[
{h:'Plano de estudo em 4 semanas',b:`<div class="tbl"><table><tr><th>Semana</th><th>Foco</th><th>Prática</th></tr>
<tr><td class="n">1</td><td>Legislação: normas de circulação, velocidades, habilitação</td><td>Treino de Legislação todos os dias</td></tr>
<tr><td class="n">2</td><td>Sinalização: todas as placas e marcas</td><td>Flashcards de placas e treino só de placas</td></tr>
<tr><td class="n">3</td><td>Direção defensiva, primeiros socorros, meio ambiente, relacionamento e mecânica</td><td>Treino por tema e 3 simulados completos</td></tr>
<tr><td class="n">4</td><td>Revisão dos pontos fracos</td><td>1 simulado completo por dia e revisão de erros</td></tr></table></div>
<div class="tip"><b>Meta</b>Marque a prova quando estiver tirando 24 ou mais em pelo menos 3 simulados seguidos. A folga protege contra o nervosismo do dia.</div>`},
{h:'Como responder as questões',b:`<ul><li><strong>Leia o enunciado inteiro</strong> antes de olhar as alternativas.</li><li><strong>Atenção a palavras como "NÃO", "EXCETO" e "INCORRETA"</strong>: elas invertem a pergunta.</li><li><strong>Elimine as absurdas</strong>: quase sempre há uma ou duas alternativas claramente erradas.</li><li><strong>Desconfie de "sempre" e "nunca"</strong> quando o assunto tem exceções.</li><li><strong>Controle o tempo</strong>: 60 minutos para 30 questões dão 2 minutos por questão. Pule as difíceis e volte depois.</li><li><strong>Não deixe em branco</strong>: questão sem resposta conta como erro.</li><li><strong>Revise</strong> antes de entregar, mas só troque uma resposta se tiver certeza.</li></ul>`},
{h:'No dia da prova',b:`<ul><li>Leve um <strong>documento oficial com foto</strong>, original.</li><li>Chegue com antecedência e confira o local e o horário no agendamento do DETRAN-MG.</li><li>Durma bem na noite anterior e faça uma refeição leve.</li><li>Celular e outros eletrônicos ficam desligados e guardados, conforme as regras do local.</li><li>Na véspera, revise só tabelas e placas. Não tente aprender conteúdo novo.</li></ul>`},
{h:'Depois da aprovação',b:`<ol><li>Com a prova teórica aprovada, vêm as <strong>aulas práticas</strong> com instrutor, portando a Licença de Aprendizagem.</li><li>Em seguida, o <strong>exame de direção</strong>. O examinador avalia o domínio do veículo, a obediência à sinalização e a segurança nas manobras.</li><li>Aprovado, você recebe a <strong>Permissão para Dirigir</strong>, válida por 1 ano. Evite infrações graves, gravíssimas ou repetir médias para receber a CNH definitiva.</li></ol>
<div class="tip"><b>Na prova prática</b>Use sempre o cinto, regule bancos e espelhos antes de sair, sinalize toda mudança de direção e respeite a preferência dos pedestres. Os critérios exatos de avaliação são definidos pelo DETRAN-MG.</div>`}
]},
{id:'peg',t:'Pegadinhas da prova',sub:'As confusões que mais derrubam candidatos, com a regra certa de cada uma.',secs:[
{h:'1. Parar não é estacionar',b:`<p><b>Como costuma cair:</b> uma placa com a letra E cortada e a pergunta “o que é proibido aqui?”.</p><p><b>A pegadinha:</b> parada é a imobilização só pelo tempo de embarque ou desembarque de passageiros; estacionamento é ficar parado por mais tempo que isso. A placa R-6a (E cortado por uma faixa) proíbe <b>estacionar</b>, mas deixa parar rapidamente. Quem proíbe as duas coisas é a R-6c (E com um X).</p><div class="tip"><b>Para não errar</b>R-6a: proibido estacionar. R-6b: estacionamento regulamentado. R-6c: proibido parar e estacionar.</div>`},
{h:'2. Regulamentação manda, advertência avisa',b:`<p><b>Como costuma cair:</b> uma placa e a pergunta se desobedecê-la é infração.</p><p><b>A pegadinha:</b> placas circulares com orla vermelha (regulamentação) são ordens: desobedecer é infração. Placas amarelas em losango (advertência) só alertam sobre um perigo adiante. A exceção de formato é a R-1, “Parada obrigatória”, que é octogonal, e a R-2, “Dê a preferência”, que é um triângulo de ponta para baixo.</p><div class="tip"><b>Para não errar</b>Redonda com borda vermelha = obrigação ou proibição. Losango amarelo = cuidado adiante.</div>`},
{h:'3. Quem manda mais: agente, semáforo ou placa',b:`<p><b>Como costuma cair:</b> o agente faz um gesto mandando seguir, mas o semáforo está vermelho.</p><p><b>A pegadinha:</b> pelo art. 89 do CTB, as ordens do agente de trânsito prevalecem sobre as normas de circulação e sobre os outros sinais. Depois vêm as indicações do semáforo, que prevalecem sobre as placas e marcas; e os sinais prevalecem sobre as regras gerais de circulação.</p><div class="tip"><b>Para não errar</b>Ordem: agente → semáforo → demais sinais → regras gerais do CTB. Se o agente mandou seguir, siga.</div>`},
{h:'4. Preferência em cruzamento sem sinalização',b:`<p><b>Como costuma cair:</b> dois carros chegam juntos a um cruzamento sem placa nem semáforo; ou um deles já está na rotatória.</p><p><b>A pegadinha:</b> o art. 29 do CTB diz: se só um vem de rodovia, a preferência é de quem está na rodovia; na rotatória, a preferência é de quem <b>já está circulando nela</b>, mesmo que venha pela sua esquerda; nos demais casos, tem preferência quem vem pela <b>direita</b>.</p><div class="tip"><b>Para não errar</b>Rodovia, depois rotatória, depois quem vem pela direita.</div>`},
{h:'5. Velocidade máxima onde não há placa',b:`<p><b>Como costuma cair:</b> “Em uma rodovia de pista simples sem placa, qual a velocidade máxima de um automóvel?”</p><p><b>A pegadinha:</b> muita gente responde 110 km/h, que é o limite das rodovias de <b>pista dupla</b>. Pelo art. 61, sem placa: rodovia de pista dupla 110 km/h e de pista simples 100 km/h para automóveis, camionetas e motocicletas (90 km/h para os demais veículos); estradas 60 km/h. Na cidade: via de trânsito rápido 80, arterial 60, coletora 40 e local 30 km/h. A velocidade mínima é a metade da máxima (art. 62).</p><div class="tip"><b>Para não errar</b>Pista dupla 110, pista simples 100, estrada 60. Cidade: 80, 60, 40, 30. Mínima = metade da máxima.</div>`},
{h:'6. Pontos na CNH e suspensão',b:`<p><b>Como costuma cair:</b> quantos pontos vale uma infração gravíssima, ou com quantos pontos a CNH é suspensa.</p><p><b>A pegadinha:</b> gravíssima vale <b>7 pontos</b>, não 10. Leve 3, média 4, grave 5. A suspensão (art. 261) depende do que você cometeu em 12 meses: 20 pontos se houver duas ou mais gravíssimas, 30 pontos se houver uma gravíssima e 40 pontos se não houver nenhuma.</p><div class="tip"><b>Para não errar</b>Pontos: 3, 4, 5 e 7. Suspensão: 20, 30 ou 40 pontos conforme o número de gravíssimas.</div>`},
{h:'7. Permissão para dirigir',b:`<p><b>Como costuma cair:</b> o que impede o motorista recém-habilitado de receber a CNH definitiva.</p><p><b>A pegadinha:</b> o primeiro documento é a Permissão para Dirigir, válida por um ano. Pelo art. 148, ela não vira CNH definitiva se o condutor cometer <b>uma única</b> infração grave ou gravíssima, ou se for reincidente em infração média. Uma infração leve isolada não impede.</p><div class="tip"><b>Para não errar</b>Na Permissão: uma grave ou gravíssima, ou duas médias, e o candidato recomeça o processo.</div>`},
{h:'8. Álcool: infração ou crime',b:`<p><b>Como costuma cair:</b> um motorista bebeu “só um pouquinho” ou se recusou a fazer o bafômetro.</p><p><b>A pegadinha:</b> para a infração do art. 165 basta <b>qualquer</b> concentração de álcool: é gravíssima, com multa multiplicada por 10 e suspensão do direito de dirigir por 12 meses. Recusar o teste do bafômetro tem a mesma penalidade (art. 165-A). O <b>crime</b> do art. 306 é outra coisa: concentração igual ou superior a 0,3 mg de álcool por litro de ar alveolar (ou 6 dg por litro de sangue), ou sinais de capacidade alterada.</p><div class="tip"><b>Para não errar</b>Infração: qualquer quantidade. Crime: a partir de 0,3 mg/L no bafômetro. Recusar o teste não livra da multa.</div>`},
{h:'9. Ultrapassagem',b:`<p><b>Como costuma cair:</b> em que situação é permitido ultrapassar pela direita, ou onde a ultrapassagem é proibida.</p><p><b>A pegadinha:</b> a regra é ultrapassar <b>pela esquerda</b>. Pela direita só quando o veículo da frente indicou que vai entrar à esquerda (art. 29). É proibido ultrapassar em pista de mão dupla nas curvas e aclives sem visibilidade, nas pontes e viadutos, nas passagens de nível e nas faixas de pedestres, salvo sinalização permitindo (art. 32), e também nas interseções e suas proximidades (art. 33).</p><div class="tip"><b>Para não errar</b>Esquerda sempre; direita só se o da frente sinalizou que vai virar à esquerda.</div>`},
{h:'10. Faixas no chão: amarela ou branca',b:`<p><b>Como costuma cair:</b> uma foto de faixa contínua e a pergunta se pode ultrapassar.</p><p><b>A pegadinha:</b> a cor indica o sentido: <b>amarela</b> separa fluxos de sentidos opostos; <b>branca</b> separa fluxos do mesmo sentido. O traço indica a regra: <b>contínua</b> não pode ser cruzada (proíbe ultrapassar e mudar de faixa); <b>seccionada</b> (tracejada) pode ser cruzada com segurança.</p><div class="tip"><b>Para não errar</b>Cor = sentido (amarela opostos, branca mesmo sentido). Linha contínua = não cruze.</div>`},
{h:'11. Farol baixo durante o dia',b:`<p><b>Como costuma cair:</b> “É obrigatório andar com farol aceso de dia em qualquer rodovia?”</p><p><b>A pegadinha:</b> não. Desde a Lei 14.071/2020, de dia o farol baixo é obrigatório em túneis, sob chuva, neblina ou cerração, e em rodovias de <b>pista simples</b> fora do perímetro urbano, para veículos que não tenham luz de rodagem diurna (DRL). Motocicletas, motonetas e ciclomotores usam farol baixo sempre, de dia e de noite.</p><div class="tip"><b>Para não errar</b>Pista simples fora da cidade sem DRL: farol baixo de dia. Moto: farol aceso sempre.</div>`},
{h:'12. Criança no carro',b:`<p><b>Como costuma cair:</b> com que idade a criança pode ir no banco da frente.</p><p><b>A pegadinha:</b> a regra tem <b>duas condições</b>: pelo art. 64, crianças com menos de 10 anos que ainda não atingiram 1,45 m de altura vão no banco traseiro, em dispositivo de retenção adequado à idade, ao peso e à altura. Só a idade não basta.</p><div class="tip"><b>Para não errar</b>Menos de 10 anos e menos de 1,45 m: banco de trás, na cadeirinha ou no assento de elevação.</div>`},
{h:'13. Primeiros socorros: o que não fazer',b:`<p><b>Como costuma cair:</b> a vítima de moto está consciente e pede para tirar o capacete, ou pede água.</p><p><b>A pegadinha:</b> nunca retire o capacete do motociclista e não dê nada para a vítima beber ou comer. Não mova a vítima, a não ser que haja risco iminente, como fogo. A primeira atitude é sinalizar o local para evitar um novo acidente e chamar o socorro: SAMU 192, Bombeiros 193.</p><div class="tip"><b>Para não errar</b>Sinalize, chame o socorro (192/193), não remova o capacete, não dê água, não mova a vítima.</div>`},
{h:'14. Aquaplanagem',b:`<p><b>Como costuma cair:</b> o carro perdeu aderência em uma poça na estrada. O que fazer?</p><p><b>A pegadinha:</b> a reação instintiva de pisar fundo no freio é a errada. Tire o pé do acelerador, segure o volante firme e mantenha a direção reta até os pneus voltarem a tocar o asfalto. Pneus gastos e velocidade alta aumentam o risco.</p><div class="tip"><b>Para não errar</b>Aquaplanou: tire o pé do acelerador, não freie bruscamente, volante firme e reto.</div>`}
]},
{id:'sin',t:'Sinalização de trânsito',sub:'Todas as placas, marcas no pavimento, dispositivos, semáforos, gestos e sons.',secs:[
{h:'Tipos de sinalização',b:`<p>A sinalização se divide em vertical (placas), horizontal (marcas no pavimento), dispositivos auxiliares, luminosa (semáforos), sonora e gestos do agente e do condutor. As placas se dividem em três grupos:</p>
<ul><li><strong>Regulamentação</strong>: impõem obrigações, proibições e limites. Formato circular, fundo branco e orla vermelha. Desobedecer é infração.</li><li><strong>Advertência</strong>: avisam sobre perigos adiante. Formato de losango, fundo amarelo. Em obras, fundo laranja.</li><li><strong>Indicação</strong>: orientam o condutor. Verde para destinos e identificação, azul para serviços, marrom para turismo, branco para mensagens educativas.</li></ul>
<div class="tip"><b>Exceções de formato</b>Parada obrigatória é octogonal e Dê a preferência é um triângulo invertido. São as únicas de regulamentação fora do círculo. A Cruz de Santo André (advertência) tem forma de X.</div>
<div class="tip"><b>Informações complementares</b>Uma placa pode vir com uma placa retangular embaixo (ex.: "Seg. a Sex. 7h às 19h"), que limita quando ou para quem a regra vale.</div>`},
{h:`Placas de regulamentação (${nCat('reg')})`,b:`<p>Têm códigos que começam com R. A faixa vermelha diagonal indica proibição. Sem a faixa, a placa indica obrigação ou limite.</p>${grpHtml('reg')}`},
{h:`Placas de advertência (${nCat('adv')})`,b:`<p>Têm códigos que começam com A. Pedem que o condutor reduza a velocidade e redobre a atenção. As letras "a" e "b" no código costumam indicar esquerda e direita.</p>${grpHtml('adv')}`},
{h:`Placas de indicação (${nCat('ind')})`,b:`<p>Orientam o trajeto, identificam vias e locais, indicam serviços e reforçam comportamentos seguros. As cores definem o tipo de informação.</p>${grpHtml('ind')}`},
{h:'Marcas no pavimento',b:`<p><strong>Marcas longitudinais</strong> (no sentido da via):</p><ul><li><strong>Amarelas</strong>: separam fluxos em sentidos opostos.</li><li><strong>Brancas</strong>: separam fluxos no mesmo sentido e marcam o bordo da pista.</li><li><strong>Contínua</strong>: proíbe ultrapassar e mudar de faixa.</li><li><strong>Seccionada (tracejada)</strong>: permite transpor com segurança.</li><li><strong>Dupla contínua</strong>: proibição nos dois sentidos. Uma contínua ao lado de uma seccionada vale para o lado de cada uma.</li></ul>
<p><strong>Marcas transversais</strong> (atravessam a via):</p><ul><li><strong>Linha de retenção</strong>: onde o veículo deve parar.</li><li><strong>Faixa de pedestres</strong> (zebrada ou paralela).</li><li><strong>Linhas de estímulo à redução de velocidade</strong>: faixas cada vez mais próximas.</li><li><strong>Marcação de cruzamento de ciclistas</strong>.</li></ul>
<p><strong>Outras:</strong> marcas de canalização (zebrado, onde não se circula nem se estaciona), marcas de delimitação de vagas, e inscrições como setas, "PARE", "ÔNIBUS" e símbolos.</p>
<p><strong>Cores especiais:</strong> vermelho para ciclovias e ciclofaixas; azul para vagas de pessoas com deficiência.</p>`},
{h:'Dispositivos auxiliares e obras',b:`<ul><li><strong>Tachas e tachões</strong>: pequenos refletores no pavimento que reforçam as faixas à noite.</li><li><strong>Balizadores e delineadores</strong>: marcam o alinhamento da via em curvas.</li><li><strong>Defensas metálicas e barreiras de concreto</strong>: contêm veículos desgovernados.</li><li><strong>Ondulações transversais (lombadas)</strong> e <strong>sonorizadores</strong>: forçam a redução de velocidade.</li><li><strong>Cones, cavaletes, tambores e telas</strong>: canalizam o trânsito em obras e emergências.</li><li><strong>Dispositivos luminosos</strong>: painéis de mensagem variável e setas luminosas.</li></ul>
<div class="tip"><b>Obras</b>A sinalização temporária de obras usa fundo laranja. Reduza a velocidade e siga os desvios indicados.</div>`},
{h:'Semáforo, gestos e sinais sonoros',b:`<p><strong>Semáforo veicular:</strong> vermelho, pare; amarelo, atenção (pare se puder fazê-lo com segurança); verde, siga. <strong>Semáforo de pedestres:</strong> boneco vermelho, não atravesse; verde, atravesse; vermelho piscando, termine a travessia ou não comece.</p>
<div class="tbl"><table><tr><th>Apito do agente</th><th>Significado</th></tr><tr><td>Um silvo breve</td><td>Siga</td></tr><tr><td>Dois silvos breves</td><td>Pare</td></tr><tr><td>Um silvo longo</td><td>Diminua a marcha</td></tr></table></div>
<div class="tbl"><table><tr><th>Gesto do condutor (braço esquerdo)</th><th>Significado</th></tr><tr><td>Estendido na horizontal</td><td>Vou virar à esquerda</td></tr><tr><td>Antebraço para cima</td><td>Vou virar à direita</td></tr><tr><td>Antebraço para baixo, movendo</td><td>Vou diminuir a marcha ou parar</td></tr></table></div>
<p><strong>Gestos do agente:</strong> braço levantado na vertical significa parada para todos os veículos; braços estendidos na horizontal significam parada para quem vem de frente ou de trás do agente; braço estendido com movimento vertical significa diminuir a marcha.</p>`},
{h:'Placas de serviços e de turismo',b:`<p>As placas de indicação usam a cor para avisar o tipo de informação:</p><ul><li><b>Azul, com pictograma preto sobre quadro branco</b>: serviços auxiliares ao condutor, como abastecimento (SAU-09), borracheiro (SAU-08), pronto-socorro (SAU-10), restaurante (SAU-12), hotel (SAU-13), pedágio (SAU-18) e terminal rodoviário (SAU-19).</li><li><b>Marrom, com pictograma branco</b>: atrativos turísticos, divididos em naturais (TNA, como cachoeira e praia), histórico-culturais (THC, como museu e igreja), de recreação (TAR, como parque e mirante), de esporte e lazer (TAD) e de eventos (TIT).</li><li><b>Verde</b>: orientação de destino nas rodovias, com cidades, distâncias e direções.</li></ul><div class="tip"><b>Na prova</b>Não confunda: o azul com cruz vermelha é pronto-socorro (serviço), e o marrom é sempre turismo. Veja todas na galeria de placas, nos filtros Serviços e Turismo.</div>`}
]},
{id:'dd',t:'Direção defensiva',sub:'Como prever riscos e evitar acidentes em qualquer situação.',secs:[
{h:'O que é e seus elementos',b:`<p>Direção defensiva é dirigir de modo a evitar acidentes, apesar das ações incorretas dos outros e das condições adversas.</p><ul><li><strong>Conhecimento</strong>: das leis e do veículo.</li><li><strong>Atenção</strong>: ao trânsito e ao ambiente, o tempo todo.</li><li><strong>Previsão</strong>: antecipar situações de risco.</li><li><strong>Decisão</strong>: escolher a melhor ação no momento certo.</li><li><strong>Habilidade</strong>: domínio do veículo.</li></ul>`},
{h:'Condições adversas',b:`<ul><li><strong>Luz</strong>: ofuscamento, pouca luz, sol contra.</li><li><strong>Tempo</strong>: chuva, neblina, vento.</li><li><strong>Via</strong>: buracos, curvas, pista escorregadia.</li><li><strong>Trânsito</strong>: congestionamento, horários de pico.</li><li><strong>Veículo</strong>: pneus gastos, freios ruins.</li><li><strong>Condutor</strong>: sono, álcool, estresse, celular.</li><li><strong>Passageiros e carga</strong>: distrações e excesso de peso.</li></ul>
<div class="tip"><b>Neblina e ofuscamento</b>Use farol baixo na neblina. Se for ofuscado, reduza e olhe para a margem direita da via.</div>`},
{h:'Distâncias e tempo de reação',b:`<p><strong>Distância de parada = distância de reação + distância de frenagem.</strong> Álcool, sono e celular aumentam o tempo de reação. A distância de frenagem cresce muito com a velocidade e com a pista molhada.</p><p>Use a <strong>regra dos dois segundos</strong>: quando o carro da frente passar por uma referência fixa, conte "mil e um, mil e dois". Você só deve chegar à referência depois disso. Com chuva ou à noite, aumente essa distância.</p>`},
{h:'Situações de risco',b:`<ul><li><strong>Aquaplanagem</strong>: segure firme o volante, tire o pé do acelerador e não freie bruscamente.</li><li><strong>Derrapagem da traseira</strong>: gire o volante para o mesmo lado em que a traseira escorrega.</li><li><strong>Curvas</strong>: reduza antes de entrar, nunca dentro dela.</li><li><strong>Descidas de serra</strong>: use marcha reduzida. Descer em ponto morto é infração.</li><li><strong>Ultrapassagem</strong>: só com visibilidade, espaço e sinalização. É a principal causa de colisões frontais.</li><li><strong>Ponto cego</strong>: ajuste os espelhos e olhe por cima do ombro, principalmente por causa das motos.</li><li><strong>Pneu furado em movimento</strong>: segure o volante, não freie bruscamente e reduza aos poucos até parar fora da pista.</li></ul>`},
{h:'Rodovias, noite e passagem de nível',b:`<ul><li><strong>Rodovias</strong>: o acostamento é só para emergências. Para trocar pneu, saia totalmente da pista e sinalize com o triângulo.</li><li><strong>Noite</strong>: reduza a velocidade. Use farol alto só sem veículos à frente ou vindo em sentido contrário. Piscar o farol rapidamente pode advertir outros motoristas, como sinal de intenção de ultrapassar.</li><li><strong>Passagem de nível</strong>: o trem tem preferência e não consegue parar a tempo. Reduza, olhe para os dois lados, escute e nunca pare sobre os trilhos.</li><li><strong>Veículos grandes</strong>: caminhões e ônibus têm pontos cegos maiores e fazem curvas mais abertas. Não fique ao lado deles por muito tempo.</li></ul>`},
{h:'Postura e equipamentos',b:`<ul><li>Mãos na posição "9 e 15", braços levemente flexionados.</li><li>Encosto de cabeça regulado na altura da cabeça, contra o efeito chicote.</li><li>Cinto para todos os ocupantes, inclusive no banco de trás.</li><li>Crianças com menos de 10 anos e menos de 1,45 m vão no banco traseiro, em dispositivo de retenção (bebê-conforto, cadeirinha ou assento de elevação).</li><li>Com freio ABS, pise firme e mantenha; o carro continua dirigível.</li><li>Objetos soltos no carro viram projéteis numa freada. Prenda a carga.</li></ul>`}
]},
{id:'ps',t:'Primeiros socorros',sub:'O que fazer, e o que não fazer, em um acidente.',secs:[
{h:'Sequência de ação',b:`<p>A ordem que mais cai na prova:</p><ol><li><strong>Garanta a segurança</strong>: estacione em local seguro, ligue o pisca-alerta e sinalize com o triângulo a uma distância que dê tempo de os outros reagirem.</li><li><strong>Peça socorro</strong>: informe o local exato, o número de vítimas e o estado delas.</li><li><strong>Avalie as vítimas</strong>: consciência, respiração e sangramentos.</li><li><strong>Ajude sem agravar</strong>: só faça o que souber fazer.</li></ol>
<div class="tbl"><table><tr><th>Serviço</th><th>Telefone</th></tr><tr><td>SAMU</td><td class="n">192</td></tr><tr><td>Corpo de Bombeiros</td><td class="n">193</td></tr><tr><td>Polícia Militar</td><td class="n">190</td></tr><tr><td>Polícia Rodoviária Federal</td><td class="n">191</td></tr></table></div>`},
{h:'Avaliando a vítima',b:`<ol><li><strong>Consciência</strong>: chame a vítima em voz alta e toque levemente nos ombros. Não a sacuda.</li><li><strong>Respiração</strong>: observe se o peito se movimenta.</li><li><strong>Sangramentos</strong>: procure hemorragias visíveis.</li></ol>
<ul><li>Consciente: converse, tranquilize e peça que não se mexa.</li><li>Inconsciente e respirando, sem suspeita de lesão na coluna: <strong>posição lateral de segurança</strong>, para evitar engasgo.</li><li>Inconsciente e sem respirar: chame o SAMU e comece as compressões torácicas.</li></ul>`},
{h:'O que NÃO fazer',b:`<ul><li>Não retire o capacete de motociclistas.</li><li>Não dê água, comida ou remédios à vítima.</li><li>Não remova a vítima, exceto em risco iminente (incêndio, explosão).</li><li>Não retire objetos cravados no corpo.</li><li>Não toque em veículos com cabos elétricos caídos sobre eles.</li><li>Não passe produtos caseiros em queimaduras nem estoure bolhas.</li></ul>`},
{h:'Procedimentos básicos',b:`<ul><li><strong>Hemorragia</strong>: compressão direta com pano limpo.</li><li><strong>Parada cardiorrespiratória</strong>: compressões no centro do peito, 100 a 120 por minuto. Com ventilação, 30 compressões para 2 ventilações.</li><li><strong>Estado de choque</strong> (pele fria, pálida, pulso rápido e fraco): mantenha a vítima deitada e aquecida.</li><li><strong>Queimaduras</strong>: água corrente em temperatura ambiente.</li><li><strong>Fraturas</strong>: não tente colocar o osso no lugar. Mantenha o membro imóvel.</li><li><strong>Vazamento de combustível</strong>: desligue a ignição e não deixe ninguém fumar perto.</li></ul>
<div class="tip"><b>Omissão de socorro</b>É crime (art. 304) deixar de prestar socorro ou, não podendo, deixar de pedir auxílio, mesmo que outra pessoa já esteja ajudando.</div>`}
]},
{id:'ma',t:'Meio ambiente e cidadania',sub:'Poluição, convivência e respeito no trânsito.',secs:[
{h:'Poluição causada pelos veículos',b:`<ul><li><strong>Monóxido de carbono (CO)</strong>: tóxico, incolor e sem cheiro.</li><li><strong>Dióxido de carbono (CO₂)</strong>: principal gás de efeito estufa.</li><li>O <strong>catalisador</strong> reduz a emissão de gases poluentes.</li><li>O <strong>PROCONVE</strong> controla as emissões de veículos novos.</li><li>Fumaça preta indica motor desregulado.</li><li>Escapamento adulterado ou defeituoso causa poluição sonora e é infração grave.</li></ul>`},
{h:'Atitudes que fazem diferença',b:`<ul><li>Pneus calibrados e motor regulado reduzem consumo e poluição.</li><li>Evite acelerações bruscas e motor ligado parado.</li><li>Óleo usado vai para pontos de coleta. Pneus velhos vão para reciclagem (água parada neles cria mosquito da dengue).</li><li>Não jogue lixo pela janela: além de poluir, é infração média.</li><li>Transporte coletivo, bicicleta e carona reduzem congestionamentos.</li></ul>`},
{h:'Cidadania e convivência',b:`<p>O trânsito é um espaço compartilhado. Cidadania é respeitar os direitos dos outros e cumprir as normas.</p><ul><li>Pedestres devem usar faixas e passarelas quando houver.</li><li>Bicicletas circulam nos bordos da pista, no mesmo sentido dos veículos, quando não houver ciclovia, ciclofaixa ou acostamento.</li><li>Os veículos maiores são responsáveis pela segurança dos menores, e todos pela dos pedestres.</li></ul>`}
]},
{id:'rel',t:'Relacionamento no trânsito',sub:'Comportamento, emoções, usuários vulneráveis, álcool e distrações.',secs:[
{h:'Comportamento seguro',b:`<p>A maioria dos acidentes tem relação com o comportamento humano: pressa, desatenção, imprudência e desrespeito às regras. Dirigir bem envolve técnica e também atitude.</p><ul><li><strong>Empatia</strong>: coloque-se no lugar do outro usuário da via.</li><li><strong>Paciência</strong>: o atraso de alguns minutos não justifica o risco.</li><li><strong>Cortesia</strong>: dê passagem, sinalize suas intenções e agradeça.</li><li><strong>Respeito às regras</strong>: elas existem para que todos possam prever o comportamento dos outros.</li></ul>`},
{h:'Emoções e agressividade',b:`<p>Raiva, estresse e ansiedade reduzem a atenção e levam a decisões arriscadas. Diante de uma provocação:</p><ul><li>Não responda com gestos, buzina ou "fechadas".</li><li>Aumente a distância do veículo agressivo e deixe-o seguir.</li><li>Se estiver nervoso ou triste demais, adie a viagem ou peça para outra pessoa dirigir.</li></ul>
<div class="tip"><b>Lembre-se</b>Competir no trânsito (racha, disputas de espaço) é crime e uma das causas de acidentes graves.</div>`},
{h:'Usuários vulneráveis',b:`<ul><li><strong>Pedestres</strong>: têm prioridade na faixa. Crianças são imprevisíveis; idosos e pessoas com deficiência precisam de mais tempo para atravessar.</li><li><strong>Ciclistas</strong>: mantenha 1,5 m ao passar, reduza a velocidade e cuidado ao abrir a porta.</li><li><strong>Motociclistas</strong>: ficam no ponto cego com facilidade. Olhe por cima do ombro antes de mudar de faixa.</li><li><strong>Áreas escolares e hospitalares</strong>: reduza a velocidade e evite buzinar.</li></ul>`},
{h:'Álcool, drogas e medicamentos',b:`<p>O álcool age já em pequenas quantidades:</p><ul><li>Aumenta o tempo de reação e diminui os reflexos.</li><li>Reduz o campo visual ("visão de túnel") e prejudica a percepção de distâncias.</li><li>Dá falsa sensação de confiança, levando a riscos maiores.</li></ul>
<p>Drogas ilícitas e alguns medicamentos (calmantes, antialérgicos, remédios para dormir) também causam sono e lentidão. Leia a bula e siga a orientação médica.</p>
<div class="tip"><b>Tolerância zero</b>No Brasil, qualquer concentração de álcool ao volante é infração gravíssima. Café ou banho frio não eliminam o álcool do organismo.</div>`},
{h:'Fadiga e distrações',b:`<ul><li><strong>Sono</strong>: bocejos, olhos pesados e dificuldade de manter a faixa são sinais de alerta. Pare e descanse.</li><li><strong>Viagens longas</strong>: faça pausas regulares.</li><li><strong>Celular</strong>: segurar ou manusear é infração gravíssima. Mensagens tiram os olhos da via por vários segundos.</li><li><strong>Outras distrações</strong>: comer, mexer no rádio ou no GPS, discussões com passageiros.</li></ul>`}
]},
{id:'mec',t:'Mecânica básica',sub:'Painel, pneus, motor, segurança e manutenção.',secs:[
{h:'Luzes do painel',b:`<ul><li><strong>Pressão do óleo</strong> (vermelha): pare em local seguro e desligue o motor.</li><li><strong>Temperatura</strong>: motor superaquecido. Nunca abra o reservatório com o motor quente.</li><li><strong>Bateria</strong>: falha no sistema de carga (alternador ou correia).</li><li><strong>Freio</strong>: freio de mão puxado ou nível baixo de fluido.</li><li><strong>Injeção / motor</strong> (amarela): falha no sistema de injeção. Procure uma oficina.</li><li><strong>ABS e airbag</strong> (amarelas): sistema com falha; o freio comum continua funcionando.</li></ul>
<div class="tip"><b>Regra geral</b>Luz vermelha pede parada; luz amarela pede verificação em breve.</div>`},
{h:'Motor e sistemas',b:`<ul><li><strong>Arrefecimento</strong>: radiador, bomba d'água, válvula termostática e ventoinha.</li><li><strong>Lubrificação</strong>: verifique o óleo em local plano, com o motor desligado há alguns minutos.</li><li><strong>Elétrico</strong>: a bateria dá a partida; o alternador recarrega com o motor ligado.</li><li><strong>Ignição</strong>: velas em motores a gasolina, etanol ou flex. No diesel, a combustão é por compressão.</li><li><strong>Alimentação</strong>: filtro de ar, filtro de combustível e injeção eletrônica.</li><li><strong>Transmissão</strong>: a embreagem acopla e desacopla o motor das rodas.</li><li><strong>Freios</strong>: pedal baixo ou esponjoso indica ar no sistema ou falta de fluido.</li></ul>`},
{h:'Pneus, suspensão e direção',b:`<ul><li>Calibre com os pneus <strong>frios</strong>, incluindo o estepe.</li><li>Sulco mínimo de <strong>1,6 mm</strong>, indicado pelo TWI.</li><li>Desgaste no centro: pressão alta. Nas bordas: pressão baixa.</li><li>Carro puxando para um lado: alinhamento. Volante vibrando: balanceamento.</li><li>Amortecedores gastos aumentam a distância de frenagem.</li></ul>`},
{h:'Segurança do veículo',b:`<ul><li><strong>Airbag</strong>: complementa o cinto; sem cinto, pode até causar lesões.</li><li><strong>ABS</strong>: evita o travamento das rodas na frenagem.</li><li><strong>Encosto de cabeça</strong>: protege o pescoço em colisões traseiras.</li><li><strong>Limpadores</strong>: palhetas que riscam o vidro devem ser trocadas.</li><li><strong>Luzes</strong>: faróis, lanternas, freio e setas devem funcionar sempre.</li></ul>`},
{h:'Manutenção preventiva',b:`<div class="tbl"><table><tr><th>Item</th><th>O que verificar</th></tr>
<tr><td>Óleo do motor</td><td>Nível pela vareta e troca no prazo do fabricante</td></tr>
<tr><td>Líquido de arrefecimento</td><td>Nível no reservatório, com o motor frio</td></tr>
<tr><td>Fluido de freio</td><td>Nível e troca periódica</td></tr>
<tr><td>Pneus</td><td>Calibragem, desgaste e estepe</td></tr>
<tr><td>Luzes</td><td>Faróis, lanternas, setas e luz de freio</td></tr>
<tr><td>Palhetas</td><td>Limpeza do para-brisa sem riscos</td></tr>
<tr><td>Bateria</td><td>Terminais limpos e partida firme</td></tr></table></div>`},
{h:'Equipamentos obrigatórios',b:`<p>Para automóveis: cinto de segurança, encosto de cabeça, espelhos retrovisores, buzina, faróis e lanternas, triângulo de sinalização, macaco, chave de roda e estepe (dispensado em veículos com pneus que rodam vazios).</p><p>O <strong>extintor de incêndio é opcional</strong> para automóveis desde 2015 (Resolução CONTRAN 556/2015).</p>`}
]}
];

  ({inicio:rHome,aulas:rAulas,placas:rPlacas,simulados:rSims,prova:rExam,desempenho:rStats})[h]();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

function stats(){const h=S.hist.filter(x=>x.total===TOTAL&&x.mode==='prova');const pct=S.hist.length?Math.round(S.hist.reduce((a,x)=>a+x.score/x.total,0)/S.hist.length*100):null;
  let ans=0;Object.values(S.seen).forEach(v=>ans+=v[1]);
  return{n:S.hist.length,best:h.length?Math.max(...h.map(x=>x.score)):null,pct,ans,wrong:Object.keys(S.wrong).filter(k=>k in QI).length,passed:h.filter(x=>x.score>=PASS).length,full:h.length}}
function lessonsDone(){let d=0,t=0;MOD.forEach(m=>{t+=m.secs.length;d+=modDone(m)});return[d,t]}

function cdText(){if(!S.examDate)return '<h3>Quando é a sua prova?</h3><p class="muted" style="font-size:15px;margin-top:4px">Marque a data para ver quantos dias faltam e o ritmo de estudo sugerido.</p>';
 const d=new Date(S.examDate+'T00:00:00'),t=new Date();t.setHours(0,0,0,0);const n=Math.round((d-t)/864e5);
 if(n<0)return '<h3>A data marcada já passou</h3><p class="muted" style="font-size:15px;margin-top:4px">Atualize a data se você remarcou a prova.</p>';
 if(n===0)return '<h3>A prova é hoje. Boa sorte!</h3><p class="muted" style="font-size:15px;margin-top:4px">Revise só as tabelas e as placas. Leve documento com foto.</p>';
 const tip=n<=3?'Faça 1 simulado completo por dia e revise seus erros.':n<=10?'Faça 1 simulado completo por dia e um treino do tema mais fraco.':'Siga o plano de 4 semanas do módulo Preparação.';
 return `<h3><span class="num" style="font-size:44px;color:var(--accent-ink)">${n}</span> ${n===1?'dia':'dias'} para a prova</h3><p class="muted" style="font-size:15px;margin-top:4px">${tip}</p>`}
function rHome(){const st=stats(),[ld,lt]=lessonsDone();
$('#v-inicio').innerHTML=`
<div class="hero"><div class="hero-in">

    <div class="facts"><div><b class="num">30</b><span>questões</span></div><div><b class="num">20</b><span>acertos para aprovar</span></div><div><b class="num">60</b><span>minutos</span></div><div><b class="num">4</b><span>alternativas cada</span></div></div>

</div><div class="post"></div></div>

<div class="kpis">

${PRO?'':payBox('Estude tudo por R$ 29,90','Você está usando a versão grátis: módulos de Legislação e Preparação, placas de regulamentação, simulados 1 e 2 e treino rápido. Libere o resto com um pagamento único.')}
<div class="panel"><div class="sec-head"><div><h2>Plano de estudo</h2><p class="muted">Três etapas, nesta ordem.</p></div></div>
<div class="steps" style="margin-top:18px">

  <div class="step"><span class="n">2</span><div><h3>Decore as placas</h3><p>Use o modo de memorização na galeria: o nome fica oculto até você tocar na placa.</p></div></div>

function pickOfficial(r){let ids=[];Object.entries(DIST).forEach(([th,n])=>{ids=ids.concat(shuf(byTh(th),r).slice(0,n).map(q=>q.id))});return shuf(ids,r)}
const FIXP={};Object.keys(DIST).forEach((th,k)=>FIXP[th]=shuf(byTh(th),rng(1020+k*31)).map(q=>q.id));
const HARDP={};Object.keys(DIST).forEach((th,k)=>{const qs=byTh(th);HARDP[th]=shuf(qs.filter(q=>q.dif===2),rng(4040+k*17)).concat(shuf(qs.filter(q=>q.dif===1),rng(5050+k*17))).map(q=>q.id)});
function pickHard(n,r){let ids=[];Object.entries(DIST).forEach(([th,c])=>{const p=HARDP[th];for(let j=0;j<c;j++)ids.push(p[((n-1)*c+j)%p.length])});return shuf(ids,r)}
function pickFixed(n,r){let ids=[];Object.entries(DIST).forEach(([th,c])=>{const p=FIXP[th];for(let j=0;j<c;j++)ids.push(p[((n-1)*c+j)%p.length])});return shuf(ids,r)}

 if(o.kind==='fixed'){ids=pickFixed(o.n,r);name='Simulado '+String(o.n).padStart(2,'0');limit=LIMIT;sid='sim'+o.n}
 else if(o.kind==='hard'){ids=pickHard(o.n,r);name='Simulado difícil '+String(o.n).padStart(2,'0');limit=LIMIT;sid='hard'+o.n}
 else if(o.kind==='random'){ids=pickOfficial(r);name='Prova completa';limit=LIMIT}
 else if(o.kind==='free'){ids=pickOfficial(r);name='Prova sem tempo';mode='treino'}
 else if(o.kind==='quick'){ids=shuf(Q.filter(isB),r).slice(0,10).map(q=>q.id);name='Treino rápido';mode='treino'}

 goto('prova')}

<aside class="side"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px"><h3 style="font-size:20px">Questões</h3><span class="num muted">${nAns}/${EX.items.length}</span></div><div class="grid30">${grid}</div></div>
${confirmOpen?`<div class="confirm"><b>${nAns<EX.items.length?`Faltam ${EX.items.length-nAns} questões sem resposta.`:'Todas as questões foram respondidas.'}</b><span>${tr?'Encerrar e ver o resultado?':'Depois de entregar, não é possível alterar as respostas.'}</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-p btn-sm" id="e-yes">${tr?'Ver resultado':'Entregar'}</button><button class="btn btn-g btn-sm" id="e-no">Voltar</button></div></div>`:`<button class="btn btn-g" id="e-fin">${tr?'Encerrar treino':'Entregar prova'}</button>`}
<button class="btn btn-g btn-sm" id="e-quit">Sair sem salvar</button>
</aside></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const oi=+b.dataset.o;if(tr&&it.sel!==null)return;it.sel=oi;rExam()});
 document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{EX.i=+b.dataset.g;rExam()});
 if($('#e-prev'))$('#e-prev').onclick=()=>{EX.i--;rExam()};
 if($('#e-next'))$('#e-next').onclick=()=>{EX.i++;rExam();$('#v-prova').scrollIntoView({block:'start'})};
 const ask=()=>{confirmOpen=true;rExam()};
 if($('#e-fin'))$('#e-fin').onclick=ask;if($('#e-fin2'))$('#e-fin2').onclick=ask;
 if($('#e-yes'))$('#e-yes').onclick=finish;if($('#e-no'))$('#e-no').onclick=()=>{confirmOpen=false;rExam()};
 $('#e-quit').onclick=()=>{if(tick){clearInterval(tick);tick=null}EX=null;goto('simulados')};
}
document.addEventListener('keydown',e=>{if($('#v-prova').hidden||!EX||EX.done||e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;const k=e.key.toUpperCase();const idx='ABCD'.indexOf(k);
 if(idx>=0){const it=EX.items[EX.i];if(EX.mode==='treino'&&it.sel!==null)return;it.sel=it.ord[idx];rExam()}
 else if(e.key==='ArrowRight'&&EX.i<EX.items.length-1){EX.i++;rExam()}else if(e.key==='ArrowLeft'&&EX.i>0){EX.i--;rExam()}});
function finish(){if(!EX||EX.done)return;if(tick){clearInterval(tick);tick=null}
 EX.done=true;EX.used=Math.floor((Date.now()-EX.start)/1000);const by={};let sc=0;
 EX.items.forEach(it=>{const q=Q[QI[it.id]],ok=it.sel===0;if(ok)sc++;by[q.th]=by[q.th]||[0,0];by[q.th][1]++;if(ok)by[q.th][0]++;
   const s=S.seen[it.id]||[0,0];s[1]++;if(ok)s[0]++;S.seen[it.id]=s;if(ok)delete S.wrong[it.id];else S.wrong[it.id]=1});
 EX.score=sc;EX.by=by;S.hist.push({sid:EX.sid,name:EX.name,mode:EX.mode,date:Date.now(),score:sc,total:EX.items.length,used:EX.used,by});
 if(S.hist.length>200)S.hist=S.hist.slice(-200);save();confirmOpen=false;rExam();window.scrollTo(0,0)}
function thBars(by){return `<div class="thbars">${Object.keys(TH).filter(k=>by[k]).map(k=>{const[c,t]=by[k],p=c/t;return `<div class="thb"><span>${TH[k]}</span><div class="bar"><i class="${p>=.75?'ok':p>=.6?'mid':'bad'}" style="width:${p*100}%"></i></div><span class="num">${c}/${t}</span></div>`}).join('')}</div>`}
function rResult(){const n=EX.items.length,need=n===TOTAL?PASS:Math.ceil(n*2/3),ok=EX.score>=need;
 const items=EX.items.map((it,k)=>({it,k,q:Q[QI[it.id]]})).filter(x=>revFilter==='all'||x.it.sel!==0);
 $('#v-prova').innerHTML=`<div class="result-hero"><div class="score">${EX.score}<small>/${n}</small></div><div><span class="st ${ok?'ok':'bad'}">${ok?'Aprovado':'Reprovado'}</span><p>${esc(EX.name)} · ${Math.round(EX.score/n*100)}% de acertos · ${fmt(EX.used)} de prova. ${n===TOTAL?'Na prova do DETRAN são necessários 20 acertos.':`Meta deste treino: ${need} acertos.`} ${ok?'Continue treinando para manter o ritmo.':'Revise as aulas dos temas mais fracos e refaça os erros.'}</p>
 <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn btn-p btn-sm" id="r-new">Novo simulado</button>${n-EX.score?'<button class="btn btn-road btn-sm" id="r-wrong">Refazer meus erros</button>':''}<a class="btn btn-road btn-sm" href="#desempenho">Ver desempenho</a></div></div></div>
<div class="panel"><h3 style="margin-bottom:14px">Acertos por tema</h3>${thBars(EX.by)}</div>
<div class="sec-head"><h2>Correção</h2><div class="toolbar"><button class="chip" data-rf="all" aria-pressed="${revFilter==='all'}">Todas (${n})</button><button class="chip" data-rf="bad" aria-pressed="${revFilter==='bad'}">Erradas (${n-EX.score})</button></div></div>
<div class="review">${items.length?items.map(({it,k,q})=>{const right=it.sel===0,isImg=!!q.opts[0].g;
  const mine=it.sel===null?'Sem resposta':isImg?'':esc(q.opts[it.sel].t);
  return `<div class="rv ${right?'':'bad'}"><span class="eyebrow">${k+1} · ${TH[q.th]}${q.bnq?' · '+BNQ_DIF[q.dif]:''}</span><p class="q">${esc(q.q)}</p>${q.img?`<svg viewBox="0 0 100 100" role="img" aria-label="Placa">${q.img}</svg>`:''}${q.imgs&&q.imgs.length?q.imgs.map(g=>`<svg viewBox="0 0 100 100" role="img" aria-label="Placa">${g}</svg>`).join(''):''}
  ${isImg?`<div class="imgline">${it.sel!==null&&!right?`<span>Sua resposta:</span><svg viewBox="0 0 100 100" role="img" aria-label="Sua resposta">${q.opts[it.sel].g}</svg>`:''}${it.sel===null?'<span>Sem resposta.</span>':''}<span>Correta:</span><svg viewBox="0 0 100 100" role="img" aria-label="Resposta correta">${q.opts[0].g}</svg></div>`
  :`<p class="a">${right?'':`<span style="color:var(--bad)">Sua resposta: ${mine}</span><br>`}<span style="color:var(--ok)"><b>Correta:</b> ${esc(q.opts[0].t)}</span></p>`}
  <p class="e">${esc(q.e)}</p></div>`}).join(''):'<p class="muted">Nenhuma questão errada. Muito bem!</p>'}</div>`;
 $('#r-new').onclick=()=>goto('simulados');if($('#r-wrong'))$('#r-wrong').onclick=()=>startExam({kind:'wrong'});
 document.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{revFilter=b.dataset.rf;rResult()});
}

/* ===================== Desempenho ===================== */
function rStats(){const st=stats(),h=S.hist;
 if(!h.length){$('#v-desempenho').innerHTML=`<div class="sec-head"><div><h2>Desempenho</h2></div></div><div class="panel empty">${svgOf(SIG['A-14'])}<h3>Nenhum simulado feito ainda</h3><p class="muted">Faça seu primeiro simulado e o seu histórico, a evolução das notas e os acertos por tema aparecem aqui.</p><a class="btn btn-p" href="#simulados">Ir para os simulados</a></div>`;return}
 const agg={};h.forEach(x=>Object.entries(x.by).forEach(([k,[c,t]])=>{agg[k]=agg[k]||[0,0];agg[k][0]+=c;agg[k][1]+=t}));
 const last=h.slice(-15);const W=600,H=230,pl=40,pr=12,pt=14,pb=34,cw=(W-pl-pr)/last.length,y=p=>pt+(1-p)*(H-pt-pb);
 let ch=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Porcentagem de acertos nos últimos simulados">`;
 [0,.25,.5,.75,1].forEach(p=>{ch+=`<line x1="${pl}" x2="${W-pr}" y1="${y(p)}" y2="${y(p)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(p)+4}" font-size="11" text-anchor="end" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">${p*100}%</text>`});
 last.forEach((x,i)=>{const p=x.score/x.total,bw=Math.min(28,cw*.6),cx=pl+cw*i+cw/2,pass=x.total===TOTAL?x.score>=PASS:p>=2/3;ch+=`<rect x="${cx-bw/2}" y="${y(p)}" width="${bw}" height="${Math.max(1,y(0)-y(p))}" rx="3" fill="${pass?'var(--ok)':'var(--bad)'}"/><text x="${cx}" y="${H-pb+16}" font-size="11" text-anchor="middle" fill="var(--muted)" font-family="Atkinson Hyperlegible,sans-serif">${h.length-last.length+i+1}</text>`});
 ch+=`<line x1="${pl}" x2="${W-pr}" y1="${y(2/3)}" y2="${y(2/3)}" stroke="var(--accent-ink)" stroke-width="2" stroke-dasharray="6 4"/><text x="${W-pr}" y="${y(2/3)-6}" font-size="11" text-anchor="end" fill="var(--accent-ink)" font-family="Atkinson Hyperlegible,sans-serif" font-weight="700">Aprovação: 20/30</text></svg>`;
 $('#v-desempenho').innerHTML=`<div class="sec-head"><div><h2>Desempenho</h2><p class="muted">Seus dados ficam salvos apenas neste navegador.</p></div></div>
<div class="kpis"><div class="kpi"><b>${st.n}</b><span>simulados e treinos</span></div><div class="kpi"><b>${st.full?st.passed+'/'+st.full:'—'}</b><span>provas completas aprovadas</span></div><div class="kpi"><b>${st.best===null?'—':st.best+'/30'}</b><span>melhor nota</span></div><div class="kpi"><b>${st.pct}%</b><span>média de acertos</span></div><div class="kpi"><b>${st.ans}</b><span>questões respondidas</span></div></div>
<div class="panel"><h3 style="margin-bottom:12px">Evolução (últimos ${last.length})</h3><div class="chart">${ch}</div></div>
<div class="two"><div class="panel"><h3 style="margin-bottom:14px">Acertos por tema (geral)</h3>${thBars(agg)}<p class="muted" style="font-size:14px;margin-top:14px">Verde a partir de 75%. Temas em vermelho merecem uma nova leitura da aula.</p></div>
<div class="panel"><h3 style="margin-bottom:6px">Histórico</h3><div class="hist">${h.slice().reverse().slice(0,12).map(x=>{const pass=x.total===TOTAL?x.score>=PASS:x.score/x.total>=2/3;return `<div class="row"><span><b>${esc(x.name)}</b><br><span class="muted" style="font-size:13px">${new Date(x.date).toLocaleDateString('pt-BR')} · ${fmt(x.used||0)}</span></span><span class="num" style="font-size:22px">${x.score}/${x.total}</span><span class="pill ${pass?'ok':'bad'}">${pass?'Aprovado':'Reprovado'}</span></div>`}).join('')}</div></div></div>
<div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span class="muted">${resetAsk?'Isso apaga histórico, erros e aulas concluídas. Confirma?':'Quer começar do zero?'}</span><div style="display:flex;gap:8px">${resetAsk?'<button class="btn btn-p btn-sm" id="z-yes">Apagar tudo</button><button class="btn btn-g btn-sm" id="z-no">Cancelar</button>':'<button class="btn btn-g btn-sm" id="z-ask">Apagar meus dados</button>'}</div></div>`;
 if($('#z-ask'))$('#z-ask').onclick=()=>{resetAsk=true;rStats()};if($('#z-no'))$('#z-no').onclick=()=>{resetAsk=false;rStats()};
 if($('#z-yes'))$('#z-yes').onclick=()=>{S={hist:[],wrong:{},seen:{},read:{}};save();resetAsk=false;rStats()};
}
renderHeader();route();
</script>

</body>
</html>
