<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Habilita MG – Estudo para a prova do DETRAN-MG</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpolygon points='50,3 97,50 50,97 3,50' fill='%23F6C400' stroke='%23111' stroke-width='4'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: faixa de asfalto no topo (cabeçalho + destaque), conteúdo em superfície clara, placas reais como peças-chave */
:root{
  --bg:#ECEEF0; --surface:#FFFFFF; --sunk:#E2E5E8; --ink:#14181D; --muted:#56606B; --line:#D2D7DC;
  --accent:#F2B400; --accent-ink:#875B00; --on-accent:#15181C;
  --road:#1F252C; --road-2:#2A323B; --road-ink:#F1F3F5; --road-muted:#A9B3BD;
  --ok:#1C7C44; --ok-bg:#DFF1E6; --bad:#BE251E; --bad-bg:#F8E1DF; --info:#1B4F95; --info-bg:#E1EAF7;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111519; --surface:#1A1F25; --sunk:#232930; --ink:#E8EBEE; --muted:#9AA4AF; --line:#2F363E;
  --accent:#F5BF1F; --accent-ink:#F5BF1F; --on-accent:#15181C;
  --road:#0B0E11; --road-2:#171C22; --road-ink:#F1F3F5; --road-muted:#9AA4AF;
  --ok:#4CC383; --ok-bg:#16301F; --bad:#F2716A; --bad-bg:#3B1D1B; --info:#86B2F0; --info-bg:#1A2840; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111519; --surface:#1A1F25; --sunk:#232930; --ink:#E8EBEE; --muted:#9AA4AF; --line:#2F363E;
  --accent:#F5BF1F; --accent-ink:#F5BF1F; --on-accent:#15181C;
  --road:#0B0E11; --road-2:#171C22; --road-ink:#F1F3F5; --road-muted:#9AA4AF;
  --ok:#4CC383; --ok-bg:#16301F; --bad:#F2716A; --bad-bg:#3B1D1B; --info:#86B2F0; --info-bg:#1A2840; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--road)}
.wrap{max-width:1140px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.05;margin:0}
h2{font-size:clamp(28px,4vw,38px);font-weight:700;text-transform:uppercase;letter-spacing:.01em}
h3{font-size:22px;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-display);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--accent-ink)}
.muted{color:var(--muted)}

/* Cabeçalho */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--road);color:var(--road-ink)}
.top-in{display:flex;align-items:center;gap:20px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--f-display);font-size:24px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.brand b span{color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--f-display);font-weight:600;font-size:17px;text-transform:uppercase;letter-spacing:.05em;color:var(--road-muted);text-decoration:none;padding:8px 12px;border-radius:6px;white-space:nowrap}
nav.tabs a:hover{color:var(--road-ink);background:var(--road-2)}
nav.tabs a[aria-current="page"]{color:var(--on-accent);background:var(--accent)}
.lane{height:5px;background:var(--road);position:relative}
.lane::after{content:"";position:absolute;left:0;right:0;top:1px;height:3px;background:repeating-linear-gradient(90deg,var(--accent) 0 34px,transparent 34px 56px)}
@media (max-width:640px){.top-in{gap:8px}nav.tabs{margin-left:0;width:100%}nav.tabs a{font-size:15px;padding:7px 10px}}

main{padding-block:28px 64px}
.view{display:grid;gap:28px}

/* Botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;border-radius:8px;padding:11px 18px;font-family:var(--f-display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;text-decoration:none;line-height:1}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-p:hover{filter:brightness(1.06)}
.btn-g{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-g:hover{border-color:var(--muted)}
.btn-road{background:transparent;border-color:#4A545F;color:var(--road-ink)}
.btn-road:hover{border-color:var(--road-ink)}
.btn-sm{font-size:15px;padding:8px 12px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Hero */
.hero{background:var(--road);color:var(--road-ink);border-radius:14px;overflow:hidden;position:relative}
.hero-in{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;padding:40px 36px 36px;align-items:center}
.hero h1{font-size:clamp(40px,6.4vw,76px);font-weight:800;text-transform:uppercase;letter-spacing:-.005em;line-height:.92}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{color:var(--road-muted);font-size:18px;max-width:46ch;margin-top:16px}
.hero .facts{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:22px}
.hero .facts div{display:flex;flex-direction:column}
.hero .facts b{font-family:var(--f-display);font-size:36px;font-weight:700;color:var(--road-ink);line-height:1}
.hero .facts span{font-size:13px;color:var(--road-muted);text-transform:uppercase;letter-spacing:.06em}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-signs{position:relative;height:300px}
.hero-signs svg{position:absolute;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.hero-signs .s1{width:170px;left:8%;top:10px;transform:rotate(-6deg)}
.hero-signs .s2{width:150px;right:4%;top:40px;transform:rotate(5deg)}
.hero-signs .s3{width:150px;left:34%;top:140px;transform:rotate(-2deg)}
.hero .post{position:absolute;bottom:0;left:0;right:0;height:5px;background:repeating-linear-gradient(90deg,var(--accent) 0 34px,transparent 34px 56px);opacity:.9}
@media (max-width:820px){.hero-in{grid-template-columns:1fr;padding:28px 20px}.hero-signs{height:190px}.hero-signs .s1{width:110px;left:0}.hero-signs .s2{width:100px;right:0;top:10px}.hero-signs .s3{width:100px;left:34%;top:80px}}

/* Painéis */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head p{max-width:62ch;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px}
.kpi b{display:block;font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--muted)}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi:last-child{grid-column:span 2}}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.step{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.step .n{font-family:var(--f-display);font-weight:800;font-size:42px;line-height:.85;color:var(--accent-ink)}
.step h3{font-size:20px;margin-bottom:4px}
.step p{color:var(--muted);font-size:15px}
@media (max-width:760px){.steps{grid-template-columns:1fr}}

.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:10px;cursor:pointer;text-align:left}
.mod:hover{border-color:var(--muted)}
.mod .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.mod h3{font-size:22px}
.mod p{font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
@media (max-width:900px){.mods{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.mods{grid-template-columns:1fr}}

/* Aulas */
.lesson-grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start}
.lesson-nav{position:sticky;top:90px;display:grid;gap:4px}
.lesson-nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:15px}
.lesson-nav button:hover{background:var(--sunk)}
.lesson-nav button[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);font-weight:700}
.lesson-nav small{font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:860px){.lesson-grid{grid-template-columns:1fr}.lesson-nav{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:4px}}
.lesson{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px)}
.lesson>header h2{font-size:clamp(30px,4.6vw,44px)}
.lesson>header p{color:var(--muted);margin-top:8px}
.lsec{border-top:1px solid var(--line);padding-top:22px;margin-top:22px}
.lsec-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.lsec h3{font-size:26px}
.prose{max-width:68ch;margin-top:10px;display:grid;gap:12px}
.prose ul,.prose ol{margin:0;padding-left:22px;display:grid;gap:6px}
.prose strong{font-weight:700}
.tip{border-left:4px solid var(--accent);background:var(--sunk);padding:12px 14px;border-radius:0 8px 8px 0;font-size:15px}
.tip b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:14px;display:block;color:var(--accent-ink)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.tbl table{border-collapse:collapse;width:100%;font-size:15px;min-width:440px}
.tbl th,.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.05em;background:var(--sunk)}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.signrow{display:flex;flex-wrap:wrap;gap:14px}
.signrow figure{margin:0;width:104px;display:grid;gap:6px;justify-items:center;text-align:center;font-size:13px;color:var(--muted)}
.signrow svg{width:76px;height:76px}
.check{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ok);font-weight:700}
.lesson-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line)}

/* Placas */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-size:15px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sign{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 12px 12px;display:grid;gap:8px;justify-items:center;text-align:center;cursor:pointer}
.sign:hover{border-color:var(--muted)}
.sign svg{width:96px;height:96px}
.sign code{font-family:var(--f-display);font-size:14px;color:var(--muted);letter-spacing:.04em}
.sign .nm{font-size:14px;line-height:1.3;font-weight:700}
.gallery{display:grid;gap:14px}.gh2{font-size:20px;margin-top:10px;display:flex;gap:8px;align-items:baseline}.gh2 span,.gh span{font-family:var(--f-display);font-size:15px;color:var(--muted);font-weight:600}
.gh{font-family:var(--f-display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 0;color:var(--ink)}
.hide-names .sign .nm{filter:blur(6px);user-select:none}
.hide-names .sign.rev .nm{filter:none}
.dlg{position:fixed;inset:0;z-index:60;background:rgba(10,12,15,.55);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px))}
.dlg-box{background:var(--surface);border-radius:14px;max-width:520px;width:100%;padding:26px;display:grid;gap:14px;justify-items:center;text-align:center;max-height:90vh;overflow:auto}
.dlg-box svg{width:170px;height:170px}
.dlg-box p{max-width:48ch}

/* Simulados */
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.mode{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px;align-content:start}
.mode.feat{background:var(--road);color:var(--road-ink);border-color:var(--road)}
.mode.feat p{color:var(--road-muted)}
.mode h3{font-size:24px}
.mode p{font-size:15px;color:var(--muted)}
.mode .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.mode select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;min-width:0;flex:1}
@media (max-width:900px){.modes{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.modes{grid-template-columns:1fr}}
.sims{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.sim{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px;text-align:left;cursor:pointer}
.sim:hover{border-color:var(--muted)}
.sim b{font-family:var(--f-display);font-size:24px;font-weight:700;text-transform:uppercase}
.sim span{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;width:max-content}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.neu{background:var(--sunk);color:var(--muted)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--info-bg);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px}

/* Prova */
.exam{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:22px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:1fr}}
.exam-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.exam-top h2{font-size:clamp(26px,4vw,34px)}
.clock{font-family:var(--f-display);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--road);color:var(--road-ink);padding:4px 14px;border-radius:8px;line-height:1.1}
.clock.low{color:#FF8A80}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,30px);display:grid;gap:18px}
.qmeta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.qmeta .tag{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-weight:600;font-size:14px;color:var(--accent-ink)}
.qtext{font-size:clamp(19px,2.4vw,22px);line-height:1.4;font-weight:700;max-width:60ch}
.qimg{display:flex;justify-content:center;padding:10px;background:var(--sunk);border-radius:10px}
.qimg svg{width:150px;height:150px}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;font-size:17px;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt .l{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--sunk)}
.opt.sel{border-color:var(--ink)}
.opt.sel .l{background:var(--ink);color:var(--bg)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .l{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.opts.img{grid-template-columns:repeat(4,1fr)}
@media (max-width:620px){.opts.img{grid-template-columns:repeat(2,1fr)}}
.opts.img .opt{grid-template-columns:1fr;justify-items:center;padding:12px 8px;gap:8px}
.opts.img .opt svg{width:100%;max-width:110px;height:auto;aspect-ratio:1}
.fb{border-radius:10px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ink);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border-left:4px solid var(--bad)}
.fb b{display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.side{display:grid;gap:14px;position:sticky;top:90px}
@media (max-width:900px){.side{position:static}}
.grid30{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grid30 button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-family:var(--f-display);font-weight:600;font-size:16px;cursor:pointer;font-variant-numeric:tabular-nums}
.grid30 button.ans{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid30 button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.grid30 button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.grid30 button.cur{outline:3px solid var(--accent);outline-offset:1px}
.confirm{background:var(--sunk);border-radius:10px;padding:14px;display:grid;gap:10px;font-size:15px}

/* Resultado */
.result-hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;background:var(--road);color:var(--road-ink);border-radius:14px;padding:28px}
.result-hero .score{font-family:var(--f-display);font-weight:800;font-size:clamp(70px,12vw,120px);line-height:.85;font-variant-numeric:tabular-nums}
.result-hero .score small{font-size:.4em;color:var(--road-muted)}
.result-hero .st{display:inline-block;font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:28px;letter-spacing:.04em;padding:4px 14px;border-radius:6px}
.st.ok{background:#1C7C44;color:#fff}.st.bad{background:#BE251E;color:#fff}
.result-hero p{color:var(--road-muted);margin-top:10px}
@media (max-width:620px){.result-hero{grid-template-columns:1fr}}
.thbars{display:grid;gap:12px}
.thb{display:grid;grid-template-columns:190px 1fr 64px;gap:12px;align-items:center;font-size:15px}
.thb .bar{height:10px}
.thb .bar i.ok{background:var(--ok)}.thb .bar i.mid{background:var(--accent)}.thb .bar i.bad{background:var(--bad)}
.thb .num{text-align:right;font-size:18px}

<script>
/* ===================== Utilidades ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const TH={m1:'Placas, Cores e Caminhos',m2:'Escolhas e Consequências',m3:'Na Direção da Segurança',m4:'Cuidar, Agir e Preservar',leg:'Extra: Legislação',placa:'Extra: Sinalização',dd:'Extra: Direção defensiva',ps:'Extra: Primeiros socorros',ma:'Extra: Meio ambiente e cidadania',mec:'Extra: Mecânica básica'};
const KEY='habilitamg.v1';
let S={hist:[],wrong:{},seen:{},read:{},examDate:''};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
/* ---------- Acesso pago ---------- */
const CHECKOUT='https://pay.hotmart.com/D108329189O';
const ACC_HASH='808391b4e3b22750ed5e0c5e9180b9d773d72e48915d3bf92b8dc41963bb4405';
let PRO=false;try{PRO=localStorage.getItem('habilitamg.pro')==='1'}catch(e){}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryCode(c){c=String(c||'').trim().toLowerCase().replace(/^#?acesso-/,'');if(!c)return false;let h='';try{h=await sha(c)}catch(e){return false}if(h!==ACC_HASH)return false;PRO=true;try{localStorage.setItem('habilitamg.pro','1')}catch(e){}return true}
const LOCK='<svg class="lk" viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M7 11V8a5 5 0 0 1 10 0v3" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/></svg>';
function payBox(title,desc,close){return `<div class="lockbox"><p class="eyebrow">Acesso completo · pagamento único</p><h2>${title}</h2><p>${desc}</p><div class="price">R$ 29,90 <small>uma vez só, sem mensalidade</small></div>
<ul class="perks"><li>7 módulos de aulas completos</li><li>Todas as ${SIGNS.length} placas, com flashcards e modo de memorização</li><li>${NSIM} simulados com as questões oficiais do Banco Nacional (Senatran) e prova aleatória ilimitada</li><li>Treino por tema, só placas e revisão dos seus erros</li></ul>
<div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-p" href="${CHECKOUT}" target="_blank" rel="noopener">Liberar acesso completo</a>${close?'<button class="btn btn-road btn-sm" data-close>Agora não</button>':''}</div>
<p style="font-size:14px">O pagamento é feito pela Hotmart (Pix, cartão ou boleto). Assim que for aprovado, a Hotmart manda o acesso para o seu e-mail: na aula “Comece aqui” estão o link e o código que liberam tudo aqui.</p>
<div class="codeform"><input class="code-in" type="text" autocomplete="off" placeholder="Já comprou? Digite o código de acesso" aria-label="Código de acesso"><button class="btn btn-road btn-sm" data-code>Liberar</button></div><span class="codemsg" aria-live="polite"></span></div>`}
function openPay(what){const d=$('#dlg');d.hidden=false;d.innerHTML=`<div class="dlg-pay" role="dialog" aria-modal="true" aria-label="Liberar acesso completo">${payBox('Libere '+what,'Esta parte faz parte do acesso completo do Habilita MG.',1)}</div>`;d.onclick=e=>{if(e.target===d)closeDlg()};const a=d.querySelector('.btn-p');if(a)a.focus()}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,4500)}
function renderHeader(){const el=$('#pro-slot');el.innerHTML=PRO?'<span class="pill ok" style="align-self:center">Acesso completo</span>':'<button class="btn btn-p btn-sm" data-pay="o acesso completo">Liberar tudo · R$ 29,90</button>'}
async function submitCode(box){const inp=box.querySelector('.code-in'),msg=box.querySelector('.codemsg');msg.textContent='Verificando…';if(await tryCode(inp.value)){closeDlg();toast('Acesso liberado! Bons estudos.');renderHeader();route()}else msg.textContent='Código inválido. Confira o código enviado por e-mail ou WhatsApp após a compra.'}
document.addEventListener('click',e=>{const c=e.target.closest('[data-code]');if(c){submitCode(c.closest('.lockbox'));return}const p=e.target.closest('[data-pay]');if(p){openPay(p.dataset.pay);return}if(e.target.closest('[data-close]'))closeDlg()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('code-in'))submitCode(e.target.closest('.lockbox'))});
const freeMod=id=>PRO||id==='leg'||id==='prep';
function allowed(o){return PRO||(o.kind==='fixed'&&o.n<=2)||o.kind==='quick'||(o.kind==='theme'&&(o.th==='leg'||o.th==='m1'))}

/* ===================== Desenho das placas ===================== */
const R='#D2231C',Y='#F6C400',O='#F08C00',G='#0B7A3B',B='#1452A3',BRN='#6E4423',K='#111';
const f1=n=>(+n).toFixed(1);
function head(x,y,a,s=12,c=K){const co=Math.cos(a),si=Math.sin(a),bx=x-co*s,by=y-si*s,px=-si*s*.72,py=co*s*.72;return `<polygon points="${f1(x)},${f1(y)} ${f1(bx+px)},${f1(by+py)} ${f1(bx-px)},${f1(by-py)}" fill="${c}"/>`}
function arr(p,c=K,w=7,s=13){const P=p[p.length-1],Q=p[p.length-2],a=Math.atan2(P[1]-Q[1],P[0]-Q[0]);const pts=p.slice(0,-1).concat([[P[0]-Math.cos(a)*s*.9,P[1]-Math.sin(a)*s*.9]]);return `<polyline points="${pts.map(q=>f1(q[0])+','+f1(q[1])).join(' ')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linejoin="miter"/>`+head(P[0],P[1],a,s,c)}
function qa(x0,y0,cx,cy,x1,y1,c=K,w=7,s=12){const a=Math.atan2(y1-cy,x1-cx);return `<path d="M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}" fill="none" stroke="${c}" stroke-width="${w}"/>`+head(x1+Math.cos(a)*s,y1+Math.sin(a)*s,a,s,c)}
function oct(r){let p=[];for(let k=0;k<8;k++){const a=Math.PI/8+k*Math.PI/4;p.push(f1(50+r*Math.cos(a))+','+f1(50+r*Math.sin(a)))}return p.join(' ')}
function rot(r,w=6,s=10){let o='';for(let k=0;k<3;k++){const a0=(-50+k*120)*Math.PI/180,a1=a0-80*Math.PI/180;const x0=50+r*Math.cos(a0),y0=50+r*Math.sin(a0),x1=50+r*Math.cos(a1),y1=50+r*Math.sin(a1);o+=`<path d="M${f1(x0)} ${f1(y0)} A${r} ${r} 0 0 0 ${f1(x1)} ${f1(y1)}" fill="none" stroke="${K}" stroke-width="${w}"/>`;const a=Math.atan2(-Math.cos(a1),Math.sin(a1));o+=head(x1+Math.cos(a)*s*.8,y1+Math.sin(a)*s*.8,a,s)}return o}
const txt=(t,x,y,sz,c=K,anc='middle',w=700)=>`<text x="${x}" y="${y}" font-family="Arial,Helvetica,sans-serif" font-weight="${w}" font-size="${sz}" text-anchor="${anc}" fill="${c}">${t}</text>`;
const ring=`<circle cx="50" cy="50" r="44" fill="#fff" stroke="${R}" stroke-width="9"/>`;
const BAR=`<line x1="21" y1="21" x2="79" y2="79" stroke="${R}" stroke-width="8"/>`;
const BAR2=`<line x1="79" y1="21" x2="21" y2="79" stroke="${R}" stroke-width="8"/>`;
const reg=(i,b)=>ring+i+(b?BAR:'');
const dia=(i,bg=Y)=>`<polygon points="50,3 97,50 50,97 3,50" fill="${bg}" stroke="${K}" stroke-width="2.5" stroke-linejoin="round"/><polygon points="50,9.5 90.5,50 50,90.5 9.5,50" fill="none" stroke="${K}" stroke-width="2"/>`+i;
const ped=(x,y,s,c=K)=>`<g transform="translate(${x} ${y}) scale(${s})"><circle cx="0" cy="-22" r="5.5" fill="${c}"/><path d="M0 -14 L-2 5 M-2 5 L-9 22 M-2 5 L7 22 M-1 -11 L-10 -1 M-1 -11 L9 -3" stroke="${c}" stroke-width="5" stroke-linecap="round" fill="none"/></g>`;

['dd','Em caso de aquaplanagem, o condutor deve:','segurar firme o volante, tirar o pé do acelerador e não frear bruscamente','frear bruscamente','acelerar para sair da lâmina d’água','virar o volante rapidamente','Mantenha a trajetória até os pneus voltarem a tocar o solo.'],
['dd','Ao ser ofuscado pelo farol alto de quem vem em sentido contrário, você deve:','reduzir a velocidade e olhar para a margem direita da via','olhar fixamente para o farol','responder com seu farol alto','acelerar para passar logo','Manual de Direção Defensiva.'],
['dd','Sob neblina, o correto é:','usar farol baixo e reduzir a velocidade','usar farol alto','ligar o pisca-alerta e manter a velocidade','parar sobre a pista de rolamento','O farol alto reflete na neblina e ofusca o próprio condutor.'],
['dd','Ponto cego é:','a área ao redor do veículo que o condutor não vê pelos espelhos','um defeito do retrovisor','o espaço entre o motor e o painel','um trecho da via sem iluminação','Ajuste os espelhos e olhe por cima do ombro antes de mudar de faixa.'],
['dd','A distância de parada é a soma da:','distância de reação com a distância de frenagem','velocidade com o peso do veículo','distância de seguimento com a largura da via','altura do veículo com o tamanho dos pneus','Distância de parada = reação + frenagem.'],
['dd','Qual fator aumenta o tempo de reação do condutor?','Álcool, cansaço e uso do celular','Pneus novos','Uma boa noite de sono','Rádio desligado','Esses fatores atrasam a percepção e a resposta.'],
['dd','Ao sentir sono ao volante, o condutor deve:','parar em local seguro e descansar','abrir a janela e seguir viagem','aumentar a velocidade para chegar logo','tomar café e dirigir mais rápido','Só o descanso resolve a sonolência.'],
['dd','Em descidas longas de serra, o recomendado é:','usar marcha reduzida (freio-motor)','descer em ponto morto','desligar o motor','usar só o freio de estacionamento','Descer desengrenado superaquece os freios e é infração (art. 231, IX).'],
['dd','Para ultrapassar com segurança, é preciso:','ter visibilidade, espaço suficiente e sinalizar a intenção','buzinar e acelerar ao máximo','fazê-lo em curvas para ganhar tempo','ultrapassar pela direita sempre que possível','Art. 29, X e XI.'],
['dd','Ao perceber que está sendo ultrapassado, você deve:','manter-se na sua faixa, sem acelerar','acelerar para impedir a ultrapassagem','frear bruscamente','mudar para a faixa da esquerda','Art. 29, XI, b.'],
['dd','Ao se aproximar de uma curva, o mais seguro é:','reduzir a velocidade antes de entrar nela','frear no meio da curva','acelerar ao entrar','usar o acostamento','Frear dentro da curva pode desestabilizar o veículo.'],
['dd','A colisão com o veículo da frente acontece, principalmente, por:','não manter distância segura','usar o cinto de segurança','dirigir com faróis acesos','respeitar a sinalização','Distância curta não deixa tempo para reagir.'],
['dd','A colisão frontal, uma das mais graves, costuma ser causada por:','ultrapassagem em local proibido ou sem visibilidade','uso do pisca-alerta','dirigir abaixo da velocidade máxima','estacionar corretamente','Em rodovias de pista simples, a ultrapassagem indevida é a principal causa.'],
['dd','O encosto de cabeça bem regulado protege contra:','lesões no pescoço (efeito chicote) em colisões traseiras','o calor do sol','o ofuscamento','o ponto cego','Ajuste a parte de cima perto da altura do topo da cabeça.'],
['dd','A posição recomendada das mãos no volante é:','“9 e 15”, como os ponteiros do relógio às 9h15','as duas mãos no topo do volante','uma mão no volante e a outra sempre no câmbio','as duas mãos na parte de baixo','Dá mais controle e não atrapalha o airbag.'],
['dd','No início de uma chuva, a pista fica mais escorregadia porque:','a água se mistura ao óleo e à poeira do asfalto','o asfalto esquenta','os pneus aumentam de tamanho','a sinalização some','A mistura forma uma película lisa sobre a pista.'],
['dd','Se a traseira do carro derrapar, o condutor deve:','girar o volante para o mesmo lado em que a traseira escorrega, sem frear bruscamente','frear com toda a força','girar o volante para o lado oposto ao da derrapagem','soltar o volante','Isso realinha as rodas e ajuda a recuperar o controle.'],
['dd','Em uma frenagem de emergência em carro com freio ABS, o condutor deve:','pisar firme no freio e manter, podendo desviar com o volante','bombear o pedal várias vezes','soltar o freio e acelerar','puxar o freio de mão','O ABS evita o travamento das rodas e mantém a dirigibilidade.'],
['dd','Em vias com várias faixas no mesmo sentido, o condutor deve circular, em regra:','pela faixa da direita, deixando a esquerda para ultrapassagem','sempre pela faixa da esquerda','pelo acostamento','pela faixa mais vazia, trocando com frequência','Art. 29, IV.'],
['dd','Ao ver uma bola entrando na rua, o condutor defensivo:','reduz a velocidade, pois uma criança pode vir atrás','buzina e segue','acelera para passar antes','muda de faixa sem olhar','Isso é previsão: antecipar o risco.'],
['dd','Motociclistas exigem atenção redobrada porque:','são menores e podem ficar no ponto cego','andam sempre devagar','não precisam respeitar a sinalização','não usam faróis','Verifique os espelhos e olhe por cima do ombro.'],
['dd','Ao encontrar animais na pista, você deve:','reduzir a velocidade e evitar manobras bruscas','buzinar e acelerar','desviar bruscamente para o acostamento','acender o farol alto e manter a velocidade','Animais podem se mover de forma imprevisível.'],
['dd','Dirigir após ingerir bebida alcoólica, mesmo em pouca quantidade:','reduz reflexos e atenção, aumentando o risco de acidente','melhora a concentração','não tem efeito se o condutor for experiente','é permitido em trajetos curtos','Além de perigoso, é infração gravíssima (art. 165).'],
['dd','Ao dirigir à noite, o condutor deve:','reduzir a velocidade, já que a visibilidade é menor','usar sempre farol alto, mesmo com carros vindo em sentido contrário','dirigir com as luzes apagadas para não ofuscar','aumentar a velocidade, pois há menos trânsito','O farol alto só pode ser usado sem veículos à frente ou em sentido oposto próximos.'],
['ps','Diante de um acidente, a primeira providência é:','sinalizar o local e garantir a própria segurança','retirar as vítimas dos veículos','dar água às vítimas','tirar fotos para o seguro','Sem segurança, você pode virar mais uma vítima.'],
['ps','Qual é o telefone do SAMU?','192','193','190','191','192 é o Serviço de Atendimento Móvel de Urgência.'],
['ps','O telefone do Corpo de Bombeiros é:','193','192','190','194','Os Bombeiros atendem resgates e incêndios.'],
['ps','Para acionar a Polícia Rodoviária Federal, ligue:','191','190','192','197','191 é o número da PRF.'],
['ps','Em um motociclista acidentado, o capacete:','não deve ser retirado por leigos','deve ser retirado imediatamente','deve ser retirado só se estiver apertado','deve ser retirado para dar água à vítima','A retirada pode agravar lesões na coluna cervical.'],
['ps','A uma vítima de acidente, consciente e com sede, você deve:','não oferecer líquidos nem alimentos','dar água em pequenos goles','dar café para mantê-la acordada','dar refrigerante','Ela pode precisar de cirurgia e há risco de vômito e aspiração.'],
['ps','Em uma hemorragia externa, o primeiro procedimento é:','fazer compressão direta sobre o ferimento com pano limpo','lavar com álcool','fazer torniquete de imediato','deixar sangrar para limpar','A compressão direta controla a maioria dos sangramentos.'],
['ps','Na reanimação cardiopulmonar (RCP) em adultos, as compressões devem ser feitas no ritmo de:','100 a 120 por minuto','40 a 60 por minuto','150 a 200 por minuto','10 a 20 por minuto','Diretrizes de RCP.'],
['ps','Quando houver ventilação boca a boca, a proporção recomendada na RCP é:','30 compressões para 2 ventilações','15 compressões para 1 ventilação','5 compressões para 5 ventilações','2 compressões para 30 ventilações','Leigos podem fazer só as compressões, sem interrupção.'],
['ps','Em queimaduras leves, o correto é:','resfriar com água corrente em temperatura ambiente e não estourar bolhas','passar manteiga ou pasta de dente','estourar as bolhas','cobrir com algodão','Produtos caseiros aumentam o risco de infecção.'],
['ps','A vítima deve ser removida do veículo por um leigo apenas quando:','houver risco iminente, como incêndio ou explosão','ela pedir','o trânsito estiver lento','a ambulância demorar mais de 5 minutos','Fora disso, aguarde o socorro especializado.'],
['ps','Uma vítima com pele fria, pálida, suor e pulso rápido e fraco pode estar em:','estado de choque','sono profundo','crise de riso','situação normal','Mantenha-a aquecida e deitada, e chame o socorro.'],
['ps','Deixar de prestar socorro à vítima, ou de pedir auxílio quando não puder socorrer, é:','crime de trânsito (omissão de socorro)','infração leve','permitido se outra pessoa já ajudou','apenas falta ética, sem punição','Art. 304 do CTB: vale mesmo que terceiros prestem socorro.'],
['ps','Ao sinalizar o local do acidente, o condutor deve:','usar pisca-alerta e o triângulo a uma distância que dê tempo de os outros reagirem','colocar o triângulo colado ao veículo','apenas acenar para os carros','deixar o farol alto aceso apontado para a pista','Quanto maior a velocidade da via, mais longe deve ficar o triângulo.'],
['ps','Num acidente com cabos elétricos caídos sobre o veículo, você deve:','não tocar no veículo e orientar os ocupantes a ficarem dentro','puxar os ocupantes para fora','retirar o cabo com as mãos','molhar o veículo','Chame os Bombeiros (193) e a concessionária de energia.'],
['ps','Em um acidente com vazamento de combustível, deve-se:','desligar a ignição e impedir que fumem por perto','ligar o motor para afastar o veículo','acender um isqueiro para enxergar melhor','jogar água no combustível','Qualquer faísca pode causar incêndio.'],
['ps','Objeto cravado no corpo da vítima deve ser:','mantido no lugar e fixado, sem retirar','retirado imediatamente','girado para aliviar a dor','empurrado mais para dentro','A retirada pode causar hemorragia grave.'],
['ps','Ao ligar para o serviço de emergência, informe:','o local exato, o número de vítimas e o estado delas','apenas o seu nome','a placa do seu carro','só o horário','Informações claras agilizam o atendimento.'],
['ma','Qual gás emitido pelos escapamentos é altamente tóxico, incolor e sem cheiro?','Monóxido de carbono (CO)','Oxigênio (O₂)','Vapor d’água','Nitrogênio (N₂)','O CO reduz a capacidade do sangue de transportar oxigênio.'],
['ma','O catalisador tem a função de:','reduzir a emissão de gases poluentes','aumentar a potência do motor','economizar óleo','resfriar o motor','Ele transforma gases tóxicos em substâncias menos nocivas.'],
['ma','O programa que controla a emissão de poluentes de veículos novos no Brasil é o:','PROCONVE','PROCON','PNATRANS','DPVAT','Programa de Controle da Poluição do Ar por Veículos Automotores.'],
['ma','O óleo lubrificante usado deve ser:','entregue em postos ou pontos de coleta para rerrefino','jogado no ralo','enterrado no quintal','queimado em fogueira','Óleo descartado de forma errada contamina solo e água.'],
['ma','Conduzir veículo com descarga livre ou silenciador defeituoso, causando ruído excessivo, é infração:','grave','leve','média','não é infração','Art. 230, XI.'],
['ma','Fumaça preta em excesso saindo do escapamento indica, geralmente:','motor desregulado','pneus calibrados','bateria nova','motor econômico','A combustão incompleta polui e gasta mais combustível.'],
['ma','Uma atitude que reduz o consumo de combustível e a poluição é:','manter os pneus calibrados e evitar acelerações bruscas','acelerar forte nas saídas','manter o motor ligado parado por muito tempo','andar com pneus murchos','Pneus murchos aumentam o atrito e o consumo.'],
['ma','Pneus velhos descartados de forma incorreta podem:','acumular água e servir de criadouro do mosquito da dengue','se decompor rapidamente','fertilizar o solo','melhorar a drenagem','Devem ir para pontos de coleta e reciclagem.'],
['ma','Cidadania no trânsito significa:','respeitar os direitos dos outros e cumprir as normas','ter prioridade sempre','dirigir só quando for conveniente','evitar pedestres','O trânsito é um espaço compartilhado.'],
['ma','O principal gás de efeito estufa emitido pelos veículos é o:','dióxido de carbono (CO₂)','oxigênio','hélio','argônio','A queima de combustíveis fósseis libera CO₂.'],
['ma','Usar transporte coletivo, bicicleta ou carona ajuda a:','reduzir congestionamentos e a poluição','aumentar o consumo de combustível','piorar o trânsito','aumentar o barulho','Menos veículos nas ruas, menos emissões.'],
['ma','O pedestre, no trânsito, deve:','usar a faixa de pedestres e as passarelas quando houver','atravessar correndo em qualquer ponto','andar pela pista mesmo havendo calçada','atravessar entre carros estacionados','Art. 69 do CTB.'],
['ma','Bicicletas, onde não houver ciclovia, ciclofaixa ou acostamento, devem circular:','nos bordos da pista, no mesmo sentido dos veículos','na contramão','sempre sobre a calçada','no centro da pista','Art. 58 do CTB.'],
['ma','A poluição sonora no trânsito pode causar:','estresse, irritação e perda auditiva','melhora no humor','maior concentração','nenhum efeito','O excesso de ruído afeta a saúde.'],
['ma','Ao passar ou ultrapassar um ciclista, o condutor deve:','guardar distância lateral de 1,5 m e reduzir a velocidade','buzinar forte bem perto','passar o mais próximo possível','ultrapassar sem reduzir','Art. 201: não guardar 1,5 m é infração média.'],
['mec','Se a luz da pressão do óleo acender no painel com o carro em movimento, você deve:','parar em local seguro e desligar o motor','continuar até o destino','acelerar para aumentar a pressão','desligar só o ar-condicionado','Sem lubrificação, o motor pode fundir em pouco tempo.'],
['mec','Com o motor superaquecido, nunca se deve:','abrir a tampa do reservatório de arrefecimento com o motor quente','parar o carro','desligar o ar-condicionado','observar o marcador de temperatura','O líquido sob pressão pode causar queimaduras graves.'],
['mec','Fazem parte do sistema de arrefecimento:','radiador, bomba d’água e válvula termostática','velas, bobina e distribuidor','pastilhas, discos e cilindros de roda','amortecedores e molas','O sistema mantém o motor na temperatura ideal.'],
['mec','A calibragem dos pneus deve ser feita:','com os pneus frios','logo após uma viagem longa','com os pneus quentes, para medir melhor','apenas uma vez por ano','Pneus quentes mostram pressão maior do que a real.'],
['mec','A profundidade mínima dos sulcos dos pneus, indicada pelo TWI, é de:','1,6 mm','0,5 mm','3 mm','5 mm','Abaixo disso o pneu está careca e o veículo pode ser retido.'],
['mec','Desgaste excessivo no centro da banda de rodagem indica:','pressão acima da recomendada','pressão abaixo da recomendada','apenas falta de alinhamento','pneu novo','Pressão baixa gasta as bordas; pressão alta gasta o centro.'],
['mec','O alternador tem a função de:','gerar energia e recarregar a bateria com o motor funcionando','dar partida no motor sozinho','resfriar o motor','filtrar o ar','Se a luz da bateria acender, o alternador pode não estar carregando.'],
['mec','A embreagem serve para:','acoplar e desacoplar o motor da transmissão, permitindo trocar as marchas','frear o veículo','resfriar o câmbio','acender os faróis','Pisar na embreagem desliga o motor das rodas.'],
['mec','Pedal de freio “baixo” ou “esponjoso” pode indicar:','ar no sistema ou nível baixo de fluido','pneus bem calibrados','óleo do motor novo','bateria descarregada','Procure uma oficina antes de seguir.'],
['mec','Amortecedores gastos causam:','instabilidade e aumento da distância de frenagem','economia de combustível','melhor aderência','redução de ruídos','O pneu perde contato com o solo com mais facilidade.'],
['mec','Se o veículo “puxa” para um lado em linha reta, o problema provável é:','desalinhamento da direção','bateria fraca','excesso de óleo','filtro de ar sujo','O alinhamento corrige os ângulos das rodas.'],
['mec','Vibração no volante em velocidades mais altas costuma indicar:','rodas desbalanceadas','falta de combustível','luz de freio queimada','escapamento furado','O balanceamento distribui o peso da roda.'],
['mec','O nível do óleo do motor deve ser verificado com o veículo:','em local plano e com o motor desligado há alguns minutos','em movimento','em uma rampa','com o motor acelerado','Assim o óleo escorre para o cárter e a leitura fica correta.'],
['mec','São equipamentos obrigatórios para automóveis:','triângulo de sinalização, macaco, chave de roda e estepe','extintor de incêndio e kit de primeiros socorros','GPS e câmera de ré','rádio e ar-condicionado','Desde 2015 o extintor é opcional para automóveis (Res. CONTRAN 556/2015). Veículos com pneus que rodam vazios podem dispensar estepe.'],
['mec','As velas de ignição são usadas em motores:','a gasolina, etanol ou flex (ciclo Otto)','somente a diesel','elétricos','de bicicleta elétrica','No diesel, a combustão ocorre por compressão.'],
['mec','O filtro de ar sujo causa:','aumento de consumo e perda de potência','melhor desempenho','economia de óleo','freio mais eficiente','O motor recebe menos ar para a combustão.'],
['mec','A luz de advertência da bateria acesa com o motor ligado indica:','falha no sistema de carga (alternador ou correia)','tanque cheio','farol alto ligado','porta aberta','O carro passa a usar só a carga da bateria.'],
['mec','Para que serve o sistema de suspensão?','absorver impactos e manter os pneus em contato com o solo','dar partida no motor','iluminar a pista','acelerar o veículo','Molas e amortecedores trabalham juntos.'],
['leg','Quem compra um veículo usado deve transferir a propriedade em até:','30 dias','90 dias','1 ano','15 dias','Art. 123, § 1º. Não transferir no prazo é infração grave (art. 233).'],
['leg','Estacionar na esquina, a menos de 5 m do alinhamento da via transversal, é infração:','média','leve','gravíssima','não é infração','Art. 181, I.'],
['leg','Estacionar afastado da guia da calçada de 50 cm a 1 m é infração:','leve','grave','gravíssima','média','Art. 181, II. Mais de 1 m é grave (art. 181, III).'],
['leg','Estacionar sobre a calçada ou sobre a faixa de pedestres é infração:','grave','leve','média','permitido por até 5 minutos','Art. 181, VIII.'],
['leg','Estacionar no acostamento, sem motivo de força maior, é infração:','leve','gravíssima','grave','não é infração','Art. 181, VII.'],
['leg','Depois da defesa prévia, o recurso contra uma multa em 1ª instância é julgado pela:','JARI','CONTRAN','Polícia Militar','Prefeitura','Juntas Administrativas de Recursos de Infrações (art. 16 e 285).'],
['leg','Quem reconhece a infração pelo sistema de notificação eletrônica (SNE) e abre mão de recorrer pode ter desconto de até:','40%','10%','20%','50%','Art. 284, § 1º. Pagar até o vencimento por outros meios dá 20%.'],
['leg','A área com marcas de canalização (zebrado) no pavimento:','não deve ser usada para circular nem estacionar','pode ser usada para ultrapassar','é área de carga e descarga','é reservada a motocicletas','As marcas de canalização orientam o fluxo e delimitam áreas proibidas.'],
['leg','A linha de retenção (faixa branca transversal) indica:','o local onde o veículo deve parar','o início de uma ciclovia','o local de ultrapassagem','o fim da via','Fica antes de semáforos, faixas de pedestres e placas PARE.'],
['leg','Na via de trânsito rápido, é característica:','não ter interseções em nível nem travessia de pedestres em nível','ter semáforos a cada quarteirão','servir só ao acesso a residências','ser uma via rural não pavimentada','Art. 60 e Anexo I do CTB.'],
['leg','Rodovia, segundo o CTB, é:','uma via rural pavimentada','uma via urbana de trânsito rápido','qualquer estrada de terra','uma via exclusiva de caminhões','Anexo I do CTB. A via rural não pavimentada é a estrada.'],
['leg','A cor vermelha em marcas no pavimento indica:','ciclovias e ciclofaixas','faixa de ônibus','proibição de estacionar','área de pedestres','A marca azul indica vagas de pessoas com deficiência.'],
['leg','No semáforo de pedestres, o boneco vermelho piscando significa:','a travessia está para terminar; não comece a atravessar','pode atravessar correndo','o semáforo está com defeito','preferência para os veículos que viram','Anexo II do CTB.'],
['dd','O farol alto não deve ser usado quando:','houver veículo vindo em sentido contrário ou você estiver seguindo outro veículo','a via estiver escura e vazia','em rodovias sem iluminação','de madrugada, sem trânsito','Art. 40, II.'],
['dd','Ao se aproximar de uma passagem de nível (ferrovia), o condutor deve:','reduzir, parar se necessário, olhar e escutar antes de cruzar','acelerar para passar rápido','parar sobre os trilhos para olhar melhor','buzinar e seguir sem reduzir','O trem não consegue parar a tempo e tem preferência.'],
['dd','Caminhões e ônibus exigem mais atenção porque:','têm pontos cegos maiores e fazem curvas mais abertas','são sempre mais rápidos','não precisam sinalizar','freiam em distância menor','Evite ficar ao lado ou logo atrás deles por muito tempo.'],
['dd','O acostamento pode ser usado:','para parada de emergência','para ultrapassar quando o trânsito está lento','como faixa extra em congestionamentos','para fazer retorno a qualquer momento','Transitar pelo acostamento é infração gravíssima (art. 193).'],
['dd','Se um pneu furar com o carro em movimento, o condutor deve:','segurar firme o volante, não frear bruscamente e reduzir aos poucos','frear com toda a força','virar o volante rapidamente para o acostamento','acelerar para manter o controle','A frenagem brusca pode fazer o carro rodar.'],
['ps','Vítima inconsciente, respirando e sem suspeita de lesão na coluna, deve ser colocada:','em posição lateral de segurança','sentada','de bruços com a cabeça para baixo','em pé, apoiada','Evita que a vítima se engasgue com vômito ou com a língua.'],
['ps','Para verificar se a vítima está consciente, você deve:','chamá-la em voz alta e tocar levemente seus ombros','jogar água no rosto dela','sacudi-la com força','dar tapas no rosto','Não movimente bruscamente a vítima.'],
['ps','Diante de uma possível fratura, o socorrista leigo deve:','manter o membro imóvel e aguardar o socorro','tentar colocar o osso no lugar','massagear o local','pedir que a vítima ande para testar','Movimentar pode agravar a lesão.'],
['mec','O airbag protege corretamente quando:','o ocupante está usando o cinto de segurança','o banco está o mais perto possível do volante','há objetos sobre o painel','a criança vai no banco da frente','O airbag complementa o cinto; não o substitui.'],
['mec','A luz amarela de injeção (motor) acesa no painel indica:','falha no sistema de injeção, que deve ser verificada','tanque de combustível cheio','freio de mão puxado','farol alto ligado','Luzes amarelas pedem verificação em breve.'],
['mec','As palhetas do limpador de para-brisa devem ser trocadas quando:','deixam riscos ou não limpam bem o vidro','o carro for lavado','a cada troca de pneus','nunca precisam ser trocadas','Boa visibilidade é essencial com chuva.'],
['ma','Diante de um pedestre idoso atravessando devagar, o condutor deve:','aguardar com paciência até que ele termine a travessia','buzinar para apressá-lo','passar por trás dele','acelerar para passar antes','Usuários vulneráveis merecem cuidado redobrado.'],
['ma','A agressividade ao volante:','aumenta o risco de acidentes e conflitos','melhora o fluxo do trânsito','é sinal de boa direção','não tem consequências','Controle emocional faz parte da direção segura.'],
['ma','Pelo art. 29, § 2º do CTB, os veículos de maior porte são responsáveis:','pela segurança dos menores, os motorizados pelos não motorizados e todos pela dos pedestres','apenas por si mesmos','somente pelos ônibus','pela fiscalização do trânsito','Regra de responsabilidade compartilhada.'],
['ma','Medicamentos que causam sonolência:','podem prejudicar a direção; leia a bula e siga a orientação médica','não interferem em nada','melhoram os reflexos','só afetam motociclistas','Calmantes, antialérgicos e remédios para dormir exigem cuidado.'],
['ma','Ao ser provocado por outro motorista no trânsito, o mais seguro é:','não revidar e aumentar a distância do veículo agressivo','responder com gestos','dar uma "fechada" nele','persegui-lo para anotar a placa','Revidar aumenta o risco de acidente e de violência.'],
['ma','O álcool, mesmo em pequena quantidade, provoca:','reflexos mais lentos, visão de túnel e falsa confiança','mais atenção e reflexos rápidos','melhora da visão noturna','nenhum efeito em quem está acostumado','Por isso a tolerância no Brasil é zero.'],
['leg','Segundo o CTB, acostamento é a parte da via destinada:','à parada ou estacionamento em emergência e à circulação de pedestres e bicicletas quando não houver local apropriado','à ultrapassagem de veículos lentos','ao estacionamento permanente de caminhões','exclusivamente às motocicletas','Anexo I do CTB.'],
['leg','A ciclofaixa é:','parte da pista de rolamento reservada a bicicletas e delimitada por sinalização','uma pista própria para bicicletas, separada fisicamente','a calçada compartilhada com pedestres','o acostamento das rodovias','A ciclovia é a que tem separação física (Anexo I).'],
['leg','A ciclovia é:','pista própria para bicicletas, separada fisicamente do trânsito comum','faixa pintada no meio da pista','parte da calçada','faixa exclusiva de motos','Anexo I do CTB.'],
['leg','Parada, segundo o CTB, é a imobilização do veículo:','pelo tempo necessário para embarque ou desembarque','por qualquer tempo, com o motorista dentro','por mais de 5 minutos','apenas em postos de combustível','Ficar mais tempo que isso é estacionamento (Anexo I).'],

['leg','O ciclomotor é o veículo de duas ou três rodas com motor de até:','50 cc e velocidade máxima de fabricação de até 50 km/h','125 cc e até 80 km/h','250 cc','150 cc e até 100 km/h','Anexo I. Para conduzi-lo é preciso ACC ou categoria A.'],

['leg','O peso bruto total (PBT) é:','a tara do veículo somada à lotação','o peso do veículo vazio','apenas o peso da carga','o peso dos passageiros','Anexo I do CTB.'],
['leg','Ônibus, segundo o CTB, é o veículo de passageiros com capacidade para:','mais de 20 passageiros','até 8 passageiros','até 20 passageiros','mais de 50 passageiros','Até 20 passageiros é micro-ônibus (Anexo I).'],
['leg','Refúgio é a área:','sinalizada e protegida onde o pedestre aguarda durante a travessia','de estacionamento de emergência','onde o motociclista espera o semáforo','reservada a carga e descarga','Anexo I do CTB.'],
['leg','O canteiro central é:','o obstáculo físico que separa duas pistas de rolamento','a faixa de pedestres','o acostamento pavimentado','a área de manobra de ônibus','Anexo I do CTB.'],
['leg','Passagem de nível é o cruzamento:','no mesmo nível entre uma via e uma linha férrea','de duas rodovias em viaduto','entre ciclovia e calçada','de pedestres em passarela','Anexo I do CTB.'],
['leg','Calçada é a parte da via:','reservada ao trânsito de pedestres, não destinada a veículos','destinada ao estacionamento','que separa duas pistas','reservada a ciclistas','Anexo I do CTB.'],
['leg','Trânsito, segundo o CTB, é:','a movimentação e imobilização de veículos, pessoas e animais nas vias terrestres','apenas o congestionamento de veículos','somente a circulação de automóveis','o conjunto das placas de uma via','Art. 1º, § 1º, e Anexo I.'],
['leg','Ultrapassagem é passar à frente de outro veículo:','que está no mesmo sentido e mais lento, saindo e voltando à faixa de origem','que vem em sentido contrário','parado no acostamento','em qualquer direção','Anexo I do CTB.'],
['leg','Na prova teórica, questão deixada sem resposta:','conta como erro','é anulada a seu favor','vale meio ponto','é refeita no final','Por isso, responda todas as questões.'],
['leg','Na prova teórica com 30 questões e 60 minutos, o tempo médio por questão é de:','2 minutos','1 minuto','3 minutos','30 segundos','Pule as difíceis e volte a elas no final.'],
['dd','Ao ver um ônibus parado no ponto, o condutor defensivo:','reduz a velocidade, pois pedestres podem atravessar à frente dele','acelera para ultrapassar logo','buzina para avisar','muda de faixa sem sinalizar','Pedestres costumam surgir na frente do ônibus.'],
['dd','Em uma via com crianças brincando na calçada, o condutor deve:','reduzir a velocidade e redobrar a atenção','manter a velocidade e buzinar','acelerar para passar rápido','usar o farol alto','Crianças são imprevisíveis e podem entrar na via.'],
['dd','O uso do farol baixo durante o dia, em rodovias:','torna o veículo mais visível para os outros','ofusca os outros condutores','aumenta o consumo de forma perigosa','é proibido','Por isso é obrigatório em rodovias de pista simples (art. 40).'],
['dd','Antes de abrir a porta do carro estacionado na rua, o condutor deve:','olhar o retrovisor e por cima do ombro para ver se vem ciclista ou moto','abrir rapidamente para não atrapalhar','buzinar','ligar o pisca-alerta e abrir sem olhar','Abrir a porta sem cuidado causa acidentes graves com ciclistas.'],
['dd','Ao dirigir atrás de uma motocicleta, a distância de seguimento deve ser:','a mesma ou maior que a mantida para um carro','menor, porque motos freiam pior','de apenas meio carro','indiferente','Motos podem frear de forma brusca ou cair.'],
['ps','O socorrista leigo, ao chegar a um acidente, deve evitar:','aglomerar curiosos perto das vítimas','sinalizar o local','ligar para o 192','tranquilizar as vítimas conscientes','Curiosos atrapalham o socorro e correm risco.'],
['ps','Em caso de convulsão, o correto é:','proteger a cabeça da vítima e afastar objetos, sem colocar nada na boca','segurar a língua da vítima','jogar água no rosto','dar água para beber','Depois, coloque-a de lado e chame o socorro.'],
['ma','Desligar o motor em paradas longas, como esperando alguém:','economiza combustível e reduz a poluição','danifica o motor sempre','é proibido pelo CTB','aumenta a emissão de gases','Motor ligado parado só gasta e polui.'],
['ma','A inspeção e manutenção do veículo em dia contribuem para:','menor emissão de poluentes e mais segurança','aumentar o consumo','piorar a frenagem','nada além da aparência','Motor regulado polui menos.'],
['mec','O uso contínuo do pé apoiado no pedal de embreagem causa:','desgaste prematuro da embreagem','economia de combustível','melhor troca de marchas','resfriamento do câmbio','Só pise na embreagem na hora de trocar a marcha.'],
['mec','Antes de uma viagem longa, deve-se verificar:','pneus (inclusive estepe), óleo, água, freios e luzes','apenas o combustível','só a aparência do carro','apenas o rádio','Uma revisão rápida evita panes na estrada.'],
['mec','O fluido de freio deve ser trocado periodicamente porque:','absorve umidade com o tempo e perde eficiência','evapora todo em poucos dias','muda de cor e mancha a pintura','aumenta o consumo de combustível','Siga o prazo indicado pelo fabricante.']

const BNQ_MOD={1:'Placas, Cores e Caminhos',2:'Escolhas e Consequências',3:'Na Direção da Segurança',4:'Cuidar, Agir e Preservar'};
