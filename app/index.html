 exceção à regra de ouro \"não remova, não movimente, não transporte\" em um sinistro com vítimas?","","Somente fazer a movimentação em caso de risco iminente, como incêndio ou explosão.","Quando a vítima pedir para ser movida.","Quando o motorista estiver com pressa.","Quando a vítima estiver deitada sobre o asfalto.","O risco à vida é a única razão que justifica movimentar uma vítima de sinistro."],["p1m4q103",4,2,"Em vias rápidas ou com pouca visibilidade (neblina), o que fazer em relação à distância mínima de 30 metros para sinalização com o triângulo?","","Aumentar a distância de sinalização, pois 30 metros é apenas o mínimo.","Reduzir a distância de sinalização para que o triângulo fique perto do carro.","Manter a distância de exatamente 30 metros.","Usar o pisca-alerta e não o triângulo.","Em vias rápidas, é necessário dar mais tempo de reação aos outros motoristas, o que se faz aumentando a distância."],["p1m4q104",4,2,"Por que dirigir com sono é tão perigoso quanto dirigir alcoolizado?","","Porque a sonolência reduz os reflexos, a atenção e a capacidade de reação, sendo comparável ao efeito do álcool.","Apenas porque o sono causa bocejos.","Porque a sonolência só afeta a velocidade.","Apenas por causa da regra de $80~km/h$.","O efeito da sonolência no desempenho cognitivo e reacional é equiparado ao do álcool, sendo um \"perigo invisível\"."],["p1m4q105",4,1,"Qual a consequência de não descansar ao sentir sono?","","O motorista pode ter micro-sonos (cochilos de 3 a 4 segundos) sem perceber, dirigindo com os olhos fechados.","Apenas um aumento do bocejo.","Apenas um aumento da concentração.","Apenas a redução da velocidade.","O micro-sono é o risco invisível do motorista cansado."],["p1m4q106",4,1,"O que você deve fazer em um sinistro, ao ligar para o socorro e perceber que a vítima está inconsciente?","","Informar ao socorro que a vítima está inconsciente e, se possível, desligar o motor.","Tentar fazer a reanimação cardiopulmonar sozinho.","Movimentar a vítima para o acostamento.","Tentar dar água para a vítima.","Informar o estado da vítima e garantir a segurança do local são as prioridades."],["p1m4q107",4,1,"O que o motorista deve evitar ao máximo em um sinistro, devido ao risco de agravar os ferimentos da vítima?","","Remover, movimentar ou transportar a vítima.","Ligar para o 192 ou 193.","Sinalizar o local do sinistro.","Desligar o motor.","A movimentação pode ser fatal em casos de fratura ou lesão na coluna."],["p1m4q108",4,1,"O que você deve fazer antes de acionar o socorro especializado, como parte da \"Avaliação da Situação\"?","","Observar se há vazamentos de combustível, fumaça, fios elétricos soltos ou risco de incêndio/explosão.","Tentar apagar um vazamento de combustível.","Fazer procedimentos médicos na vítima.","Fugir do local.","Essas informações garantem a sua segurança e são vitais para o socorro."],["p1m4q109",4,0,"João estava dirigindo na cidade quando viu uma colisão grave, com um motociclista caído no chão. Havia sangue e parecia que a vítima precisava de atendimento médico urgente. Qual número de emergência João deve ligar imediatamente para acionar o socorro médico especializado (SAMU)?","","192","193","190","191","O SAMU é o Serviço de Atendimento Móvel de Urgência, especializado em emergências médicas, e seu número de contato é o 192."],["p1m4q110",4,0,"Maria estava na rodovia e viu um carro pegando fogo no acostamento. Ela precisava de ajuda especializada para controlar o incêndio. Para quem Maria deve ligar para pedir ajuda em casos de incêndio, resgates ou riscos com cabos elétricos?","","193 (Corpo de Bombeiros).","192 (SAMU).","190 (Polícia Militar).","191 (PRF).","O Corpo de Bombeiros é o responsável por resgate e combate a incêndios, e o número de contato é 193."],["p1m4q111",4,0,"Pedro deu uma pequena batida no carro da frente. Ninguém se feriu, mas os carros estavam parados no meio da faixa, bloqueando todo o trânsito. Após trocar as informações (placa, CNH, telefone) com o outro motorista, qual a atitude correta que Pedro deve tomar?","","Retirar os veículos da via e levá-los para o acostamento ou local seguro, para liberar o trânsito.","Deixar os veículos onde estão e aguardar a chegada da polícia.","Fazer o registro da ocorrência no meio da pista.","Ignorar a batida e fugir do local.","Em sinistros sem vítimas, é obrigatório mover os veículos para evitar novos acidentes e liberar o fluxo da via."],["p1m4q112",4,0,"Ana estava no trânsito quando furou o pneu e teve que parar rapidamente no acostamento. Qual o passo essencial para sinalizar a emergência no local e proteger a si e aos outros motoristas, logo após ligar o pisca-alerta?","","Posicionar o triângulo de sinalização a pelo menos 30 metros de distância do veículo.","Posicionar o triângulo a 5 metros do carro, no acostamento.","Ligar o farol alto.","Deixar a porta aberta para que outros motoristas vejam o problema.","Sinalizar o local do sinistro é o segundo passo, sendo o triângulo posicionado a um mínimo de 30 metros de distância."],["p1m4q113",4,0,"Em um sinistro, Paula parou para ajudar uma vítima que estava consciente, mas com sede. Qual item Paula não deve dar à vítima sob hipótese alguma, mesmo que ela peça?","","Água, comida ou medicamentos.","Apoio e conforto.","Cobertor se estiver com frio.","Informação sobre a chegada do socorro.","Jamais se deve dar algo para a vítima ingerir, pois isso pode ser fatal se ela precisar de cirurgia ou estiver em estado de choque."],["p1m4q114",4,0,"Rafael está dirigindo há muito tempo em uma viagem e começa a sentir as pálpebras pesadas e a bocejar a cada minuto. O que esses sinais do corpo de Rafael estão indicando?","","A sonolência, que reduz seus reflexos e sua capacidade de reagir a imprevistos.","Aumento da atenção e foco.","Necessidade de beber café e seguir viagem.","Apenas um resfriado leve.","Bocejos e pálpebras pesadas são sinais claros de que o corpo precisa de descanso e que a sonolência está prejudicando o desempenho."],["p1m4q115",4,0,"Um pedestre foi atropelado e estava deitado no chão, sentindo muito frio. Qual atitude correta e segura deve ser tomada para ajudar a vítima a manter a temperatura corporal e evitar o estado de choque?","","Cobri-la com um cobertor, agasalho ou manta térmica, se disponível.","Dar uma bebida quente.","Apenas ignorar, pois é mais seguro.","Movimentá-la para um local quente.","O material orienta a cobrir a vítima para evitar a perda de temperatura e o agravamento do estado de choque."],["p1m4q116",4,0,"Um motociclista estava caído e inconsciente. Qual a atitude que o condutor leigo não deve tomar sob hipótese alguma?","","Tentar remover o capacete ou qualquer peça de roupa que esteja grudada.","Ligar para o socorro.","Cobrir a vítima se estiver com frio.","Conversar com a vítima para acalmá-la.","A remoção de capacete e roupas grudadas pode agravar fraturas ou causar lesões na coluna."],["p1m4q117",4,0,"O instrutor de trânsito estava alertando sobre os sinais de sonolência, como bocejar. O que a sonolência reduz no motorista, tornando a direção perigosa?","","Seus reflexos, sua atenção e sua capacidade de reagir a imprevistos.","A necessidade de frear.","A sua velocidade.","O consumo de combustível.","A sonolência afeta as funções cognitivas de forma semelhante ao álcool."],["p1m4q118",4,1,"Patrícia parou em um sinistro e viu que havia fumaça saindo do capô de um dos carros. Antes de ligar para o socorro, qual informação Patrícia deve observar para sua própria segurança e para alertar os profissionais (parte da \"Avaliação da Situação\")?","","Observar se há vazamentos de combustível, fumaça, fios elétricos soltos ou risco de incêndio/explosão.","Tentar apagar o fogo sozinha.","Fazer procedimentos médicos na vítima.","Fugir do local.","A Avaliação da Situação exige a observação de riscos iminentes (incêndio, explosão) para garantir a segurança do local."],["p1m4q119",4,1,"André e Bia bateram de leve e ninguém se feriu. Eles já pararam no acostamento e precisam formalizar o sinistro. Além da placa e modelo do carro, quais informações pessoais de Bia e André são cruciais para a formalização do sinistro?","","Nome completo, CPF, CNH e telefone.","A cor da roupa e a altura.","Apenas a placa do carro e o modelo.","A cor do cabelo e a marca do celular.","A troca de nome, CPF, CNH e telefone é essencial para que o sinistro possa ser registrado e resolvido."],["p1m4q120",4,1,"Um motociclista foi derrubado e parecia ter fraturado a perna. Um condutor queria movê-lo para a calçada, mas outro lembrou-se da \"regra de ouro\" do socorro. Qual é a regra de ouro do primeiro socorro que impede o condutor leigo de agravar os ferimentos da vítima?","","\"Não remova, não movimente, não transporte.\"","\"Movimente apenas em caso de dor.\"","\"Movimente sempre para o acostamento.\"","\"Remova a vítima o mais rápido possível.\"","Movimentar a vítima pode agravar fraturas e causar lesões irreversíveis na coluna."],["p1m4q121",4,1,"João estava muito cansado e, sem perceber, teve um \"micro-sono\" de apenas 3 ou 4 segundos. O material afirma que essa sonolência tem um efeito comparável a dirigir alcoolizado. O que a sonolência reduz no motorista, tornando a direção perigosa?","","Reduz os reflexos, a atenção e a capacidade de reação do motorista, de forma similar ao álcool.","Aumenta a velocidade e a adrenalina.","Melhora a capacidade de reação em situações de emergência.","Não tem efeito comparável ao álcool.","O efeito da sonolência no desempenho é equiparado ao do álcool, pois a perda de atenção e reflexos é grave."],["p1m4q122",4,1,"Lucas é um condutor comum e está prestando socorro em um sinistro, ligando para o SAMU. Ele pensou em fazer um curativo em um corte, mas lembrou de seu papel. Qual é o papel de Lucas como condutor leigo que presta assistência?","","Dar apoio emocional, informar a vítima sobre a chegada do socorro e nunca tentar fazer procedimentos médicos que não saiba.","Tentar fazer a reanimação cardiopulmonar.","Apenas observar a vítima sem falar nada.","Mover a vítima para o carro.","O papel do condutor é proteger, sinalizar e apoiar, sem intervenção médica."],["p1m4q123",4,1,"Em um sinistro grave com vítimas, o motor dos carros envolvidos continuava ligado. Qual a ação de segurança que deve ser tomada para evitar riscos como o de incêndio ou explosão?","","Desligar o motor dos veículos envolvidos, se possível.","Retirar os pneus dos carros.","Retirar os documentos das vítimas.","Ligar para a seguradora.","Desligar o motor é uma medida de segurança preventiva no local do sinistro, evitando riscos como o de incêndio."],["p1m4q124",4,1,"Emergência/Localização: Ao ligar para o Corpo de Bombeiros (193), o atendente precisava saber como mandar a equipe de resgate. Qual a informação mais crucial que o condutor deve fornecer para os serviços de emergência (190, 192, 193) para garantir um socorro rápido e eficaz?","","A localização exata do sinistro e o número e situação das vítimas.","Seu nome e CPF completo.","Apenas o tipo de veículo envolvido.","A cor da roupa das vítimas.","A precisão da localização e o estado das vítimas são vitais para o tempo de resposta do socorro."],["p1m4q125",4,2,"Em um sinistro com uma vítima gravemente ferida, o carro estava começando a pegar fogo. Qual a única exceção à regra de ouro \"não remova, não movimente, não transporte\" que justifica mover a vítima?","","Somente fazer a movimentação em caso de risco iminente, como incêndio, explosão ou atropelamento.","Quando a vítima pedir para ser movida.","Quando o motorista estiver com pressa.","Quando a vítima estiver deitada sobre o asfalto.","O risco iminente de morte (como o fogo) é a única razão que justifica o risco de agravar os ferimentos."],["p1m4q126",4,2,"Se João, dirigindo a 80km/h, tiver um micro-sono de apenas 4 segundos, qual o risco real dessa situação?","","O veículo percorre quase 100 metros sem controle nenhum, o equivalente a dirigir de olhos fechados por um quarteirão inteiro.","O veículo percorre apenas 10 metros, sem risco.","O veículo se autocontrola e não sai da faixa.","O veículo apenas reduz a velocidade.","A combinação de sono e alta velocidade resulta em uma perda de controle por uma distância perigosamente longa."],["p1m4q127",4,0,"Após uma discussão intensa em casa, Paulo pegou o carro para ir trabalhar. Ele sentiu a raiva e a frustração o dominarem ao volante, tornando-o impulsivo. Qual é a principal responsabilidade do condutor consciente ao sentir essa alteração emocional?","","Reconhecer o estado emocional alterado (raiva/frustração) e parar para se acalmar e se preparar para dirigir.","Acelerar o veículo para esquecer o problema.","Ignorar a emoção, pois ela não afeta a direção.","Tentar ligar para a pessoa com quem discutiu para resolver o problema enquanto dirige.","A responsabilidade do condutor começa com o autocontrole: reconhecer o problema e evitar dirigir sob forte estresse emocional."],["p1m4q128",4,0,"O instrutor de Maria explicou que o termo \"acidente\" não deve mais ser usado, pois sugere que o evento é uma fatalidade. Qual termo oficial o instrutor usou para se referir a um evento de trânsito evitável que resulta em dano ou prejuízo?","","Sinistro.","Colisão.","Ocorrência.","Desastre.","O termo sinistro é usado para reforçar que o evento é uma consequência de escolhas e comportamentos, e não um mero acaso."],["p1m4q129",4,0,"Você está dirigindo em uma via urbana e testemunha um sinistro sem vítimas. A primeira coisa que você faz é parar o seu veículo em um local seguro. Qual dispositivo do seu veículo você deve acionar imediatamente para alertar os outros condutores sobre o perigo?","","O pisca-alerta do veículo.","O farol alto.","O limpador de para-brisa.","O sistema de som.","O pisca-alerta é a sinalização mais rápida e essencial para alertar outros motoristas sobre a parada emergencial."],["p1m4q130",4,0,"Um motorista sofreu um sinistro e estava consciente, mas com muito medo e sentindo frio. Qual a atitude correta que você deve tomar para dar apoio emocional e manter a vítima estável até a chegada do socorro?","","Conversar com a vítima para mantê-la calma e consciente, e cobri-la se estiver com frio.","Dar água e medicamentos.","Tentar mover a vítima para um local mais seguro.","Fazer procedimentos médicos.","Seu papel é dar apoio e conforto, nunca tentar fazer intervenções médicas ou dar algo para ingerir."],["p1m4q131",4,0,"Você está dirigindo na estrada e percebe que está bocejando a cada minuto e lutando para manter os olhos abertos. Qual atitude de segurança o material indica que você deve tomar imediatamente ao reconhecer esses sinais de alerta?","","Encontrar um local seguro, parar e descansar.","Abrir a janela e aumentar o volume do rádio.","Beber café e continuar dirigindo.","Fazer um cochilo rápido no volante.","O único remédio seguro para a sonolência é o descanso em um local seguro."],["p1m4q132",4,1,"Uma vítima de sinistro está caída na grama, longe do perigo imediato, e parece ter fraturado o braço. Um motorista quer movê-la para o seu carro para levá-la ao hospital. Qual a regra de ouro do material que ele deve seguir, e qual a única exceção?","","\"Não remova, não movimente, não transporte.\" A única exceção é em caso de risco iminente (incêndio, explosão).","\"Movimente apenas em caso de dor.\"","\"Movimente sempre para o acostamento.\"","\"Remova a vítima o mais rápido possível.\"","A única justificativa para a movimentação é o risco de morte da vítima no local, como um incêndio."],["p1m4q133",4,1,"O instrutor comparou o perigo de dirigir com sono ao de dirigir alcoolizado. Qual o efeito direto da sonolência no desempenho do motorista que a torna tão perigosa quanto o álcool?","","A sonolência reduz os reflexos, a atenção e a capacidade de reação de forma semelhante ao efeito do álcool.","A sonolência afeta apenas a velocidade.","A sonolência aumenta a concentração.","A sonolência não tem efeito comparável ao álcool.","A redução das funções cognitivas e da capacidade de reação é o que torna o sono um \"perigo invisível\" e equiparável ao álcool."],["p1m4q134",4,1,"Os pneus são o único ponto de contato entre o veículo e o chão. Qual a periodicidade ideal de calibrageml?","","Pelo menos uma vez por semana, sempre com os pneus frios.","A cada 15 dias, logo após o carro ter rodado um pouco para aquecer.","Apenas uma vez por mês, não importando a temperatura.","Somente antes de viagens longas, se o pneu estiver visivelmente murcho.","A calibragem semanal com pneus frios é a recomendação."],["p1m4q135",4,1,"Pneus murchos causam diversos problemas. Quais são as duas consequências diretas de pneus com calibragem inadequada?","","Aumentam o consumo de combustível e desgastam mais rápido.","Aumentam a vida útil do pneu e melhoram a estabilidade.","Diminuem o consumo de combustível e melhoram a frenagem.","Prejudicam apenas o sistema de suspensão, sem afetar o consumo.","Pneus murchos aumentam o consumo e desgastam mais rápido."],["p1m4q136",4,1,"Qual é o procedimento correto para manter o equilíbrio do desgaste e aumentar a vida útil dos pneus?","","Fazer o rodízio a cada 10 mil km.","Trocar todos os pneus por novos a cada 5 mil km.","Aumentar a calibragem em 25% para compensar o desgaste.","Rodar apenas na cidade, pois o rodízio é inútil em rodovias.","O rodízio a cada 10 mil km equilibra o desgaste."],["p1m4q137",4,0,"Qual o perigo principal dos pneus com desgaste ou \"carecas\", especialmente em pistas molhadas?","","Pneus gastos não conseguem expulsar água da pista e podem causar aquaplanagem.","Pneus gastos podem causar vibração excessiva no volante.","Pneus gastos fazem o carro puxar para o lado esquerdo.","Pneus gastos apenas aumentam o ruído de rodagem.","Pneus gastos são um risco sério de aquaplanagem."],["p1m4q138",4,0,"Além de enxergar no escuro, qual é o outro papel fundamental das luzes do veículo para a segurança no trânsito?","","Servir para que os outros veículos vejam o seu carro.","Apenas alertar sobre a falha de outros sistemas do veículo.","Apenas consumir menos energia elétrica do carro.","Ajudar a carregar a bateria do veículo.","As luzes têm a função de \"ver e ser visto\"."],["p1m4q139",4,0,"Qual o procedimento de segurança simples, que leva apenas alguns segundos, que o condutor deve realizar antes de sair de casa?","","Testar sempre os faróis, as setas e a luz de freio.","Verificar o nível de óleo com o motor quente.","Fazer o rodízio dos pneus a cada saída.","Calibrar o estepe semanalmente, mesmo se estiver OK.","Testar as luzes evita sinistros e é rápido."],["p1m4q140",4,0,"Em relação ao uso do farol, qual a simples atitude que aumenta muito a visibilidade do seu carro para outros motoristas, principalmente em rodovias?","","Manter o farol baixo aceso mesmo durante o dia.","Manter o farol alto aceso durante o dia.","Usar apenas a luz de posição em rodovias.","Desligar todos os faróis para economizar bateria.","O farol baixo de dia aumenta a visibilidade."],["p1m4q141",4,0,"Qual é o principal risco causado pelo uso incorreto do farol alto?","","O farol alto ofusca quem vem na direção contrária e pode causar sinistros graves.","O farol alto consome mais combustível do que o farol baixo.","O farol alto descarrega rapidamente a bateria do veículo.","O farol alto danifica a suspensão do carro.","O ofuscamento é o principal perigo do farol alto."],["p1m4q142",4,1,"O sistema de freios é classificado como o componente de segurança mais importante do veículo. Qual a frequência recomendada para uma revisão completa (pastilhas, discos, fluido e sistema hidráulico)?","","A cada 5 mil ou 10 mil km.","A cada 20 mil km, apenas se houver ruído.","Uma vez por ano, independentemente da quilometragem.","Apenas quando o pedal estiver muito baixo.","A revisão completa tem periodicidade definida."],["p1m4q143",4,1,"Qual dos sinais a seguir é um aviso de problema no sistema de freios que não pode ser ignorado?","","O pedal do freio estiver muito baixo ou muito alto.","O volante estiver leve e sem vibrações.","O carro estiver com o tanque de combustível cheio.","O som do carro estiver funcionando perfeitamente.","Os sinais de falha nos freios devem ser observados."],["p1m4q144",4,1,"Qual a verificação mensal que o condutor deve fazer no sistema de freios, e o que a baixa no nível desse componente pode indicar?","","Observar o nível do fluido de freio; se estiver baixo, pode indicar vazamento.","Observar o nível da água do radiador; se estiver baixo, pode indicar aquecimento.","Observar o nível do óleo do motor; se estiver baixo, pode indicar entupimento.","Observar o nível do combustível; se estiver baixo, pode indicar sujeira.","Checar o fluido de freio mensalmente é crucial."],["p1m4q145",4,0,"O que as palhetas gastas dos limpadores de para-brisa podem causar, prejudicando a visibilidade, especialmente à noite?","","Riscam o vidro e deixam marcas no momento da limpeza.","Diminuem o consumo de combustível.","Melhoram a estabilidade do veículo.","Aumentam a vida útil do reservatório de água.","Palhetas gastas riscam o vidro e prejudicam a visão."],["p1m4q146",4,0,"Qual é a recomendação de troca para as palhetas dos limpadores de para-brisa?","","Pelo menos uma vez por ano, ou sempre que estiverem ressecadas, rachadas ou deixando marcas no vidro. 25","A cada 5 anos, pois o material é de alta durabilidade.","Apenas quando o motor parar de funcionar.","Somente quando o carro for vendido.","A troca anual ou por sinais de desgaste é a regra."],["p1m4q147",4,0,"Qual é o líquido recomendado para ser misturado à água limpa do reservatório do limpador de para-brisa para ajudar a remover sujeiras e insetos?","","Detergente neutro.","Água sanitária concentrada.","Óleo de motor usado.","Produtos químicos fortes.","O detergente neutro ajuda na limpeza sem danificar a borracha."],["p1m4q148",4,0,"Em quais condições climáticas o sistema de desembaçamento do veículo é classificado como essencial?","","Em dias frios e chuvosos.","Apenas em dias de forte calor.","Apenas em vias sem iluminação.","Somente para desembaçar os vidros laterais.","O desembaçador garante a visão em condições de umidade e frio."],["p1m4q149",4,0,"O óleo é chamado de \"sangue do motor\". Qual a principal função do óleo?","","Lubrifica as peças móveis, reduz o atrito e ajuda a controlar a temperatura.","Apenas alimenta o motor com energia para funcionar.","Apenas limpa o escapamento do veículo.","Apenas aumenta a pressão dos pneus.","O óleo tem funções vitais no motor."],["p1m4q150",4,0,"Qual a periodicidade e condição correta para verificar o nível do óleo do motor, usando a vareta medidora?","","Pelo menos uma vez por mês, com o carro frio e em terreno plano.","Semanalmente, com o carro quente após um longo percurso.","A cada seis meses, com o carro ligado.","Apenas quando acender a luz do painel.","A verificação deve ser feita mensalmente, com o motor frio e plano."],["p1m4q151",4,0,"Por que o motorista deve evitar andar na reserva de combustível?","","Andar na reserva pode sugar sujeira do tanque e entupir o sistema.","Andar na reserva estraga o reservatório do limpador de para-brisa.","Andar na reserva faz o sistema de freios falhar.","Andar na reserva causa ruídos estranhos na suspensão.","A reserva de combustível é arriscada para o motor."],["p1m4q152",4,0,"O que deve ser trocado junto com o óleo do motor para que o óleo novo tenha seus benefícios completos?","","O filtro de óleo.","O óleo de transmissão.","O pneu estepe.","O fluido de freio.","O filtro de óleo sujo anula o óleo novo."],["p1m4q153",4,0,"Qual o principal objetivo da revisão preventiva do veículo?","","Identificar pequenos problemas antes que se tornem grandes e caros.","Apenas deixar o carro mais bonito para a revenda.","Apenas gastar dinheiro desnecessariamente.","Apenas cumprir uma exigência legal do CTB.","O objetivo é a prevenção de problemas e custos maiores."],["p1m4q154",4,0,"Qual documento do veículo traz um cronograma de revisões, com as quilometragens recomendadas e que deve ser seguido à risca?","","O manual do proprietário.","O documento de licenciamento do veículo.","O Certificado de Registro e Licenciamento do Veículo (CRLV).","A CNH do condutor.","O manual do proprietário é a fonte oficial do cronograma."],["p1m4q155",4,0,"Qual a atitude que ajuda a manter o histórico do veículo, valoriza-o na revenda e facilita o acompanhamento da manutenção?","","Guardar todos os comprovantes e documentos de manutenção organizados.","Descartar os comprovantes após o pagamento.","Não anotar a quilometragem na revisão.","Fazer a revisão em locais diferentes a cada vez.","O histórico organizado valoriza o veículo."],["p1m4q156",4,0,"Qual a periodicidade de duração média da bateria do veículo e o que deve ser checado regularmente?","","A bateria dura de 2 a 4 anos e deve-se verificar os terminais.","A bateria dura 1 ano e deve-se checar o nível de água.","A bateria dura 5 anos e deve-se checar o nível de óleo.","A bateria dura 6 meses e deve-se limpar o escapamento.","A durabilidade e a checagem dos terminais são importantes."],["p1m4q157",4,0,"O que o motorista deve fazer imediatamente ao notar que o escapamento do veículo está furado?","","Consertar, pois faz barulho excessivo e pode intoxicar os ocupantes com gases.","Cobrir o furo com fita isolante.","Desligar o sistema de ar-condicionado.","Ignorar, pois o problema é apenas estético.","O risco de intoxicação exige conserto imediato."],["p1m4q158",4,0,"Qual é o procedimento de segurança obrigatório ao verificar o nível de água do radiador?","","Verificar o nível com o motor frio e nunca abrir com o motor quente.","Abrir o reservatório com o motor quente para checar a pressão.","Usar o dedo para verificar se a água está quente.","Verificar apenas o nível, sem se preocupar com a temperatura.","Nunca abrir o radiador quente evita queimaduras graves."],["p1m4q159",4,2,"Qual o sinal de problema na suspensão que o condutor pode observar ao dirigir, além de ruídos estranhos e desalinhamento?","","Desgaste irregular dos pneus.","O retrovisor externo estar quebrado.","O nível de combustível estar baixo.","A luz de freio estar queimada.","O desgaste irregular dos pneus indica problemas na suspensão."],["p1m4q160",4,1,"Qual a regra de uso do farol alto à noite?","","Usar apenas em vias sem iluminação e sem tráfego contrário.","Usar em todas as vias, para enxergar o máximo possível.","Nunca usar o farol alto, pois sempre ofusca.","Usar o farol alto apenas ao frear.","O uso do farol alto é restrito para evitar ofuscamento."],["p1m4q161",4,1,"O que os filtros de ar, óleo e combustível entupidos causam no veículo, exigindo que sejam trocados conforme o manual?","","Prejudicam o desempenho e aumentam o consumo.","Melhoram o sistema de freios.","Diminuem o ruído do escapamento.","Aumentam a vida útil do pneu.","Filtros entupidos afetam diretamente o motor."],["p1m4q162",4,1,"Qual a relação entre a manutenção preventiva e o meio ambiente?","","Cuidar do veículo (manutenção) é cuidar da sua segurança, da de quem está com você e também do meio ambiente.","A manutenção só serve para aumentar a potência do motor.","Não há relação, pois o veículo não afeta o meio ambiente.","A manutenção é feita apenas para evitar multas.","A manutenção tem um impacto social e ambiental."],["p1m4q163",4,1,"Você está dirigindo em uma rodovia à noite, em um trecho com pouca iluminação. De repente, você avista um veículo vindo na direção contrária. Qual é o procedimento correto que você deve adotar para seguir as regras de segurança e evitar um sinistro?","","Mudar imediatamente do farol alto para o farol baixo assim que o outro veículo se aproximar.","Manter o farol alto aceso até o veículo passar, para garantir o máximo de visibilidade da pista.","Desligar completamente os faróis para não ofuscar o outro motorista.","Ligar as luzes de neblina em conjunto com o farol alto.","O material alerta que o farol alto ofusca quem vem na direção contrária e pode causar sinistros graves. Portanto, ele deve ser trocado para o baixo ao avistar outro veículo."],["p1m4q164",4,0,"Você está se preparando para uma viagem de fim de semana e encontra seu estepe na mala. Você o inspeciona e ele está visivelmente murcho. Qual é a negligência imediata que você comete ao não ter cuidado com o pneu reserva?","","Corre o risco de ter um pneu reserva murcho quando mais precisar dele em uma emergência.","Você gastará mais combustível durante a viagem.","O estepe murcho causará ruídos estranhos na suspensão.","O pneu reserva murcho aumenta a vida útil dos pneus que estão rodando.","O material orienta que se \"Confira regularmente\" o estepe, pois ele precisa estar pronto para ser usado em emergências."],["p1m4q165",4,1,"Ao dirigir pela cidade, você começa a sentir um forte cheiro de gás de escape dentro do carro e ouve um barulho metálico na parte traseira. Qual é o risco iminente associado a um escapamento furado?","","O escapamento furado pode intoxicar os ocupantes com gases dentro do veículo.","O carro será reprovado na inspeção de freios.","O ruído excessivo pode danificar a suspensão do carro.","O problema fará com que o fluido de freio vaze.","O material avisa que um \"escapamento furado faz barulho excessivo e pode intoxicar os ocupantes com gases.\""],["p1m4q166",4,0,"É um dia frio e chuvoso e o vidro do seu carro começa a embaçar rapidamente, comprometendo totalmente sua visão. Qual sistema do veículo é essencial para garantir que você possa enxergar a via nessas condições climáticas?","","O sistema de desembaçamento, que deve ser testado, pois é essencial em dias frios e chuvosos.","O sistema de suspensão.","A correta calibragem do estepe.","O sistema de iluminação de emergência.","O material lista o desembaçamento como um sistema essencial para garantir a visibilidade em dias frios e chuvosos."],["p1m4q167",4,1,"Você precisa verificar o nível de óleo do motor antes de sair para o trabalho. Com pressa, você faz a checagem logo após estacionar o carro, ainda quente e com o motor ligado. Qual é o erro de procedimento que você cometeu?","","A verificação deve ser feita com o carro frio e em terreno plano para garantir que o óleo assente.","O óleo precisa estar quente para que sua viscosidade seja medida corretamente.","O motor deve estar ligado para que o óleo circule.","O nível de óleo não pode ser verificado em dias úteis, apenas nos finais de semana.","O procedimento correto no material é verificar o nível de óleo com o \"motor frio e em terreno plano\"."],["p1m4q168",4,1,"Ao checar o nível de óleo com a vareta, você percebe que ele está significativamente abaixo da marca \"Mínimo\". Qual é a primeira atitude a ser tomada, conforme o manual, para evitar um prejuízo enorme ao motor?","","Completar o nível com o tipo de óleo recomendado no manual e, se o consumo for frequente, procurar um mecânico.","Adicionar qualquer tipo de óleo disponível, desde que o nível suba acima da marca mínima.","Ignorar o nível, pois o carro foi revisado há seis meses.","Adicionar apenas água no reservatório do óleo.","O texto indica que o óleo deve ser completado com o tipo recomendado e que o baixo nível constante exige a procura por um mecânico."],["p1m4q169",4,1,"Você fez a troca de óleo do seu carro na semana passada, mas decidiu não trocar o filtro de óleo para economizar tempo e dinheiro. Qual a consequência direta dessa escolha?","","Um filtro sujo anula os benefícios do óleo novo, comprometendo a lubrificação e a limpeza do motor.","O carro puxará para um lado ao frear.","O fluido de freio será contaminado pelo óleo velho.","O farol alto deixará de funcionar corretamente.","O material indica que o filtro de óleo deve ser \"trocado sempre junto com o óleo\", pois um filtro sujo anula os benefícios do óleo novo."],["p1m4q170",4,1,"Preocupado com a economia, você decide abastecer em um posto desconhecido que oferece um preço muito abaixo da média do mercado. Qual o risco nessa situação?","","O risco de abastecer com combustível adulterado, que pode causar danos sérios ao motor.","O carro automaticamente puxará para o lado ao acelerar.","Os pneus serão descalibrados automaticamente após o abastecimento.","A bateria do veículo durará mais de 4 anos.","O material alerta que \"combustível adulterado pode causar danos sérios ao motor\" e exige atenção ao abastecimento."],["p1m4q171",4,1,"Você abre o capô do carro e percebe que os terminais da bateria estão cobertos por uma substância esverdeada ou branca (zinabre). Qual a solução de manutenção simples que deve ser aplicada imediatamente?","","Limpar os terminais com uma escova para garantir o bom funcionamento da bateria.","Adicionar mais fluido de freio nos terminais.","Passar a mão nos terminais para remover o zinabre.","Abrir o radiador com o motor quente para dissipar o zinabre.","O material orienta a \"Verificar os terminais regularmente. Se estiverem sujos ou com zinabre, limpe com uma escova.\""],["p1m4q172",4,2,"Ao frear em um sinal, você nota que o carro \"puxa\" bruscamente para a direita e ouve um ruído metálico. Qual é o sinal de alerta de segurança que você não pode ignorar?","","É um aviso sério de que há um problema no sistema de freios, exigindo a procura imediata de um mecânico.","O sinal indica que os pneus estão apenas descalibrados.","O problema é causado pela sujeira no reservatório de água do limpador.","O sinal é causado por um vazamento de óleo do motor.","O material lista o carro \"puxar para um dos lados\" e \"ruídos estranhos\" como sinais de que algo não está certo com o sistema de freios."],["p1m4q173",4,1,"Você está dirigindo em uma rodovia e percebe que sua luz de freio traseira não está acendendo. Ao que está associado a falha da luz de freio?","","Ao aumento muito grande do risco de colisão traseira, pois o motorista de trás não será avisado da sua desaceleração.","Ao vazamento de fluido do sistema de arrefecimento.","Ao aumento do consumo de combustível.","Ao desgaste irregular dos pneus dianteiros.","A falha na luz de freio é um perigo porque ela é essencial para \"avisar quem vem atrás\" e aumenta o risco de colisão traseira."],["p1m4q174",4,0,"Para limpar o para-brisa, você usa um produto de limpeza de uso doméstico muito forte, não recomendado para carros. Qual é o risco dessa atitude para o sistema de limpeza?","","Danificar a borracha das palhetas dos limpadores de para-brisa.","Descalibrar os pneus automaticamente.","Aumentar o nível do óleo do motor.","Obstruir o sistema de arrefecimento.","O material recomenda usar detergente neutro no reservatório, indicando que produtos químicos fortes podem danificar o sistema, como a borracha das palhetas."],["p1m4q175",4,1,"Você tem observado ruídos estranhos ao passar em lombadas e percebeu que um de seus pneus está com desgaste irregular. Qual dos sistemas complementares pode estar com problemas e necessita de verificação?","","O sistema de suspensão, que tem como sinais ruídos estranhos, desalinhamento ou desgaste irregular dos pneus.","O sistema de iluminação de placa.","O sistema de desembaçamento do vidro traseiro.","O sistema de luzes de ré.","O material recomenda ficar atento a \"ruídos estranhos, desalinhamento ou desgaste irregular dos pneus\", pois esses são sinais de problemas na suspensão."],["p1m4q176",4,1,"Você manteve o histórico de manutenção do seu carro organizado, guardando os comprovantes e anotando as quilometragens. Qual é o benefício direto dessa organização na hora de trocar ou vender o veículo?","","Ajuda a manter o histórico do veículo e valoriza o carro na revenda.","Isso só é útil para o mecânico, sem valor para o proprietário.","Os comprovantes devem ser descartados após um ano de uso.","A organização só é útil para carros com menos de 2 anos de uso.","O material instrui a \"Guardar comprovantes\" pois isso \"valoriza o veículo e facilita o acompanhamento\"."],["p1m4q177",4,0,"Você nota que o nível de água do radiador está um pouco baixo e decide completá-lo. Qual é o procedimento de segurança ao fazer essa checagem?","","Verificar o nível com o motor frio e nunca abrir o radiador com o motor quente, sob risco de queimaduras graves.","Abrir a tampa com o motor quente para que o vapor force a saída da água.","Usar água mineral para garantir a pureza do líquido de arrefecimento.","Completar o nível de água apenas uma vez por ano.","O material instrui a \"Verifique o nível de água do radiador com o motor frio. Nunca abra com o motor quente, pois pode causar queimaduras graves.\""],["p1m4q178",4,1,"Em vez de esperar um problema surgir, você agenda a troca de pastilhas e a checagem do fluido de freio a cada 10 mil km. Qual a vantagem financeira que essa atitude proativa garante?","","A manutenção preventiva sempre sai mais barato do que o conserto de um problema de última hora.","A manutenção preventiva aumenta o custo mensal do veículo.","O conserto de última hora não é tão caro quanto a revisão agendada.","O seguro do carro cobre apenas problemas causados por falta de manutenção.","O material cita a \"Sabedoria automotiva\": \"Manutenção preventiva sempre sai mais barato\" do que consertar com pressa."],["p1m4q179",4,1,"Você está em uma viagem longa e, de repente, uma nuvem de poeira e sujeira cobre seu para-brisa. Qual a solução ideal para limpar o vidro e não estragar as palhetas?","","Usar o reservatório de água, que deve estar com água limpa e um pouco de detergente neutro.","Usar um produto químico forte para dissolver a sujeira rapidamente.","Parar o carro e esfregar o vidro com a mão.","Não usar o limpador, pois ele pode riscar o vidro nessas condições.","O material recomenda manter o reservatório com \"água limpa, misturada a um pouco de detergente neutro\" para ajudar a remover sujeiras."],["p1m4q180",4,1,"Você nota que o vidro do carro está sempre sujo por dentro, com uma camada de gordura e poeira que se acentua à noite, quando as luzes dos faróis batem. Qual a simples ação de limpeza que deve ser feita regularmente?","","Limpar os vidros por dentro e por fora regularmente, pois gordura e poeira prejudicam muito a visão noturna.","Limpar apenas por fora com água do reservatório.","Limpar apenas por dentro, pois a sujeira externa não é relevante.","Usar o desembaçador para remover a gordura do vidro.","O material enfatiza a importância de limpar os vidros \"por dentro e por fora regularmente\", pois gordura e poeira prejudicam muito a visão noturna."],["p1m4q181",4,0,"Você está no começo de uma longa viagem, com previsão de tráfego intenso. Qual a atitude preventiva você deve ter em relação aos freios, mesmo que a manutenção periódica esteja em dia?","","Sempre testar os freios antes de viagens longas para certificar que estão respondendo bem e sem ruídos.","Aumentar o nível do óleo do motor em 50%.","Esvaziar completamente o reservatório do limpador.","Fazer o rodízio dos pneus no momento da saída.","O material sugere que \"sempre teste os freios\" antes de viagens longas."],["p1m4q182",4,1,"Você tem observado que o veículo está mais lento, com dificuldade em acelerar, e o consumo de combustível aumentou. Qual componente sujo ou entupido pode ser o responsável por essa dupla consequência?","","Os filtros de ar, óleo e combustível, que entupidos prejudicam o desempenho e aumentam o consumo.","O reservatório de água do limpador de para-brisa.","O sistema de luzes da placa.","Os terminais da bateria.","O material afirma que \"Filtros entupidos prejudicam o desempenho e aumentam o consumo\" e que a troca deve ser feita conforme o manual."],["p1m4q183",4,2,"Qual a dupla de fluidos de segurança que deve ter seu nível checado pelo menos uma vez por mês, sendo que um deve ser checado com o carro frio e o outro com verificação mensal do nível?","","Óleo do motor (carro frio e plano) e Fluido de Freio (observação mensal).","Fluido de Freio (semanalmente) e Água do Radiador (somente na revisão anual).","Óleo do motor (carro quente) e Fluido de Direção Hidráulica (mensalmente).","Água do Radiador (somente com o carro quente) e Fluido de Freio (anualmente).","O material indica checar o nível do óleo \"pelo menos uma vez por mês, com o carro frio e em terreno plano\" e \"Observar o nível do fluido de freio\" mensalmente, alertando que a baixa pode indicar vazamento."],["p1m4q184",4,2,"Você nota o desgaste irregular dos pneus e ruídos estranhos ao passar em lombadas. Qual a consequência adicional imediata de segurança associada a um escapamento furado (outro problema) que não pode ser ignorada?","","Um escapamento furado pode intoxicar os ocupantes com gases, exigindo conserto imediato.","O escapamento furado indica que a bateria precisa ser trocada.","O ruído estranho indica que o fluido de freio está baixo.","O desgaste irregular dos pneus indica a falha total das luzes de ré.","A seção \"Escapamento\" alerta que um escapamento furado \"pode intoxicar os ocupantes com gases. Conserte assim que notar problemas\", sendo um risco de segurança imediato."],["p1m4q185",4,2,"Qual o risco para o sistema de alimentação que o motorista corre ao andar constantemente com o veículo na reserva de combustível?","","O risco de sugar sujeira do tanque e entupir o sistema de combustível.","O risco de o fluido de freio secar mais rápido.","O risco de a bateria descarregar por falta de energia.","O risco de o óleo do motor vazar pela vareta medidora.","O material alerta para a \"Sabedoria automotiva\": \"Evite andar na reserva. Você pode sugar sujeira do tanque e entupir o sistema.\""],["p1m4q186",4,2,"É possível ter o melhor volante, pneus e motor potente, mas se este sistema falhar, \"nada disso importa\". Qual é o sistema de segurança ao qual essa afirmação se refere, devendo ser prioridade absoluta na manutenção?","","O sistema de freios, que é o componente de segurança mais importante do veículo.","O sistema de suspensão.","O sistema de iluminação de emergência.","O sistema de arrefecimento.","O material define explicitamente o sistema de freios como o \"componente de segurança mais importante do veículo\" e usa a frase citada para reforçar sua prioridade."],["p1m4q187",4,2,"Qual é a distinção entre a revisão preventiva e o conserto corretivo, usando a analogia da saúde?","","A preventiva é feita antes que os problemas apareçam, como ir ao médico fazer exames, enquanto o conserto é o remédio após a doença.","A preventiva é apenas para cumprir o cronograma do manual, e o conserto é mais caro, mas mais rápido.","A preventiva é mais demorada, mas garante que o óleo do motor seja trocado junto com o filtro.","O conserto é sempre mais barato, mas a preventiva valoriza o carro.","O material define a preventiva como a \"melhor forma de identificar pequenos problemas antes que se tornem grandes e caros\" e usa a analogia de \"ir ao médico e fazer exames de rotina\"."],["p1m4q188",4,2,"Você leva seu carro ao mecânico e ele nota desgaste irregular nos seus pneus. Qual é o sistema, além da suspensão, que deve ser imediatamente verificado para solucionar a causa do desgaste irregular?","","A suspensão e o alinhamento do veículo, que, se desregulados, causam desgaste irregular e ruídos.","A calibragem do estepe, que afeta o alinhamento.","O escapamento, que, se furado, causa o desgaste do pneu.","O sistema de lubrificação, que, se falhar, causa desgaste nos pneus.","O material relaciona o desgaste irregular dos pneus a problemas na suspensão, e o alinhamento (que não é um item de suspensão, mas um ajuste) é a principal causa desse desgaste, devendo ser verificado junto."],["p1m4q189",4,2,"Em quais situações o farol baixo é essencial para a segurança, sendo que em uma delas ele deve ser usado mesmo durante o dia?","","Deve ser usado durante o dia, especialmente em rodovias, e à noite, em vias com iluminação ou com tráfego contrário.","Deve ser usado apenas à noite em vias sem iluminação e sem tráfego contrário.","Deve ser usado apenas ao frear para avisar o veículo de trás.","Deve ser usado apenas em dias de neblina e chuva intensa.","O material instrui o uso do farol baixo \"durante o dia (principalmente nas rodovias)\" e à noite em \"vias iluminadas ou quando houver veículo vindo em sentido contrário\"."],["p1m4q190",4,0,"Qual o conjunto de atitudes práticas, simples e acessíveis que, além de proteger o meio ambiente, economizam dinheiro no bolso do motorista?","","Condução sustentável.","Condução esportiva.","Condução de alto risco.","Condução de luxo.","A Condução Sustentável é definida como um conjunto de atitudes que economizam dinheiro e protegem o meio ambiente."],["p1m4q191",4,1,"Modificações irregulares, como alterar suspensão ou faróis sem autorização, comprometem a segurança do veículo e geram quais consequências?","","Aumentam o risco de sinistros, a emissão de poluentes e podem gerar multas e remoção do veículo.","Reduzem o consumo de combustível e a poluição sonora.","São permitidas, desde que a modificação seja estética.","Melhoram a segurança e a visibilidade noturna.","Modificações irregulares comprometem a segurança, aumentam o risco de sinistros, a emissão de poluentes e podem gerar multas."],["p1m4q192",4,0,"Qual o Resultado Positivo de se fazer a manutenção preventiva regularmente?","","Evita fumaça preta, vazamentos e consumo excessivo.","Aumenta o peso do carro e o esforço do motor.","Obriga o motorista a usar o farol alto.","Prejudica a visibilidade noturna.","Fazer a manutenção preventiva evita fumaça preta, vazamentos e consumo excessivo."],["p1m4q193",4,0,"Qual Boa Prática resulta na redução da emissão de gases e da poluição sonora?","","Desligar o motor em paradas longas.","Acelerar bruscamente em semáforos.","Usar escapamento esportivo.","Evitar o uso do ar-condicionado.","Desligar o motor em paradas longas reduz a emissão de gases e a poluição sonora."],["p1m4q194",4,0,"Qual o Resultado Positivo da prática de retirar peso desnecessário do porta-malas?","","Menos esforço do motor e menor consumo.","Maior desgaste dos freios e pneus.","Aumento do tempo gasto em rotas.","Redução da poluição sonora.","Retirar peso desnecessário do porta-malas resulta em menos esforço do motor e menor consumo."],["p1m4q195",4,0,"Qual combustível renovável, produzido a partir da cana-de-açúcar, é um dos principais responsáveis pela redução de emissões de gases poluentes na frota de veículos leves no Brasil?","","Etanol.","Gasolina pura.","Óleo diesel.","Gás Natural Veicular (GNV).","O etanol é um combustível renovável produzido a partir da cana-de-açúcar."],["p1m4q196",4,0,"O que a prática de aceleração suave e progressiva resulta em termos de consumo e emissões?","","Menos consumo de combustível e redução de emissões.","Maior consumo de combustível e aumento de emissões.","Maior desgaste dos freios.","Menor durabilidade do motor.","Acelerar suavemente e progressivamente gera menos consumo de combustível e redução de emissões."],["p1m4q197",4,1,"O que a alteração irregular de suspensão, faróis ou outras modificações sem autorização compromete, além da segurança e emissão de poluentes?","","Aumentam o risco de sinistros e podem gerar multas.","Apenas o valor de revenda do veículo.","Apenas o consumo de água do radiador.","Apenas a durabilidade das palhetas.","As modificações irregulares aumentam o risco de sinistros e podem gerar multas e remoção do veículo."],["p1m4q198",4,0,"Qual a Boa Prática que resulta em \"Menos esforço do motor e menor consumo\"?","","Retirar peso desnecessário do porta-malas.","Dirigir com o motor desligado.","Fazer o rodízio dos pneus a cada 1.000 km.","Acelerar o máximo possível.","A prática de retirar peso desnecessário do porta-malas resulta em menos esforço do motor e menor consumo."],["p1m4q199",4,2,"Qual é a infração de trânsito que indica \"problemas graves no motor e emissão altíssima de poluentes\"?","","Circular com o carro soltando fumaça preta.","Estacionar sobre a calçada.","Avançar o sinal vermelho.","Dirigir sem cinto de segurança.","Fumaça preta excessiva indica problemas e é classificada como infração de trânsito grave."],["p1m4q200",4,0,"O que a prática de evitar freadas bruscas preserva no veículo, além dos freios e pneus?","","A suspensão.","O óleo do motor.","O fluido do limpador de para-brisa.","O sistema de arrefecimento.","Evitar freadas bruscas resulta em menor desgaste de freios, pneus e suspensão."],["p1m4q201",4,0,"João dirigia ao amanhecer, mas bocejou três vezes seguidas e percebeu os olhos pesados. O que ele deveria fazer antes de continuar?","","Parar e descansar um pouco antes de seguir viagem","Aumentar a velocidade para chegar mais rápido","Abrir a janela e seguir mesmo com sono","Forçar-se a ficar acordado ouvindo música alta","O texto reforça que o sono reduz reflexos e pode causar sinistros."],["p1m4q202",4,0,"Clara saiu de casa irritada após uma discussão e notou que estava acelerando mais do que o normal. Qual a atitude correta?","","Respirar fundo e esperar as emoções acalmarem antes de seguir","Continuar acelerando para liberar o estresse","Dirigir enquanto fala ao telefone para desabafar","Frear bruscamente para ‘descontar’ a raiva","Emoções alteradas afetam a direção e aumentam o risco."],["p1m4q203",4,0,"Pedro percebeu que não lembrava dos últimos metros dirigidos. Qual comportamento explica isso?","","Ele teve um microssono","Ele estava muito atento","O carro estava desregulado","Havia pouco combustível","Microssono é quando o cérebro “desliga” por alguns segundos."],["p1m4q204",4,0,"Marta ouviu uma batida leve atrás dela. Antes de descer do carro, o que deve fazer?","","Ligar o pisca-alerta e garantir a própria segurança","Sair correndo para ver o dano","Ligar imediatamente para um amigo","Ficar parada no meio da via para discutir","Segurança própria vem sempre em primeiro lugar."],["p1m4q205",4,0,"Ao parar para ajudar em um sinistro, Caio se aproximou do carro acidentado. O que ele deveria verificar primeiro?","","Se há riscos como fumaça, vazamentos ou fios soltos","Se ele reconhece alguém no carro","Se as vítimas têm documentos","Se os carros precisam ser movidos","Avaliar riscos evita se tornar mais uma vítima."],["p1m4q206",4,0,"Durante a noite, Ana avistou um veículo parado após um sinistro em uma curva. O que ela deve fazer para evitar novos sinistros?","","Sinalizar colocando o triângulo a pelo menos 30 metros","Ficar no escuro para não atrair atenção","Seguir sem avisar ninguém","Ligar o farol alto diretamente para o veículo parado","A sinalização adequada evita novos sinistros."],["p1m4q207",4,0,"Lucas encontrou uma vítima caída e consciente. Qual atitude é correta enquanto aguarda socorro?","","Conversar para mantê-la calma","Movimentá-la para deixá-la mais confortável","Dar água imediatamente","Levantar a pessoa para ver se consegue andar","Manter a vítima calma ajuda a estabilizar a situação."],["p1m4q208",4,0,"Ricardo dirigia há horas sem parar e começou a sentir a visão turva. Qual a atitude correta?","","Encostar em local seguro e descansar","Ignorar e continuar","Aumentar o volume do rádio","Abrir a janela e seguir assim mesmo","O cansaço pode ser tão perigoso quanto álcool."],["p1m4q209",4,0,"Paula presenciou um sinistro sem vítimas. Qual é o procedimento correto?","","Retirar o veículo da via, se possível, após registrar as informações","Manter o carro parado no meio da pista","Discutir com o outro motorista antes de qualquer atitude","Ligar o farol alto para sinalizar","Sinistros sem vítima devem ser removidos da via para evitar novos riscos."],["p1m4q210",4,1,"Durante uma tempestade, Bruno percebeu que os limpadores estavam falhando. O que ele deveria ter feito antes?","","Revisado e trocado as palhetas desgastadas","Deixado para arrumar quando algo quebrasse","Usado apenas o desembaçador","Dirigido mais rápido para sair da chuva","Manutenção preventiva evita perda de visibilidade."],["p1m4q211",4,1,"Fernanda viu fumaça saindo do motor após uma batida leve. O que ela deve fazer?","","Afastar-se e não tentar mexer no veículo","Abrir o capô imediatamente","Continuar dirigindo","Soprar a fumaça para ver melhor","Situações com risco de incêndio exigem distanciamento."],["p1m4q212",4,1,"Gustavo esqueceu de calibrar os pneus e, na viagem, notou o carro instável. Qual o erro?","","Não calibrar semanalmente com pneus frios","Parar para calibrar só no fim da viagem","Usar pneus de marcas diferentes","Dirigir em estrada sem ar-condicionado","Pneus mal calibrados aumentam consumo e risco de sinistros."],["p1m4q213",4,1,"Em um sinistro com vítimas, Laura queria ajudar mas pensou em movê-las. Por que não deve?","","Mover pode agravar lesões internas","As vítimas preferem ficar em pé","É proibido por lei","Pode sujar o banco do carro","Movimentação incorreta agrava danos."],["p1m4q214",4,1,"Carlos percebeu que o freio estava fazendo ruído estranho. Qual deve ser sua atitude?","","Procurar um mecânico imediatamente","Usar mais força no pedal","Ignorar até piorar","Usar apenas o freio de mão","Ruídos anormais podem ser sinais de falha grave."],["p1m4q215",4,1,"Luana, ao ver um motociclista caído, pensou em tirar o capacete. Por que isso é errado?","","Retirar o capacete pode agravar lesões no pescoço","O capacete é caro","Pode sujar as mãos","O motociclista pode fugir","Primeiros socorros incluem NÃO retirar capacete."],["p1m4q216",4,1,"Em uma emergência, Rafael tentou ligar para a família antes do socorro. Qual é o procedimento correto?","","Ligar primeiro para os números de emergência","Ligar para amigos","Postar em redes sociais","Gravar um vídeo do sinistro","Acionar o socorro imediatamente é essencial."],["p1m4q217",4,1,"Sofia percebeu que o carro puxava para o lado ao frear. Qual o risco disso?","","Falha no sistema de freios","Pneu muito novo","Combustível de má qualidade","Espelho mal ajustado","Freios assimétricos são extremamente perigosos."],["p1m4q218",4,1,"Cléo percebeu que o para-brisa estava sempre embaçando. O que pode ter faltado?","","Manutenção ou troca das palhetas","Mais velocidade","Dirigir com vidro aberto","Usar água suja no reservatório","Limpadores ruins prejudicam visibilidade."],["p1m4q219",4,2,"Após um sinistro grave, Eduardo tentou retirar uma vítima presa. Por que isso é perigoso?","","Situações complexas exigem equipamentos especializados","Vítimas preferem ficar sozinhas","O carro provavelmente está sem risco","É sempre melhor agir rápido sem pensar","Ação mal orientada pode gerar sequelas graves."],["p1m4q220",4,2,"Beatriz viu cabos elétricos caídos após um sinistro. Qual o comportamento seguro?","","Manter distância e acionar autoridades","Tentar retirar com um galho","Aproximar-se para ver melhor","Chutar o fio para longe","Cenários especiais exigem cautela absoluta."],["p1m4q221",4,2,"Marcos ignorou sinais de sonolência. Por que isso é arriscado?","","Cochilos de 3 segundos equivalem a até 100m sem controle","Porque o carro aquece","Porque gasta mais combustível","Porque a viagem fica chata","Microssono é um dos maiores riscos ao volante."],["p1m4q222",4,2,"Durante um sinistro, André queria filmar antes de ajudar. Por que isso é inadequado?","","Prioriza exposição em vez de segurança","Vídeos são proibidos","O celular estraga fácil","O seguro não aceita vídeos","O foco deve ser salvar vidas, não registrar imagens."],["p1m4q223",4,2,"Uma vítima estava desmaiada e Joice pensou em dar água. Por que isso é perigoso?","","Pode causar engasgo ou aspiração","A água pode estar quente","A vítima pode não gostar","A garrafa pode cair","Vítimas inconscientes não devem ingerir nada."],["p1m4q224",4,2,"Luiz decidiu não revisar o carro antes da viagem. Qual risco isso representa?","","Falhas mecânicas inesperadas podem causar sinistros graves","Pode sujar o carro","Gasta mais combustível","Fica menos confortável","Manutenção preventiva é fundamental."],["p2m1q1",1,0,"A faixa de pedestres, com suas largas listras brancas, concede qual direito ao pedestre?","","A prioridade de travessia, exigindo que os veículos parem.","O direito de atravessar, mas somente quando o semáforo de pedestres estiver verde.","O direito de atravessar apenas se não houver veículos se aproximando.","Direito do pedestre esperar até que não passe mais carro.","A faixa de pedestres garante ao pedestre prioridade absoluta de passagem sobre os veículos ao atravessar a via."],["p2m1q2",1,1,"Qual a função das faixas vermelhas na pavimentação das vias?","","Um espaço exclusivo ou preferencial para a circulação de ciclistas.","Uma área de parada obrigatória para todos os veículos.","Uma faixa de tráfego com velocidade máxima reduzida.","Uma área de cruzamento perigoso que deve ser evitada.","A pintura de faixas vermelhas no asfalto indica faixas exclusivas para ciclistas (ciclovia/ciclofaixa)"],["p2m1q3",1,0,"A placa 'Sentido Proibido' indica que:","R-3","A entrada de veículos naquela via ou faixa é proibida, pois o tráfego flui no sentido contrário.","A velocidade máxima permitida é muito baixa.","Não pode virar à direita ou à esquerda no próximo cruzamento.","A rua não tem saída e será preciso retornar.","A placa \"Sentido Proibido\" indica que os veículos não podem entrar ou trafegar na via naquele sentido."],["p2m1q4",1,0,"Ao ver uma placa amarela com o desenho de uma lombada (quebra-molas), o que o condutor deve fazer?","A-18","Reduzir a velocidade para passar pela alteração no pavimento com segurança e conforto.","Acelerar para passar rapidamente pela lombada(quebra-molas).","Desviar para a outra faixa para evitar a lombada (quebra-molas).","Manter a velocidade, pois a placa é apenas um aviso.","Ao ver uma placa amarela indicando lombada, o condutor deve reduzir a velocidade e ficar atento para passar com segurança e cuidado sobre o obstáculo."],["p2m1q5",1,0,"Ao ver uma placa amarela com o desenho de uma lombada, o que o condutor deve fazer?","A-18","Reduzir a velocidade e passar com atenção.","Acelerar para passar rápido.","Ignorar a placa.","Parar o veículo completamente.","A placa amarela alerta para mudanças nas condições da via, como lombadas ou obstáculos, exigindo redução de velocidade."],["p2m1q6",1,0,"Ao ver uma placa amarela indicando 'Aclive acentuado', qual é a recomendação para um motorista de carro manual?","A-20b","Reduzir a marcha antes de iniciar a subida para não perder força.","Manter a marcha mais alta possível para economizar combustível.","Acelerar ao máximo antes da subida para ganhar impulso.","Acionar o freio de mão levemente para ajudar no controle do veículo.","Aconselhável 'reduzir a marcha antes de iniciar o aclive para não perder força no meio do caminho'."],["p2m1q7",1,1,"As placas brancas com mensagens como 'Use o cinto de segurança' pertencem a qual categoria?","","Placas de Indicação (Educativas)","Placas de Sinalização Temporária","Placas de Advertência","Placas de Regulamentação","Placas brancas com mensagens como \"Use o cinto de segurança\" pertencem à categoria de placas de indicação educativas, que informam ou orientam condutores e pedestres."],["p2m1q8",1,2,"As placas de formato octogonal (oito lados) e triangular invertido são exceções dentro de qual família de placas?","","Placas de Regulamentação","Placas de Advertência","Placas de Sinalização Temporária","Placas de Indicação","As Placas \"Pare\" (octogonal) e \"Dê a Preferência (triângulo invertido) pertencem a família das Placas de Regulamentação. Seus formatos são exceção à regra. As demais placas dessa Família são redondas e das cores vermelha, branca e preta"],["p2m1q9",1,1,"As placas de indicação de cor marrom são utilizadas para sinalizar o quê?","","Atrativos turísticos, como cachoeiras e museus.","Direções e distâncias para outras cidades em rodovias.","Mensagens educativas para um trânsito mais seguro.","Serviços auxiliares, como postos de gasolina e hospitais.","As placas de indicação marrons são dedicadas ao turismo, servem pra indicar pontos próximos ao local, que podem ser de interesse histórico, cultural ou natural"],["p2m1q10",1,1,"As placas de indicação de cor verde são mais comuns em qual tipo de ambiente?","","Em estradas e rodovias para orientar sobre direções, destinos e distâncias.","Próximo a parques e reservas naturais para indicar atrativos turísticos.","Em zonas escolares para reforçar a necessidade de atenção.","Dentro de áreas urbanas para indicar nomes de ruas locais.","As placas verdes são mais comuns em rodovias e vias de circulação rápida, pois servem para orientar e indicar destinos, distâncias e direções."],["p2m1q11",1,0,"As placas de regulamentação, com exceção de duas, possuem formato circular. Quais são essas duas exceções e por que têm formatos distintos?","","PARE' (octogonal) e 'Dê a Preferência' (triângulo invertido), para serem facilmente reconhecíveis.","'Proibido Estacionar' (retangular) e 'Alfândega' (quadrada), devido a convenções internacionais.","'Velocidade Máxima Permitida' (quadrada) e 'Sentido Proibido' (retangular), para destacar sua importância.","'Lombada' (losango) e 'Cruz de Santo André' (formato de X), por indicarem perigos e não regras.","As duas exceções às placas circulares de regulamentação são a placa “PARE”, que tem formato octogonal para ser reconhecida facilmente de longe, e a placa “DÊ A PREFERÊNCIA”, que é triangular invertida para destacar a obrigação de ceder passagem. Esses formatos distintos ajudam a identificar rapidamente a mensagem principal, mesmo sem ler o texto."],["p2m1q12",1,0,"As placas de Regulamentação, que estabelecem regras obrigatórias, são predominantemente de que cores?","","Vermelha, branca e preta","Amarela e preta","Azul e branca","Laranja e preta","As placas de regulamentação são das cores vermelha, branca e preta, sendo a vermelha a cor predominante"],["p2m1q13",1,0,"As placas fixadas ao lado da via como a de 'PARE', pertencem a qual tipo de sinalização?","","Sinalização Vertical","Sinalização Horizontal","Sinalização Semafórica","Dispositivos Auxiliares","As placas instaladas ao lado ou sobre a via para regulamentar, advertir e orientar os usuários do trânsito são classificadas como sinalização vertical"],["p2m1q14",1,0,"De acordo com a hierarquia da sinalização, o que tem mais prioridade: uma placa de 'Velocidade Máxima 60 km/h' ou um semáforo vermelho?","","O semáforo, pois na hierarquia ele está acima das placas.","Nenhum dos dois, o condutor deve usar o bom senso.","Depende do horário, durante a noite a placa prevalece.","A placa, pois ela estabelece uma regra permanente para a via.","O semáforo vermelho tem prioridade, mesmo sobre a placa de “Velocidade Máxima 60 km/h”, pois as ordens do semáforo prevalecem sobre placas e outras sinalizações. Art. 89, CTB."],["p2m1q15",1,1,"Dispositivos como cones, balizadores e tachas refletivas (olho de gato) são classificados como qual tipo de sinalização?","","Dispositivos Auxiliares","Sinalização Vertical","Sinalização Horizontal","Sinalização Cicloviária","Os dispositivos auxiliares são “ajudantes físicos” que complementam e reforçam a sinalização, como postes, tachas refletivas e balizadores na pista."],["p2m1q16",1,1,"É permitido transitar em uma faixa exclusiva de ônibus de transporte público?","","Não, é uma infração gravíssima e o condutor deve respeitar a sinalização.","Sim, se for apenas por poucos metros para fazer uma conversão.","Sim, se o trânsito nas outras faixas estiver completamente parado.","Sim, fora do horário de pico, quando não há muito ônibus circulando.","Essa conduta é infração gravíssima e o condutor deve observar e respeitar a sinalização. Art. 184, inciso III do CTB"],["p2m1q17",1,1,"Na sinalização horizontal, o que linhas contínuas amarelas pintadas no centro da pista indicam?","","Separação de fluxos em sentidos opostos, com ultrapassagem proibida para ambos os lados.","Permissão para ultrapassagem para ambos os sentidos.","Separação de fluxos no mesmo sentido, com ultrapassagem proibida.","Área exclusiva para a circulação de bicicletas.","Na sinalização horizontal, a cor amarela indica fluxos em sentidos opostos e a linha contínua significa que a ultrapassagem é proibida. MBST, volume IV"],["p2m1q18",1,0,"Na sinalização horizontal, qual é a função da linha de retenção?","","Mostrar o local limite onde o veículo deve parar, antes de um semáforo ou placa 'PARE'.","Separar faixas de tráfego que seguem em sentidos opostos.","Delimitar a área onde os pedestres devem atravessar a rua.","Indicar o local exato onde é permitido ultrapassar outro veículo.","A linha de retenção é uma faixa grossa pintada no chão que mostra o ponto onde o veículo deve parar completamente, antes dela, em locais de parada obrigatória, como cruzamentos. MBST, volume IV"],["p2m1q19",1,0,"O que a cor laranja em uma placa de sinalização geralmente indica?","","Uma condição temporária na via, como obras ou desvios.","A proximidade de um ponto turístico de interesse histórico.","Uma área com grande fluxo de pedestres e ciclistas.","Uma regra de trânsito que se aplica apenas durante a noite.","A cor laranja é usada nas sinalizações temporárias porque é bem visível e indica que há uma mudança nas condições normais da via, como obras ou serviços na pista."],["p2m1q20",1,0,"O que indica uma linha contínua amarela pintada no centro de uma pista?","","Que a ultrapassagem e o retorno são proibidos naquele trecho.","Que a via é de mão única.","Que é uma área exclusiva para pedestres.","Que a ultrapassagem é permitida para ambos os sentidos.","A linha contínua funciona como uma barreira visual, indicando que cruzar para a outra faixa é proibido e perigoso."],["p2m1q21",1,0,"O que o motorista deve fazer ao se deparar com a luz amarela do semáforo?","","Reduzir a velocidade e se preparar para parar antes da faixa de retenção.","Parar imediatamente, mesmo que esteja no meio do cruzamento.","Acelerar para conseguir passar antes que o sinal fique vermelho.","Continuar com a mesma velocidade, pois a preferência ainda é sua.","A luz amarela significa \"atenção\", indicando que o sinal ficará vermelho em breve e o condutor deve se preparar a parada obrigatória"],["p2m1q22",1,2,"O que são 'marcas de canalização' na sinalização horizontal?","","Faixas brancas diagonais que organizam o fluxo, separando ou direcionando os veículos.","A linha grossa branca antes do semáforo onde os carros devem parar.","As faixas brancas que delimitam vagas de estacionamento.","As setas pintadas no chão que indicam a direção de cada faixa.","As marcas de canalização são linhas e símbolos pintados no chão que orientam o fluxo de veículos, indicando faixas, desvios ou separações de pistas para organizar o trânsito, e não devem ser ultrapassadas ou trafegadas, pois delimitam o espaço de circulação e mantêm a segurança."],["p2m1q23",1,1,"O que significa uma linha dupla na pista, sendo a linha do seu lado contínua e a outra tracejada?","","A ultrapassagem é permitida apenas para os veículos no sentido oposto.","A ultrapassagem é proibida para ambos os sentidos de tráfego.","A ultrapassagem é permitida apenas para o seu sentido de tráfego.","A ultrapassagem é permitida para ambos os sentidos de tráfego.","Em uma pista dupla com linha contínua e tracejada, vale a regra: se a linha contínua está do seu lado, você não pode ultrapassar"],["p2m1q24",1,1,"Qual é a atitude correta de um bom condutor ao ver o sinal de trânsito ficar amarelo?","","Reduzir a velocidade e se preparar para parar com segurança antes da faixa.","Acelerar para aproveitar o 'último segundo' e não ter que parar.","Buzinar para avisar o carro de trás que você vai parar.","Frear bruscamente, mesmo que tenha espaço para parar com calma.","Esta é a conduta do motorista consciente, que entende que o amarelo é um aviso para parar, não para acelerar."],["p2m1q25",1,0,"Qual é a função das setas direcionais pintadas no chão?","","Indicar a direção obrigatória que cada faixa de tráfego segue.","Avisar sobre a proximidade de um retorno na via.","Alertar para a presença de ciclistas compartilhando a via.","Sugerir as melhores rotas para evitar congestionamentos.","As setas direcionais pintadas no chão indicam a direção obrigatória que os veículos devem seguir em cada faixa. MBST Vol. IV"],["p2m1q26",1,2,"Qual é a principal característica das sinalizações temporárias?","","Sua cor laranja e sinaliza que há um evento ou obra no caminho, caracteriza-se por não ser permanente.","Ela utiliza exclusivamente dispositivos luminosos, como semáforos.","Ela só é válida durante o dia.","É sempre acompanhada por um agente de trânsito.","A principal característica da sinalização temporária é que ela indica mudanças nas condições normais da via, como obras ou desvios, e pode ser removida ou alterada conforme a situação. MBST Vol. VII"],["p2m1q27",1,0,"Qual é a principal diferença entre a placa 'Proibido Estacionar' e 'Proibido Parar e Estacionar'?","","Em 'Proibido Estacionar' é permitida uma parada rápida para embarque/desembarque, enquanto na outra, nem isso é permitido.","Não há diferença, ambas proíbem completamente a imobilização do veículo.","Uma se aplica a carros e a outra a motocicletas.","'Proibido Estacionar' é uma recomendação, enquanto 'Proibido Parar e Estacionar' é uma ordem.","Em \"Proibido Estacionar\" é permitida uma parada rápida para embarque e desembarque (E com um corte diagonal), mas o condutor não pode deixar o veículo estacionado"],["p2m1q28",1,0,"Qual é a principal função das placas de advertência, como a que indica 'Curva Acentuada'?","","Alertar sobre perigos e situações especiais à frente na via.","Educar o motorista sobre comportamento seguro.","Ordenar a parada imediata do veículo.","Informar a distância até a próxima cidade.","As placas de advertência servem para avisar como antecedência sobre condições que exigem atenção, como curvas à frente ou lombadas"],["p2m1q29",1,2,"O que a sinalização cicloviária, com faixas vermelhas e símbolos de bicicleta, indica?","","Indicar um espaço prioritário ou exclusivo para a circulação de ciclistas, que deve ser respeitado pelos motoristas.","Indicar áreas onde o trânsito de bicicletas é proibido devido ao alto fluxo de carros.","Alertar os ciclistas de que eles estão entrando em uma via compartilhada sem preferência definida.","Que os ciclistas devem ceder a preferência aos veículos motorizados nessas áreas.","A sinalização cicloviária, como faixas vermelhas e símbolos de bicicleta, indica áreas exclusivas para ciclistas e orienta sua circulação, garantindo segurança do ciclista e separação do tráfego de veículos motorizados. MBST Vol. IV"],["p2m1q30",1,0,"Qual é a principal razão para que a placa 'PARE' tenha um formato octogonal único?","","Para ser facilmente reconhecida, mesmo que vista de costas ou parcialmente coberta.","Para diferenciar as paradas obrigatórias em áreas rurais e urbanas.","Para indicar que a parada é uma sugestão e não uma ordem.","Para economizar material na sua fabricação.","O formato octogonal da placa \"PARE\" é único para que seja facilmente reconhecida à distância, garantindo que o condutor identifique imediatamente a obrigação de parar."],["p2m1q31",1,0,"Qual é o principal objetivo da sinalização de trânsito no Brasil?","","Tornar o trânsito mais seguro, organizado e previsível para todos os usuários da via.","Aumentar a arrecadação de multas para os municípios e estados.","Decorar as ruas e estradas com placas e pinturas coloridas.","Testar a habilidade e atenção dos motoristas em situações complexas.","A sinalização existe para organizar o trânsito e garantir a segurança, funcionando como uma linguagem universal"],["p2m1q32",1,0,"Qual tipo de calçado é considerado inadequado e perigoso para a condução de um veículo?","","Chinelos e calçados que não ficam firmes nos pés.","Botas de cano longo.","Sapatos fechados.","Tênis com solado grosso.","Este tipo de calçado pode escapar dos pés, enroscar nos pedais e comprometer seriamente a segurança da condução."],["p2m1q33",1,1,"Quando a sinalização horizontal apresenta uma linha branca seccionada (tracejada), o que isso significa?","","Separa fluxos no mesmo sentido e a ultrapassagem é permitida, se houver segurança.","É uma área onde é proibido parar e estacionar.","Separa fluxos de sentidos opostos e a ultrapassagem é proibida.","Indica a aproximação de uma faixa de pedestres.","A linha branca tracejada separa faixas de mesmo sentido e indica que o condutor pode trocar de faixa ou ultrapassar, desde que seja seguro, respeitando os limites de velocidade e atenção ao trânsito ao redor."],["p2m1q34",1,0,"Quando um motorista encontra a palavra 'PARE' escrita no chão, qual é a sua relação com a placa vertical de 'PARE'?","","Ela reforça a mensagem da placa de 'PARE', indicando a mesma ordem de parada obrigatória.","A palavra no chão indica que a parada é opcional, enquanto a placa a torna obrigatória.","A marcação no chão substitui a placa, tendo maior prioridade na hierarquia.","É uma marcação para pedestres, indicando onde eles devem parar antes de atravessar.","A palavra \"PARE\" pintada no chão reforça a placa vertical de “PARE”, indicando o ponto exato onde o veículo deve parar completamente."],["p2m1q35",1,1,"Se um semáforo em uma passagem de trem começar a piscar em vermelho, o que isso significa?","","Que um trem está se aproximando e a travessia deve ser interrompida imediatamente.","Que a passagem está livre e os carros podem cruzar a ferrovia.","Que o semáforo está com defeito e o motorista deve passar com cuidado.","Que apenas veículos pesados, como caminhões, devem parar.","Se o semáforo em uma passagem de trem começar a piscar em vermelho, significa que os veículos devem parar e aguardar a passagem do trem, pois a travessia não está segura."],["p2m1q36",1,0,"Se você estiver em um cruzamento onde o semáforo está verde, mas um agente de trânsito sinaliza para você parar, qual instrução você deve seguir?","","A do agente de trânsito, pois suas ordens prevalecem sobre todas as outras sinalizações.","A da placa de 'PARE', se houver uma no cruzamento.","Nenhuma, deve-se usar a regra geral de preferência da direita.","A do semáforo, pois é um equipamento eletrônico e mais preciso.","Você deve obedecer ao agente, pois ele tem a maior autoridade no trânsito: vem antes do semáforo, das placas e das marcas pintadas no chão."],["p2m1q38",1,0,"Um semáforo está verde, mas um agente de trânsito sinaliza para você parar. Qual instrução deve ser seguida?","","Parar imediatamente, pois o agente tem prioridade.","Seguir o semáforo.","Acelerar para atravessar antes do agente.","Ignorar e continuar.","As instruções do agente de trânsito têm prioridade sobre semáforos, placas e outras sinalizações, garantindo segurança e controle do fluxo."],["p2m1q39",1,0,"Você encontra uma placa circular branca com borda vermelha e o número 60. O que significa?","R-19","Velocidade máxima permitida: 60 km/h.","Velocidade mínima de 60 km/h.","Distância de 60 metros até a próxima curva.","Faixa exclusiva para veículos que trafegam a 60 km/h.","Placas circulares com borda vermelha indicam regulamentações obrigatórias"],["p2m1q40",1,0,"Você está dirigindo e vê uma placa de regulamentação com o símbolo de um 'E' cortado por uma faixa vermelha. O que essa placa permite?","R-6a","Permite uma parada rápida para embarque e desembarque, mas proíbe estacionar o veículo no local.","Não permite nenhuma forma de imobilização do veículo, nem mesmo por um instante.","Permite estacionar, mas proíbe a parada rápida para embarque e desembarque.","Indica que o estacionamento é exclusivo para um determinado tipo de veículo.","Uma placa de regulamentação com o símbolo de um “E” cortado por uma faixa vermelha indica “Proibido Estacionar”, permitindo apenas paradas rápidas para embarque e desembarque, mas não permite estacionar o veículo."],["p2m1q41",1,0,"Você vê uma placa amarela com o desenho de pessoa atravessando. O que ela significa?","A-32b","Faixa de pedestres, respeite a prioridade.","Indica que não há pedestres na área.","Permite que veículos passem sem reduzir velocidade.","Apenas alerta sobre ciclovia.","Placas de advertência alertam sobre locais onde há maior atenção necessária"],["p2m2q1",2,0,"A atitude de seguir um veículo de emergência (ambulância, bombeiros) para aproveitar o caminho livre é considerada:","","Uma infração de trânsito.","Uma estratégia permitida em caso de congestionamento.","Permitida, desde que se mantenha uma distância segura.","Uma atitude de bom senso para liberar a via mais rápido.","Essa conduta é irregular e perigosa. Infração do artigo 190 do CTB"],["p2m2q2",2,2,"Ameaçar pedestres que atravessam a via ou outros veículos é uma infração de que tipo?","","Gravíssima","Grave","Média","Leve","Art. 170 do CTB"],["p2m2q3",2,1,"Avançar o sinal vermelho é uma infração gravíssima. Quantos pontos são adicionados à CNH do condutor por essa atitude?","","7 pontos.","3 pontos.","5 pontos.","4 pontos.","As infrações gravíssimas, que representam o maior risco, recebem a pontuação máxima. Art. 259, inciso I do CTB"],["p2m2q4",2,0,"Dirigir com a CNH vencida há mais de 30 dias é considerado qual tipo de infração?","","Gravíssima","Média","Grave","Leve","Dirigir sem estar devidamente habilitado (o que inclui CNH vencida) representa um risco imediato e elevado. Art. 162, inciso V do CTB"],["p2m2q5",2,1,"Dirigir com o som do carro excessivamente alto, perturbando o sossego público, é uma infração de qual gravidade?","","Grave.","Não é uma infração de trânsito, mas sim uma contravenção penal.","Média.","Leve.","Além de ser uma falta de respeito, o som alto é considerado uma infração de alto risco social, com multa e possibilidade de retenção do veículo. Art. 228 do CTB"],["p2m2q6",2,1,"Dirigir com uma lâmpada do farol queimada é considerado uma infração de qual natureza?","","Média, pois representa risco à segurança por falta de visibilidade.","Leve, pois a outra lâmpada ainda funciona.","Não é uma infração, mas o motorista deve consertar assim que possível.","Grave, pois é um equipamento obrigatório.","Uma lâmpada queimada é um exemplo de infração média, que pode colocar a vida do condutor em risco. Art. 230, inciso XXII do CTB"],["p2m2q7",2,0,"Durante o período da Permissão Para Dirigir , qual combinação de infrações resultará na perda do direito de obter a CNH definitiva?","","Ser reincidente em uma infração de natureza média.","Cometer uma única infração de natureza média.","Cometer duas infrações de natureza leve em um ano.","Não cometer infração.","O condutor em período de permissão não pode ser reincidente em infrações médias, além de não poder cometer infrações graves ou gravíssimas."],["p2m2q8",2,0,"Durante o período de validade da Permissão Para Dirigir, qual tipo de infração o condutor NÃO pode cometer para obter a CNH definitiva?","","Cometer infração grave ou gravíssima.","Ser autuado por excesso de velocidade de até 20% acima do limite.","Cometer qualquer infração de natureza leve.","Receber duas multa leves.","Art. 148, §§ 3º e 4º do CTB"],["p2m2q9",2,1,"Estacionar em uma vaga reservada para idosos ou pessoas com deficiência sem possuir a devida credencial é uma infração:","","Gravíssima, por ser uma falta de respeito e desrespeito à lei de acessibilidade.","Leve, se for 'apenas 5 minutinhos'.","Grave, pois dificulta a mobilidade de outras pessoas.","Média, pois apenas atrapalha o acesso.","O uso indevido dessas vagas é uma das infrações mais severas por seu impacto social e desrespeito a um direito."],["p2m2q10",2,1,"É permitido estacionar o veículo no sentido contrário ao fluxo da via, ainda que esteja corretamente alinhado à calçada?","","Não, é uma infração de trânsito média, pois pode confundir outros condutores.","Não, mas é considerado apenas uma infração leve.","Sim, se não houver placa proibindo.","Sim, desde que seja durante a noite, quando o trânsito é menor.","Essa prática é uma infração pois surpreende outros motoristas e vai contra o fluxo da via."],["p2m2q11",2,1,"Estacionar sobre uma calçada ou ciclovia é uma infração de qual gravidade?","","Grave","Leve","Média","Gravíssima","Desrespeitar o espaço exclusivo de pedestres e ciclistas, colocando-os em risco, é classificado como uma infração de alto perigo."],["p2m2q12",2,1,"Fazer manobras perigosas como 'empi
