nar' a moto em via pública é considerado:","","Uma infração gravíssima e também pode ser considerada crime de trânsito.","Uma infração leve, pois não causa danos diretos a ninguém.","Apenas uma infração grave, com multa de valor moderado.","Uma demonstração de habilidade, permitida se não houver outros veículos por perto.","Essas manobras são infrações gravíssimas e, quando geram situação de risco, podem configurar crime. Art. 244, inciso III"],["p2m2q13",2,2,"Fugir do local de um sinistro para evitar a responsabilidade é considerado o que pela lei de trânsito?","","Um crime de trânsito, com pena de detenção ou multa.","Uma infração grave, com multa e pontos na CNH.","Uma infração média, se ninguém ficou ferido.","Uma atitude moralmente errada, mas sem punição legal específica.","O Código de Trânsito Brasileiro tipifica a fuga do local do sinistro como crime, pois demonstra a intenção de não arcar com as responsabilidades."],["p2m2q14",2,0,"Não usar o cinto de segurança, seja no banco da frente ou de trás, é classificado como qual tipo de infração?","","Grave","Leve","Média","Gravíssima","O CTB classifica essa infração como grave."],["p2m2q15",2,2,"Qual o limite de pontos em 12 meses para o condutor que não tem nenhuma infração gravíssima?","","40 (quarenta) pontos.","20 (vinte) pontos.","30 (trinta) pontos.","19 (dezenove) pontos.","Conforme o Art. 261, Inciso I, alínea 'c' do CTB, a penalidade de suspensão do direito de dirigir será imposta quando o infrator atingir 40 (quarenta) pontos no período de 12 meses, caso não conste nenhuma infração gravíssima na pontuação."],["p2m2q16",2,0,"O que pode acontecer se você não pagar uma multa de trânsito dentro do prazo?","","O veículo pode ficar com restrições no licenciamento, impedindo sua circulação e transferência.","O valor da multa é descontado diretamente do seu salário.","Você perde pontos na CNH, mas não precisa pagar a multa.","A multa é perdoada automaticamente após um ano.","Conforme dispõe o Art. 131, § 2º do CTB, multas não pagas impedem a regularização do veículo e acumulam juros."],["p2m2q17",2,2,"Para um motociclista, qual é a infração por pilotar com a viseira do capacete levantada?","","Infração média","Infração leve","Não é uma infração","Infração gravíssima","Pilotar sem a proteção dos olhos (viseira ou óculos) é uma infração média. Art. 244, inciso X"],["p2m2q18",2,1,"Por que é proibido estacionar a menos de 5 metros de uma esquina?","","Porque atrapalha a visão dos motoristas, dificulta manobras, além de ser uma infração de trânsito.","Porque a prefeitura costuma instalar lixeiras nesse local.","Porque é um espaço reservado para carga e descarga.","Porque essa área é de uso exclusivo dos pedestres.","Estacionar na esquina prejudica a visibilidade no cruzamento, aumentando o risco de sinistros. Art. 181, inciso I"],["p2m2q19",2,0,"Qual atitude pode transformar uma infração de trânsito em um crime de trânsito?","","Dirigir sob efeito de álcool acima do limite previsto em lei.","Não pagar a multa de trânsito dentro do prazo de vencimento.","Estacionar em local proibido por mais de duas horas.","Receber mais de três multas gravíssimas no mesmo ano.","Quando o comportamento do condutor é tão perigoso que ultrapassa a esfera administrativa, como dirigir embriagado, ela se torna um crime."],["p2m2q20",2,0,"Qual das atitudes a seguir pode ser considerada um crime de trânsito?","","Participar de 'racha' ou exibição perigosa em via pública.","Transitar pela faixa exclusiva de ônibus.","Estacionar em fila dupla para um desembarque rápido.","Fugir do pagamento do pedágio.","Competições ilegais e manobras arriscadas geram um risco tão alto que são tipificadas como crime, com pena de detenção."],["p2m2q21",2,2,"Qual das seguintes ações é classificada como uma infração de gravidade média?","","Transitar em velocidade até 20% superior à máxima permitida.","Avançar o sinal vermelho do semáforo.","Não usar o cinto de segurança.","Estacionar o veículo afastado um pouco da guia.","O excesso de velocidade nesta faixa representa um risco moderado, de acordo com a classificação do sistema de trânsito."],["p2m2q22",2,1,"Qual das seguintes ações representa uma infração de trânsito grave e um risco ambiental relacionado à poluição sonora e do ar?","","Circular com o carro fazendo barulho pelo escapamento e soltando fumaça preta e excessiva.","Dirigir com as palhetas do limpador de para-brisa gastas.","Utilizar o farol alto em vias iluminadas, ofuscando outros motoristas.","Não realizar o rodízio de pneus a cada 10 mil km.","A fumaça preta indica problemas no motor, alta emissão de poluentes e constitui uma infração de trânsito grave."],["p2m2q23",2,2,"Qual é a classificação da infração de um motociclista que pilota sem usar o capacete?","","Gravíssima, com multa e suspensão do direito de dirigir.","Leve, se for em um trajeto curto dentro do bairro.","Grave, com multa e retenção da moto.","Média, se estiver em baixa velocidade.","A falta do principal equipamento de segurança para motociclistas é uma das infrações mais perigosas e acarreta, além da multa, a suspensão da CNH."],["p2m2q24",2,0,"Qual é a classificação da infração por deixar de usar a seta para indicar uma mudança de faixa?","","Grave","Média","Leve","Gravíssima","A seta é um sistema de comunicação essencial, e não usá-la coloca outros em alto risco ao criar uma situação imprevisível."],["p2m2q25",2,0,"Qual é a classificação da infração por não dar passagem a um veículo de emergência com sirene e luzes ligadas?","","Gravíssima.","Leve, se o motorista não percebeu a tempo.","Média, pois é uma questão de gentileza.","Grave, pois atrapalha o trânsito.","Deve ser dada prioridade aos veículos de emergência."],["p2m2q26",2,0,"Qual é a gravidade da infração de transitar pelo acostamento?","","Gravíssima, com multa multiplicada por 3.","Grave, com multa e 5 pontos.","Leve, pois não interfere na faixa de rolamento.","Média, se for por um trecho curto.","Utilizar o acostamento para obter vantagem no trânsito gera um alto risco de sinistros e é punido com severidade."],["p2m2q27",2,0,"Qual é a gravidade da infração por desobedecer às ordens de um agente de trânsito?","","Grave.","Gravíssima.","Média, se a desobediência não causar um sinistro.","Leve, pois o agente pode apenas dar uma advertência verbal.","A autoridade do agente é fundamental para a segurança, e desrespeitá-la é uma infração de alto risco."],["p2m2q28",2,2,"Qual o limite de pontos na CNH, em um período de 12 meses, para um condutor que não cometeu nenhuma infração gravíssima?","","40 pontos.","50 pontos.","20 pontos.","30 pontos.","Conforme o art. 261, Inciso I, alínea 'c' do CTB, a penalidade de suspensão do direito de dirigir será imposta quando o infrator atingir 40 (quarenta) pontos no período de 12 meses, caso não conste nenhuma infração gravíssima na pontuação."],["p2m2q29",2,2,"Quando um agente de trânsito retém o veículo no local da fiscalização, qual tipo de consequência está sendo aplicada?","","Medida Administrativa","Crime de Trânsito","Pontuação na Carteira","Penalidade","Esta é a ação imediata realizada pelo agente no momento da fiscalização para impedir que o perigo continue."],["p2m2q30",2,0,"Quando uma infração de trânsito, como dirigir alcoolizado, se torna também um crime de trânsito?","","Quando o comportamento é tão grave que ultrapassa a esfera administrativa, como atingir um certo limite no bafômetro.","Sempre que o motorista é parado em uma blitz.","Infrações de trânsito e crimes de trânsito são a mesma coisa.","Apenas se o motorista causar um sinistro com vítimas","O crime ocorre quando a conduta é tão perigosa que a lei prevê processo criminal, como ao exceder 0,3 mg/L no etilômetro (bafômetro)."],["p2m2q31",2,0,"Quantos pontos são somados na CNH por uma infração de natureza Leve?","","3 pontos","7 pontos","4 pontos","5 pontos","Infrações leves, que geram menor risco imediato, resultam nesta pontuação."],["p2m2q32",2,0,"Transportar uma criança sem o dispositivo de retenção adequado (bebê-conforto, cadeirinha, etc.) é uma infração de qual natureza?","","Gravíssima","Leve","Grave","Média","A vulnerabilidade de uma criança em um sinistro torna essa infração uma das mais perigosas, sendo punida com a máxima severidade."],["p2m2q33",2,1,"Um motorista joga uma lata de refrigerante pela janela do carro. Além de ser uma falta de educação, como essa atitude é classificada pela legislação?","","Como uma infração de trânsito média e um ato que prejudica o meio ambiente.","Como uma atitude inadequada, mas que não gera nenhuma penalidade.","Como uma infração leve, pois não coloca a vida de ninguém em risco.","Como uma infração grave, com a mesma penalidade de furar um sinal vermelho.","Jogar lixo pela janela é classificado como infração média, além de ser um crime ambiental que contribui para a poluição das cidades e entupimento de bueiros. Art. 172 do CTB"],["p2m2q34",2,0,"Um motorista que ultrapassa o limite de velocidade em mais de 50% comete uma infração gravíssima que resulta em:","","Multa multiplicada por 3 e suspensão do direito de dirigir.","Multa multiplicada por 5 e cassação da CNH.","Apenas multa com valor normal e 7 pontos na CNH.","Apenas a suspensão do direito de dirigir.","Esta combinação de penalidades é aplicada para esse nível de excesso de velocidade, refletindo o alto risco da conduta."],["p2m3q1",3,1,"Qual a finalidade de se manter uma distância mínima de 2 metros em relação ao veículo que segue à frente?","","Espaço suficiente para frear com segurança em caso de imprevisto.","Uma melhor aerodinâmica e economia de combustível.","Visibilidade dos semáforos e placas de trânsito.","Que o motorista da frente não se sinta pressionado.","Este tempo/distância permite que o motorista perceba o perigo, reaja e acione os freios sem colidir com o veículo à frente."],["p2m3q2",3,0,"Além de enxergar bem ao dirigir, ser visto pelos outros depende de:","","Faróis e lanternas limpos e funcionando.","Faróis apagados para não “incomodar”.","Películas escuras no para-brisa.","Seta desligada para surpresa.","É muito perigoso dirigir sem esses equipamentos ligados, acione seus fárois e lanternas para segurança de todos."],["p2m3q3",3,0,"Ao dirigir em uma estrada de terra, qual comportamento é essencial para manter a segurança e o controle do veículo?","","Aumentar a distância do veículo da frente e reduzir a velocidade.","Dirigir com as mãos relaxadas no volante para sentir melhor o terreno.","Manter a mesma velocidade de uma rodovia asfaltada para evitar que o carro 'flutue'.","Frear bruscamente antes das curvas para garantir a máxima aderência.","A poeira levantada pelo veículo da frente prejudica a visibilidade e a menor aderência do piso exige mais espaço para frenagem, tornando essas duas ações cruciais."],["p2m3q4",3,1,"Ao dirigir em uma rodovia durante o dia, qual procedimento relacionado à iluminação do veículo é recomendado?","","Manter o farol baixo sempre aceso.","Ligar o farol alto para ser visto de longe.","Usar apenas as luzes de neblina.","Não é necessário usar os faróis durante o dia.","Esta prática aumenta a visibilidade do seu veículo para os outros condutores, mesmo sob a luz do sol."],["p2m3q5",3,0,"Ao realizar uma conversão à direita, como o motorista deve posicionar o veículo antes de iniciar a manobra?","","O mais próximo possível do bordo direito da via.","O mais próximo possível do bordo esquerdo da via.","No meio da faixa, para ter mais espaço de manobra.","O mais próximo possível do eixo central da via.","Esta posição impede que outros veículos passem pela direita e indica claramente a intenção de virar."],["p2m3q6",3,1,"Ao realizar uma conversão à esquerda em uma via de mão dupla, qual o posicionamento correto a ser adotado antes de iniciar a conversão?","","Aproximar-se do eixo central da via, sem invadir a contramão.","Aproximar-se do bordo direito da pista.","Invadir a pista contrária para ter mais espaço na curva.","Manter-se no centro da faixa de rolamento.","Este posicionamento sinaliza corretamente a intenção de virar à esquerda e organiza o fluxo de quem segue em frente."],["p2m3q7",3,1,"Ao sair de uma rodovia, quando o condutor deve começar a reduzir a velocidade?","","Somente após ter entrado completamente na faixa de desaceleração.","Assim que avistar a placa indicando a saída.","Ainda na pista principal, antes de entrar na faixa de desaceleração.","Apenas no final da faixa de desaceleração, freando bruscamente.","A faixa de desaceleração existe justamente para que a redução de velocidade seja feita fora do fluxo principal, com segurança."],["p2m3q8",3,0,"Ao se deparar com uma rotatória, quem tem a preferência de passagem?","","O veículo que já está circulando dentro dela.","O veículo que está entrando na rotatória.","O veículo que vem pela direita, mesmo que vá entrar na rotatória.","O veículo maior ou mais rápido.","Para manter a fluidez e a segurança, a prioridade é sempre de quem já está realizando a manobra circular."],["p2m3q9",3,0,"Após uma pequena colisão em uma avenida movimentada que resultou apenas em para-choques amassados, sem feridos, o que os condutores devem fazer prioritariamente?","","Retirar os veículos para um local seguro, como o acostamento, para liberar o fluxo de trânsito e evitar novos sinistros.","Iniciar a troca de informações e acionar o seguro antes de mover os carros do local.","Deixar os carros na posição da batida e aguardar a chegada da polícia para fazer o registro.","Ligar imediatamente para o SAMU (192), mesmo que ninguém aparente estar machucado.","A legislação determina que, em casos de sinistro apenas com danos materiais, os veículos devem ser removidos para garantir a segurança e a fluidez da via."],["p2m3q10",3,2,"As defensas metálicas instaladas nas margens de pontes e curvas perigosas são um exemplo de quê?","","Dispositivo auxiliar","Sinalização temporária","Sinalização Horizontal","Sinalização vertical","As defensas metálicas são um exemplo de dispositivos auxiliares, elementos físicos que compõem a sinalização projetado para proteger veículos e reduzir a gravidade de colisões em pontes e curvas perigosas."],["p2m3q11",3,0,"Até que a criança atinja 1,45 m de altura, em qual local do veículo ela deve ser transportada?","","No banco traseiro, utilizando o dispositivo de retenção adequado.","No banco traseiro, no colo de um adulto.","No banco dianteiro, se estiver usando assento de elevação.","Em qualquer assento, desde que use o cinto de segurança do veículo","A legislação determina que o transporte seja feito no banco traseiro com o equipamento de segurança correto para a idade, peso e altura."],["p2m3q12",3,1,"É permitido levar passageiros na caçamba de uma caminhonete?","","Não, pois oferece alto risco de queda e lesões graves, além de ser uma infração gravíssima.","Sim, se todos os passageiros estiverem sentados e segurando firmemente.","Apenas em áreas rurais, onde não há fiscalização.","Sim, desde que seja em baixa velocidade e em trajetos curtos.","Art. 230, inciso II do CTB"],["p2m3q13",3,1,"Em um cruzamento não sinalizado entre duas vias de mesmo porte, qual veículo tem a preferência?","","O veículo que estiver à direita do condutor.","O veículo que for maior.","O veículo que buzinar.","Os dois têm preferência.","Esta é a 'regra da direita', fundamental para a organização do trânsito em cruzamentos sem sinalização específica. Art. 215, inciso I, alínea b"],["p2m3q14",3,0,"Em uma situação onde não há nenhuma sinalização, qual regra geral de preferência deve ser aplicada?","","A preferência é do veículo que se aproxima pela direita do condutor.","A preferência é do veículo que está trafegando em maior velocidade.","A preferência é do veículo que está na via da esquerda.","A preferência é do veículo maior.","Em um cruzamento não sinalizado, a regra geral é dar preferência a quem vem da direita."],["p2m3q15",3,1,"Qual é a principal finalidade do uso da buzina, segundo os princípios da direção defensiva e comunicação no trânsito?","","Alertar outros usuários da via sobre um perigo iminente ou sua presença para evitar um sinistro.","Cumprimentar pedestres ou outros motoristas conhecidos.","Apressar o motorista da frente quando o semáforo abre.","Expressar irritação com uma manobra incorreta de outro condutor.","O Código de Trânsito prevê o uso da buzina em toques breves para fazer as advertências necessárias a fim de evitar sinistros."],["p2m3q16",3,0,"O que o condutor deve fazer ao perceber um pedestre atravessando fora da faixa?","","Reduzir a velocidade e manter a atenção redobrada.","Ignorar e seguir, pois o pedestre está errado.","Buzinar para advertir.","Frear bruscamente.","Mesmo fora da faixa, a vida tem prioridade. O condutor deve reduzir e manter a atenção, pois o pedestre é o mais vulnerável no trânsito."],["p2m3q17",3,0,"O que significa ver e ser visto na direção defensiva?","","Tornar-se visível e estar atento aos demais usuários da via.","Manter o carro limpo e bonito.","Dirigir apenas de dia.","Usar o farol alto o tempo todo.","“Ver e ser visto” é um princípio da direção defensiva que busca garantir que o condutor perceba os outros e seja percebido, prevenindo sinistros."],["p2m3q18",3,1,"O que significa dizer que, no trânsito, o motorista precisa estar sempre atento?","","Que tudo o que o motorista faz ou deixa de fazer gera um resultado, seguro ou perigoso.","Que as regras de trânsito são subjetivas e cada um interpreta de um jeito.","Que dirigir é uma atividade automática que não exige muitas decisões.","Que todas as decisões são punidas com multa.","Cada ação, como uma freada brusca ou uma pequena distração, tem uma consequência direta na segurança."],["p2m3q19",3,0,"O que significa ser um bom motorista?","","Seguir as regras de trânsito.","Dirigir rapidamente para não atrapalhar o trânsito.","Conhecer atalhos para chegar mais rápido ao destino.","Ter um carro novo todo ano.","Seguir as regras é o compromisso fundamental que o condutor assume para proteger vidas."],["p2m3q20",3,0,"O que um motorista deve fazer imediatamente ao ouvir a sirene e ver as luzes de uma ambulância se aproximando?","","Reduzir a velocidade e deslocar-se para a faixa da direita para liberar a passagem.","Parar bruscamente no meio da pista onde está.","Continuar no mesmo ritmo e esperar que a ambulância desvie.","Acelerar e não deixar ela passar.","O procedimento correto é facilitar a passagem do veículo de emergência de forma segura, movendo-se para a direita."],["p2m3q21",3,0,"Por que ver e ser visto é essencial no trânsito?","","Porque se você não vê ou não é visto, o risco de sinistro aumenta.","Porque melhora apenas o conforto do motorista.","Porque serve só para rodovias.","Porque evita gastar com manutenção.","Uma atitude simples que evita sinistros de trânsito, ligar o sistema de iluminação do veículos (faróis e lanternas)"],["p2m3q22",3,1,"Por que a palavra 'acidente' foi substituída por 'sinistro' no trânsito?","","Para indicar que a grande maioria desses eventos é evitável e não fruto do acaso.","Para padronizar a linguagem com as companhias de seguro.","Porque 'acidente' só se aplica a rodovias.","Porque a palavra 'acidente' se aplica apenas a eventos sem vítimas fatais.","A mudança de terminologia reforça a ideia de que esses eventos são consequência de escolhas e comportamentos, e não fatalidades inevitáveis."],["p2m3q23",3,1,"Crianças menores de 10 anos podem ser transportadas em motocicletas?","","Sim, desde que tenham condições de cuidar de sua própria segurança","Não, pois a lei de trânsito proíbe o transporte de qualquer passageiro em motos.","Não, porque coloca em risco a criança.","Não, porque o capacete infantil é difícil de encontrar para comprar.","Além de ser infração gravíssima com multa e suspensão do direito de dirigir. Art. 244, § 1º, alínea c"],["p2m3q24",3,0,"Por que é importante não realizar o ziguezague entre as faixas de trânsito?","","Porque desorienta outros motoristas e aumenta o risco de colisões.","Porque aumenta o consumo de combustível.","Porque reduz a velocidade do veículo.","Porque causa desgaste nos pneus.","Trocar de faixa repetidamente é perigoso e imprevisível. Mantenha-se em uma faixa até que seja realmente necessário mudar."],["p2m3q25",3,0,"Por que um condutor não deve parar em fila dupla?","","Porque atrapalha o fluxo do trânsito","Porque pode causar um congestionamento sonoro.","Porque é uma infração que causa a suspensão da CNH.","Porque gasta mais combustível do que estacionar corretamente.","Esta atitude obstrui uma faixa de rolamento e força pedestres a desviarem para a rua, aumentando o risco de sinistro."],["p2m3q26",3,2,"Por que não se deve usar farol alto em situações de neblina?","","Porque a luz forte reflete nas partículas de água e piora a visibilidade.","Porque gasta mais bateria do que o farol baixo.","Porque o farol alto pode superaquecer e queimar.","Porque é proibido por lei usar farol alto em rodovias.","A luz do farol alto é refletida de volta para os olhos do motorista, formando uma 'parede de luz' que ofusca em vez de iluminar."],["p2m3q27",3,1,"Por que o condutor deve ajustar o banco e os retrovisores antes de dirigir?","","Para garantir boa visibilidade e controle do veículo.","Para conforto apenas.","Para seguir uma exigência burocrática.","Para o carro gastar menos combustível.","Ajustar o banco e os retrovisores aumenta a segurança, permitindo melhor campo de visão e reação a imprevistos."],["p2m3q28",3,0,"Por que o motorista deve sempre usar a seta antes de mudar de faixa ou virar?","","Para avisar os outros motoristas e tornar o trânsito previsível.","Para cumprir uma formalidade da lei.","Para deixar o carro mais moderno.","Porque melhora o desempenho do veículo.","A seta é a principal forma de comunicação no trânsito. Usá-la com antecedência avisa os demais condutores sobre suas intenções e evita sinistros."],["p2m3q29",3,2,"Qual a importância de manter os faróis baixos acesos durante o dia, especialmente em rodovias?","","Para aumentar a visibilidade do seu veículo para os outros motoristas, tornando-o mais perceptível.","Para melhorar a iluminação da pista e a visibilidade de placas de sinalização durante o dia.","Para economizar a bateria, pois o farol baixo consome menos energia que o farol de rodagem diurna (DRL).","Para evitar multas, pois é uma exigência legal em todas as vias urbanas e rurais durante o dia.","Lembre-se do princípio de 'ver e ser visto', que explica que essa simples atitude aumenta muito a visibilidade do carro para os demais usuários da via, prevenindo sinistros."],["p2m3q30",3,2,"Qual a principal diferença entre uma rodovia e uma estrada?","","Rodovias são vias rurais pavimentadas e estradas são vias rurais não pavimentadas.","Rodovias ligam cidades e estradas ligam bairros.","Rodovias possuem pedágio e estradas não.","Rodovias são para carros e estradas para caminhões.","A pavimentação (asfalto ou concreto) é o que caracteriza uma rodovia, enquanto estradas são vias não pavimentadas. Glossário do CTB"],["p2m3q31",3,0,"Qual comportamento demonstra direção defensiva?","","Ajustar a velocidade conforme o clima e as condições da via.","Tentar ultrapassar sempre que possível.","Ignorar motociclistas que passam pelo corredor.","Usar o celular apenas em semáforos vermelhos.","A velocidade segura depende das condições do ambiente. Reduzir em caso de chuva, neblina ou tráfego intenso é um sinal de prudência e consciência."],["p2m3q32",3,0,"Qual dispositivo de retenção infantil é indicado para uma criança de 2 anos com 13 kg?","","Cadeirinha, virada para frente.","Assento de elevação.","Apenas o cinto de segurança do banco traseiro.","Bebê conforto, virado para trás.","Para a faixa de 1 a 4 anos (ou de 9 a 18 kg), a cadeirinha instalada virada para frente é o equipamento correto."],["p2m3q33",3,2,"Qual é a distância lateral mínima que um motorista deve manter ao ultrapassar um ciclista?","","1,5 metro.","2,0 metros.","0,5 metro.","1,0 metro.","Esta é a distância necessária para evitar provocar desequilíbrio e garantir a segurança, sendo o desrespeito uma infração média. Art. 201 do CTB"],["p2m3q34",3,2,"Qual é a função da faixa de aceleração ao entrar em uma via de trânsito rápido?","","Aumentar a velocidade para se igualar ao fluxo da via principal.","Aguardar parado até que haja uma brecha no trânsito.","Servir como acostamento temporário para emergências.","Reduzir a velocidade antes de entrar na pista principal.","O propósito desta faixa é permitir que o veículo ganhe velocidade de forma segura antes de ingressar no fluxo de tráfego intenso."],["p2m3q35",3,0,"O que significa o princípio “o maior cuida do menor” no trânsito?","","O condutor de um veículo motorizado tem a responsabilidade de zelar pela segurança de ciclistas e pedestres.","Veículos maiores, como caminhões, sempre têm a preferência.","Apenas veículos de emergência, como ambulâncias, precisam seguir esta regra.","Pedestres e ciclistas devem sempre ceder a passagem para os carros.","O princípio \"o maior cuida do menor\" significa que veículos maiores ou mais rápidos devem ter atenção redobrada e proteger os mais vulneráveis, como pedestres, ciclistas e motociclistas."],["p2m3q36",3,1,"Qual é a principal razão para manter os faróis baixos acesos durante o dia em rodovias, conforme a prática de 'ver e ser visto'?","","Para que outros motoristas, mesmo a longas distâncias, percebam a presença do seu veículo mais facilmente.","Para evitar o desgaste do sistema de iluminação noturna do veículo.","Para iluminar a pista e enxergar buracos com mais facilidade sob o sol.","Porque o farol alto pode ser usado durante o dia e o baixo é uma alternativa.","A luz acesa torna o veículo muito mais visível para os outros, tanto para quem vem em sentido contrário quanto para quem olha pelo retrovisor, prevenindo sinistros."],["p2m3q37",3,2,"Qual é a principal razão pela qual crianças não devem ser transportadas no banco dianteiro?","","Porque o airbag dianteiro pode ser perigoso para elas.","Porque elas podem distrair o motorista.","Porque elas podem se distrair com a paisagem mais facilmente.","Porque a lei permite apenas maiores de 18 anos no banco da frente.","A força de expansão do airbag é projetada para um adulto e pode causar lesões graves ou fatais em uma criança."],["p2m3q38",3,1,"Qual é a principal razão pela qual manusear o celular ao volante é tão perigoso?","","Porque o desvio de atenção, mesmo por poucos segundos, faz o carro percorrer uma longa distância sem o motorista estar prestando atenção.","Porque a multa é muito cara.","Porque pode danificar o aparelho celular em caso de freada brusca.","Porque é uma das infrações grave.","A principal razão é que o ato de manusear o celular causa uma distração visual e cognitiva que, devido à velocidade, faz o veículo percorrer longas distâncias sem a atenção do motorista, impedindo a reação a eventos críticos e aumentando drasticamente o risco de acidentes."],["p2m3q39",3,1,"Qual é a principal restrição de peso para um veículo ser conduzido com a Categoria B da CNH?","","O peso bruto total não pode passar de 3.500 kg.","O veículo não pode ter mais de 1.500 kg.","O peso do veículo não pode ultrapassar o do motorista.","Não há restrição de peso, apenas de lugares.","De acordo com o art. 143, inciso III do CTB, a principal restrição de peso para a Categoria B é que o Peso Bruto Total (PBT) não exceda a 3.500 kg, pois veículos de carga acima desse peso exigem a Categoria C."],["p2m3q40",3,0,"Qual é a recomendação para o uso do acostamento em uma rodovia?","","Usá-lo apenas em casos de emergência, como pane mecânica.","Parar para atender ao celular ou descansar.","Utilizá-lo para fazer ultrapassagens mais rápidas.","Trafegar por ele quando o trânsito na pista principal estiver lento.","O acostamento é uma área de segurança destinada exclusivamente a paradas emergenciais, devidamente sinalizadas."],["p2m3q41",3,0,"Qual é a regra fundamental ao se aproximar de uma faixa de pedestres?","","Reduzir a velocidade e parar, pois a preferência é sempre do pedestre na faixa.","Acelerar para passar antes que o pedestre comece a atravessar.","Manter a velocidade se o pedestre ainda não colocou o pé na faixa.","Buzinar para alertar o pedestre da sua aproximação.","A lei é clara: se houver pedestre atravessando ou com intenção de atravessar, o condutor deve parar."],["p2m3q42",3,2,"Qual é a velocidade máxima permitida em uma via local, como a rua de um bairro residencial?","","30 km/h","40 km/h","60 km/h","80 km/h","O art. 61, § 1º, I, \"d\" do CTB estabelece que a velocidade máxima, na ausência de sinalização, é de 30 km/h nas Vias Locais"],["p2m3q43",3,0,"Qual equipamento de proteção, além do capacete, é altamente recomendado para proteger as mãos em caso de queda de motocicleta?","","Luvas específicas para motociclismo.","Calçados abertos.","Bermudas.","Óculos de sol.","As mãos são frequentemente as primeiras a tocar o chão em uma queda, e luvas apropriadas protegem contra abrasões e impactos."],["p2m3q44",3,0,"Qual prática de segurança é fundamental para aumentar a visibilidade do motociclista e ajudar outros condutores a percebê-lo com mais facilidade no trânsito?","","Manter o farol baixo sempre aceso, mesmo durante o dia.","Posicionar-se sempre no ponto cego dos carros para se proteger.","Buzinar frequentemente em cruzamentos para anunciar sua presença.","Utilizar roupas escuras para não distrair outros motoristas.","O farol aceso cria um ponto de luz que se destaca na paisagem do trânsito, permitindo que outros motoristas identifiquem a presença e a distância da motocicleta com mais antecedência."],["p2m3q45",3,0,"Se você perceber que passou da saída que precisava pegar, qual é a atitude mais segura a ser tomada?","","Seguir em frente com segurança e procurar o próximo retorno.","Parar no acostamento e esperar uma oportunidade para cruzar as faixas.","Fazer uma manobra brusca de última hora para tentar entrar na saída.","Dar ré na avenida para voltar até a saída.","Esta é a forma de evitar riscos que permite realizar a manobra com tranquilidade."],["p2m3q46",3,1,"Dirigir com segurança é, principalmente, um conjunto de:","","Hábitos e escolhas conscientes.","Capacidade de dirigir em alta velocidade.","Conhecimento profundo da mecânica do veículo.","Habilidades naturais","O texto conclui que a direção segura é resultado de atitudes como respeito, empatia e escolhas deliberadas, que se tornam hábitos."],["p2m3q47",3,0,"Sobre o uso do cinto de segurança no banco de trás, o que podemos afirmar?","","É obrigatório para todos os passageiros.","É obrigatório apenas em viagens intermunicipais.","É recomendado, mas não obrigatório.","É obrigatório apenas para crianças.","Em uma colisão, um passageiro solto no banco de trás pode ser arremessado com força fatal. Art. 65 do CTB"],["p2m3q48",3,0,"Um condutor com habilitação na categoria B está autorizado a dirigir qual dos seguintes veículos?","","Uma picape leve com peso total de 3.000 kg e capacidade para 5 pessoas.","Uma motocicleta de 250 cilindradas.","Um caminhão pequeno com peso bruto total de 4.000 kg.","Uma van escolar com capacidade para 12 passageiros.","A Categoria B permite a condução de veículos cujo peso bruto total não exceda 3.500 kg e cuja lotação não exceda 8 lugares, excluído o do motorista. Artigo 143, inciso II"],["p2m4q1",4,0,"O que um condutor recém-habilitado com a Categoria A está autorizado a pilotar?","","Motocicletas, motonetas e ciclomotores.","Qualquer tipo de motocicleta, exceto triciclos motorizados.","Apenas motocicletas de até 50 cilindradas.","Veículos de duas rodas e picapes leves.","Esta categoria abrange todos os veículos motorizados de duas ou três rodas, conforme descrito na fonte."],["p2m4q2",4,0,"Sobre o uso de capacete danificado ou que já sofreu um impacto, o que deve ser feito?","","Nunca deve ser utilizado, pois sua eficácia está comprometida.","Deve ser consertado em um local especializado.","Pode ser emprestado, desde que o novo usuário verifique a fivela.","Pode ser usado em trajetos curtos e de baixa velocidade.","Um capacete que sofreu impacto pode ter danos estruturais não visíveis que o tornam incapaz de proteger adequadamente em um novo sinistro."],["p2m4q3",4,0,"A citação \"No trânsito, o equilíbrio emocional é tão importante quanto o freio do carro\" significa que:","","O autocontrole emocional é um item de segurança essencial para prevenir sinistros.","Dirigir triste ou com raiva pode causar problemas mecânicos no sistema de freios.","É desnecessário ter um controle emocional para saber usar o freio corretamente em uma emergência.","Pessoas muito emotivas não deveriam ser autorizadas a dirigir.","A citação compara o equilíbrio emocional (que controla os impulsos e permite tomar decisões racionais) ao freio (que controla a velocidade e para o carro), ambos sendo cruciais para a segurança."],["p2m4q4",4,0,"Ao ligar para um número de emergência como o SAMU (192), qual das informações a seguir é a mais crucial para agilizar o atendimento?","","A localização exata do sinistro e o número de vítimas.","O seu nome completo e número de telefone para contato.","Quem foi o culpado pela colisão, para o registro da ocorrência.","O modelo e a cor dos veículos envolvidos no sinistro.","Saber onde ir e quantos recursos (ambulâncias, médicos) enviar é a informação mais crítica para que o socorro chegue rápido e preparado."],["p2m4q5",4,1,"Ao presenciar um sinistro, você vê um motociclista caído no chão, consciente, mas reclamando de dor. Qual das seguintes ações é considerada um erro grave que pode piorar muito o estado da vítima?","","Tentar remover o capacete do motociclista para ajudá-lo a respirar melhor.","Sinalizar o local com o triângulo de segurança a uma distância adequada.","Conversar com a vítima para acalmá-la enquanto o socorro não chega.","Ligar para o número 193 (Bombeiros) para solicitar resgate.","A retirada do capacete só deve ser feita por profissionais, pois um movimento incorreto pode causar lesões gravíssimas na coluna cervical."],["p2m4q6",4,1,"Ao prestar assistência a uma vítima de sinistro, o que significa 'não remova, não movimente, não transporte'?","","Que qualquer movimento pode agravar lesões ocultas, especialmente na coluna, e só deve ser feito por profissionais ou em caso de perigo iminente.","Que a vítima deve permanecer exatamente na mesma posição em que foi encontrada até a conclusão da perícia técnica.","Que a vítima não deve ser tocada em nenhuma circunstância, nem mesmo para confortá-la.","Que é ilegal mover uma vítima de sinistro, configurando crime de lesão corporal culposa.","Esta é a essência da regra: a movimentação inadequada é um risco grave de agravar fraturas e lesões na coluna, sendo a exceção apenas situações extremas como incêndio."],["p2m4q7",4,0,"Ao registrar um sinistro sem vítimas, por que é importante que os motoristas tirem fotos dos danos nos veículos e dos documentos um do outro?","","Para ter um registro claro que pode ser usado no acionamento no momento de reparação do dano.","Apenas para ter uma lembrança do que aconteceu e evitar que se repita.","Para enviar para a oficina mecânica e já obter um orçamento dos reparos.","Para postar nas redes sociais e alertar os amigos sobre o ocorrido.","As fotografias servem como prova documental dos danos e dos dados dos envolvidos, facilitando os procedimentos com a seguradora e, se necessário, com as autoridades."],["p2m4q8",4,2,"Ao se deparar com um sinistro envolvendo um veículo que transporta cargas perigosas, identificado pelo painel laranja, qual é o procedimento mais seguro a ser seguido?","","Manter uma distância mínima de 50 metros, posicionar-se contra o vento e informar o número do painel aos bombeiros.","Utilizar o extintor do seu carro para conter qualquer princípio de incêndio e evacuar as vítimas do local.","Sinalizar o local com o triângulo a 30 metros e aguardar dentro do seu veículo a chegada do socorro.","Aproximar-se para identificar o número no painel e prestar os primeiros socorros imediatamente.","Este procedimento combina as principais recomendações de segurança: manter distância, evitar a inalação de gases tóxicos (posicionando-se a favor do vento, não contra) e fornecer informações cruciais para o socorro especializado."],["p2m4q9",4,1,"Ao se deparar com uma vítima de sinistro que não responde e parece não respirar, o que uma pessoa sem treinamento em reanimação deve fazer?","","Informar imediatamente ao SAMU (192) e seguir as orientações do atendente por telefone.","Virar a vítima de lado para que ela possa respirar melhor.","Jogar água no rosto da vítima para tentar acordá-la.","Tentar fazer massagem cardíaca de qualquer jeito, pois é melhor que nada.","O atendente do SAMU é treinado para dar instruções precisas por telefone, guiando a pessoa no local sobre como proceder de forma segura até a chegada da ambulância."],["p2m4q10",4,2,"Dirigir com pneus murchos, além de perigoso, causa um impacto negativo específico. Qual é ele?","","Aumenta o consumo de combustível.","Aumenta a poluição sonora do veículo.","Danifica o sistema de escapamento do carro.","Causa superaquecimento no sistema de freios.","Pneus com pressão abaixo da ideal aumentam a área de contato com o solo e, consequentemente, o arrasto, forçando o motor a trabalhar mais."],["p2m4q11",4,2,"Dirigir com sono é tão perigoso quanto dirigir alcoolizado. Por qual motivo principal?","","Porque a sonolência reduz os reflexos, a atenção e a capacidade de reagir.","Porque tanto o sono quanto o álcool causam visão dupla no motorista.","Porque te deixa alegre e agitado.","Porque dirigir com sono pode causar multas de trânsito","A comparação é feita porque o sono, assim como o álcool, afeta gravemente as funções neurológicas essenciais para uma direção segura, como tempo de reação e percepção de perigo."],["p2m4q12",4,1,"Durante o atendimento a uma vítima de sinistro que está consciente e com frio, o que é permitido fazer enquanto o socorro não chega?","","Cobri-la com um casaco ou cobertor para aquecê-la.","Movê-la para um local mais confortável, como a sombra.","Dar um copo de água com açúcar para acalmá-la.","Passar um remédio para dor que você tenha no carro.","Manter a vítima aquecida ajuda a estabilizar sua condição e a mantê-la confortável, sendo uma das poucas intervenções seguras que uma pessoa leiga pode fazer."],["p2m4q13",4,1,"Durante uma longa viagem noturna, um motorista percebe que está bocejando com frequência e que, por alguns instantes, teve dificuldade em manter o foco na estrada. Qual a ação correta e imediata a ser tomada?","","Procurar um local seguro, como um posto de gasolina ou ponto de parada, para estacionar e descansar por um tempo.","Acelerar para diminuir o tempo de viagem e, assim, poder descansar ao chegar ao destino.","Beber um café forte ou um energético e continuar a viagem para chegar ao destino mais rápido.","Aumentar o volume do rádio e abrir as janelas, pois isso é suficiente para despertar.","Dirigir com sono é tão perigoso quanto dirigir alcoolizado"],["p2m4q14",4,0,"Em um sinistro sem vítimas, onde os veículos obstruem o trânsito, qual é a ação prioritária que os condutores devem tomar após garantirem a própria segurança?","","Retirar os veículos da via para um local seguro para não obstruir o tráfego e evitar novos sinistros.","Ligar para o SAMU (192) como precaução, mesmo que ninguém aparente estar ferido.","Aguardar a chegada da autoridade policial para registrar a ocorrência antes de mover os veículos.","Fotografar os danos e a posição dos veículos na via antes de qualquer movimentação para garantir o registro.","Se não houver feridos e os veículos estiverem bloqueando o trânsito, eles devem ser removidos para liberar a via e aumentar a segurança. Art. 178 do CTB"],["p2m4q15",4,1,"Joana teve uma discussão estressante no trabalho e, ao entrar no carro para voltar para casa, sente muita raiva. No trânsito, outro motorista a fecha. Qual é a atitude mais segura e responsável que Joana pode tomar nessa situação?","","Respirar fundo algumas vezes, reconhecer que está com raiva e focar em dirigir com calma para chegar em segurança.","Anotar a placa do outro carro para registrar uma queixa formal contra o motorista depois.","Ligar para um colega para desabafar sobre a discussão e sobre o motorista que a fechou.","Acelerar para alcançar o outro veículo e buzinar para expressar sua indignação.","O gerenciamento das emoções, como reconhecer o sentimento e agir com calma, é fundamental para manter a segurança e evitar decisões impulsivas no trânsito."],["p2m4q16",4,2,"O que significa dizer que os pneus são responsáveis pela 'aquaplanagem'?","","Que pneus gastos perdem a capacidade de expulsar a água da pista, fazendo o veículo flutuar sobre ela e perder o controle.","Que pneus de baixa qualidade podem absorver água e aumentar o peso do veículo na chuva.","Que a calibragem não é importante.","Que os pneus podem ser velhos que funcionarão.","Os sulcos dos pneus são projetados para drenar a água. Quando estão gastos ('carecas'), essa drenagem falha, e uma camada de água se forma entre o pneu e o asfalto."],["p2m4q17",4,1,"O que um motociclista deve verificar em seu capacete para garantir que ele está em conformidade para circular?","","Verificar se o capacete sofreu algum impacto ou dano estrutural e não usar se estiver danificado.","Se a marca do capacete é igual ao da moto.","Se ele possui adesivos.","Se a viseira é espelhada.","É importante fazer a verificação do equipamento de segurança para garantir a segurança do motociclista e a eficiência do equipamento."],["p2m4q18",4,1,"Para garantir a segurança e a durabilidade do veículo, a manutenção preventiva é essencial. Com que frequência e em que condição os pneus devem ser calibrados?","","Semanalmente, com os pneus frios, seguindo a pressão indicada no manual do veículo.","Apenas quando parecerem visivelmente murchos, usando qualquer pressão.","Uma vez por mês, enchendo-os um pouco acima do recomendado para durar mais.","A cada seis meses, com os pneus quentes para a pressão se ajustar melhor.","Esta é a recomendação correta para garantir a pressão ideal, o que melhora a segurança, a durabilidade dos pneus e a economia de combustível."],["p2m4q19",4,0,"Para proteger o meio ambiente, qual das atitudes abaixo deve ser EVITADA por um condutor consciente?","","Circular com o carro soltando fumaça preta e com o escapamento furado.","Calibrar os pneus do carro toda semana.","Fazer a manutenção preventiva do veículo regularmente.","Planejar a rota antes de sair para evitar engarrafamentos.","Fumaça preta indica queima incorreta de combustível, liberando altos níveis de poluição, e um escapamento furado causa poluição sonora excessiva."],["p2m4q20",4,2,"Para que o airbag funcione de forma eficaz e segura, o uso de qual outro item é crucial?","","Cinto de segurança.","Calçados adequados.","Freios ABS.","limpador de parabrisas.","O cinto mantém o corpo do ocupante na posição correta, evitando que ele seja lançado contra o airbag em expansão."],["p2m4q21",4,1,"Por que é errado fotografar ou filmar vítimas em um local de sinistro para divulgar na internet?","","Porque desrespeita a dignidade das pessoas envolvidas e atrapalha o trabalho do socorro.","Porque a câmera do celular pode atrapalhar os equipamentos da equipe de resgate.","Porque as imagens podem ser consideradas falsas e gerar pânico.","Porque apenas jornalistas profissionais têm autorização para registrar essas cenas.","A legislação protege a imagem e a dignidade da pessoa. Além disso, a ação de filmar desvia o foco de quem poderia estar ajudando e interfere no trabalho dos profissionais."],["p2m4q22",4,1,"Por que o manual do proprietário é considerado a ferramenta mais importante para a manutenção preventiva do veículo?","","Porque traz um cronograma de revisões desenvolvido pelos engenheiros que projetaram o carro, detalhando o que e quando verificar.","Porque ensina o proprietário a ser mecânico.","Porque sem ele o veículo não anda.","Porque contém os contatos de todas as oficinas mecânicas credenciadas pela montadora.","O manual contém o cronograma exato de revisões, criado por quem conhece o veículo em profundidade, e seguir essas recomendações é fundamental."],["p2m4q23",4,0,"Qual das alternativas de mobilidade é apresentada como ideal para trajetos pequenos, combinando benefícios para a saúde, custo zero e impacto ambiental nulo?","","Caminhada.","Caronas Solidárias.","utilziar a motocicleta","utilizar o ciclomotor","A caminhada para trajetos pequenos é uma das melhores formas de deslocamento, trazendo os benefícios à saúde e o custo e poluição zero."],["p2m4q24",4,1,"Qual dos seguintes meios de transporte é considerado o mais sustentável para a preservação do meio ambiente?","","Bicicleta.","Transporte Público.","Carro elétrico.","Motocicleta.","A bicicleta é o meio de transporte mais sustentável para a preservação do meio ambiente, pois não utiliza combustíveis fósseis, não emite poluentes e contribui para a redução do tráfego e da poluição sonora."],["p2m4q25",4,1,"Qual das seguintes ações é um exemplo de condução ecológica que ajuda a reduzir o consumo de combustível e a poluição do ar?","","Acelerar de forma suave e progressiva, antecipando as paradas para evitar freadas bruscas.","Manter o ar-condicionado sempre ligado na potência máxima para o motor funcionar melhor.","Retirar o catalisador do escapamento para dar mais potência ao veículo.","Acelerar e frear bruscamente para tornar o fluxo do trânsito mais dinâmico.","Dirigir de maneira suave mantém o motor em uma faixa de rotação mais eficiente, economizando combustível e diminuindo a emissão de poluentes."],["p2m4q26",4,2,"Qual das seguintes práticas de 'Condução Ecológica' tem o maior impacto na economia de combustível?","","Manter os pneus sempre bem calibrados.","Acelerar forte.","Deixar o porta-malas cheio de coisa desnecessária.","Deixar de desligar o motor em paradas longas.","A calibragem correta dos pneus pode gerar uma economia de até 8% no consumo de combustível, um valor percentual direto mencionado."],["p2m4q27",4,0,"Qual dos números de emergência listados é o mais indicado para ligar em caso de um sinistro em uma rodovia federal?","","191 - Polícia Rodoviária Federal (PRF)","190 - Polícia Militar","192 - SAMU","193 - Bombeiros","A PRF é a autoridade responsável pela fiscalização e atendimento de ocorrências em rodovias federais."],["p2m4q28",4,1,"Qual é a principal vantagem ambiental do etanol como combustível no Brasil?","","É um combustível renovável que contribui para a redução da emissão de gases de efeito estufa na frota de veículos.","Não deve ser considerado como opção.","É feito de petróleo.","Pode ser utilizado em veículos feito para gasolina.","É um combustível renovável (de cana-de-açúcar, etc.) e um dos principais responsáveis pela redução das emissões de gases poluentes no país."],["p2m4q29",4,2,"Qual é o principal motivo para NÃO oferecer água, comida ou medicamentos a uma vítima de sinistro de trânsito?","","Porque pode causar complicações médicas graves, como durante uma cirurgia.","Porque a vítima pode não estar com sede ou fome no momento.","Para evitar engasgos, já que a vítima pode estar deitada.","Porque é responsabilidade exclusiva da família oferecer alimentos à vítima.","A ingestão de qualquer substância pode interferir na anestesia ou em outros procedimentos médicos de emergência que a vítima possa precisar."],["p2m4q30",4,2,"Qual é o princípio fundamental da filosofia 'Visão Zero', que influencia as estratégias modernas de segurança no trânsito?","","A responsabilidade pela prevenção de mortes e lesões graves é compartilhada por todo o sistema viário, não apenas pelo condutor.","A meta é eliminar completamente os erros humanos na condução por meio de tecnologia autônoma.","A prioridade máxima é a fluidez do tráfego, pois congestionamentos geram comportamentos de risco.","O objetivo é zerar o número de multas de trânsito através de uma educação mais rigorosa dos condutores.","Visão Zero parte da premissa de que o erro humano é inevitável e, portanto, o sistema (vias, veículos, leis) deve ser projetado para que esses erros não tenham consequências fatais."],["p2m4q31",4,1,"Se a luz indicadora do airbag no painel do carro permanecer acesa após ligar o veículo, o que isso pode indicar?","","Uma possível falha no sistema do airbag.","Que o sistema está ativado e pronto para uso.","Que o veículo está em modo de segurança para estacionamento.","Que o óleo está baixo.","A permanência da luz acesa é um sinal de alerta de que o sistema pode não funcionar corretamente em caso de colisão."],["p2m4q32",4,0,"Se um motorista sai do carro para se alongar durante uma viagem longa, qual benefício direto essa ação traz para a segurança?","","Ajuda a combater o cansaço e a sonolência.","Diminui o tempo total da viagem.","Permite verificar a calibragem dos pneus.","Melhora o consumo de combustível do veículo.","Ao sair do carro, caminhar e respirar ar fresco são medidas eficazes para recuperar o estado de alerta durante pausas."],["p2m4q33",4,1,"Um carro bate em um poste, e cabos elétricos caem sobre ele. O que o motorista, que não se feriu, deve fazer enquanto está dentro do veículo?","","Permanecer dentro do veículo sem tocar nas partes metálicas e ligar para os bombeiros (193).","Tentar empurrar os cabos para longe do carro com um objeto não condutor.","Sair imediatamente do carro, tomando cuidado para não tocar nos fios.","Abrir a porta do veículo.","O interior do veículo é o local mais seguro. A recomendação é ficar imóvel, evitar contato com o metal e acionar os bombeiros, que são treinados para lidar com riscos elétricos."],["p2m4q34",4,0,"Um motorista envolvido em um sinistro percebe um cheiro de combustível e fumaça saindo de um dos carros. Qual deve ser a sua prioridade máxima?","","Garantir a própria segurança e a de outros, afastando-se do local e acionando os bombeiros.","Tentar ligar o carro novamente para tirá-lo do local.","Avaliar os danos materiais para acionar o seguro.","Pegar o extintor de incêndio e tentar apagar a fumaça.","Fumaça e vazamento de combustível indicam risco de incêndio ou explosão. A primeira ação deve ser sempre proteger a vida, afastando-se e chamando socorro especializado."],["p2m4q35",4,0,"Dirigir com sono, mesmo que por poucos segundos, pode causar:","","Perda de controle do veículo e maior chance de acidente.","Nenhum problema, se o cochilo for rápido.","Apenas distração leve, sem risco real.","O carro desacelera automaticamente, prevenindo acidente.","Cochilar, mesmo por poucos segundos, pode fazer o carro percorrer metros sem controle, aumentando muito o risco de acidentes."],["p2m4q36",4,0,"Um motorista nota que as palhetas do limpador de para-brisa estão deixando marcas e rastros de água no vidro, dificultando a visão. O que isso indica?","","Que as palhetas estão ressecadas ou gastas e precisam ser trocadas.","Que o reservatório de água do limpador está vazio.","Que o motor do limpador de para-brisa está sem força.","Que está tudo funcionando corretamente","Quando a borracha das palhetas perde a flexibilidade ou se danifica, ela não consegue mais remover a água de forma uniforme, devendo ser substituídas."]];
