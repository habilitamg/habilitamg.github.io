 a placa acima?","R-29","É proibida a circulação de pedestres.","É permitido o trânsito de pedestres.","É área de travessia de pedestres.","É passagem obrigatória para pedestres.","A faixa vermelha sobre o símbolo do pedestre indica proibição de circulação."],["p1m1q127",1,0,"O que significa a placa acima?","A-35","Que pode haver animais de grande porte atravessando a pista.","Que o local é exclusivo para pastagem.","Que a via é fechada para veículos.","Que o motorista pode acelerar.","A placa alerta sobre a presença de bois, vacas ou outros animais na pista."],["p1m1q128",1,0,"Onde é mais comum encontrar essa placa?","A-31","Em estradas rurais e próximas a fazendas.","Em centros urbanos.","Em estacionamentos.","Em túneis e viadutos.","É usada para alertar motoristas sobre o trânsito de máquinas agrícolas."],["p1m1q129",1,0,"Onde geralmente é instalada a placa acima?","R-29","Em pontes, viadutos, túneis e vias expressas.","Em calçadas largas.","Em faixas de pedestres.","Em áreas escolares.","Esses locais não possuem área segura para circulação a pé."],["p1m1q130",1,0,"Paula dirige à noite e passa por um bairro residencial com a placa acima. Qual é a conduta correta?","R-20","Evitar buzinar, inclusive para cumprimentos.","Usar buzina curta para se anunciar.","Tocar a buzina em intervalos.","Reduzir o som, mas buzinar se quiser.","O ruído noturno é ainda mais perturbador e deve ser evitado."],["p1m1q131",1,0,"Paulo conduz seu carro e encontra a placa acima. O que ele deve fazer?","R-24a","Seguir obrigatoriamente à direita.","Virar à esquerda.","Parar o veículo.","Fazer retorno.","A seta indica o único sentido permitido para o fluxo naquele ponto."],["p1m1q132",1,0,"Paulo conduz um caminhão-baú e encontra a placa acima próxima a uma ponte. Por que essa placa foi instalada ali?","R-14","Para proteger a estrutura da ponte contra sobrepeso.","Para controlar o fluxo de veículos.","Para reduzir a velocidade.","Para indicar pedágio.","O excesso de peso pode comprometer a estrutura de pontes e viadutos, gerando risco de colapso."],["p1m1q133",1,0,"Paulo dirige pela Avenida Brasil e encontra a placa acima. O que ele deve fazer?","R-5a","Seguir em frente até o próximo ponto permitido para retorno.","Fazer o retorno rapidamente, olhando pelo retrovisor.","Parar no meio da via e aguardar espaço.","Utilizar o acostamento para manobrar.","A R-5a proíbe o retorno à esquerda, devendo o condutor seguir até um local autorizado e seguro."],["p1m1q134",1,0,"Paulo dirige sob chuva intensa. A placa indica “80 km/h”. O que ele deve fazer?","R-19","Reduzir a velocidade, mesmo que abaixo do limite mínimo.","Manter no mínimo 80 km/h.","Aumentar a velocidade para evitar aquaplanagem.","Parar no acostamento.","O limite da placa é o máximo, mas o condutor deve adequar a velocidade às condições da via."],["p1m1q135",1,0,"Paulo dirige um ônibus com altura de 3,5 metros e encontra a placa acima. Ele pode seguir?","R-15","Sim, pois está abaixo do limite máximo permitido.","Não, porque o veículo é grande.","Apenas se houver espaço lateral.","Somente se não houver pedágio.","A altura informada na placa é o limite máximo, veículos mais baixos podem transitar normalmente."],["p1m1q136",1,0,"Por que a placa acima é essencial em cruzamentos de mão única?","R-25b","Para evitar que condutores entrem na contramão.","Para indicar quebra-molas.","Para permitir estacionamento.","Para sinalizar pedágio.","Indica o sentido permitido e impede entradas indevidas na pista oposta."],["p1m1q137",1,0,"Por que é importante diminuir a velocidade ao ver essa placa?","A-19","Para evitar solavancos, danos no veículo e perda de controle.","Para economizar combustível.","Para manter o motor em rotação alta.","Porque a pista é de pedágio.","A passagem rápida pode causar pancadas no fundo do carro e acidentes."],["p1m1q138",1,0,"Por que é importante olhar para ambos os lados ao passar um cruzamento conforme sinalizado nessa placa?","A-6","Porque veículos, motos e bicicletas podem surgir de qualquer direção.","Porque o motorista precisa ver o pôr do sol.","Porque o retrovisor não funciona.","Porque o carro pode desligar.","Olhar para todos os lados aumenta a segurança e evita colisões laterais."],["p1m1q139",1,0,"Por que é importante que esta placa esteja visível logo na entrada da via?","A-45","Para que o condutor decida antes de entrar, evitando congestionamentos e manobras perigosas.","Para indicar o limite de velocidade.","Para alertar pedestres sobre o fluxo de veículos.","Para informar presença de lombada.","A visibilidade da placa evita situações de risco e manobras de retorno em locais estreitos."],["p1m1q140",1,0,"Por que é importante reduzir a velocidade ao ver essa placa?","A-14","Porque o sinal pode estar fechado logo à frente.","Porque a placa é obrigatória.","Porque há buracos na pista.","Porque a cor amarela significa perigo fixo.","Reduzir dá tempo para parar com segurança se o sinal estiver vermelho."],["p1m1q141",1,0,"Por que é importante reduzir a velocidade nas lombadas sinalizadas com essa placa?","A-18","Para evitar danos no veículo e garantir conforto e segurança aos ocupantes.","Porque é obrigatório parar totalmente.","Para economizar combustível.","Porque a lombada é apenas decorativa.","A alta velocidade pode causar perda de controle ou danos à suspensão."],["p1m1q142",1,0,"Por que essa placa é importante em rodovias e serras?","A-4b","Porque avisa o motorista que a estrada tem curvas fechadas seguidas.","Porque indica local de pedágio.","Porque mostra um ponto de ultrapassagem.","Porque sinaliza uma ponte estreita.","Em regiões de serra, o risco de acidente em curvas duplas é maior."],["p1m1q143",1,0,"Por que essa placa é importante para a segurança viária?","R-29","Porque evita atropelamentos em locais sem condições seguras de travessia.","Porque autoriza pedestres a atravessar em qualquer ponto.","Porque orienta o fluxo de ciclistas.","Porque indica o limite de velocidade.","Sua função é afastar pedestres de locais de risco e preservar vidas."],["p1m1q144",1,0,"Qual a atitude correta de um automóvel diante dessa placa?","R-39","Não circular na faixa ou via sinalizada.","Manter-se à direita e reduzir a velocidade.","Seguir normalmente entre os caminhões.","Estacionar no local.","A via é reservada apenas ao trânsito de caminhões."],["p1m1q145",1,0,"Qual deve ser a atitude do condutor ao visualizar a placa acima?","A-1a","Reduzir a velocidade e posicionar o veículo mais à direita da faixa.","Aumentar a velocidade para sair rápido da curva.","Manter a marcha e acelerar na entrada da curva.","Parar antes da curva.","Reduzir a velocidade e ajustar o posicionamento lateral aumenta a estabilidade."],["p1m1q146",1,0,"Qual deve ser a atitude do condutor de motocicleta ao encontrar essa placa?","R-37","Não entrar ou circular no trecho indicado.","Seguir normalmente, mas com farol baixo.","Reduzir a velocidade e seguir.","Parar para embarque e desembarque.","A entrada de motocicletas em área com essa sinalização constitui infração de trânsito."],["p1m1q147",1,0,"Qual deve ser a atitude do condutor de ônibus ao encontrar essa placa?","R-38","Não acessar a via sinalizada.","Seguir pela via, reduzindo a velocidade.","Utilizar a via apenas para embarque.","Parar para verificar o motivo da restrição.","O condutor deve respeitar a proibição e buscar rota alternativa."],["p1m1q148",1,0,"Qual deve ser a atitude do motorista ao ver essa placa?","A-14","Reduzir a velocidade e ficar atento às luzes do semáforo.","Acelerar para passar antes do vermelho.","Buzinar para avisar os outros.","Ignorar a placa e seguir normalmente.","A aproximação de um semáforo exige atenção e velocidade moderada."],["p1m1q149",1,0,"Qual deve ser a atitude do motorista ao ver esta placa?","A-31","Reduzir a velocidade e redobrar a atenção.","Ultrapassar o trator rapidamente.","Acelerar para sair da área rural.","Ligar o farol alto.","Máquinas agrícolas se movem devagar, exigindo paciência e cuidado dos demais condutores."],["p1m1q150",1,0,"Qual deve ser a primeira atitude ao ver essa placa?","A-6","Reduzir a velocidade e observar os dois lados.","Acelerar para passar antes dos outros carros.","Buzinar e seguir em frente.","Parar o veículo no meio da pista.","Reduzir e observar garante tempo para evitar colisões."],["p1m1q151",1,0,"Qual deve ser o comportamento do condutor ao ver essa placa antes de entrar na rotatória?","R-33","Seguir no sentido indicado e ceder passagem a quem já estiver circulando.","Parar completamente antes de entrar.","Entrar pela contramão se a via estiver livre.","Ultrapassar os veículos mais lentos.","O CTB exige respeito à preferência dos veículos que já estão na rotatória."],["p1m1q152",1,0,"Qual deve ser o comportamento do motociclista nesse tipo de travessia?","A-39","Reduzir a velocidade e atravessar em linha reta e devagar, evitando derrapagens sobre os trilhos.","Atravessar em alta velocidade para não ser atingido.","Parar no meio dos trilhos para olhar melhor.","Fazer zigue-zague para manter equilíbrio.","Trilhos podem ser escorregadios, a travessia deve ser feita com cuidado e estabilidade."],["p1m1q153",1,0,"Qual é a conduta segura ao se aproximar da placa acima?","A-2b","Reduzir levemente a velocidade e manter o veículo na faixa de rolamento.","Acelerar antes da curva.","Frear bruscamente dentro da curva.","Transitar no acostamento.","A antecipação da redução evita perda de aderência e mantém o controle direcional."],["p1m1q154",1,0,"Qual é a função principal da placa acima?","A-42c","Advertir sobre o início de divisão física da pista.","Indicar redução de pista.","Avisar sobre pedágio.","Anunciar obra na pista.","A sinalização prepara o condutor para a nova configuração da via."],["p1m1q156",1,0,"Qual é a principal função da placa acima?","R-27","Organizar o tráfego e reduzir conflitos entre veículos leves e pesados.","Alertar sobre lombadas.","Indicar ponto de parada de ônibus.","Proibir ultrapassagem.","Mantendo veículos pesados à direita, evita lentidão nas faixas de ultrapassagem."],["p1m1q157",1,0,"Qual é o principal risco ao ignorar a placa acima?","A-42b","Colisão frontal com veículos em sentido contrário.","Estouro de pneu.","Pane elétrica.","Gasto excessivo de combustível.","A falta de atenção ao fim da pista dupla pode resultar em ultrapassagem perigosa e choque frontal."],["p1m1q158",1,0,"Qual é o principal risco ao ignorar essa placa?","R-28","Colisão frontal com veículos que trafegam no sentido contrário.","Atraso no trajeto.","Perda de tempo em filas.","Multa por excesso de velocidade.","A desatenção pode levar a acidentes graves por invasão da contramão."],["p1m1q159",1,0,"Qual é o risco principal em curvas seguidas como indicado na placa acima?","A-5a","O motorista perder o controle do carro se estiver muito rápido.","O carro desligar o motor.","O consumo de combustível aumentar.","O farol apagar.","A força centrífuga aumenta nas curvas e pode empurrar o carro para fora da pista."],["p1m1q160",1,0,"Qual manobra é proibida na presença dessa placa?","R-25d","Virar à esquerda.","Seguir em frente.","Virar à direita.","Parar na via.","A placa proíbe conversão à esquerda e retorno."],["p1m1q161",1,0,"Qual manobra é proibida onde há a placa acima?","R-25c","Virar à direita.","Seguir em frente.","Virar à esquerda.","Parar o veículo.","Essa sinalização impede a conversão à direita no ponto indicado."],["p1m1q162",1,0,"Qual o objetivo principal da placa acima?","R-24a","Organizar o fluxo e evitar conflitos de tráfego.","Avisar sobre obras na pista.","Permitir o estacionamento.","Indicar pedágio.","Essa sinalização reduz riscos de colisões frontais e garante circulação ordenada."],["p1m1q163",1,0,"Qual o principal objetivo da placa acima?","R-32","Garantir prioridade ao transporte coletivo de passageiros.","Facilitar o trânsito de caminhões.","Aumentar o fluxo de automóveis.","Indicar ponto turístico.","A prioridade ao transporte coletivo melhora a mobilidade urbana e reduz o congestionamento."],["p1m1q165",1,0,"Qual o principal objetivo desta placa?","A-45","Evitar que o motorista entre por engano e tenha dificuldade de sair.","Indicar rua preferencial.","Mostrar via de alta velocidade.","Avisar sobre lombadas.","A sinalização evita confusão, congestionamentos e manobras indevidas."],["p1m1q166",1,0,"Quando o condutor encontra a placa acima, ele:","R-26","Deve seguir em frente, sem realizar conversões.","Pode virar à direita.","Deve parar imediatamente.","Pode fazer retorno.","A placa indica a única direção permitida naquele ponto da via."],["p1m1q167",1,0,"Quando o condutor encontra essa placa, ele deve:","R-25b","Sinalizar e virar à direita no ponto indicado.","Parar antes da esquina.","Virar à esquerda.","Seguir em frente.","A seta define a direção obrigatória a ser seguida pelo veículo."],["p1m1q168",1,0,"Quando o motorista vê essa placa, o que deve fazer?","A-15","Reduzir a velocidade e se preparar para parar.","Acelerar para passar antes dos outros.","Frear bruscamente no local da placa.","Parar sobre a faixa de pedestres.","A sinalização de advertência serve para antecipar a parada obrigatória."],["p1m1q169",1,0,"Rafaela dirige e vê a placa acima antes de uma praça com pedestres. Por que essa placa foi colocada ali?","R-10","Para proteger pedestres e evitar riscos em áreas de convivência.","Porque há radar fixo.","Porque o piso é de paralelepípedo.","Porque é área de estacionamento rotativo.","Essa placa é comum em áreas de lazer, praças e calçadões, garantindo segurança aos pedestres."],["p1m1q170",1,0,"Rita estaciona seu carro em uma vaga sinalizada com a placa acima e uma placa auxiliar “1 hora – rotativo”. O que ela deve fazer?","R-6b","Permanecer no local por, no máximo, 1 hora.","Estacionar o dia todo, se houver vaga.","Deixar o carro à noite sem controle de tempo.","Usar a vaga apenas se for moradora da rua.","A placa “E” indica estacionamento permitido, mas a placa auxiliar define as condições, como o tempo máximo de permanência."],["p1m1q171",1,0,"Rogério conduz um caminhão com peso total de 12 toneladas e vê a placa acima. O que deve fazer?","R-14","Não prosseguir e procurar rota alternativa.","Seguir com cuidado.","Reduzir a velocidade e passar assim mesmo.","Encostar e descarregar parte da carga.","A placa R-14 indica o limite máximo de peso bruto total permitido no trecho. Veículos acima desse limite não podem transitar."],["p1m1q172",1,0,"Rogério dirige em uma avenida movimentada e vê a placa acima. Ele deseja voltar no sentido contrário. O que deve fazer?","R-5a","Seguir em frente até encontrar sinalização que permita o retorno.","Parar no canteiro central e aguardar oportunidade.","Retornar com cuidado, se não houver trânsito.","Dar ré até o cruzamento anterior.","Mesmo que pareça seguro, o retorno é proibido. O motorista deve buscar o próximo ponto permitido."],["p1m1q173",1,0,"Rogério dirige em uma rodovia e vê a placa acima. O que deve fazer?","R-7","Manter-se atrás do veículo à frente até o fim do trecho sinalizado.","Ultrapassar devagar, se houver espaço.","Acelerar para ultrapassar rapidamente.","Usar o acostamento para ganhar tempo.","A placa acima proíbe toda ultrapassagem até o ponto em que a sinalização indicar o fim da restrição."],["p1m1q174",1,0,"Rogério passa por um hospital e vê a placa acima. O que ele deve fazer?","R-20","Evitar qualquer uso de buzina, para não causar ruído desnecessário.","Buzinar brevemente para alertar pedestres.","Aumentar o volume do som.","Acelerar para sair rápido da área.","O uso de buzina é proibido em áreas sensíveis, como hospitais e escolas."],["p1m1q175",1,0,"A forma octogonal da placa “PARE” tem como objetivo:","","Ser reconhecida facilmente.","Indicar um tipo de serviço.","Mostrar que é uma placa temporária.","Reduzir o custo de fabricação.","O formato octogonal é exclusivo da R-1 para garantir alta identificação visual em qualquer ângulo."],["p1m1q176",1,1,"Ao entrar em uma curva indicada pela placa acima, com excesso de velocidade, o veículo tende a:","A-2b","Seguir reto.","Fazer a curva com mais facilidade.","Reduzir automaticamente a tração.","Girar sobre o próprio eixo.","A força centrífuga empurra o veículo para fora da curva, especialmente à direita."],["p1m1q177",1,1,"Beatriz estaciona rapidamente com o pisca-alerta ligado em local com a placa acima. Essa ação é permitida?","R-6a","Não, pois o pisca-alerta não autoriza desrespeitar a proibição.","Sim, se o tempo for inferior a 5 minutos.","Sim, desde que permaneça dentro do carro.","Sim, se não houver fiscalização.","A sinalização deve ser obedecida independentemente do tempo ou da presença de agentes."],["p1m1q178",1,1,"Bruno deseja deixar um passageiro em local com a placa acima. O que ele deve fazer?","R-6c","Seguir até um ponto onde a parada seja permitida.","Parar rapidamente e liberar o passageiro.","Estacionar com o pisca-alerta ligado.","Reduzir e parar sobre a calçada.","Essa placa não permite qualquer parada, devendo o condutor procurar local autorizado."],["p1m1q179",1,1,"Carlos dirige à noite e vê a placa acima antes de uma curva acentuada. Por que essa proibição existe?","R-7","Porque a visibilidade é reduzida e não há campo de visão suficiente para a manobra.","Porque há radar fixo mais adiante.","Porque é área urbana.","Porque a pista é larga.","A placa evita manobras perigosas em locais onde a visibilidade é comprometida."],["p1m1q180",1,1,"Carlos dirige um automóvel e encontra a placa acima com a inscrição “Exceto veículos de emergência”. O que significa?","R-10","Somente ambulâncias, viaturas policiais e bombeiros podem circular naquele local.","Todos os carros podem entrar.","Caminhões também estão liberados.","É apenas sinalização educativa.","As exceções descritas em placas complementares indicam permissão restrita a veículos em serviço público essencial."],["p1m1q181",1,1,"César vê a placa acima junto de outra com o texto “Exceto veículos de emergência”. O que isso significa?","R-5b","Somente ambulâncias, bombeiros e viaturas em serviço podem fazer o retorno.","Todos os veículos podem retornar.","A placa está desativada.","A proibição é temporária.","A placa complementar cria exceção específica autorizada pelo órgão de trânsito."],["p1m1q182",1,1,"Como a placa acima contribui para a segurança viária?","R-27","Mantendo previsibilidade e separação de fluxos entre veículos leves e pesados.","Diminuindo a fiscalização eletrônica.","Reduzindo a necessidade de sinalização vertical.","Incentivando ultrapassagens em curva.","Ordena o tráfego e reduz zonas de conflito em pistas de múltiplas faixas."],["p1m1q183",1,1,"Eduardo estaciona seu carro sobre uma calçada com a placa acima próxima. O que diz a lei?","R-6a","É infração grave estacionar sobre passeio, mesmo sem placa específica.","É permitido se não atrapalhar pedestres.","Só é proibido se houver sinalização vertical.","É infração leve.","O CTB proíbe estacionar sobre calçadas, e a placa reforça a regra geral de segurança e acessibilidade."],["p1m1q184",1,1,"Em pista molhada, qual é a conduta segura ao encontrar essa sinalização?","A-1a","Reduzir mais a velocidade e evitar movimentos bruscos no volante.","Manter a velocidade e frear com força no meio da curva.","Ligar o pisca-alerta e parar.","Utilizar apenas o freio de mão.","A aderência diminui e a curva torna-se mais perigosa em piso molhado."],["p1m1q185",1,1,"Em qual local urbano é mais comum a presença dessa placa?","R-32","Em corredores exclusivos, avenidas com faixas de ônibus e terminais urbanos.","Em áreas escolares.","Em zonas rurais.","Em rodovias federais.","É usada para garantir eficiência ao transporte coletivo urbano."],["p1m1q186",1,1,"Em qual situação a velocidade deve ser reduzida mesmo abaixo da indicada na placa?","R-19","Sob chuva, neblina, buracos ou presença de pedestres.","Quando o veículo está novo.","Apenas à noite.","Quando não há radares.","A velocidade deve sempre ser compatível com as condições da via e da visibilidade."],["p1m1q187",1,1,"Em qual situação é mais comum encontrar essa placa?","A-15","Antes de cruzamentos com pouca visibilidade.","No início de pontes largas.","Em trechos de ultrapassagem.","Perto de postos de combustível.","A advertência aumenta a segurança em locais de risco de colisão."],["p1m1q188",1,1,"Em uma rua sinalizada com “Sentido Proibido”, o motorista deve:","","Respeitar a proibição e buscar o sentido permitido.","Seguir em frente apenas para estacionar.","Usar o acostamento para continuar.","Fazer conversão proibida.","O respeito à placa mantém o fluxo seguro e evita colisões frontais com quem vem no sentido correto."],["p1m1q189",1,1,"Juliana vê a placa acima acompanhada de outra placa logo abaixo com a inscrição “Exceto ônibus”. O que isso significa?","R-4b","Apenas os ônibus podem realizar a conversão.","Todos os veículos estão liberados.","A proibição é temporária.","Que apenas ônibus estão proibidos de fazer a conversão.","A placa complementar delimita a exceção para transporte coletivo, válida conforme regulamentação local."],["p1m1q190",1,1,"Juliana vê a placa acima acompanhada de uma faixa contínua dupla no pavimento. O que essa combinação indica?","R-7","Que a proibição de ultrapassar é inrtanto pela sinalização vertical quanto pela horizontal.","Que pode ultrapassar se houver espaço.","Que vale apenas para caminhões.","Que a faixa é apenas decorativa.","A sinalização horizontal complementa a vertical, reforçando a proibição total de ultrapassagem."],["p1m1q191",1,1,"Marcos conduz um caminhão e encontra a placa acima acompanhada da inscrição “Das 7h às 20h”. O que isso significa?","R-9","A proibição vale apenas dentro do horário indicado.","É proibido trafegar 24 horas.","A placa é apenas educativa.","Que ele pode travegar livremente.","As placas auxiliares definem horários específicos de restrição de circulação."],["p1m1q192",1,1,"Marina dirige em um aclive e encontra a placa acima. Qual é o principal risco de desobedecê-la?","R-7","Colidir frontalmente com veículo vindo no sentido contrário.","Ser multada apenas.","Gastar mais combustível.","Perder o controle da direção.","Nos aclives, o campo de visão é reduzido e a ultrapassagem pode causar colisões frontais."],["p1m1q193",1,1,"Marina está em local com a placa acima acompanhada de uma placa auxiliar “Das 7h às 19h”. Às 21h, ela estaciona. Está correta?","R-6a","Sim, pois a restrição vale apenas no horário indicado.","Não, a proibição é para 24 horas.","Apenas se for moradora da rua.","Somente se deixar o pisca-alerta ligado.","Placas complementares definem restrições por faixa horária, fora do horário, o estacionamento é permitido."],["p1m1q194",1,1,"O condutor que deseja fazer o retorno em local sinalizado com “Proibido virar à esquerda” deve:","","Seguir até um ponto onde o retorno seja permitido.","Fazer o retorno imediatamente, com cuidado.","Parar e pedir orientação a pedestres.","Realizar a manobra de marcha a ré.","A proibição de virar à esquerda inclui o ato de retornar. O motorista deve prosseguir até o próximo ponto liberado."],["p1m1q195",1,0,"O fundo vermelho e as letras brancas da placa “PARE” significam:","","Proibição e ordem obrigatória de parada total.","Alerta de obras na via.","Indicação de preferência.","Orientação de trajeto alternativo.","A cor vermelha nas placas de regulamentação indica proibição ou obrigação, reforçando a ordem de parada."],["p1m1q196",1,1,"O que a placa acima e a placa de sentido de circulação pela esquerda têm em comum?","R-25b","Ambas determinam o movimento obrigatório dos veículos.","Ambas indicam perigo de curva.","Ambas liberam estacionamento.","Ambas têm formato retangular.","Ambas são de regulamentação e orientam o sentido de fluxo."],["p1m1q197",1,1,"O que acontece se o condutor circular na rotatória no sentido contrário ao indicado pela placa acima?","R-33","Comete infração grave e põe em risco os demais usuários.","Apenas recebe advertência verbal.","É permitido em horários de pouco movimento.","Nenhuma consequência.","Circular no sentido contrário da via é infração grave, conforme art. 186, inciso I, do CTB."],["p1m1q199",1,1,"O que representa o comportamento seguro ao ver esta placa?","A-32a","Atenção redobrada, velocidade reduzida e empatia com quem atravessa.","Pressa e buzina.","Disputa de espaço com o pedestre.","Uso do farol alto.","A direção defensiva valoriza a vida e evita atropelamentos."],["p1m1q200",1,1,"Onde existe essa placa, se o condutor quiser seguir em frente, o que deve lembrar?","A-8","Que a via termina e ele deve obrigatoriamente virar.","Que pode continuar reto se for de madrugada.","Que o cruzamento é preferencial para ele.","Que o trecho é de ultrapassagem livre.","A interseção em “T” indica o fim da pista — seguir reto é perigoso e proibido."],["p1m1q201",1,1,"Por que a placa acima é essencial para a segurança viária?","R-28","Porque alerta o condutor sobre o risco de veículos em sentido contrário.","Porque indica área de pedágio.","Porque proíbe paradas de ônibus.","Porque mostra o limite de peso da via.","Essa informação evita colisões frontais e ultrapassagens perigosas."],["p1m1q202",1,1,"Por que a placa acima é fundamental em rodovias de pista simples com ilhas de refúgio?","R-24b","Porque impede que veículos invadam a faixa contrária durante o contorno.","Porque indica estacionamento.","Porque aumenta o limite de velocidade.","Porque substitui o guard rail.","A obediência à direção de passagem previne colisões frontais."],["p1m1q203",1,1,"Por que as placas semelhantes a esta acima podem ter diferentes valores em um mesmo trajeto?","R-19","Porque o limite é ajustado conforme o tipo de via, tráfego e entorno.","Porque são colocadas aleatoriamente.","Porque indicam o limite mínimo.","Porque servem apenas de orientação.","As condições locais determinam o limite adequado de velocidade."],["p1m1q204",1,1,"Por que as ultrapassagens são mais perigosas em vias com a placa acima?","R-28","Porque há risco de colisão com veículos que vêm no sentido oposto.","Porque há menos curvas.","Porque o trânsito é mais lento.","Porque há pedestres em excesso.","Em mão dupla, o cálculo errado de tempo e distância causa sinistros fatais."],["p1m1q205",1,1,"Por que é importante manter atenção redobrada no tipo de cruzamento indicado por essa placa?","A-8","Porque veículos podem vir em alta velocidade pela via transversal.","Porque a placa é difícil de ver.","Porque o asfalto é sempre molhado.","Porque o cruzamento é automático.","Muitos sinistros ocorrem por falta de observação lateral."],["p1m1q207",1,1,"Por que é importante respeitar a placa acima em túneis e passagens subterrâneas?","R-15","Porque o desrespeito pode causar colisão da carga contra o teto, colocando em risco todos os usuários.","Porque o ar é mais úmido nesses locais.","Porque há pedágio próximo.","Porque é área de fiscalização.","O excesso de altura pode causar sinistros e danos estruturais, exigindo interdição da via."],["p1m1q208",1,1,"Por que é importante respeitar o sentido de circulação indicado pela placa acima em áreas urbanas?","R-24a","Porque evita conflitos entre fluxos opostos e atropelamentos.","Porque ajuda a encontrar vagas de estacionamento.","Porque melhora o som do motor.","Porque reduz o gasto de combustível.","O respeito ao sentido correto garante a previsibilidade do comportamento dos condutores."],["p1m1q209",1,1,"Por que essa placa é importante em locais com curvas ou subidas?","A-14","Porque o motorista pode não ver o semáforo a tempo.","Porque indica radar.","Porque mostra o limite de velocidade.","Porque indica o fim da pista.","A sinalização antecipada evita freadas bruscas em locais de pouca visibilidade."],["p1m1q210",1,1,"Por que não se deve ultrapassar em trechos com essa placa?","A-7a","Porque veículos podem entrar repentinamente pela esquerda.","Porque o carro pode perder a direção.","Porque o piso sempre é irregular.","Porque é um local de pedágio.","A ultrapassagem aumenta o risco de colisão com quem entra na pista."],["p1m1q211",1,1,"Por que o condutor deve manter distância de segurança em uma curva à direita, conforme indicado pela placa acima?","A-2b","Porque a visibilidade é reduzida e a trajetória pode se estreitar.","Porque o veículo da frente acelera automaticamente.","Porque o limite de velocidade aumenta.","Porque o consumo de combustível diminui.","A visibilidade limitada e a geometria da curva exigem mais espaço de reação."],["p1m1q212",1,1,"Por que respeitar a placa acima é importante em rodovias com túneis e viadutos?","R-16","Porque o desrespeito pode causar colisão lateral e danificar as estruturas.","Porque evita multas de excesso de velocidade.","Porque reduz o ruído urbano.","Porque facilita o estacionamento.","Veículos muito largos podem atingir paredes, muretas e colunas de sustentação."],["p1m1q213",1,1,"Quais veículos são abrangidos pela proibição da placa acima?","R-37","Motocicletas, motonetas e ciclomotores.","Bicicletas e patinetes elétricos.","Automóveis e caminhões.","Tratores e máquinas agrícolas.","A placa se aplica a todos os veículos motorizados de duas rodas, independentemente da cilindrada."],["p1m1q214",1,1,"Qual comportamento seguro o condutor deve adotar após avistar essa placa?","R-28","Manter-se na faixa da direita e redobrar a atenção aos veículos do sentido oposto.","Aumentar a velocidade para sair rápido da área.","Ultrapassar logo após a placa.","Transitar pelo acostamento.","O tráfego bidirecional exige maior cautela e redução de velocidade."],["p1m1q215",1,1,"Qual é a principal diferença entre a placa de lombada e a de pista irregular?","A-18","A de lombada indica uma elevação isolada, a de pista irregular indica vários desníveis.","A de lombada é vermelha.","A de pista irregular obriga a parar.","As duas têm o mesmo significado.","A lombada é um obstáculo único, a pista irregular representa desníveis contínuos."],["p1m1q216",1,1,"Qual é o comportamento correto ao encontrar essa placa?","R-25c","Reduzir a velocidade e escolher entre seguir em frente ou virar à esquerda, sinalizando a manobra.","Seguir em frente sem atenção.","Virar à direita rapidamente.","Parar o veículo antes da placa.","A decisão deve ser tomada com segurança e comunicação prévia."],["p1m1q217",1,1,"Qual é o comportamento correto ao se deparar com a placa acima?","R-23","Manter-se à direita e respeitar a via.","Invadir a contramão para cortar caminho.","Aumentar a velocidade em curva.","Seguir à esquerda.","Invadir a contramão é infração gravíssima e coloca vidas em risco."],["p1m1q218",1,1,"Qual o erro mais comum cometido por condutores em curvas acentuadas como a indicada pela placa acima?","A-1b","Entrar na curva em velocidade superior à recomendada.","Ligar o farol alto.","Desligar o motor para economizar combustível.","Acionar o limpador de para-brisa.","O excesso de velocidade é a principal causa de saídas de pista em curvas."],["p1m1q219",1,1,"Qual o objetivo principal da placa acima?","R-34","Proteger ciclistas e garantir a convivência segura entre modais.","Facilitar o tráfego de automóveis.","Reservar estacionamento de motos.","Evitar o uso de bicicletas.","Promove segurança e incentivo ao transporte não motorizado."],["p1m1q220",1,1,"Qual o risco de desrespeitar a placa acima?","R-37","Ocorrer colisões com pedestres ou veículos em áreas não projetadas para motos.","Aumentar a fluidez do trânsito.","Reduzir o consumo de combustível.","Nenhum risco, apenas penalidade administrativa.","Em vias estreitas e calçadões, motos representam alto risco de atropelamento."],["p1m1q221",1,1,"Qual o risco de veículos leves usarem uma via sinalizada com a placa acima?","R-39","Aumento da probabilidade de colisões com caminhões.","Redução de riscos.","Melhoria da fluidez geral.","Nenhum risco significativo.","A diferença de tamanho e peso aumenta o risco de acidentes graves."],["p1m1q222",1,1,"Quando há duas placas de velocidade diferentes, uma para automóveis e outra para caminhões, o motorista deve:","R-19","Obedecer ao limite correspondente ao seu tipo de veículo.","Escolher o limite maior.","Manter o dobro da menor.","Ignorar ambas.","O limite varia conforme a categoria do veículo, a via e as condições locais."],["p1m1q223",1,1,"Quando passar por uma placa como essa e em seguida encontrar um semáforo que estiver intermitente (piscando em amarelo), o que o condutor deve fazer?","A-14","Reduzir a velocidade e prosseguir com atenção.","Acelerar para aproveitar o sinal.","Parar obrigatoriamente.","Ignorar o sinal.","O amarelo intermitente alerta para atenção redobrada no cruzamento."],["p1m1q224",1,1,"Que atitude deve ter o motorista de carro ao ver essa placa?","R-32","Não entrar ou circular na faixa exclusiva de ônibus.","Utilizar a faixa para ultrapassar.","Acelerar para sair rapidamente.","Parar sobre a faixa.","O respeito à exclusividade evita multas e melhora o transporte coletivo."],["p1m1q225",1,1,"Renata vê a placa acima próxima à entrada de um túnel. Por que a manobra é proibida nesse local?","R-8b","Porque o espaço é reduzido e a visibilidade lateral é limitada.","Porque o túnel é iluminado.","Porque há radar de velocidade.","Porque o piso é de concreto.","Nos túneis, as mudanças de faixa aumentam o risco de colisões devido à pouca visibilidade e à proximidade entre veículos."],["p1m1q226",1,1,"Ricardo dirige à noite e percebe a placa acima próxima a uma saída de túnel. Qual é o motivo da proibição?","R-8a","Garantir a fluidez e evitar cruzamentos de trajetórias na saída.","Indicar local de fiscalização eletrônica.","Indicar fim de pista dupla.","Liberar ultrapassagens.","Mudanças bruscas de faixa em saídas de túnel causam colisões laterais e congestionamentos."],["p1m1q227",1,1,"Ricardo trafega à noite e vê a placa acima em um trecho de pista simples. O que deve fazer?","R-5a","Continuar no sentido da via e só retornar onde for permitido.","Fazer o retorno com farol alto.","Aguardar no meio da pista para virar.","Encostar no acostamento e manobrar.","Mesmo com pouca movimentação, a sinalização deve ser respeitada para evitar colisões frontais."],["p1m1q228",1,1,"Se o condutor avança por engano em uma rua com a placa “Sentido proibido”, o que deve fazer imediatamente?","","Parar em local seguro e retornar ao sentido permitido.","Continuar até o fim da via.","Dar marcha a ré no meio da pista.","Ignorar e seguir normalmente.","A manobra deve ser feita com segurança, evitando risco a outros usuários e sempre retornando ao trajeto correto."],["p1m1q229",1,1,"Tiago encontra a placa acima acompanhada da inscrição “Exceto táxi”. O que isso significa?","R-6a","Somente táxis podem estacionar naquele local.","A proibição vale para todos, inclusive táxis.","Apenas táxis estão proibidos.","O estacionamento é livre à noite.","A placa complementar cria exceção regulamentada pelo órgão de trânsito, válida apenas aos veículos indicados."],["p1m1q230",1,0,"O que o condutor deve fazer antes mesmo de ligar o carro?","","Verificar itens básicos como pneus, freios e o cinto de segurança.","Conferir se o rádio está funcionando.","Testar o som e o ar-condicionado.","Ajustar o banco apenas depois de sair da garagem.","A checagem prévia do veículo evita problemas e sinistros. É o primeiro passo de um condutor responsável."],["p1m1q231",1,1,"Quando o semáforo está verde, mas um agente de trânsito manda parar, o que o motorista deve fazer?","","Obedecer ao agente de trânsito.","Seguir porque o sinal está aberto.","Aguardar o agente sair da via.","Buzinar para avisar que o sinal está verde.","Existe uma hierarquia na sinalização. A ordem do agente prevalece sobre o semáforo ou a placa."],["p1m1q232",1,0,"Em uma faixa de pedestres, quem tem prioridade?","","O pedestre que atravessa ou demonstra intenção de atravessar.","O veículo maior.","Quem estiver com mais pressa.","O ciclista, sempre.","A prioridade é sempre do pedestre. O motorista deve reduzir e, se necessário, parar completamente."],["p1m1q233",1,1,"Qual é a função da sinalização cicloviária?","","Garantir espaço seguro para os ciclistas.","Restringir a circulação de bicicletas.","Servir apenas de decoração urbana.","Indicar locais de estacionamento.","A sinalização cicloviária delimita ciclovias e ciclofaixas, promovendo respeito e segurança aos ciclistas."],["p1m1q234",1,1,"Por que a cor laranja é usada nas sinalizações temporárias?","","Porque é uma cor visível e chama atenção para algo diferente na via.","Porque combina com o ambiente urbano.","Porque representa tranquilidade.","Porque é a cor padrão das placas educativas.","A cor laranja se destaca de todas as outras e alerta que há mudanças temporárias na via."],["p1m1q235",1,0,"Quando o motorista encontra um semáforo piscando em amarelo, o que deve fazer?","","Reduzir a velocidade e seguir com atenção.","Parar completamente até o sinal mudar.","Acelerar para passar logo.","Esperar outro motorista indicar o que fazer.","O amarelo piscante indica atenção redobrada — o condutor deve reduzir e prosseguir com cuidado."],["p1m1q236",1,1,"Por que a sinalização horizontal (pinturas no chão) é tão importante?","","Porque orienta o fluxo e define o espaço de cada usuário da via.","Porque serve apenas como enfeite.","Porque substitui as placas verticais.","Porque mostra apenas os limites de velocidade.","As linhas, setas e faixas pintadas no solo organizam o trânsito e indicam condutas seguras."],["p1m1q237",1,1,"O que acontece quando um motorista ignora uma placa de regulamentação?","","Comete uma infração e coloca vidas em risco.","Nada, se não houver fiscalização.","Apenas recebe uma advertência verbal.","Fica livre para escolher o que fazer.","As placas de regulamentação são ordens obrigatórias; desrespeitá-las é infração e ameaça à segurança."],["p1m1q238",1,2,"Por que conhecer o “código das cores” da sinalização horizontal é essencial?","","Porque cada cor transmite uma mensagem específica sobre o uso da via.","Porque ajuda apenas em vias urbanas.","Porque deixa o asfalto mais bonito.","Porque substitui as placas de regulamentação.","As cores e tipos de linha indicam onde é permitido ultrapassar, parar ou dividir faixas, e garantem ordem no trânsito."],["p1m1q239",1,2,"Quando há mensagens conflitantes entre placas, faixas e semáforo, o que o condutor deve fazer?","","Seguir a hierarquia da sinalização.","Escolher o que achar mais conveniente.","Priorizar sempre o semáforo.","Seguir o veículo à frente.","O Código de Trânsito Brasileiro estabelece uma hierarquia clara — em caso de conflito, deve-se obedecer primeiro ao agente, depois ao semáforo, e por último às placas e marcas no solo."],["p1m1q240",1,0,"O que caracteriza as placas de regulamentação?","","Elas impõem regras que devem ser obedecidas.","São sinais apenas informativos.","Servem só para enfeitar as vias.","São usadas apenas em rodovias.","Porque impõem regras obrigatórias e desrespeitá-las é infração."],["p1m1q241",1,0,"Qual formato é comumente associado às placas de advertência?","","Losango (diamante), geralmente amarelas.","Retangular horizontal, geralmente azul.","Circular, com borda vermelha.","Quadrada e marrom.","O losango amarelo alerta sobre perigos ou mudanças à frente."],["p1m1q242",1,1,"As placas verdes são mais usadas para:","","Indicar direções, cidades e distâncias em rodovias.","Indicar serviços como postos e hotéis.","Educar sobre segurança.","Sinalizar pontos turísticos.","Placas verdes atuam como 'GPS' nas estradas, mostrando rotas e distâncias."],["p1m1q243",1,0,"Qual a missão das placas brancas?","","Conscientizar e educar sobre comportamentos seguros.","Dar ordens obrigatórias aos motoristas.","Indicar serviços e postos de atendimento.","Apontar atrações turísticas.","As placas brancas têm função educativa, reforçando comportamentos seguros."],["p1m1q244",1,0,"Por que a sinalização deve ser compreendida rapidamente pelo motorista?","","Porque mensagens precisam ser entendidas em frações de segundo","Porque os motoristas não têm tempo de ler.","Porque são feitas só para especialistas.","Para permitir que o carro dirija sozinho.","A sinalização usa símbolos e cores para comunicação instantânea durante a direção."],["p1m1q245",1,1,"O que significa a sinalização temporária em cor laranja?","","Indica obras, desvios ou eventos temporários na via.","Que a via é exclusiva para transporte público.","Que é uma área escolar.","Que há um ponto turístico adiante.","A cor laranja destaca mudanças temporárias e pede atenção extra."],["p1m1q246",1,0,"O que uma faixa de pedestres representa no pavimento?","","Local de prioridade para travessia de pedestres.","Área de carga e descarga.","Faixa exclusiva para bicicletas.","Local de estacionamento.","A faixa é o espaço sagrado do pedestre, que tem prioridade ao atravessar."],["p1m1q248",1,0,"Qual o papel dos dispositivos auxiliares (ex.: cones, barreiras)?","","Ajudar a aumentar a segurança e organizar o trânsito fisicamente.","Servir apenas como decoração noturna.","Substituir completamente as placas verticais.","Indicar apenas rotas turísticas.","São elementos físicos que complementam placas e faixas para segurança."],["p1m1q249",1,0,"O que significa 'sinalização cicloviária'?","","Sinalização que indica espaços reservados (ciclovias/ciclofaixas) para ciclistas.","Sinalização que proíbe bicicletas da cidade.","Indicação de pontos de ônibus.","Local de lavagem de bicicletas.","Delimita infraestruturas específicas para deslocamento seguro de ciclistas."],["p1m1q250",1,1,"Qual é a vantagem de 'ler o chão' (sinalização horizontal)?","","Ela está sempre no campo de visão do motorista e orienta condutas.","É apenas estética urbana.","Substitui sinais luminosos em cruzamentos.","Serve só para pavement design.","As marcas no solo guiam movimentos, ultrapassagens e paradas."],["p1m1q251",1,1,"O que sinaliza uma placa azul?","","Serviços e identificação, como postos ou informações.","Direções e cidades em rodovias.","Atrações turísticas.","Mensagens educativas.","Placas azuis indicam serviços e identificação úteis ao viajante."],["p1m1q252",1,0,"Por que a hierarquia entre sinais é importante?","","Para definir qual sinal seguir quando há conflito entre mensagens.","Para dar prioridade às placas sobre agentes.","Para tornar a sinalização mais complexa.","Para permitir que cada município escolha suas regras.","A hierarquia evita conflitos (ex.: policial vs semáforo) e define prioridade clara."],["p1m1q253",1,0,"Qual a recomendação ao usar a faixa de aceleração para entrar numa rodovia?","","Acelerar na faixa para atingir a velocidade do tráfego antes de inserir-se.","Parar e aguardar que os carros passem.","Entrar devagar e reduzir na pista principal.","Acelerar e cortar os outros veículos.","Faixa de aceleração serve para adaptar velocidade e entrar com segurança."],["p1m1q254",1,0,"Qual é a atitude central da direção defensiva ?","","Antecipar riscos e preparar-se para a inesperado.","Dirigir sempre no limite máximo de velocidade.","Confiar que os outros não erram.","Evitar usar o cinto em trajetos curtos.","Direção defensiva é prever erros alheios e manter distância e atenção."],["p1m1q255",1,1,"Por que a velocidade máxima da via nem sempre é a mais segura?","","Porque condições como chuva exigem reduzir abaixo do limite.","Porque os limites são sempre exagerados.","Porque locais urbanos não têm limites.","Porque o semáforo determina a velocidade.","Velocidade segura depende de visibilidade, clima e fluxo, não só da placa."],["p1m1q256",1,1,"O que uma placa marrom indica?","","Atrativos turísticos como parques e museus.","Proibições de estacionamento.","Direções rodoviárias.","Áreas de risco.","Placas marrons são dedicadas ao turismo e pontos de interesse."],["p1m1q257",1,0,"Por que não se deve retornar em curvas, pontes ou túneis?","","Porque reduz visibilidade e aumenta risco de sinistros.","Porque é permitido só de noite.","Porque é complicado para motoristas experientes.","Porque reduz o número de multas.","Retornos nesses locais comprometem segurança por falta de visibilidade."],["p1m1q258",1,0,"O que é recomendado ao ultrapassar um ciclista?","","Manter 1,5 m de distância lateral para evitar desequilíbrio.","Aproxime-se por trás e ultrapasse sem espaço.","Use a faixa de pedestre para ultrapassar.","Buzine constantemente para acelerar o ciclista.","Distância lateral segura reduz risco de tombos e é citada no material."],["p1m1q259",1,0,"Qual é a consequência prática de estacionar indevidamente em local proibido?","","Remoção do veículo e despesas com pátio.","Só uma advertência verbal.","Nada, se for pouco tempo.","Apenas perda de pontos sem multa.","Estacionamento indevido pode gerar remoção e custos significativos."],["p1m1q260",1,0,"Por que o uso correto de cintos e cadeirinhas é enfatizado?","","Porque esses dispositivos protegem ocupantes em caso de sinistro.","Porque melhoram a economia de combustível.","Porque aumentam a velocidade do veículo.","Porque substituem a necessidade de atenção do motorista.","Equipamentos de segurança só funcionam se usados corretamente, salvando vidas."],["p1m1q261",1,0,"Quais os calçados são recomendados para dirigir?","","Usar sapatos adequados; chinelos podem comprometer controle dos pedais.","Dirigir sempre descalço é melhor.","Usar qualquer calçado é indiferente.","Usar sapatos de salto alto é recomendado.","Calçados firmes garantem bom controle dos pedais e segurança."],["p1m1q262",1,1,"O que é a PPD?","","Permissão para Dirigir: habilitação provisória válida por 1 ano.","Documento do veículo.","Curso extra opcional.","Uma multa aplicada a novos condutores.","PPD é a primeira habilitação temporária com regras especiais."],["p1m1q263",1,0,"Durante a Permissão para Dirigir, qual comportamento é proibido ao condutor?","","Cometer infrações graves, gravíssimas ou reincidência em médias.","Dirigir somente à noite.","Usar o veículo para trabalho.","Trocar de categoria sem prova.","A PPD exige conduta responsável; infrações sérias levam à suspensão."],["p1m1q264",1,0,"O que diferencia vias urbanas de rodovias?","","Urbanas têm mais pedestres e cruzamentos; rodovias ligam cidades e permitem maiores velocidades.","Rodovias são sempre sem sinalização.","Urbanas não têm limites de velocidade.","Rodovias são apenas para caminhões.","Cada tipo de via exige comportamento adaptado e atenção específica."],["p1m1q265",1,0,"Por que as faixas pintadas no pavimento são tão vantajosas?","","Porque estão sempre no campo de visão do condutor enquanto dirige.","Porque são apenas decorativas.","Porque substituem agentes de trânsito.","Porque indicam pontos turísticos.","Marcas no solo guiam movimentos sem exigir olhar para placas laterais."],["p1m1q266",1,0,"Qual é a indicação de uma placa 'PARE'?","","É uma ordem absoluta: parar completamente e só seguir quando seguro.","É apenas uma sugestão.","É uma informação sobre velocidade.","É uma placa de indicação turística.","'PARE' é regulamentação que exige parada total para segurança."],["p1m1q267",1,0,"Qual a recomendação sobre manter distância do veículo à frente?","","Manter distância adequada para poder reagir a imprevistos.","Colar no carro da frente para 'fechar' trânsito.","Ultrapassar pela direita sempre.","Usar o celular para se distrair.","Distância é pilar da direção defensiva, permitindo tempo de reação."],["p1m1q268",1,1,"O que se entende por 'conversão à esquerda' ?","","Manobra que cruza o fluxo oposto e exige atenção extra.","Uma ultrapassagem pela direita.","Estacionar na esquerda da via.","Ignorar sinais de prioridade.","Conversão à esquerda envolve atravessar o fluxo contrário e requer paciência."],["p1m1q269",1,1,"Quando a faixa é destinada a ciclistas (ciclofaixa), o que é recomendado aos motoristas?","","Respeitar a faixa e dar espaço ao ciclista.","Ultrapassar rapidamente os ciclistas.","Parar sobre a ciclofaixa para desembarque.","Usar a ciclofaixa para estacionamento.","Ciclofaixas delimitam espaço específico; motoristas devem respeitar e manter distância."],["p1m1q270",1,1,"Em caso de mensagens conflitantes (agente, semáforo, placa), qual é a sequência de prioridade mencionada?","","Agente de trânsito > semáforo > placas e marcas no solo.","Placa > semáforo > agente.","Semáforo > placa > agente.","Marca no solo > placa > semáforo.","A hierarquia definida pelo CTB prioriza o agente em situações de conflito."],["p1m1q271",1,1,"Por que as infrações podem variar de leves a gravíssimas?","","Porque o risco e a gravidade do comportamento variam e as penas acompanham isso.","Porque os fiscais decidem aleatoriamente.","Porque depende do tipo de veículo.","Porque muda a cada cidade sem regra.","O material explica que diferenças de risco resultam em penalidades distintas."],["p1m1q272",1,1,"Qual a recomendação sobre 'velocidade inteligente'?","","Adaptar a velocidade conforme via, clima e tráfego, não só o limite.","Sempre dirigir no limite máximo permitido.","Andar sempre mais devagar que os demais.","Sempre usar piloto automático.","Velocidade inteligente prioriza controle e segurança sobre a velocidade legal máxima."],["p1m1q273",1,1,"Em vias urbanas próximas a escolas, qual comportamento é esperado do condutor?","","Reduzir a velocidade e aumentar atenção por crianças e pedestres.","Aumentar velocidade para liberar a via.","Ultrapassar outros veículos.","Estacionar sobre a calçada.","Áreas escolares demandam redução de velocidade e cuidado redobrado."],["p1m1q274",1,1,"O que define uma rodovia pavimentada?","","Via rural asfaltada ou de concreto que permite velocidades maiores com sinalização completa.","Uma via sem sinalização.","Uma via apenas para pedestres.","Uma rua urbana com muitos cruzamentos.","Rodovias pavimentadas têm características de segurança e permitem velocidades maiores."],["p1m1q275",1,1,"Por que a educação no trânsito (placas brancas) aparece em trechos perigosos?","","Porque reforçam comportamentos que reduzem risco nesses pontos.","Porque não há lugar melhor para colocar placas.","Porque substituem radares.","Porque apenas aumentam a visibilidade do local.","Placas educativas são colocadas onde reforçar a atenção tem efeito direto na segurança."],["p1m1q276",1,1,"Qual a função prática de uma faixa de aceleração em uma entrada de rodovia?","","Permitir que o veículo aumente velocidade e combine com o tráfego antes de inserir-se.","Forçar o motorista a frear.","Servir como estacionamento temporário.","Reduzir o número de faixas na rodovia.","Faixa de aceleração ajuda a integrar com segurança o fluxo de veículos."],["p1m1q277",1,1,"Por que é errado 'entrar devagar' na pista principal vindo da faixa de aceleração?","","Porque causa risco de colisão por diferença de velocidade com o tráfego.","Porque é legal em todos os casos.","Porque acelera o tráfego atrás.","Porque facilita a conversão.","Entrar devagar cria descontinuidade no fluxo e pode provocar colisões traseiras."],["p1m1q278",1,1,"Como o condutorde agir quanto às manobras de conversão?","","Usar calma, sinalizar e garantir visibilidade antes de executar a manobra.","Fazer rápidas manobras para poupar tempo.","Nunca sinalizar para confundir outros.","Ultrapassar pela direita ao converter.","Conversões seguras exigem calma, sinalização e atenção à visibilidade."],["p1m1q279",1,1,"O que se espera do condutor ao se aproximar de um cruzamento sem sinalização?","","Conhecer e aplicar as regras de preferência para evitar impasses.","Aguardar sempre que outro veículo se mova.","Passar sem reduzir a velocidade.","Sempre ceder a quem gritar mais alto.","Regras de preferência evitam conflitos e mantêm fluidez no cruzamento."],["p1m1q280",1,1,"Qual a diferença entre 'rodovia' e 'estrada de terra' no comportamento do condutor?","","Porque estradas de terra exigem redução de velocidade e mais cuidado devido à menor aderência.","Porque estradas de terra permitem velocidades maiores.","Porque a lei não se aplica nelas.","Porque são sempre seguras.","Estradas de terra têm menos segurança e requerem condução mais lenta e cautelosa."],["p1m1q281",1,2,"Por que a sinalização deve ser uniforme em todo o país?","","Para que uma mesma placa signifique a mesma ação em qualquer cidade, aumentando a previsibilidade.","Para permitir variações locais frequentes.","Para confundir visitantes.","Para favorecer o design regional.","Uniformidade garante que motoristas compreendam sinais independentemente do local."],["p1m1q282",1,2,"Como a sinalização horizontal complementa a vertical quando há conflito entre elas?","","A hierarquia define prioridade; marcas no solo orientam movimentos e, se houver conflito, segue-se a ordem legal.","A sinalização horizontal sempre prevalece.","A sinalização vertical sempre prevalece.","Conflitos não ocorrem entre sinalizações.","Em conflitos, é preciso considerar a hierarquia: agente, semáforo, placas, marcas no solo."],["p1m1q283",1,2,"Considerando direção defensiva, qual é a relação entre atenção, distância e antecipação?","","Atenção constante e manter distância permitem antecipar ações de outros e evitar sinistros.","Atenção é menos importante que velocidade.","Distância não influencia na antecipação.","Antecipação substitui atenção.","A combinação dos três cria o 'escudo' da direção defensiva, reduzindo riscos."],["p1m1q284",1,0,"Ao ver uma linha contínua amarela simples no centro da via, o que o condutor deve entender?","","É proibido ultrapassar naquele trecho.","A via é preferencial.","Pode ultrapassar com cuidado.","É uma faixa exclusiva de ônibus.","Linha amarela contínua indica proibição de ultrapassagem por motivos de segurança e visibilidade."],["p1m1q285",1,0,"Quando há duas linhas amarelas contínuas lado a lado, o que isso significa?","","A ultrapassagem é proibida para os dois sentidos.","Somente um lado pode ultrapassar.","É uma pista de aceleração.","É uma marcação de estacionamento.","Linhas duplas contínuas proíbem ultrapassagem para ambos os sentidos da via."],["p1m1q286",1,0,"Ao encontrar uma linha seccionada (tracejada) no centro da pista, o motorista pode:","","Ultrapassar com segurança, se as condições permitirem.","Parar sobre a linha.","Transitar entre as faixas livremente.","Fazer retorno em qualquer ponto.","A linha seccionada permite ultrapassagem quando há segurança e boa visibilidade."],["p1m1q287",1,0,"O que o motorista deve fazer ao ver faixas zebradas pintadas no chão?","","Evitar parar ou estacionar sobre elas.","Atravessar nelas para ganhar tempo.","Usar como área de espera.","Parar para desembarque.","As zebras são áreas de segurança e não devem ser ocupadas por veículos."],["p1m1q288",1,0,"Qual o comportamento correto ao ver uma faixa contínua branca separando faixas no mesmo sentido?","","Manter-se na faixa, sem mudar de pista.","Trocar de faixa rapidamente.","Ultrapassar o veículo à frente.","Estacionar no acostamento.","Linha branca contínua indica proibição de mudança de faixa no mesmo sentido."],["p1m1q289",1,0,"Em uma via com faixas tracejadas brancas, o que o condutor pode fazer?","","Mudar de faixa, desde que com segurança.","Parar sobre as linhas.","Fazer retorno.","Transitar sobre o canteiro.","As linhas brancas seccionadas permitem mudança de faixa em segurança."],["p1m1q290",1,0,"O que indica uma faixa de retenção antes de um semáforo?","","Ponto onde o veículo deve parar quando o sinal estiver vermelho.","Local para pedestres atravessarem.","Faixa exclusiva para motos.","Local de aceleração.","A faixa de retenção indica o limite de parada nos cruzamentos."],["p1m1q291",1,0,"Quando há uma faixa de pedestres após a faixa de retenção, o que o condutor deve fazer?","","Parar antes da faixa de pedestres.","Parar sobre a faixa.","Avançar lentamente sobre ela.","Acelerar para passar antes do pedestre.","A parada deve ser antes da faixa, preservando o espaço do pedestre."],["p1m1q292",1,0,"O que significam as setas pintadas no pavimento?","","Indicam o sentido ou obrigatoriedade de direção.","Enfeitam o pavimento.","Mostram que a via é de pedágio.","Avisam sobre obras próximas.","As setas são orientações de direção obrigatória ou recomendada."],["p1m1q293",1,0,"O que indica a marcação de canalização (faixas em “V” ou diagonais)?","","Área proibida para tráfego de veículos.","Local seguro para estacionar.","Faixa de ultrapassagem.","Trecho de conversão.","Canalizações organizam fluxos e devem ser respeitadas como áreas não transitáveis."],["p1m1q294",1,0,"Por que o condutor deve evitar circular sobre as marcas de canalização?","","Porque são áreas de separação de fluxos e não de circulação.","Porque podem danificar os pneus.","Porque reduzem o atrito.","Porque indicam locais de estacionamento.","Essas marcas delimitam espaços sem circulação — ignorá-las é infração."],["p1m1q295",1,0,"O que a linha de bordo amarela pode indicar?","","Proibição de parada e estacionamento.","Local de ultrapassagem permitida.","Zona escolar.","Faixa de ônibus.","Linha amarela no bordo da via sinaliza proibição de parada."],["p1m1q296",1,0,"O que o condutor pode fazer ao perceber uma faixa contínua amarela se transformando em tracejada?","","A partir dali, a ultrapassagem passa a ser permitida.","A ultrapassagem continua proibida.","É área escolar.","Deve estacionar o veículo.","A linha tracejada sinaliza início de trecho onde a ultrapassagem é possível."],["p1m1q297",1,0,"Em uma curva, por que costuma haver linha contínua?","","Porque a visibilidade é reduzida e éproibido ultrapassar.","Porque é uma área de estacionamento.","Porque facilita ultrapassar rápido.","Porque não há necessidade de sinalização.","Linha contínua reforça o perigo de ultrapassar em locais sem visibilidade."],["p1m1q298",1,1,"Ao ver placa com pictograma em forma de Y, o que isso significa?","A-9","Divisão de pistas — escolha o sentido antes do ponto.","Retorno obrigatório.","Local de ultrapassagem.","Área de estacionamento.","O formato em Y alerta sobre divisão de fluxo, e o motorista deve escolher o sentido correto."],["p1m1q299",1,0,"O que o condutor deve fazer ao se aproximar de uma área zebrada entre faixas?","","Evitar circular ou parar sobre a área zebrada.","Aproveitar para ultrapassar.","Usar para conversão rápida.","Estacionar brevemente.","A zebrada é área de separação de fluxos e não deve ser ocupada."],["p1m1q300",1,1,"Por que as linhas horizontais ajudam a fluidez do trânsito?","","Porque orientam condutores e reduzem dúvidas sobre posicionamento e manobras.","Porque substituem os semáforos.","Porque permitem estacionar onde quiser.","Porque reduzem o limite de velocidade.","A sinalização horizontal mantém o fluxo ordenado e previsível."],["p1m1q301",1,1,"Ao transitar em pista com setas de conversão à esquerda e em frente, o que o motorista pode fazer?","","Escolher entre seguir em frente ou virar à esquerda.","Fazer retorno no local.","Estacionar para esperar.","Virar à direita.","As setas informam as direções permitidas, e o condutor deve se posicionar conforme a intenção."],["p1m1q302",1,1,"Se uma faixa exclusiva de ônibus é delimitada por linha contínua, o que isso indica?","","É proibido transitar ou cruzar a faixa.","Pode cruzar rapidamente.","Pode estacionar brevemente.","Pode usar para conversão.","Linha contínua indica proibição total de cruzar a faixa exclusiva."],["p1m1q303",1,1,"O que o condutor deve fazer ao ver setas de convergência (duas setas unindo-se)?","","Reduzir e preparar-se para junção de faixas.","Acelerar para passar primeiro.","Parar no meio da pista.","Mudar de sentido.","Setas de convergência alertam para redução e atenção à fusão de tráfego."],["p1m1q304",1,1,"Se o motorista encontra faixas de pedestres em série, o que isso indica?","","Zona com travessia frequente, exigindo atenção constante.","Local de estacionamento.","Área de carga e descarga.","Cruzamento preferencial.","A repetição de faixas sinaliza alto fluxo de pedestres — atenção redobrada."],["p1m1q305",1,1,"Em vias com setas de retorno pintadas no solo, o que deve fazer o motorista?","","Fazer o retorno apenas naquele ponto indicado.","Fazer o retorno onde preferir.","Ignorar a seta.","Fazer ultrapassagem.","As setas delimitam o ponto autorizado para retorno, garantindo segurança."],["p1m1q306",1,1,"Qual o comportamento correto ao aproximar-se de linhas duplas, sendo uma contínua e outra tracejada?","","Apenas o lado da linha tracejada pode ultrapassar.","A ultrapassagem é proibida para ambos.","Os dois lados podem ultrapassar.","É faixa de pedestres.","O lado tracejado indica onde é permitido ultrapassar — o contínuo, não."],["p1m1q307",1,1,"O que a linha de canalização entre faixas de conversão representa?","","Espaço que separa fluxos diferentes e não pode ser ocupado.","Local de ultrapassagem.","Trecho de estacionamento.","Área de pedágio.","Canalização organiza o fluxo e proíbe circulação sobre ela."],["p1m1q308",1,1,"Por que a linha de bordo é importante em vias estreitas?","","Ajuda o condutor a manter o veículo corretamente posicionado na pista.","Serve apenas para ciclistas.","Indica local de pedágio.","Substitui a iluminação pública.","Linha de bordo auxilia o posicionamento seguro, principalmente à noite."],["p1m1q309",1,1,"O que o condutor deve evitar fazer em uma interseção com marcas de cruzamento pintadas em X?","","Parar sobre a área demarcada.","Aguardar para avançar.","Entrar mesmo com o cruzamento cheio.","Avançar o sinal vermelho.","Essas marcas indicam área de não bloqueio — o veículo não deve parar sobre o X."],["p1m1q310",1,2,"Por que a sinalização horizontal é considerada um complemento vital da vertical?","","Porque reforça mensagens diretamente no campo de visão do condutor.","Porque substitui todas as placas.","Porque é opcional em rodovias.","Porque só serve de enfeite.","As duas trabalham em conjunto — a vertical informa, a horizontal reforça visualmente."],["p1m1q311",1,2,"Como o condutor deve agir em uma via onde há marcações de canalização danificadas ou apagadas?","","Redobrar a atenção e seguir o fluxo, sem invadir áreas incertas.","Ignorar completamente a sinalização.","Usar o acostamento.","Seguir os outros veículos cegamente.","Mesmo com sinalização apagada, o motorista deve agir com cautela e prever limites de circulação."],["p1m1q312",1,2,"Por que as linhas seccionadas são mais usadas em retas do que em curvas?","","Porque nas retas há visibilidade suficiente para ultrapassagem segura.","Porque nas curvas é mais bonito.","Porque são mais fáceis de pintar.","Porque reduzem custos.","Nas curvas, a visibilidade reduzida exige linha contínua — nas retas, a tracejada é segura."],["p1m1q313",1,0,"As placas de indicação servem principalmente para:","","Informar direções, destinos e serviços disponíveis.","Proibir manobras perigosas.","Alertar sobre riscos na pista.","Indicar infrações de trânsito.","Placas de indicação têm função informativa e orientadora."],["p1m1q314",1,2,"Qual é a cor predominante das placas de indicação de destinos e direções em rodovias?","","Verde.","Vermelha.","Amarela.","Azul.","Placas verdes orientam sobre cidades, distâncias e direções."],["p1m1q315",1,0,"Em área urbana, uma placa azul com o símbolo de uma cruz vermelha indica:","SAU-10","A presença de um serviço de saúde nas proximidades.","Que é proibido estacionar.","Que há escola por perto.","Um ponto turístico.","Placas azuis identificam serviços públicos, como hospitais."],["p1m1q316",1,0,"Uma placa marrom com o símbolo de uma cachoeira indica:","TNA-05","Um atrativo turístico ou ponto de interesse.","Um risco de inundação.","A presença de obras na via.","Um serviço de emergência.","Placas marrons têm função turística."],["p1m1q317",1,0,"O que o motorista entende ao ver uma placa azul com o símbolo de um telefone?","SAU-06","Há telefone público disponível.","É obrigatório ligar para o Detran.","A via tem pedágio.","Há um posto de gasolina.","Placas azuis informam serviços úteis."],["p1m1q318",1,0,"As placas brancas de indicação são usadas para:","","Informar nomes de ruas ou bairros.","Proibir estacionamento.","Alertar sobre curvas.","Informar velocidades máximas.","Placas de fundo branco identificam locais e vias."],["p1m1q319",1,0,"O que o motorista deve fazer ao ver uma placa verde indicando “Saída 500 m”?","","Reduzir gradualmente e preparar-se para sair da rodovia.","Parar no acostamento.","Acelerar para não perder a saída.","Ignorar se o destino for próximo.","Essa placa antecipa a aproximação de uma saída."],["p1m1q320",1,0,"Uma placa azul com o símbolo de uma colher e garfo indica:","SAU-12","Restaurante ou lanchonete próxima.","Proibição de parar.","Área de carga e descarga.","Serviço mecânico.","Símbolo de alimentação disponível."],["p1m1q321",1,0,"Qual é a principal diferença entre uma placa de regulamentação e uma de indicação?","","A de regulamentação impõe regras; a de indicação apenas informa.","A de indicação tem formato redondo.","A de regulamentação é opcional.","A de indicação é sempre marrom.","Placas de regulamentação são obrigatórias; as de indicação orientam."],["p1m1q322",1,0,"O que o motorista entende ao ver uma placa azul com o símbolo de uma cama?","SAU-13","Indica um local com hospedagem disponível.","Indica área de descanso obrigatória.","Indica hospital.","Indica ponto de ônibus.","Símbolo de hospedagem, útil em longas viagens."],["p1m1q323",1,0,"As placas de indicação também podem mostrar:","","A distância em quilômetros até cidades próximas.","O limite de velocidade.","O tipo de solo da pista.","O horário de funcionamento de pedágios.","Informam distâncias e destinos."],["p1m1q324",1,0,"Em uma rodovia, a placa verde “Retorno a 2 km” informa:","","A distância até o local onde é permitido retornar.","Que é proibido retornar.","Que há um pedágio em 2 km.","Que o trânsito é mão única.","Sinaliza o ponto autorizado para retorno."],["p1m1q325",1,1,"Por que é importante que o motorista saiba identificar placas de indicação rapidamente?","","Porque ajudam na tomada de decisões sem distrações perigosas.","Porque evitam multas.","Porque substituem os mapas digitais.","Porque reduzem o consumo de combustível.","A leitura rápida evita decisões de última hora."],["p1m1q326",1,1,"Uma placa azul com símbolo de uma cruz verme ente","Sentido obrigatório à direita","Perigo de pista irregular","Ciclovia ao lado","Placas de serviços mostram abastecimento disponível."],["p1m1q335",1,0,"Lucas encontra uma placa branca com o nome da via. O que ela representa?","","Identificação da rua ou avenida","Proibição de tráfego de caminhões","Advertência de ponte móvel","Área de travessia escolar","Placas brancas servem para identificar logradouros."],["p1m1q336",1,0,"Gustavo vê uma placa marrom indicando “Cachoeira Véu da Noiva”. O que isso significa?","","Atrativo turístico adiante","Pista em obras","Risco de quedas de barreira","Sentido único obrigatório","Placas marrons indicam pontos turísticos."],["p1m1q337",1,0,"Joana vê placa azul com símbolo de hotel. O que isso indica?","SAU-13","Disponibilidade de hospedagem","Zona de pedágio","Área de risco de deslizamento","Fiscalização por radar","Placas azuis informam serviços auxiliares."],["p1m1q338",1,0,"Sara encontra placa azul com símbolo de ônibus. O que isso significa?","SAU-26","Área com rodoviária ou ponto de ônibus","Via exclusiva de carga","Estrada perigosa","Radar móvel adiante","Placa azul informa serviços públicos."],["p1m1q339",1,0,"Marcos vê placa azul com símbolo de pneu. O que ela indica?","SAU-08","Borracharia próxima","Presença de ciclistas","Restrição de ultrapassagem","Velocidade mínima obrigatória","Placa azul indica serviços ao motorista."],["p1m1q340",1,0,"Diego vê placa marrom com símbolo de museu. Que informação recebe?","THC-05","Local turístico ou cultural","Velocidade reduzida","Ponte móvel adiante","Pista escorregadia","Placas marrons comunicam turismo."],["p1m1q341",1,1,"Cléo encontra placa branca educativa “Reduza – Área Escolar”. Qual sua função?","","Conscientizar sobre velocidade em trecho sensível","Proibir ultrapassagens","Impor parada obrigatória","Indicar rotatória próxima","Placas brancas reforçam comportamentos seguros."],["p1m1q342",1,1,"Rafael vê placa azul anunciando “Polícia Rodoviária – 2 km”. O que isso indica?","","Posto de fiscalização adiante","Cruzamento perigoso","Bifurcação em T","Pista irregular","Placas azuis podem indicar postos de fiscalização."],["p1m1q343",1,1,"Júlia encontra placa verde com símbolo de aeroporto. Isso representa:","SAU-21","Acesso ao aeroporto próximo","Risco de aeronave baixa","Proibição de parada","Advertência de aclive","Placas verdes orientam destinos de grande importância."],["p1m1q344",1,1,"Bruno vê placa azul com símbolo de cadeira de rodas. O que significa?","DEF-01","Local acessível a pessoas com deficiência","Área proibida para pedestres","Velocidade mínima obrigatória","Pista com obras","A placa indica acessibilidade."],["p1m1q345",1,1,"Helena observa placa azul com símbolo de pedágio. O que ela comunica?","SAU-18","Existência de praça de pedágio adiante","Cruzamento perigoso","Ponte estreita","Área escolar","Serviços de fiscalização são indicados em azul."],["p1m1q346",1,2,"Tereza encontra placa verde listando diversas cidades com distâncias. O que isso comunica?","","Sequência organizada de destinos ao longo da rodovia","Limite de velocidade múltiplo","Proibição de trânsito pesado","Pista em obras","Placas verdes orientam trajetos de longo alcance."],["p1m1q347",1,2,"André vê placa azul com informação de “balança de pesagem”. O que ela indica?","","Posto de pesagem obrigatório para veículos de carga","Travessia de pedestres","Sentido único","Pista estreita","Placas de serviços indicam pontos de controle rodoviário."],["p1m1q348",1,2,"Márcia vê placa branca educativa “Use o Cinto – Salve Vidas”. Qual a função dela?","","Conscientizar sobre comportamento seguro","Proibir veículos grandes","Indicar estacionamento obrigatório","Alertar sobre curva acentuada","Placas educativas reforçam mensagens de segurança."],["p1m1q349",1,2,"Um motorista vê placa marrom com símbolo de patrimônio natural. O que isso representa?","TNA-06","Atrativo ambiental ou paisagístico","Proibição de ultrapassagem","Via com obras","Risco de queda de barreira","Placas turísticas divulgam lugares naturais."],["p1m1q350",1,2,"Jonas encontra placa verde com indicação de “Retorno 1 km”. O que isso informa?","","Ponto de retorno próximo, permitindo manobras seguras","Proibição de retorno","Risco de desmoronamento","Desvio temporário","Placas verdes ajudam na organização da navegação."],["p1m1q351",1,0,"O que a cor azul das placas de indicação representa?","","Informações úteis ao motorista","Riscos na pista","Regras obrigatórias","Situações emergenciais","O azul sinaliza serviços e informações gerais."],["p1m1q352",1,0,"Qual é a principal função das placas verdes?","","Orientar destinos e direções","Alertar sobre riscos","Imposição de regras","Indicar escolas","São o “GPS visual” das rodovias."],["p1m1q353",1,0,"Placas marrons servem para indicar o quê?","","Atrações turísticas e culturais","Áreas escolares","Proibições severas","Faixas exclusivas","Marrons remetem ao turismo."],["p1m1q354",1,0,"Qual é o papel das placas brancas dentro das placas de indicação?","","Reforçar mensagens educativas","Informar sobre pedágios","Alertar perigo","Indicar oficinas","São placas educativas de conscientização."],["p1m1q355",1,0,"Uma placa azul com símbolo de ônibus indica:","SAU-26","Terminal ou ponto de transporte","Proibição de ônibus","Área perigosa","Trânsito lento","Azul também marca serviços ao usuário."],["p1m1q356",1,0,"Uma placa azul com símbolo de pneu indica:","SAU-08","Borracharia","Restrição de tráfego","Radar","Curva perigosa","Serviços ao motorista são mostrados em azul."],["p1m1q357",1,0,"Uma placa marrom com símbolo de árvores indica:","TAR-03","Parque urbano","Área escolar","Perigo","Desvio","Marrons indicam turismo e natureza."],["p1m1q358",1,1,"Pedro avista placa verde indicando duas cidades e “200 m”. O que isso sinaliza?","","Distância até o ponto de decisão da bifurcação","Curva fechada","Velocidade máxima","Área escolar","Placas verdes podem antecipar trechos de decisão."],["p1m1q359",1,1,"Qual a diferença entre placas azuis e verdes dentro da categoria de indicação?","","Azuis informam serviços; verdes orientam trajetos","Verdes alertam perigo; azuis impõem regras","Azuis indicam proibições; verdes são temporárias","Nenhuma","Cada cor possui finalidade própria."],["p1m1q360",1,1,"Uma placa azul com símbolo de cruz vermelha indica:","SAU-10","Pronto Socorro","Igreja","Radares","Curva perigosa","Serviços médicos são indicados em azul."],["p1m1q361",1,1,"Em uma rodovia, Carla vê placa marrom com um símbolo de livro aberto e seta. O que isso comunica?","THC-11","Direção para biblioteca","Área de risco","Redução obrigatória","Proibição de tráfego","Placas verdes podem orientar destinos de serviços."],["p1m1q362",1,1,"Uma placa branca com texto curto como “USE O CINTO” indica:","","Mensagem educativa","Proibição","Risco imediato","Sentido obrigatório","Placas brancas reforçam comportamentos seguros."],["p1m1q363",1,1,"Paula vê placa azul com símbolo de cadeira de rodas e uma seta. O que isso indica?","DEF-01","Direção de ponto acessível","Proibição de parar","Risco de queda","Faixa exclusiva","Acessibilidade é indicada por símbolo universal."],["p1m1q364",1,2,"Uma placa verde exibindo três cidades com distâncias diferentes organiza:","","A sequência de destinos ao longo da rota","Ordens de parada obrigatória","Áreas escolares","Riscos múltiplos","Placas verdes funcionam como guias de navegação."],["p1m1q365",1,2,"Uma placa de indicação pode combinar palavras e símbolos. Qual a vantagem disso?","","Comunicação rápida e universal","Tornar a via mais bonita","Preencher espaço","Diminuir velocidade","Símbolos aceleram o entendimento."],["p1m1q366",1,2,"Em rodovia turística, placas marrons podem aparecer com frequência. Por quê?","","Indicam atrativos próximos ou zonas de interesse","Sinalizam perigo","Impõem regras","Indicam acessibilidade","Marrons guiam experiências de viagem."],["p1m1q367",1,2,"Uma placa azul com vários símbolos alinhados (hospital, restaurante, posto) indica:","","Conjunto de serviços disponíveis na área","Proibição de carga","Proximidade de obras","Local de pedágio","Agrupamentos de serviços auxiliam planejamento."],["p1m1q368",1,1,"“Ricardo está perdido e vê placa verde listando três cidades desconhecidas”. Qual melhor interpretação?","","Ela mostra os caminhos possíveis, cabendo escolher o desejado","Não deve seguir","É área de risco","Indica parada obrigatória","Placas verdes orientam rotas mesmo sem familiaridade."],["p1m1q369",1,2,"“Durante trilha turística, Helena dirige e vê sequência de placas marrons com símbolos naturais”. O que isso representa?","","Complexo turístico com vários atrativos","Via bloqueada","Curva perigosa","Restrição de tráfego","Placas marrons organizam oferta turística regional."],["p1m1q370",1,2,"Quando duas vias se cruzam e ambas possuem placa “PARE”, o condutor deve","","Parar e ceder a passagem a quem chegou primeiro ao cruzamento.","Avançar rapidamente.","Aguardar buzina do outro condutor.","Manter prioridade automática.","Nessa situação, aplica-se a regra de cortesia e prudência: cede passagem quem chega depois."],["p1m1q371",1,0,"Como deve ser usada a faixa de aceleração?","","Acelerando gradualmente até atingir a velocidade da via principal.","Parando para observar o trânsito.","Entrando direto na pista principal.","Reduzindo totalmente a velocidade.","Serve para ajustar a velocidade antes de se unir ao fluxo."],["p1m2q1",2,2,"Cassação da CNH ocorre, por exemplo, quando:","","o condutor dirige com o direito de dirigir suspenso ou reincide em determinadas infrações previstas no Código de Trânsito Brasileiro.","o condutor esquece de renovar a CNH dentro do prazo.","o condutor comete uma infração leve durante o período de suspensão.","o condutor acumula 20 pontos na CNH em um período de 12 meses.","Conforme o art. 263, incisos I e II, do Código de Trânsito Brasileiro, a cassação da CNH ocorre quando o condutor dirige com o direito de dirigir suspenso ou reincide, no período de 12 meses, em determinadas infrações graves previstas na lei."],["p1m2q2",2,2,"Qual a classificação de infração por dirigir sem possuir habilitação?","","Gravíssima.","Leve.","Média.","Só advertência.","Tipificação e medidas."],["p1m2q3",2,2,"Caso o comprador de um veículo não realize a transferência obrigatória, caberá ao vendedor (antigo proprietário) do veículo:","","Comunicar a venda ao Detran, senão continua responsável por infrações e tributos até a transferência.","Guardar o CRV e não falar nada.","Pagar o IPVA do novo dono.","Cancelar a placa.","Comunicação evita responsabilidade posterior. Art. 134 do CTB"],["p1m2q4",2,2,"É permitido transportar uma criança no colo, mesmo em trajeto curto?","","Não, isso configura uma infração de trânsito","Não, porque ela se distrai facilmente.","Não, porque pode sujar o banco.","Não, porque o cinto fica frouxo.","Art. 168 do CTB"],["p1m2q5",2,2,"Quando cabe advertência por escrito?","","Infrações leves ou médias, punidas com multa e sem outra infração nos últimos 12 meses.","Só gravíssima.","Em qualquer infração.","Apenas com sinistro.","Conforme dispõe o art. 267 do CTB, a penalidade de advertência por escrito deve ser imposta para infração de natureza leve ou média, passível de multa, caso o condutor não tenha cometido nenhuma outra infração nos últimos 12 (doze) meses."],["p1m2q6",2,0,"Maria possui permissão para dirigir e cometeu uma infração de natureza grave. O que ocorre com o processo de obtenção da Carteira Nacional de Habilitação (CNH)?","","Perde o direito de se obter a CNH e precisará reiniciar o processo para obtenção da CNH novamente.","Nada muda, ela conseguirá obter a CNH ao término de um ano.","Basta pagar uma taxa extra e segue.","Só precisa escrever uma carta ao Detran.","De acordo com o artigo 148, § 3º, do Código de Trânsito Brasileiro, o condutor que possui Permissão para Dirigir perde o direito de obter a Carteira Nacional de Habilitação (CNH) definitiva caso cometa infração grave, gravíssima ou seja reincidente em infração média durante o período permissionário."],["p1m2q7",2,2,"É correto parar ou estacionar na esquina a menos de 5 metros do cruzamento?","","Não. Isso esconde o carro e aumenta o risco de batida.","Sim, se for rapidinho.","Sim, se ligar o pisca-alerta.","Sim, se deixar alguém dentro.","Conforme estabelece o art. 181, inciso I do CTB, estacionar o veículo nas esquinas e a menos de 5 (cinco) metros do bordo do alinhamento da via transversal é considerado infração média, sujeita a multa e remoção do veículo. A restrição de 5 metros visa garantir a segurança e a visibilidade dos motoristas nas manobras de conversão e entrada no cruzamento."],["p1m2q8",2,0,"O que é infração de trânsito?","","Inobservância a qualquer preceito do CTB.","Qualquer ato que desagrada outro condutor.","Só bater o carro em sinistro.","Um aviso sem efeito legal.","Infração é violação expressa em lei, tratada no sistema de fiscalização."],["p1m2q9",2,2,"O que significa a parada de um veículo de acordo com o Código de Trânsito Brasileiro?","","Imobilizar o veículo por pouco tempo só para embarcar ou desembarcar, em local permitido.","Largar o carro por horas na calçada.","Deixar o carro com motor ligado em qualquer lugar.","Parar no meio do cruzamento para telefonar.","Parada: imobilização do veículo com a finalidade e pelo tempo estritamente necessário para efetuar embarque ou desembarque de passageiros. Glossário do CTB"],["p1m2q10",2,1,"Parar o carro a menos de cinco metros da esquina é:","","Infração de trânsito sujeita a multa.","Permitido se for rápido.","Permitido à noite.","Aceitável em ruas pouco movimentadas.","Reduz a visibilidade e aumenta o risco de colisão. Art. 181, inciso I do CTB"],["p1m2q11",2,1,"Parar o veículo em vaga de idoso sem credencial que comprove essa condição é:","","Infração gravíssima.","Permitido por poucos minutos.","Aceitável se for rápido.","Apenas advertência.","A multa protege o direito de mobilidade e acessibilidade. Art, 181, inciso XX do CTB"],["p1m2
