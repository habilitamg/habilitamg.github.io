0,"Quando você deve, de fato, parar o seu veículo no acostamento de uma rodovia?","","Apenas em caso de emergência (pneu furado, problema mecânico, mal-estar).","Sempre que precisar usar o celular ou mandar mensagem.","Sempre que sentir sono ou cansaço.","Para fazer um lanche ou tomar água.","O acostamento é uma área de emergência e não deve ser usado para paradas improvisadas ou sem necessidade."],["p1m3q472",3,0,"Na cidade, quais atitudes de parada são citadas como incorretas e que atrapalham o fluxo do trânsito?","","Não parar em fila dupla ou sobre a calçada.","Parar no sinal vermelho ou dar preferência a pedestres.","Estacionar corretamente em vagas permitidas.","Parar nos postos de gasolina.","Parar em fila dupla ou sobre a calçada é uma atitude que coloca pedestres em risco e desorganiza o trânsito."],["p1m3q473",3,0,"Ao dirigir em rodovias, qual a principal diferença em relação à cidade que aumenta muito a sua responsabilidade?","","A velocidade ser bem mais rápida.","O trânsito ser muito mais lento.","A distância entre os carros ser menor.","A visibilidade ser melhor por não ter prédios.","A alta velocidade nas rodovias faz com que tudo aconteça mais rápido, exigindo responsabilidade total do condutor."],["p1m3q474",3,0,"A primeira habilitação que você recebe (PPD) só é convertida em CNH definitiva depois de 1 ano se você tiver dirigido com:","","Cuidado e responsabilidade.","Alta velocidade para cumprir o prazo.","Apenas em vias locais.","O máximo de reincidências em infração média.","O período da PPD é a fase de aprendizado e responsabilidade redobrada, sendo um teste para a CNH definitiva."],["p1m3q475",3,0,"Quais equipamentos de segurança, além da cadeirinha infantil, é crucial para a proteção de quem está dentro e fora do veículo, segundo o material?","","Cinto, airbag, apoio de cabeça e capacete.","Pneus novos e estepe.","Som automotivo potente.","Rádio comunicador e GPS.","O uso correto do cinto, airbag, apoio de cabeça e capacete é vital para a proteção no trânsito."],["p1m3q476",3,0,"Onde você deve planejar suas paradas para usar o banheiro ou esticar as pernas durante uma longa viagem pela rodovia?","","Postos de gasolina e áreas de descanso.","Acostamentos ou debaixo de viadutos.","Faixas de rolamento ou pontes.","Onde o celular tiver sinal.","É essencial planejar as paradas em locais seguros e apropriados (postos e áreas de descanso)."],["p1m3q477",3,0,"Para a Categoria B, qual tipo de veículo se encaixa na descrição de \"uso pessoal ou familiar\", desde que respeite os limites de peso e lugares?","","Carros de Passeio (sedans, hatches, SUVs e picapes leves).","Ônibus articulado e caminhões.","Motocicletas e motonetas.","Veículos de mais de 8 lugares.","Carros de passeio e utilitários leves (até 3.500~kg e 8 lugares) são o foco da Categoria B."],["p1m3q478",3,1,"Na condução em uma Estrada de Terra, a baixa segurança e aderência exigem qual ação do motorista no volante?","","Manter as duas mãos firmes no volante para correções constantes na direção.","Manter apenas uma mão, para ter mais agilidade ao fazer curvas.","Soltar o volante e deixar o carro seguir a direção sozinho.","Segurar o volante com uma mão e usar a outra para segurar objetos.","Em estradas não pavimentadas, a direção exige firmeza e correções constantes, o que só é possível com as duas mãos no volante."],["p1m3q479",3,1,"O que as Vias Coletoras fazem no sistema de trânsito urbano?","","Fazem a ligação entre as ruas dos bairros e as grandes avenidas.","Ligam estados e permitem velocidade de 110km/h.","Servem apenas para trânsito de ônibus e vans.","Cortam a cidade sem semáforos a 80km/h.","As Vias Coletoras têm a função de distribuir o tráfego, ligando vias menores (Locais) às maiores (Arteriais)."],["p1m3q480",3,1,"Se você tem a PPD, qual o risco ao cometer uma infração média (como dirigir sem atenção) pela segunda vez em menos de um ano?","","Ser reincidente em infração média e perder o direito à CNH definitiva.","Ter a PPD renovada por mais 1 ano.","Ter que pagar a multa, mas nada mais acontece com a habilitação.","Perder apenas os pontos da infração.","O material proíbe ser reincidente em infração média, o que significa que duas infrações médias já são suficientes para reprovar na PPD."],["p1m3q481",3,1,"Se você está dirigindo na rodovia e tem que fazer uma curva fechada, qual erro você deve evitar durante a manobra?","","Frear bruscamente durante a curva.","Reduzir a velocidade antes de entrar na curva.","Acelerar suavemente na saída da curva.","Usar o farol baixo ligado.","Frear bruscamente durante a curva pode fazer você perder totalmente o controle do veículo, um erro grave de direção."],["p1m3q482",3,1,"Na cidade, o fluxo é intenso e a velocidade é menor. Qual é a sua melhor atitude para que o trânsito flua melhor e os riscos diminuam significativamente?","","Saber onde está e como deve se comportar, adaptando-se ao tipo de via.","Tentar manter a velocidade máxima em todas as vias.","Ignorar a sinalização se ela estiver te atrasando.","Usar a preferência a todo custo.","Entender o tipo de via e adaptar o comportamento a ela (Direção Defensiva) é a base para diminuir os riscos."],["p1m3q483",3,1,"O que diferencia uma Via Local (30km/h) de uma Via Coletora (40km/h) na cidade?","","A Via Local é a rua do bairro, e a Coletora faz a ponte entre o bairro e as grandes avenidas.","A Via Local tem semáforos, e a Coletora não.","A Via Coletora é uma via expressa sem cruzamentos.","A Via Local só permite a passagem de carros, e a Coletora, de caminhões.","A função da via é o que define o tipo e o limite de velocidade: a Local é de convivência (bairro), e a Coletora, de distribuição."],["p1m3q484",3,1,"Se você tem um problema mecânico na rodovia e precisa parar no acostamento, o triângulo de sinalização deve ser colocado:","","A pelo menos 30 metros atrás do carro.","No exato local onde o carro parou.","A 10 metros atrás do carro.","Na frente do carro, voltado para a via.","A distância de 30 metros é a recomendada para que os outros motoristas tenham tempo hábil de reação e desvio."],["p1m3q485",3,1,"Para conseguir tirar sua primeira CNH (Categoria AB), qual é a primeira etapa que você precisa concluir?","","Aprovação em todas as partes teóricas e práticas e ser aprovado em todos os exames.","Ter completado um ano de PPD.","Comprar um veículo novo e emplacado.","Dirigir por 50 horas na cidade.","A primeira etapa, antes de receber a PPD, é ser aprovado em todas as fases do processo de formação de condutores."],["p1m3q486",3,2,"O condutor deve respeitar o tipo de via onde está, pois a atenção e a distância do carro da frente devem ser maiores em vias de maior fluxo e velocidade. Qual o nome dessa base fundamental da direção?","","Direção Defensiva.","Direção Agressiva.","Direção Punitiva.","Direção Terapêutica.","A Direção Defensiva exige que você olhe para o ambiente ao redor (o tipo de via) e adapte seu comportamento de acordo."],["p1m3q487",3,2,"Para obter as categorias mais avançadas (C, D e E), que são necessárias para dirigir caminhões, ônibus e vans, qual é a condição de experiência que você deve ter?","","Já ter experiência com a habilitação básica (A ou B) e dominar bem a direção.","Ter 30 anos ou mais de idade.","Ter uma pontuação perfeita em todos os exames.","Ter feito apenas aulas práticas e não teóricas.","As categorias mais avançadas só podem ser obtidas após o motorista já ter dominado a direção e ganhado experiência com a habilitação básica."],["p1m3q488",3,0,"Qual o limite máximo de lugares que um veículo da Categoria B pode ter, sem contar o motorista?","","8 lugares.","5 lugares.","10 lugares.","12 lugares.","A Categoria B permite dirigir veículos com, no máximo, 8 lugares, fora o motorista."],["p1m3q489",3,0,"Por quanto tempo a Permissão Para Dirigir (PPD) é válida?","","1 (um) ano inteiro.","6 (seis) meses.","2 (dois) anos.","5 (cinco) anos.","A PPD é a sua habilitação provisória, com validade de um ano."],["p1m3q490",3,0,"Qual é o limite de velocidade máxima em uma Via Local, a rua tranquila do seu bairro?","","30km/h.","40km/h.","60km/h.","80km/h.","As Vias Locais são áreas de convivência e, por isso, têm o limite mais baixo, de 30km/h."],["p1m3q491",3,0,"Qual o limite de velocidade em uma Via Arterial, que tem bastante fluxo, semáforos e faixas de pedestres?","","60km/h.","80km/h.","40km/h.","30km/h.","Nas Vias Arteriais, que são as avenidas importantes que ligam bairros, a velocidade máxima é de 60km/h."],["p1m3q492",3,0,"Qual o limite de velocidade em uma Via de Trânsito Rápido, a grande avenida expressa que não tem cruzamentos diretos?","","80km/h.","60km/h.","40km/h.","110km/h.","As Vias de Trânsito Rápido são os eixos de maior fluidez na cidade, com limite de $80~km/h$."],["p1m3q493",3,0,"Em qual tipo de via urbana o limite de velocidade é de 40km/h e sua função é fazer a ligação entre as ruas dos bairros e as grandes avenidas?","","Via Coletora.","Via Arterial.","Via Local.","Via de Trânsito Rápido.","As Vias Coletoras têm movimento moderado e ligam as vias menores às maiores, com limite de 40km/h."],["p1m3q494",3,0,"Qual tipo de via urbana é caracterizada por ser uma grande avenida expressa que não tem semáforos e nem cruzamentos diretos?","","Vias de Trânsito Rápido.","Vias Locais.","Vias Arteriais.","Vias Coletoras.","As Vias de Trânsito Rápido são os grandes eixos que cortam a cidade com maior fluidez."],["p1m3q495",3,0,"Qual o nome da via urbana definida como \"área de convivência\" e onde é comum encontrar crianças brincando?","","Vias Locais.","Vias Arteriais.","Vias Coletoras.","Vias de Trânsito Rápido.","As Vias Locais são as ruas do bairro, onde ficam as casas e o trânsito é mais lento e de convivência."],["p1m3q496",3,0,"O que você recebe após ser aprovado em todas as etapas teóricas e práticas do processo de formação?","","A PPD (Permissão Para Dirigir).","A CNH definitiva.","Uma habilitação válida por 5 anos.","Uma habilitação que permite dirigir caminhões e ônibus.","A PPD é o primeiro documento de habilitação, válido por um ano."],["p1m3q497",3,0,"Qual a regra de infração que se aplica à PPD em relação a uma infração de natureza grave?","","Você não pode cometer nenhuma infração grave.","É permitido cometer até duas infrações graves.","É permitido cometer apenas uma infração grave.","Só a infração gravíssima é proibida no período da PPD.","Para obter a CNH definitiva, o condutor não pode cometer nenhuma infração grave, gravíssima ou ser reincidente em média."],["p1m3q498",3,1,"O que significa ser reincidente em infração média no período da PPD?","","Cometer a mesma infração média pela segunda vez e perder o direito à CNH definitiva.","Cometer duas infrações leves no período de um ano.","Cometer uma infração média e uma grave.","Cometer uma infração gravíssima e uma média.","O condutor da PPD não pode ser reincidente em infração média, ou seja, cometer a mesma infração média duas vezes."],["p1m3q499",3,0,"Qual o nome dado às ruas e avenidas dentro das cidades?","","Vias Urbanas.","Vias Rurais.","Rodovias.","Estradas.","Vias Urbanas são as ruas e avenidas que você encontra dentro das cidades."],["p1m3q500",3,0,"Qual o nome dado às rodovias e estradas que ligam cidades e estados?","","Vias Rurais.","Vias Urbanas.","Vias Locais.","Vias de Trânsito Rápido.","Vias Rurais são as rodovias e estradas usadas para viagens e para ligar estados."],["p1m3q501",3,0,"O que os equipamentos de segurança, como cinto, airbag, apoio de cabeça e capacete, podem fazer por quem está dentro e fora do veículo?","","Podem salvar vidas.","Apenas dar conforto na direção.","Apenas evitar multas.","Aumentar a velocidade.","O uso correto desses equipamentos é vital para a proteção no trânsito e pode salvar vidas."],["p1m3q502",3,0,"Na cidade, ao se aproximar de um cruzamento, qual sua principal atitude de segurança?","","Aproxime-se com calma, olhe para todos os lados e dê a preferência.","Acelere para passar antes dos outros veículos.","Ignore a sinalização se não tiver ninguém vindo.","Use o farol alto para sinalizar sua preferência.","O material orienta a respeitar a sinalização e dar a vez para quem tem a preferência."],["p1m3q503",3,0,"O que você deve fazer ao dirigir em Áreas Sensíveis, como perto de escolas, hospitais e faixas de pedestres?","","Reduzir a velocidade e ter atenção redobrada.","Manter a velocidade máxima permitida na via.","Usar o acostamento para parar.","Ignorar as faixas de pedestres se não houver ninguém em cima delas.","A vida de outras pessoas depende da sua cautela, por isso a velocidade deve ser reduzida e a atenção, redobrada."],["p1m3q504",3,0,"Quais são as duas categorias básicas que você escolhe ao tirar sua primeira CNH?","","Categoria A (motos) ou Categoria B (carros).","Categoria C (caminhões) ou D (ônibus).","Categoria E (veículos articulados) ou Categoria B.","Categoria AB (motos e carros) ou Categoria C (caminhões).","A primeira escolha é sempre entre motos (A) ou carros (B), podendo ser as duas (AB)."],["p1m3q505",3,0,"Qual o tipo de veículo de três rodas com motor que se encaixa na Categoria A?","","Triciclos motorizados.","Veículos de três rodas sem motor.","Carros de passeio de três rodas.","Ciclomotores com quatro rodas.","A Categoria A permite pilotar veículos de duas ou três rodas com motor."],["p1m3q506",3,0,"Qual o nome dado às vias rurais asfaltadas ou de concreto que permitem velocidades maiores por terem boa aderência?","","Rodovias Pavimentadas.","Estradas de Terra.","Vias Locais.","Vias Coletoras.","Rodovias Pavimentadas são as vias rurais mais seguras e com melhor estrutura para alta velocidade."],["p1m3q507",3,0,"O que o condutor deve manter sempre ligado na rodovia, mesmo durante o dia, para ajudar outros motoristas a perceberem sua presença?","","O farol baixo.","O farol alto.","As luzes de neblina.","O pisca-alerta.","O farol baixo aceso, mesmo de dia, não é \"frescura\", é segurança para ser visto a distância."],["p1m3q508",3,0,"Nas curvas da rodovia, qual a principal ação que você deve tomar antes de entrar na curva?","","Reduzir a velocidade.","Frear bruscamente durante a curva.","Acelerar o máximo possível.","Manter a velocidade constante.","Reduzir a velocidade antes de entrar na curva é o primeiro passo para fazer a manobra em segurança."],["p1m3q509",3,0,"Em que tipo de vias urbanas a velocidade máxima é \"bem baixinha\" (30km/h), perto de escolas, hospitais e faixas de pedestres?","","Em zonas residenciais e perto de escolas.","Nas Vias de Trânsito Rápido.","Nas Vias Arteriais.","Nas Vias Coletoras.","As zonas residenciais e próximas a escolas são as áreas mais sensíveis, com o menor limite de velocidade."],["p1m3q510",3,0,"Quais atitudes incorretas de parada o material cita que atrapalham o fluxo do trânsito e colocam pedestres em risco?","","Parar em fila dupla ou sobre a calçada.","Estacionar corretamente em vagas.","Parar no sinal vermelho ou dar preferência a pedestres.","Parar em postos de gasolina.","O material alerta que parar em fila dupla ou sobre a calçada desorganiza o fluxo e é perigoso para pedestres."],["p1m3q511",3,0,"Como é definida a Direção Segura?","","Hábitos e escolhas conscientes que valorizam o respeito, a empatia e a vida.","Leis de trânsito e sinalizações.","Regras de velocidade e multas.","Categorias de habilitação.","O material define a direção segura como um conjunto de hábitos, não apenas regras."],["p1m3q512",3,0,"Qual tipo de veículo com motor se enquadra na Categoria A?","","Motocicletas de qualquer cilindrada.","Carros de passeio com motor.","Caminhões leves com peso total de 3.500kg.","Veículos sem motor.","Motocicletas, motonetas, ciclomotores e triciclos são o foco da Categoria A."],["p1m3q513",3,0,"Se você possui a Categoria B, pode dirigir caminhões, ônibus e vans?","","Não, pois esses veículos exigem categorias específicas (C, D e E).","Sim, desde que o peso total não passe de 3.500kg.","Sim, pois a Categoria B engloba todos os veículos motorizados.","Apenas se o veículo tiver no máximo 8 lugares, sem contar o motorista.","Caminhões, ônibus e vans exigem categorias mais avançadas, obtidas após a experiência na categoria básica."],["p1m3q514",3,0,"Qual é a Dica de Ouro para dirigir na cidade, onde a convivência é próxima e o ritmo é mais lento?","","Paciência e atenção são suas melhores ferramentas.","Velocidade máxima é sua meta.","A preferência é sua, não a perca.","Buzinar o tempo todo é a melhor forma de sinalizar.","Na cidade, paciência e atenção são essenciais devido à proximidade com outros usuários da via."],["p1m3q515",3,1,"Qual o limite máximo de peso total (PBT) que um veículo da Categoria B pode ter?","","3.500kg (três mil e quinhentos quilos).","4.500kg (quatro mil e quinhentos quilos).","1.000kg (mil quilos).","5.000kg (cinco mil quilos).","O limite de peso para carros de passeio e utilitários leves na Categoria B é de $3.500~kg$."],["p1m3q516",3,1,"Se o condutor com PPD cometer uma infração média (como dirigir sem atenção) e depois repetir a mesma infração média em menos de um ano, qual é a consequência?","","Perderá o direito à CNH definitiva por ter sido reincidente em infração média.","Terá que pagar a multa, mas nada acontece com a PPD.","Terá a PPD renovada por mais 6 meses.","Poderá solicitar a CNH definitiva normalmente após 1 ano.","A PPD é suspensa se houver reincidência em infração média."],["p1m3q517",3,1,"Na prática, o que a Direção Defensiva ensina a fazer para proteger sua vida e a dos outros?","","Manter a atenção, antecipar imprevistos e prever situações de risco.","Dirigir no limite de velocidade, sem se preocupar com os outros.","Confiar apenas na preferência que você tem na via.","Fazer ultrapassagens arriscadas para evitar congestionamento.","A Direção Defensiva é a arte de antecipar problemas e manter a atenção total."],["p1m3q518",3,1,"Qual a função das Vias Coletoras no sistema de trânsito urbano?","","Fazer a ligação entre as ruas dos bairros (Locais) e as grandes avenidas (Arteriais).","Ligar cidades e estados, sem semáforos.","Servir apenas como área de convivência e lazer.","Cortar a cidade em grandes eixos expressos.","As Coletoras fazem a distribuição do tráfego, ligando os pontos menores aos maiores."],["p1m3q519",3,1,"Qual a \"boa regra\" de tempo sugerida para manter a distância de segurança em rodovias?","","Manter pelo menos 2 segundos de distância do veículo da frente.","Manter 1 segundo de distância do veículo da frente.","Manter a distância de 5 metros do veículo da frente.","Manter a distância de 30 metros do veículo da frente.","O cálculo em tempo, usando um ponto de referência e contando 2 segundos, é a forma mais segura de medir a distância."],["p1m3q520",3,1,"O farol baixo ligado na rodovia, mesmo de dia, ajuda outros motoristas a perceberem sua presença com mais facilidade em quais condições?","","Em dias nublados, com neblina ou quando o sol está baixo no horizonte.","Apenas em dias de chuva forte.","Apenas à noite ou em túneis.","Apenas para piscar e sinalizar a intenção de ultrapassar.","O farol baixo aumenta a visibilidade do seu veículo em todas essas condições de pouca luz."],["p1m3q521",3,1,"O que você deve fazer depois de passar pelo ponto mais fechado de uma curva na rodovia?","","Acelerar suavemente na saída.","Frear bruscamente na saída.","Manter o volante virado para o lado da curva.","Deixar o veículo seguir a inércia da curva.","A regra é: entrar devagar, e acelerar suavemente na saída para retomar a velocidade."],["p1m3q522",3,1,"Em viagens longas, onde você deve planejar suas paradas para usar o banheiro, tomar um café ou esticar as pernas?","","Postos de gasolina e áreas de descanso que aparecem ao longo da rodovia.","No acostamento da rodovia, a qualquer momento.","Debaixo de viadutos ou pontes.","Em qualquer lugar que não tenha fiscalização.","As paradas devem ser feitas em locais seguros e apropriados (postos e áreas de descanso)."],["p1m3q523",3,1,"Por que a atenção precisa ser redobrada e a velocidade, reduzida, perto de escolas, hospitais e faixas de pedestres?","","Porque a vida de outras pessoas depende da sua cautela.","Porque você será multado se não reduzir a velocidade.","Porque o trânsito flui melhor se você dirigir devagar.","Porque é o único lugar na cidade onde a regra dos 30km/h se aplica.","As Áreas Sensíveis exigem maior cautela para proteger crianças, idosos e pedestres."],["p1m3q524",3,1,"O que as Vias Arteriais (limite de 60km/h) têm que te faz parar com frequência, diferentemente das Vias de Trânsito Rápido?","","Vários semáforos e faixas de pedestres.","Acostamentos para paradas improvisadas.","Muita poeira e cascalho.","Velocidade máxima de 80km/h.","As Arteriais são avenidas importantes, mas possuem cruzamentos e semáforos que exigem paradas frequentes."],["p1m3q525",3,1,"Qual o principal risco de improvisar paradas em locais perigosos, como no acostamento sem necessidade?","","Coloca em risco outros motoristas que podem se distrair ou precisar desviar.","Seu carro será rebocado imediatamente.","Você será obrigado a pagar um pedágio.","Seu pneu pode furar se você parar no acostamento.","A parada indevida no acostamento é um perigo não só para você, mas também para os outros motoristas."],["p1m3q526",3,1,"Qual é a condição de experiência necessária para que o condutor possa obter as categorias mais avançadas (Caminhões, Ônibus e Vans)?","","Já ter experiência e dominar bem a direção com a habilitação básica (A ou B).","Ter mais de 30 anos de idade.","Ter uma pontuação perfeita em todos os exames.","Ter tirado a primeira habilitação (PPD) há mais de 5 anos.","O processo para categorias C, D e E exige que você já seja um condutor experiente nas categorias básicas."],["p1m3q527",3,0,"Qual o tipo de via rural que é descrita como não pavimentada, sendo de terra batida ou cascalho, e que exige mais cuidado?","","Estradas de Terra.","Rodovias Pavimentadas.","Vias Arteriais.","Vias de Trânsito Rápido.","Estradas de Terra são as vias rurais não pavimentadas, ligando fazendas e comunidades rurais."],["p1m3q528",3,0,"O que o material afirma ser a atitude que faz toda a diferença no trânsito, ao lado de revisar os equipamentos?","","Manter a calma no trânsito.","Usar o farol alto em todas as vias.","Dirigir o mais rápido possível.","Ignorar a preferência de outros motoristas.","O cuidado com o veículo (revisão) e o comportamento (manter a calma) andam juntos para a direção segura."],["p1m3q529",3,0,"Qual o procedimento correto que o condutor deve adotar ao dirigir sob neblina pesada?","","Ligar o farol baixo e os faróis de neblina (se tiver), e nunca usar o farol alto.","Usar apenas o farol alto, pois ele consegue \"cortar\" melhor a neblina densa.","Desligar todos os faróis para que as luzes não reflitam na neblina e ofusquem o motorista.","Ligar apenas o pisca-alerta e manter a velocidade normal.","O material instrui que na neblina, deve-se \"Ligar o farol baixo e os faróis de neblina, se tiver. Nunca use farol alto na neblina!\""],["p1m3q530",3,1,"Você está em uma viagem longa e começa a sentir os olhos pesados e bocejar muito. Qual o tempo mínimo de descanso recomendado antes de voltar a dirigir?","","Parar e descansar no mínimo 20 minutos, além de tomar um café ou lavar o rosto.","Continuar dirigindo e abrir a janela para que o ar frio o mantenha acordado.","Parar apenas por 5 minutos, o suficiente para uma pequena caminhada.","Parar e tentar ser \"herói\", ignorando os sinais de fadiga. 4","O material afirma que, ao sentir fadiga, deve-se \"Descanse 20 minutos, tome um café, lave o rosto.\""],["p1m3q531",3,0,"Qual a regra geral de uso que se aplica a todos os dispositivos para crianças (bebê conforto, cadeirinha, assento de elevação)?","","Devem ser utilizados sempre no banco traseiro de acordo com a idade e o peso da criança.","Devem ser utilizados no banco dianteiro, desde que o airbag esteja desligado.","Podem ser utilizados no banco traseiro ou dianteiro, dependendo da conveniência do motorista.","A obrigatoriedade só se aplica a viagens em rodovias, não em perímetros urbanos.","O texto afirma que os dispositivos devem ser usados \"sempre no banco traseiro de acordo com a idade da criança.\""],["p1m3q532",3,1,"Para que o apoio de cabeça seja eficaz em evitar lesões no pescoço, qual deve ser seu posicionamento correto?","","Deve ficar na altura do centro da cabeça.","Deve ficar na altura do pescoço, para suportar a coluna cervical.","Deve ser removido em viagens longas para evitar tensão na nuca.","Deve ficar o mais baixo possível para que a cabeça fique livre para mover-se.","O apoio deve ficar \"na altura do centro da cabeça, para evitar lesões no pescoço.\""],["p1m3q533",3,0,"Qual o tipo de calçado desaconselhado para a condução do veículo?","","Chinelos e calçados que não ficam firmes nos pés.","Botas de cano alto para proteção dos tornozelos.","Tênis esportivo com cadarços apertados.","Sapatos de salto alto, desde que sejam justos no pé.","O material alerta que \"Chinelos e calçados que não ficam firmes nos pés podem comprometer o uso dos pedais\"."],["p1m3q534",3,1,"Qual a faixa de idade e peso que exige o uso do dispositivo de retenção Bebê Conforto?","","Recém-nascidos e bebês com até 1 ano de idade ou até 13 kg.","Crianças de 1 a 4 anos ou com peso entre 9 e 18 kg.","Crianças de 4 a 10 anos ou até 1,45 m de altura.","Crianças com mais de 7 anos e meio e mais de 1,45 m.","O Bebê Conforto é \"Essencial para recém-nascidos e bebês até 1 ano de idade ou 13 kg.\""],["p1m3q535",3,2,"O Bebê Conforto deve ser instalado virado para trás. Qual é a justificativa crucial para essa posição?","","Protege melhor a cabeça e a coluna vertebral do bebê em caso de colisão.","Permite que o bebê tenha uma visão completa do trânsito no banco traseiro.","Facilita a instalação no sistema ISOFIX ou cinto de segurança do veículo.","Garante que o bebê receba o ar frio do ar-condicionado frontal.","A posição de costas \"protege melhor a cabeça e o pescoço do bebê.\""],["p1m3q536",3,1,"Qual a faixa de idade e peso recomendada para o uso da Cadeirinha no banco traseiro?","","Crianças de 1 a 4 anos ou com peso entre 9 e 18 kg.","Crianças com até 1 ano ou com peso até 13 kg.","Crianças de 4 a 10 anos ou com peso entre 15 e 36 kg.","Crianças com mais de 10 anos e mais de 1,45 m de altura.","A Cadeirinha é indicada para \"crianças de 1 a 4 anos ou com peso entre 9 e 18 kg.\""],["p1m3q537",3,1,"O uso do Assento de Elevação é obrigatório até qual idade ou altura da criança?","","Para crianças de 4 a 10 anos ou até 1,45 m de altura.","Apenas até os 7 anos e meio, independentemente da altura.","Apenas até a criança atingir 36 kg, independentemente da altura.","O assento de elevação só é obrigatório para crianças com peso acima de 25 kg.","O Assento de Elevação é para crianças \"de 4 a 10 anos ou até 1,45 m de altura.\""],["p1m3q538",3,2,"Transportar crianças sem os dispositivos de retenção adequados ou de forma incorreta constitui qual tipo de infração de trânsito, segundo a legislação?","","Infração gravíssima, com 7 pontos na CNH, multa e retenção do veículo.","Infração média, com 4 pontos na CNH e multa, mas sem retenção do veículo.","Infração grave, com 5 pontos na CNH, multa e apenas advertência por escrito.","Infração leve, com 3 pontos na CNH e retenção do veículo.","O material lista as consequências legais: \"infração gravíssima, com 7 pontos na CNH, multa e retenção do veículo.\""],["p1m3q539",3,2,"O que a inércia faz com o corpo dos ocupantes de um veículo em caso de colisão?","","Faz com que seu corpo continue se movendo na velocidade original do veículo.","Faz com que seu corpo se fixe imediatamente ao assento, amortecendo o impacto.","Faz com que a força do impacto seja distribuída apenas no ombro.","Faz com que o airbag infle mais lentamente, protegendo o ocupante.","O texto explica: \"Em uma colisão, a inércia faz com que seu corpo continue se movendo na velocidade original do veículo.\""],["p1m3q540",3,0,"Quais são as três partes mais resistentes do corpo pelas quais o cinto de três pontos foi projetado para distribuir a força do impacto?","","Ombros, tórax e pélvis.","Pescoço, barriga e joelhos.","Braços, pernas e cabeça.","Mãos, pés e cotovelos.","O cinto foi projetado para distribuir a força nas partes mais resistentes do corpo: \"ombros, tórax e pélvis.\""],["p1m3q541",3,1,"Qual o procedimento crucial sobre a Faixa Subabdominal do cinto de segurança, especialmente para mulheres grávidas?","","Deve repousar sobre os ossos do quadril (pélvis), e nunca sobre o abdômen.","Deve ser afrouxada para que não pressione o abdômen durante o impacto.","Deve ser passada sobre o centro da barriga para proteger a região.","Deve ser totalmente ignorada, usando apenas a faixa diagonal.","A faixa subabdominal deve ser posicionada sobre os ossos do quadril, \"sempre por baixo do abdômen, inclusive no caso de mulheres grávidas.\""],["p1m3q542",3,0,"Por que o motorista deve evitar usar o cinto de segurança com roupas volumosas?","","Roupas volumosas podem comprometer sua eficácia, pois o cinto deve estar justo ao corpo.","Roupas volumosas são desconfortáveis e limitam a mobilidade do motorista.","O cinto de segurança não consegue travar se houver excesso de roupa.","A faixa diagonal irá deslizar sobre as roupas e não proteger o ombro.","O cinto deve estar \"justo ao corpo, sem folgas. Roupas volumosas podem comprometer sua eficácia.\""],["p1m3q543",3,2,"Qual a regra de segurança sobre a Faixa Diagonal do cinto em relação ao braço do ocupante?","","Deve passar sobre o ombro e atravessar o centro do tórax, nunca por baixo do braço.","Pode ser passada por baixo do braço para evitar atrito no pescoço.","Deve ser colocada abaixo da axila para manter o braço em posição de defesa.","Deve passar na altura do pescoço, desde que não esteja justa demais.","A faixa diagonal deve passar pelo ombro e tórax, \"nunca por baixo do braço\"."],["p1m3q544",3,1,"Qual a principal função do Airbag no veículo?","","Reduzir significativamente os danos em caso de impacto, complementando a ação do cinto.","Substituir o cinto de segurança, sendo eficaz mesmo se o cinto não estiver afivelado.","Evitar o sinistro, pois ele aciona uma frenagem automática de emergência.","Ser o único responsável por manter o ocupante na posição correta durante a colisão.","O Airbag \"não evita o sinistro, mas reduz significativamente os danos em caso de impacto, complementando a ação do cinto.\""],["p1m3q545",3,2,"O que ocorre e qual o risco quando o airbag é acionado e o ocupante está sem o cinto de segurança?","","Ocupante pode colidir com o airbag ainda em expansão, aumentando o risco de lesões graves ou fatais. 45","O airbag amortece o corpo, mas o ocupante é lançado para fora do carro.","O sistema de airbag não é acionado, pois não detecta a presença de passageiro.","O airbag infla normalmente e o ocupante é mantido na posição correta.","Sem o cinto, o corpo é lançado para frente e \"o ocupante pode colidir com o airbag ainda em expansão\", o que aumenta o risco de lesões."],["p1m3q546",3,0,"Por que as crianças devem viajar sempre no banco traseiro, mesmo que o veículo possua Airbag?","","O airbag dianteiro pode ser extremamente perigoso devido à força de sua abertura.","O banco traseiro é sempre mais confortável e silencioso para as crianças.","O airbag dianteiro pode acionar mesmo sem colisão, devido ao peso da criança.","É proibido instalar cadeirinha no banco dianteiro em qualquer circunstância.","O material alerta: \"O airbag dianteiro pode ser extremamente perigoso para elas devido à força de sua abertura.\""],["p1m3q547",3,0,"Qual o procedimento de segurança em relação a objetos na área do painel ou próximo ao Airbag?","","Nunca colocar objetos, pois podem impedir a abertura ou se transformar em projéteis perigosos.","Colocar apenas pequenos objetos leves, como celulares ou moedas.","Colocar o máximo de objetos, pois eles ajudam a amortecer o impacto.","Colocar apenas objetos macios, como pelúcias ou travesseiros.","O material instrui: \"Nunca coloque objetos sobre o painel ou próximo às áreas de acionamento do airbag. Isso pode impedir sua abertura ou transformar os objetos em projéteis perigosos.\""],["p1m3q548",3,1,"Qual a ação imediata que o condutor deve tomar se a luz indicadora do Airbag no painel permanecer acesa após ligar o veículo?","","Observar se a luz apaga, pois se ela permanecer acesa, pode indicar uma falha no sistema.","Continuar dirigindo, pois a luz só indica que o sistema está desativado temporariamente.","Desligar o carro imediatamente, pois o airbag pode acionar a qualquer momento.","Colocar objetos leves sobre o painel para verificar se a luz se apaga.","A luz deve apagar após alguns segundos. Se \"permanecer acesa, pode indicar uma falha no sistema.\""],["p1m3q549",3,0,"Qual item de uso obrigatório por lei é considerado a \"barreira fundamental contra lesões na cabeça\" para motociclistas?","","O Capacete.","A Jaqueta com Proteção.","A Viseira do capacete (separadamente).","A Bota de cano robusto.","O capacete é o \"Item de uso obrigatório por lei, [e] a barreira fundamental contra lesões na cabeça.\""],["p1m3q550",3,1,"Qual a finalidade do Selo do Inmetro no capacete do motociclista?","","Atessa sua conformidade com as normas brasileiras de segurança e que ele passou por testes rigorosos.","Indica que o capacete foi feito com material biodegradável.","Indica que o capacete pode ser usado sem a viseira abaixada.","Indica que o capacete deve ser trocado a cada 5 anos.","É crucial que o capacete possua o selo do Inmetro, que \"atesta sua conformidade com as normas brasileiras de segurança.\""],["p1m3q551",3,0,"Qual a regra de segurança em relação ao uso de capacete que sofreu um impacto ou apresenta dano estrutural?","","NUNCA usar ou emprestar, pois sua eficácia está comprometida.","Usar apenas em baixas velocidades, pois a eficácia é reduzida, mas ainda existe.","Usar após consertar a parte danificada com fita adesiva ou cola.","Usar apenas no banco do passageiro (garupa).","O material é categórico: um capacete danificado tem sua \"eficácia comprometida. Nunca empreste ou utilize\""],["p1m3q552",3,1,"Qual o benefício crucial das luvas específicas para motociclismo em caso de sinistro?","","Protegem as mãos contra abrasões, cortes e impactos, que são extremamente vulneráveis.","Apenas mantêm as mãos aquecidas durante a pilotagem no inverno.","Apenas oferecem melhor aderência ao guidão para curvas de alta velocidade.","Permitem que o motociclista use calçados abertos sem risco.","O material afirma que as \"Mãos são extremamente vulneráveis em sinistros\" e que as luvas \"protegem contra abrasões, cortes e impactos.\""],["p1m3q553",3,0,"Qual o procedimento de segurança que o motociclista deve ter em relação à viseira do capacete durante a pilotagem?","","Deve estar sempre abaixada para proteger os olhos e o rosto de impactos e detritos.","Deve estar sempre levantada para garantir a máxima ventilação e visibilidade. 62","Deve estar sempre abaixada, exceto em vias urbanas de baixa velocidade.","Deve ser removida para pilotar com óculos de sol.","O material é claro: \"a viseira abaixada durante a pilotagem para proteger seus olhos e rosto de impactos e detritos.\""],["p1m3q554",3,0,"De acordo com as recomendações de segurança, qual item do capacete deve ser mantido abaixado?","","Viseira","Queixeira","Alça jugular","Forro interno","A viseira protege os olhos do motociclista de insetos, poeira e vento."],["p1m3q555",3,0,"Por que é importante que o motociclista mantenha os faróis da moto acesos mesmo durante o dia?","","Para ser mais facilmente visto pelos outros motoristas","Para economizar combustível","Para indicar que a moto está ligada","Para aumentar a vida útil da bateria","Motos com farol aceso são vistas mais cedo pelos outros motoristas, aumentando a segurança."],["p1m3q556",3,0,"Qual deve ser a atitude do motociclista ao se aproximar de cruzamentos e perto de pedestres?","","Reduzir a velocidade","Acelerar para passar rapidamente","Manter a velocidade, se o sinal estiver verde","Buzinar para alertar","Cruzamentos são locais de alto risco e a redução de velocidade é sempre recomendada."],["p1m3q557",3,1,"Qual a recomendação básica para o motociclista evitar o \"ponto cego\" dos carros?","","Manter distância lateral e se posicionar para ser visto pelos retrovisores","Manter-se sempre atrás do carro","Acelerar para ultrapassar rapidamente","Trafegar colado à lateral do carro","Estar na posição em que é visto pelos retrovisores garante que o motorista tenha ciência da presença da moto."],["p1m3q558",3,1,"Ao realizar manobras na moto, qual é a atitude de segurança prioritária a ser adotada?","","Sinalizar com antecedência e evitar movimentos bruscos","Sinalizar apenas com o braço","Manter a velocidade constante","Mudar de faixa sem sinalizar se o trânsito estiver livre","A previsibilidade (sinalização antecipada) é aliada da segurança."],["p1m3q559",3,1,"Além de ter o selo do Inmetro e viseira abaixada, qual é outra condição essencial para o uso seguro do capacete?","","Estar bem ajustado e fechado","Ser da cor preta fosca","Ter adesivos refletivos","Ser aberto (sem queixeira)","O capacete precisa estar firme e fechado para oferecer a proteção adequada."],["p1m3q560",3,2,"Qual dos seguintes itens é considerado um equipamento de segurança recomendado para o motociclista?","","Roupas reflexivas e calçados fechados","Balaclava e óculos escuros","Jaqueta de couro e boné","Capacete de fibra de carbono","Jaquetas com proteção, luvas e calçados adequados (fechados e, preferencialmente, com elementos reflexivos) minimizam lesões."],["p1m3q561",3,2,"A principal função da viseira abaixada do capacete, para a segurança do condutor, é:","","Proteger os olhos contra insetos, poeira e vento","Reduzir o ruído do vento no capacete","Melhorar a aerodinâmica da moto","Servir como item de moda","A proteção dos olhos é crucial para manter a visibilidade e o controle da moto."],["p1m3q562",3,2,"Qual comportamento é expressamente proibido e classificado como de risco ao trafegar no corredor?","","Trafegar entre veículos em alta velocidade","Mudar de faixa dentro do corredor","Parar o veículo no corredor","Ultrapassar pela direita no corredor","O texto proíbe especificamente trafegar em alta velocidade no corredor, que é um espaço de risco."],["p1m3q563",3,0,"O que o motorista deve ajustar obrigatoriamente antes de iniciar a condução do veículo?","","Retrovisores e bancos","Volume do rádio e temperatura do ar","Roteiro do GPS e luz interna","Pneus e nível do óleo","Ajustar posição de dirigir e visão é básico para reagir adequadamente no trânsito."],["p1m3q564",3,0,"Por que é fundamental evitar distrações como o celular ao dirigir?","","Tira a atenção da via, colocando vidas em risco","Apenas gera multas de trânsito","Diminui a vida útil da bateria","Aumenta o consumo de combustível","Distrações comprometem a atenção, sendo a principal causa de acidentes."],["p1m3q565",3,0,"A sinalização de manobras com a seta é opcional ou obrigatória?","","É obrigatória e deve ser usada com pelo menos três segundos de antecedência","É opcional se não houver outros carros por perto","É recomendada apenas em rodovias","Deve ser usada apenas ao mudar de faixa","A seta é a forma de comunicar aos outros motoristas o que você fará, sendo vital para a previsibilidade."],["p1m3q566",3,1,"Qual o efeito do cansaço, sono e uso de certos medicamentos nos reflexos do motorista?","","Reduzem os reflexos, sendo recomendado não dirigir","Aumentam a concentração","Não causam impacto significativo","Apenas dão sono, mas não afetam a direção","Redução dos reflexos compromete a capacidade de reação a imprevistos."],["p1m3q567",3,1,"Em qual situação o uso do farol baixo é obrigatório em rodovias, conforme as informações fornecidas?","","Sempre (mesmo de dia)","Apenas à noite ou em túneis","Apenas em condições de pouca luz","É opcional, mas recomendado","O texto estabelece que o farol baixo mesmo de dia é obrigatório em rodovias e recomendado na cidade."],["p1m3q568",3,1,"O que é a \"gentileza no trânsito\"?","","Ceder passagem, sinalizar, manter distância e evitar disputas","Dirigir sempre muito devagar","Deixar o veículo na garagem em horários de pico","Ignorar os erros dos outros motoristas","A gentileza é definida como inteligência coletiva, baseada em atitudes proativas de cortesia e segurança."],["p1m3q569",3,1,"O que se deve fazer quando se está em uma posição onde não é possível ser visto pelos retrovisores de outros veículos?","","Mudar a posição para sair do ponto cego","Buzinar para alertar o outro motorista","Acelerar para ultrapassar rapidamente","Esperar que o outro motorista o veja","Ficar visível é a forma de evitar o ponto cego e reduzir o risco de colisão."],["p1m3q570",3,2,"Por que é crucial ter uma boa visão ao redor ao dirigir, decorrente do ajuste correto dos bancos e retrovisores?","","Faz toda a diferença na hora de reagir a imprevistos","Ajuda a manter o motor ligado","Melhora a estética do veículo","Diminui o estresse emocional","A visibilidade e a posição de comando são essenciais para que o tempo de reação seja o menor possível."],["p1m3q571",3,2,"O farol baixo aceso durante o dia é mais importante em condições de pouca luz. Por que ele é recomendado na cidade, mesmo com boa iluminação?","","Carros com farol aceso são vistos mais cedo pelos outros motoristas","É uma forma de economizar o farol alto","Evita o superaquecimento do motor","Melhora a iluminação dos painéis internos","O objetivo principal é a visibilidade (ser visto), o que aumenta a segurança preventiva."],["p1m3q572",3,2,"Qual dos seguintes comportamentos não está listado como uma forma de praticar gentileza no trânsito?","","Acelerar ao invés de ceder a passagem","Sinalizar manobras aos outros","Manter a distância de segurança","Evitar disputas por espaço","Acelerar para impedir a passagem é o oposto de ceder e evitar disputas, não sendo uma atitude de gentileza."],["p1m3q573",3,2,"Dois fluxos chegam a um cruzamento sem sinalização: um vem de via arterial e outro de via local. Quem tem preferência?","","Quem vem pela direita, mesmo que a via da esquerda seja maior.","A via maior (arterial) sempre.","Quem vier mais rápido.","Quem vier com farol alto.","Tamanho da via não muda a regra da direita. Art. 29, inciso III, alínea c"],["p1m3q574",3,2,"Qual é a velocidade máxima normalmente permitida em uma zona calma?","","30 km/h.","40 km/h.","50 km/h.","60 km/h.","Reduzir a velocidade é a forma mais eficaz de salvar vidas em áreas urbanas."],["p1m3q575",3,0,"É permitido ultrapassar pela direita quando:","","O veículo à frente sinaliza que vai virar à esquerda.","A pista estiver livre.","O outro veículo for lento.","A pressa for grande.","Essa é a única exceção prevista no CTB."],["p1m4q1",4,2,"Sobre limites do corpo humano em sinistros, o que é verdadeiro?","","Mais velocidade = mais energia = lesões mais graves, por isso controlar a velocidade salva vidas.","O corpo suporta qualquer impacto leve.","A gravidade independe da velocidade.","Só o tipo do carro define a gravidade.","O corpo tem limites, velocidade segura é essencial."],["p1m4q2",4,0,"A bicicleta é classificada como:","","Veículo de tração humana, porque anda com a força da pessoa que pedala.","Veículo automotor, porque tem motor grande.","Veículo de tração animal, porque usa cavalo.","Veículo especial, porque só anda na ciclovia.","Exemplo de veículo de tração humana."],["p1m4q3",4,0,"Após ser aprovado em todas as etapas do processo de formação, o candidato obtém:","","Recebe a Permissão Para Dirigir (PPD) com validade de 1 ano.","Recebe multa educativa.","Recebe CRLV do carro do instrutor.","Recebe cartão de desconto no combustível.","A Permissão para Dirigir (PPD) é o documento obtido após a aprovação em todas as etapas do CFC e tem validade de 12 meses, permitindo ao condutor dirigir provisoriamente antes de obter a Carteira Nacional de Habilitação (CNH). Art. 148 § 2º do CTB"],["p1m4q4",4,2,"Em uma fiscalização, Maria apresenta ao agente apenas uma foto da CNH salva na galeria do celular, e não pelo aplicativo oficial Carteira Digital de Trânsito (CDT). De acordo com o CTB e a regulamentação do CONTRAN, o que o agente de trânsito deve considerar sobre o porte do documento neste caso?","","Não vale. A CNH ou PPD só tem validade no formato original: físico ou digital oficial, cópia ou foto não substitui.","Vale se a foto estiver bonita.","Vale se mandar por mensagem depois.","Vale porque é o mesmo número.","Conforme estabelecido no Art. 159, § 5º do CTB, a Carteira Nacional de Habilitação (CNH) deve ser apresentada em original. Uma foto do documento na galeria do celular é considerada uma cópia inválida e não possui fé pública, pois não permite a comprovação da sua autenticidade. Dessa forma, o agente deve considerar que a condutora não está portando o documento obrigatório, o que configura infração sujeita à multa e retenção (Art. 232 do CTB)."],["p1m4q5",4,0,"Decisão final: Maria recebeu a CNH. Qual cuidado deve tomar?","","Renovar dentro do prazo do exame de aptidão física e mental, portar o documento quando dirigir.","Guardar a CNH e dirigir sem portar.","Emprestar a CNH para amiga aprender.","Dirigir sem respeitar as leis por ser habilitada.","Validade depende da aptidão vigente e do porte."],["p1m4q6",4,0,"Durante o período de validade da Permissão Para Dirigir, o que o novo condutor não pode fazer?","","Não pode cometer infração grave ou gravíssima nem ser reincidente em média.","Pode dirigir sem documento.","Pode correr em racha.","Pode recusar regras porque “ainda é provisória”.","Conforme estabelece o art. 147, § 3º do CTB, a Carteira Nacional de Habilitação (CNH) definitiva só será conferida ao portador da Permissão Para Dirigir se, ao término de um ano, ele não tiver cometido nenhuma infração de natureza gravíssima ou grave, ou não for reincidente em infração média."],["p1m4q7",4,0,"Maria está conduzindo uma motocicleta quando se depara com um ônibus parado. O que ela deve fazer?","","Esperar o ônibus sair ou ultrapassar pela esquerda com cuidado.","Passar pela direita, bem colada.","Subir na calçada.","Ziguezaguear entre os carros.","A ultrapassagem pela direita é infração gravíssima."],["p1m4q8",4,0,"Maria reprovou na prova de direção três vezes. O que ela faz para continuar o processo de formação?","","Agenda nova prova, mantém documentos válidos.","Sai dirigindo sozinha para treinar melhor.","Usa a Permissão para Dirigir da irmã emprestada para fazer a prova.","Sobe na calçada para evitar fiscalização.","Após reprovar, o candidato pode reagendar a prova prática para uma nova tentativa, seguindo os procedimentos do Detran, até alcançar aprovação."],["p1m4q9",4,1,"O que caracteriza o respeito ao princípio da vulnerabilidade?","","Dar prioridade a pedestres e ciclistas em situações de conflito.","Priorizar veículos maiores.","Ignorar a travessia de pedestres.","Disputar espaço nas vias.","O princípio da vulnerabilidade reconhece que certos usuários da via, como pedestres e ciclistas, têm maior risco de se envolver em acidentes devido à falta de proteção física. Assim, motoristas devem dar prioridade e agir com mais cautela ao interagir com esses grupos no trânsito."],["p1m4q10",4,0,"O que demonstra boa conduta no trânsito?","","Respeitar a sinalização e agir com empatia e cortesia.","Disputar espaço com outros motoristas.","Ignorar regras quando a via está vazia.","Usar buzina excessivamente.","Boa conduta no trânsito envolve seguir as normas de trânsito, respeitar os sinais e as leis, além de ser educado e atencioso com pedestres, ciclistas e outros motoristas, promovendo um ambiente mais seguro e organizado nas vias."],["p1m4q11",4,0,"O candidato pode deixar de realizar os exames médico e psicológico alegando que se sente bem?","","Não pode. Os exames são obrigatórios para verificar condições de segurança para dirigir.","Pode sim, se assinar um papel simples.","Pode se o instrutor concordar.","Pode se fizer só a prova prática.","A aptidão é exigência legal."],["p1m4q12",4,1,"Quais são os três requisitos que o candidato deve prencher para iniciar o processo de habilitação?","","Ser penalmente imputável, saber ler e escrever, ter documento de identificação.","Ter carro novo, ter emprego fixo e morar na capital.","Ter ensino superior, moradia própria e passaporte.","Já saber dirigir, ter CPF e não ter condenações penais.","Requisitos para iniciar o processo previstos no art. 140 do CTB."],["p1m4q13",4,1,"Qual é o prazo de renovação da CNH para pessoas com idade entre 50 a 69 anos?","","A cada 5 anos.","A cada 10 anos.","A cada 3 anos.","Só quando quiser.","Art. 147, § 2º do CTB."],["p1m4q14",4,1,"Qual é o prazo de renovação da CNH para quem tem 70 anos ou mais?","","A cada 3 anos.","A cada 5 anos.","A cada 10 anos.","Não pode renovar mais.","Art. 147, § 2º do CTB."],["p1m4q15",4,2,"Após uma pequena batida sem feridos, dois motoristas passam a discutir sobre a pista. O que deve ser feito?","","Sinalizar, tirar os veículos da via e conversar em local seguro.","Deixar tudo parado até a perícia.","Ligar farol alto e gritar.","Ir embora sem trocar dados.","Os condutores devem garantir a segurança e fluidez do trânsito."],["p1m4q16",4,2,"Em qual situação o controle emocional influencia positivamente a função motora?","","Ao frear com calma em uma emergência.","Ao ignorar o risco e continuar acelerando.","Ao acelerar sem avaliar o ambiente.","Ao dirigir distraído.","Emoção equilibrada permite coordenação motora adequada e decisões seguras."],["p1m4q17",4,2,"Por que dominar a si mesmo é mais importante do que dominar o veículo?","","Porque o controle emocional evita decisões perigosas e protege vidas.","Porque as leis permitem dirigir sem prática.","Porque os veículos modernos têm freios automáticos.","Porque a técnica vem depois da velocidade.","Autocontrole é base da direção defensiva e do Sistema Seguro."],["p1m4q18",4,2,"Qual combinação cumpre recall e protege o ambiente?","","Consultar CDT/Senatran, agendar reparo gratuito e manter manutenção que reduz emissões.","Ignorar recall e rodar com fumaça azul.","Aguardar quebrar para reparar.","Usar aditivo para esconder fumaça.","Correção rápida evita falhas e poluentes."],["p1m4q19",4,2,"Qual combinação mostra a aplicação simultânea dos cinco elementos da direção segura?","","Condutor atento, veículo revisado, via observada, tempo avaliado e respeito aos outros.","Condutor apressado, veículo potente, via livre, sol forte, sem atenção.","Condutor distraído, carro novo, pista seca, pressa.","Dirigir rápido apenas com faróis acesos.","A segurança depende da interação constante entre todos os fatores."],["p1m4q20",4,2,"Quando o condutor sente medo ao dirigir, qual atitude demonstra autoconhecimento?","","Reconhecer o sentimento e treinar gradualmente.","Forçar-se a dirigir em alta velocidade.","Evitar treinar por completo.","Fingir segurança diante dos outros.","Autoregulação emocional fortalece a aprendizagem segura e confiante."],["p1m4q21",4,2,"Um motociclista, após longa jornada de trabalho noturno, decide continuar pilotando mesmo sentindo fadiga. Qual princípio da direção segura está sendo comprometido?","","O equilíbrio físico e emocional, essencial para reação e julgamento adequados.","A função motora, pois o esforço físico compensa o cansaço.","A função sensorial, já que o corpo se adapta ao esforço contínuo.","O princípio da previsão, pois basta atenção redobrada.","A fadiga afeta o tempo de reação, o raciocínio e o controle emocional, prejudicando o equilíbrio necessário à condução segura. O descanso é requisito da direção preventiva."],["p1m4q22",4,0,"Um alinhamento comprometido das rodas pode causar:","","Carro puxando, desgaste irregular dos pneus e instabilidade.","Consumo menor.","Volante sempre reto.","Pneu mais frio.","Os desalinhamento das rodas pode causar sérios danos ao veículo e comprometer a segurança viária."],["p1m4q23",4,0,"Atender ao recall protege:","","Você, passageiros e demais usuários da via.","Só o motor.","Apenas o dono do carro.","O bolso do proprietário ou do condutor.","Atender aos recalls promove a segurança coletiva no trânsito."],["p1m4q24",4,0,"Avaliar riscos ao dirigir significa:","","Ter a visão de eventuais erros antes que esses aconteçam.","Confiar que os outros sempre agirão certo.","Pensar apenas em chegar rápido.","Evitar olhar para os lados.","Avaliar riscos é antecipar perigos e adotar postura preventiva."],["p1m4q25",4,2,"Avaliar riscos é uma atitude que envolve:","","Todas as quatro funções da condução segura.","Apenas a função motora.","Somente a visão e a audição.","Nenhum fator emocional.","Sensorial, cognitiva, motora e emocional atuam juntas na avaliação de riscos."],["p1m4q26",4,0,"Baterias automotivas devem ser:","","Enviadas para reciclagem específica em locais autorizados.","Jogadas no lixo comum.","Enterradas no quintal.","Lavadas e reutilizadas sempre.","As baterias são altamente tóxicas, razão pela qual devem ser descartadas em locais apropriados."],["p1m4q27",4,0,"Boa prática para cuidado do capacete:","","Não derrubar no chão, trocar em 3–5 anos ou antes se houver dano.","Guardar solto no assoalho.","Lavar só por fora.","Nunca apertar o fecho.","Impactos comprometem a estrutura mesmo sem rachaduras."],["p1m4q28",4,0,"Porque o capacete é obrigatório para quem pilota motocicleta?","","Pois protege a cabeça e reduz risco de morte.","Pois apenas evita multa.","Pois deixa o vento mais fresco.","Porque o capacete é necessário apenas para viagens longas.","Redução do risco de morte em até 70% quando usado corretamente. O capacete é um equipamento de segurança exigido pela lei de trânsito para motoristas e passageiros de motocicletas, conforme o art. 54 do Código de Trânsito Brasileiro (CTB)"],["p1m4q29",4,0,"Como contribuir com o meio ambiente ao dirigir?","","Adotar condução suave e ter a manutenção do veículo em dia.","Deixar o motor em marcha lenta.","Acelerar forte nas saídas.","Ignorar pneus murchos.","Diminuir consumo de combustível e emissões de gases."],["p1m4q30",4,2,"Como o proprietário de um veículo pode verificar se há um recall pendente para o seu carro?","","CDT (aplicativo), site da Senatran ou site da montadora.","Apenas perguntando a amigos.","Só na loja onde comprou.","Não é possível consultar.","A forma mais eficiente e confiável de verificar se há recall pendente no seu carro é consultando o site do fabricante do veículo ou acessando o portal do Denatran, onde é possível buscar essa informação utilizando o número do chassi do veículo. Esse procedimento ajuda a garantir que o veículo esteja em conformidade com as normas de segurança e que eventuais problemas sejam resolvidos de forma adequada."],["p1m4q31",4,2,"Quais são os cuidados essenciais com a bateria de um veículo elétrico?","","Carregamento adequado e descarte correto.","Utilizar qualquer carregador disponível, independentemente do modelo.","Usar cabos improvisados.","Ignorar autonomia.","O carregamento adequado garante que a bateria do veículo elétrico tenha maior durabilidade e eficiência. Já o descarte correto é crucial para evitar a contaminação ambiental, já que as baterias contêm materiais prejudiciais que precisam ser reciclados adequadamente."],["p1m4q32",4,2,"Quais são os cuidados necessários com o sistema de arrefecimento do veículo?","","Verificar regularmente o nível do líquido de arrefecimento e realizar a troca conforme o recomendado pelo fabricante.","Abrir radiador quente para “resfriar”.","Usar só água da torneira sempre.","Ignorar mangueiras ressecadas.","O sistema de arrefecimento é essencial para evitar o aquecimento excessivo do motor. Verificar regularmente o nível do líquido de arrefecimento e fazer a troca do fluido de acordo com as instruções do fabricante garante o bom funcionamento do sistema e previne danos ao motor. O uso de líquidos inadequados ou ignorar vazamentos pode levar a aquecimento e falhas no motor."],["p1m4q33",4,1,"Dentre as opções apresentadas, qual é uma recomendação de segurança ao dirigir um veículo elétrico na cidade?","","Redobrar atenção a pedestres e ciclistas, pois o veículo é silencioso.","Usar buzina longa para avisar sempre.","Andar só com farol alto.","Ignorar a sinalização.","Ser visto/“percebido” é essencial."],["p1m4q34",4,2,"O que pode acontecer quando o veículo está com as pastilhas de freio gastas ou com o fluido de freio em más condições?","","Aumentam distância de parada e risco de colisão.","Melhoram conforto.","Não alteram nada.","Só fazem barulho.","Pastilhas gastas ou fluido de freio velho ou contaminado reduzem a eficiência do sistema de frenagem, aumentando o tempo e a distância necessários para parar o veículo."],["p1m4q35",4,2,"O que pode acontecer se o proprietário ignorar um recall do veículo?","","Pode ocorrer alguma falha mecânica ou elétrica que comprometa a segurança dos ocupantes e de outros usuários da via.","Economia de tempo sem consequências.","Perda de garantia apenas.","Mais conforto.","O recall é uma convocação feita pelo fabricante para corrigir defeitos de segurança identificados após a venda do veículo. Ignorar o recall pode causar falhas graves em sistemas essenciais, como freios, airbags, direção ou combustível, resultando em acidentes e riscos à vida."],["p1m4q36",4,0,"Quais itens de manutenção do veículo exigem descarte especial para evitar danos ao meio ambiente?","","Óleo lubrificante usado, filtros e baterias.","Tapete e capa de banco.","Odorizador.","Sacola plástica.","Itens como óleo lubrificante, filtros, baterias e pneus contêm substâncias químicas e metais pesados que podem poluir o solo e a água se descartados incorretamente."],["p1m4q37",4,1,"O que pode ocorrer quando o veículo circula com farol, seta ou lanterna queimados?","","Prejudica ver e ser visto, devem ser reparados.","É detalhe estético.","Melhora economia.","Só importa de dia.","As luzes do veículo — como faróis, lanternas e setas — são fundamentais para a visibilidade e sinalização no trânsito. Quando estão queimadas, outros condutores não conseguem identificar as intenções do motorista, como mudança de direção ou frenagem, o que aumenta o risco de colisões. Além disso, circular com lâmpadas queimadas é infração média segundo o art. 230, inciso XXII, do CTB, sujeita a multa e retenção do veículo até a regularização."],["p1m4q38",4,1,"O que significa quando a luz do airbag permanece acesa no painel do veículo?","","Falha no sistema. O condutor deve procurar manutenção.","Economia de bateria.","Airbag desligado por segurança.","Revisão desnecessária.","Quando a luz do airbag permanece acesa no painel, isso indica uma falha no sistema de segurança. Nesse caso, o airbag pode não funcionar corretamente em uma colisão, comprometendo a proteção dos ocupantes."],["p1m4q39",4,2,"O não atendimento ao recall pode gerar:","","Bloqueio do próximo licenciamento e outras consequências legais.","Bônus no seguro.","Isenção de IPVA.","Nenhuma anotação oficial.","Recall é registrado oficialmente, cumprir é responsabilidade. Art. 131, §5º do CTB."],["p1m4q40",4,0,"O olhar do motociclista deve:","","Buscar o caminho seguro, não o obstáculo.","Concentrar-se apenas nos buracos da via.","Fixar no painel.","Fixar no retrovisor.","“Olhos guiam a moto”, focar saída evita erros."],["p1m4q41",4,0,"O que caracteriza um condutor responsável?","","A preocupação constante com a sua segurança e dos demais.","A habilidade para correr quando a via está livre.","A capacidade de reagir rapidamente em emergências.","A disposição em disputar espaço no trânsito.","Responsabilidade e empatia são pilares da direção segura."],["p1m4q42",4,0,"O que é recall de veículo?","","Chamado da montadora para corrigir defeito que pode afetar segurança, funcionamento ou ambiente.","Promoção para trocar o carro.","Revisão paga de rotina.","Convite para test-drive.","Chamamento de consumidores para correção de elementos nos veículos."],["p1m4q43",4,0,"O que o condutor deve fazer ao encontrar uma via com buracos e má iluminação?","","Reduzir a velocidade e aumentar a distância do veículo da frente.","Acelerar para sair rápido.","Usar farol alto e seguir.","Buzinar para alertar.","A adaptação à via é atitude essencial de direção defensiva."],["p1m4q44",4,0,"O reparo do recall custa quanto ao proprietário?","","Nada, é gratuito para o proprietário.","Metade do valor da peça.","Apenas a mão de obra.","Taxa de oficina.","A responsabilidade pelo serviço é da montadora."],["p1m4q45",4,0,"O trânsito é uma das principais fontes de:","","Poluição do ar nas cidades.","Água potável.","Sombra urbana.","Silêncio.","Os veículos são emissores de agentes poluentes."],["p1m4q46",4,1,"Pneus bem calibrados e com sulcos:","","Melhoram estabilidade e reduzem consumo.","Só deixam o carro mais alto.","Aumentam distância de frenagem.","Não influenciam na chuva.","Contato correto com o solo garante aderência."],["p1m4q47",4,0,"Poluição sonora no trânsito pode causar:","","Estresse, insônia, irritabilidade e problemas cardíacos.","Melhora da audição.","Menor atenção ao volante.","Apenas incômodo leve.","Ruído excessivo agride a saúde."],["p1m4q48",4,0,"Por que o descarte correto de óleo usado é importante?","","Evita poluição do solo e da água por substâncias tóxicas.","Aumenta o brilho da calçada.","Some sozinho com o tempo.","Pode ser despejado no ralo.","Responsabilidade ambiental do condutor."],["p1m4q49",4,1,"Por que o recall deve ser levado a sério?","","O defeito pode se manifestar de surpresa e causar sinistro.","Porque deixa o carro mais bonito.","Porque aumenta potência.","Porque vale só para carros novos.","Falhas atingem freios, airbags, direção etc."],["p1m4q50",4,0,"Por que pneus calibrados ajudam o ambiente?","","Diminuem consumo e emissões ao reduzir resistência ao rolamento.","Só deixam o carro “alto”.","Não têm relação com poluição.","Gastam mais combustível.","Eficiência energética melhora com pressão correta."],["p1m4q51",4,0,"Por que pneus velhos precisam de descarte correto?","","Acumulam água e demoram anos para se decompor.","São leves e voam.","Não ocupam espaço.","Servem como adubo.","Evita proliferação de insetos e poluição do meio ambiente."],["p1m4q52",4,0,"Quais indícios pedem revisão de freios?","","Ruídos/trepidações ao frear e pedal baixo.","Volante inclinando para um dos lados.","Luzes queimando com facilidade.","Ar-condicionado fraco.","Sintomas típicos de desgaste ou empeno."],["p1m4q53",4,0,"Quais resíduos nunca devem ir para o lixo comum ou ralo?","","Óleo usado, fluido de freio e líquido de arrefecimento.","Água da chuva do para-brisa.","Poeira do tapete.","Papéis do lavador.","Óleo usado, fluido de freio e líquido de arrefecimento são tóxicos e contaminam solo e água."],["p1m4q54",4,0,"Qual alteração gera poluição sonora?","","Escapamento alterado.","Pneus calibrados.","Filtros trocados.","Luzes originais.","Ruído em excesso agride a saúde pública."],["p1m4q55",4,0,"Qual atitude reduz poluição do ar no uso diário?","","Planejar rotas, evitar picos e, quando possível, usar transporte coletivo.","Acelerar para chegar antes.","Ligar o carro parado por longos períodos.","Rodar com manutenção atrasada.","A condução consciente e a menor quantidade de trânsito diminuem as emissões de gases na atmosfera."],["p1m4q56",4,0,"Qual atitude reduz poluição e custo?","","Calibrar pneus, planejar rotas e evitar marcha lenta.","Acelerar forte para chegar antes.","Usar marcha em alto giro sem necessidade.","Ignorar revisões do veículo.","Condução eficiente e consciente reduz as emissões de gases na atmosfera."],["p1m4q57",4,0,"Qual passo certo para calibrar pneus?","","Pneus frios, pressão do manual/etiqueta, não esquecer o estepe.","Após viagem longa e quente.","Pressão “a olho”.","Encher além do recomendado.","Medida correta garante aderência e economia."],["p1m4q58",4,0,"Quando um condutor percebe irritação no trânsito, o que deve fazer?","","Respirar, manter calma e não tomar decisões impulsivas.","Buzinar para extravasar a raiva.","Acelerar para sair logo do congestionamento.","Discutir com outros condutores.","A função emocional regula o comportamento e previne atitudes perigosas."],["p1m4q59",4,0,"O recall é:","","Ato de prevenção para ajustes e/ou reparos no veículo.","Opcional e sem importância.","Serviço particular sigiloso.","Exclusivo para veículos de luxo.","O chamamento de consumidores é medida de segurança para reparos preventivos em veículos."],["p1m4q60",4,0,"Resíduos que exigem descarte correto:","","Óleo usado, fluido de freio, líquido de arrefecimento, baterias, pneus, filtros e lâmpadas.","Apenas água do radiador.","Pano de limpeza.","Papel do posto.","O descarte correto evita contaminação de solo e água."],["p1m4q61",4,0,"Sistemas que podem motivar recall:","","Freios, direção, airbags, combustível e parte elétrica.","Tapetes e calotas apenas.","Pintura externa.","Apenas pneus.","Esses itens afetam diretamente a segurança."],["p1m4q62",4,0,"Um carro com pneus gastos representa risco porque:","","Perde aderência e aumenta chance de derrapagem.","Gasta menos combustível.","Reduz o desgaste do motor.","Garante frenagem mais rápida.","Pneus em mau estado comprometem estabilidade e frenagem."],["p1m4q63",4,0,"Vantagem dos veículos elétricos:","","Não emitem gases poluentes durante o uso e geram menos ruído.","Aumentam fumaça.","Têm motor mais complexo.","Sempre dispensam cuidados.","Os veículos elétricos representam um benefício urbano e ambiental."],["p1m4q64",4,2,"Qual elemento da direção segura depende diretamente da condição física e mental do condutor?","","O próprio condutor.","O veículo.","A via.","As condições ambientais.","O corpo e a mente equilibrados são a base da direção segura."],["p1m4q65",4,1,"Um condutor nervoso e ansioso tende a:","","Perder concentração e cometer erros simples.","Dirigir com mais segurança.","Aumentar o controle do veículo.","Reduzir o risco de sinistros.","Emoções descontroladas afetam percepção e tempo de reação."],["p1m4q66",4,1,"Um motorista cansado corre mais risco porque:","","Tem reflexos lentos e julgamento prejudicado.","Dirige com mais calma.","Vê melhor à noite.","Reage de forma mais segura.","Fadiga aumenta o tempo de reação e reduz atenção."],["p1m4q67",4,0,"Por que a empatia é importante no trânsito?","","Porque ajuda a respeitar quem tem mais dificuldade.","Porque faz o trânsito andar mais rápido.","Porque evita multas.","Porque garante preferência ao motorista.","Entender o outro ajuda a evitar sinistros."],["p1m4q68",4,1,"Pedro percebe que o pneu do carro está murcho, mas continua dirigindo. Qual o risco?","","Perder o controle do carro e causar sinistro.","Gastar mais combustível apenas.","Danificar o som do veículo.","Ser multado por falta de cinto.","O principal risco de segurança é que o pneu murcho diminui drasticamente a estabilidade e a área de contato com o solo, gerando calor excessivo na lateral, o que pode levar à ruptura do pneu (estouro), causando a perda total de controle do veículo."],["p1m4q69",4,1,"Quais são exemplos de fator humano de risco?","","Distração, álcool, excesso de velocidade.","Buracos e pista molhada.","Pneu careca e farol queimado.","Falta de sinalização vertical.","A maioria dos sinistros de trânsito é causada por falhas humanas, que são o principal foco da Direção Defensiva. O motorista deve ser atento e previsível para compensar essas falhas, sendo o conhecimento e a habilidade (evitando a imperícia) fundamentais para a segurança."],["p1m4q70",4,1,"Um motorista está cansado e bocejando, mas quer terminar a viagem. O que ele deveria fazer?","","Parar em local seguro e descansar.","Beber café e seguir.","Abrir o vidro e continuar.","Aumentar o som do rádio.","Conforme os princípios da Direção Defensiva, o cansaço (fadiga) é uma condição adversa do condutor que diminui drasticamente a atenção, a capacidade de julgamento e o tempo de reação, equiparando-se à direção sob efeito de álcool."],["p1m4q71",4,2,"Durante a noite, Ana dirige cansada depois do trabalho. Ela percebe que está piscando os olhos com sono. O que deve fazer?","","Parar em local seguro e descansar antes de seguir viagem.","Ligar o rádio e continuar dirigindo.","Abrir o vidro para “espantar o sono”.","Acelerar para chegar logo em casa.","O sono reduz o tempo de reação e causa sinistros graves. Conforme os princípios da Direção Defensiva, o cansaço (fadiga) é uma condição adversa do condutor extremamente perigosa, que anula a capacidade de atenção, o tempo de reação e a percepção de risco. O Art. 28 do CTB exige que o motorista tenha a todo momento domínio de seu veículo, o que é impossível em estado de fadiga. Continuar a viagem nessas condições é um ato de negligência que aumenta dramaticamente o risco de sinistros graves, sendo a parada imediata para descanso a única solução segura e legalmente responsável."],["p1m4q72",4,0,"O que deve ser feito primeiro ao chegar a um local de um sinistro?","","Verificar se o local é seguro antes de se aproximar.","Tentar remover as vítimas imediatamente.","Acionar o socorro apenas após avaliar as lesões.","Aplicar os primeiros socorros sem observar o ambiente.","A segurança do socorrista vem em primeiro lugar. Se o local for perigoso, ele pode se tornar mais uma vítima."],["p1m4q73",4,2,"O que deve ser evitado ao socorrer uma vítima com fratura exposta?","","Tentar alinhar o osso quebrado.","Cobrir o ferimento com pano limpo.","Evitar movimentos bruscos.","Chamar o socorro.","Nunca se deve tentar recolocar o osso no lugar, pois isso pode agravar lesões e causar hemorragias internas."],["p1m4q74",4,1,"O que se deve fazer com uma vítima de trânsito que está usando capacete?","","Não remover o capacete","Retirar o capacete para facilitar o atendimento.","Retirar o capacete imediatamente para verificar ferimentos.","Levantar a cabeça da vítima.","A retirada incorreta do capacete pode agravar lesões cervicais."],["p1m4q75",4,1,"Uma vítima apresenta hemorragia nasal. Qual deve ser o procedimento correto?","","Inclinar levemente a cabeça para frente e comprimir o nariz.","Deitar e levantar o queixo.","Inclinar a cabeça para trás.","Tampar uma narina e inspirar profundamente.","Inclinar para frente evita que o sangue vá para as vias respiratórias e a compressão ajuda a estancar o sangramento."],["p1m4q76",4,1,"Uma vítima com suspeita de fratura de coluna deve ser:","","Mantida imóvel até a chegada do socorro.","Sentada para facilitar a respiração.","Colocada de lado.","Movimentada para avaliar os danos.","Movimentos indevidos podem causar lesões irreversíveis."],["p1m4q77",4,1,"Ao atender uma vítima de atropelamento inconsciente, o que não deve ser feito?","","Movimentar a vítima sem necessidade.","Checar a respiração.","Acionar o socorro.","Verificar pulso.","Movimentar a vítima pode agravar fraturas e lesões internas. A prioridade é avaliar e chamar o resgate."],["p1m4q78",4,0,"O que é um atendimento de primeiros socorros?","","Cuidados imediatos prestados antes da chegada de ajuda especializada.","Tratamento médico realizado em hospital.","Atendimento feito apenas por profissionais de saúde.","Aplicação de medicamentos específicos.","Primeiros socorros são medidas simples e urgentes prestadas por qualquer pessoa até o socorro especializado chegar."],["p1m4q79",4,1,"Quando uma vítima está consciente e se queixando de dor no peito, o que deve ser feito?","","Acalmá-la e acionar imediatamente o socorro especializado","Pedir para ela caminhar","Dar água fria à vítima","Mandar a pessoa deitar e esperar passar.","A dor no peito pode ser sinal de infarto. É preciso manter a calma da vítima e chamar o socorro imediatamente. Deitar, oferecer líquidos ou pedir para andar pode agravar o problema."],["p1m4q80",4,0,"Em caso de atropelamento, o que o condutor deve fazer?","","Parar o veículo em local seguro e prestar socorro chamando ajuda.","Afastar-se do local.","Retirar a vítima da pista imediatamente.","Aguardar sem comunicar o acidente.","O Código de Trânsito Brasileiro obriga o condutor a parar e acionar o socorro. O abandono de vítima é crime."],["p1m4q81",4,0,"O que deve ser feito se houver vítima inconsciente após um sinistro?","","Verificar se respira e chamar o socorro.","Jogar água no rosto da vítima","Dar álcool para a vítima cheirar.","Tentar levantá-la.","Deve-se checar respiração e chamar socorro especializado. Movimentar a vítima pode agravar ferimentos."],["p1m4q82",4,1,"O que o motorista deve fazer ao ver um ciclista caído na via?","","Parar em local seguro e acionar o socorro.","Desviar e seguir viagem.","Tocar a buzina para alertar.","Esperar que outros ajudem.","Todo condutor deve parar e prestar auxílio. O socorro rápido pode salvar vidas."],["p1m4q83",4,1,"O que não se deve fazer ao atender uma vítima com queimadura causada por sinistro de trânsito?","","Passar pasta de dente ou pomada caseira.","Lavar com água corrente.","Cobrir com pano limpo.","Estourar as bolhas que se formarem.","Produtos caseiros agravam a queimadura e dificultam o tratamento. As bolhas não devem ser estouradas, pois protegem a pele. O correto é resfriar com água corrente e proteger o local com pano limpo."],["p1m4q84",4,0,"Qual o termo que substituiu oficialmente \"acidente\" no Brasil, pois a grande maioria desses eventos pode ser evitada?","","Sinistro.","Fatalidade.","Colisão.","Ocorrência.","O termo \"sinistro\" é usado para reforçar que o evento é uma consequência de escolhas e comportamentos, e não uma fatalidade do destino."],["p1m4q85",4,0,"Em um sinistro, qual a primeira coisa que o condutor deve fazer para garantir a segurança de todos?","","Garantir a própria segurança e sinalizar imediatamente o local.","Tentar movimentar a vítima.","Formalizar o registro do ocorrido.","Ligar para a seguradora.","O primeiro passo é parar em local seguro e acionar o pisca-alerta para sinalizar o problema."],["p1m4q86",4,0,"O que o condutor deve acionar imediatamente após parar o veículo em local seguro no sinistro para alertar outros motoristas?","","O pisca-alerta do veículo.","O farol alto.","O sistema de som.","O limpador de para-brisa.","O pisca-alerta é a sinalização mais imediata de que há um problema na via."],["p1m4q87",4,0,"O que você deve fazer ao falar com uma vítima consciente em um sinistro, para prestar assistência?","","Conversar com ela para mantê-la calma e consciente, e cobri-la se estiver com frio.","Dar água e medicamentos.","Tentar mover a vítima para um local mais seguro.","Fazer procedimentos médicos.","Seu papel é dar apoio e conforto, nunca procedimentos médicos ou movimentação."],["p1m4q88",4,0,"Qual a principal atitude de um condutor consciente em relação ao seu estado físico e emocional ao dirigir?","","Reconhecer os sinais de cansaço ou alteração emocional e parar para descansar/se preparar.","Ignorar os sinais e seguir viagem.","Acelerar para chegar mais rápido.","Usar o telefone celular.","Um condutor consciente sabe que a responsabilidade começa com o seu autocontrole."],["p1m4q89",4,0,"O que o motorista deve fazer em caso de sono ou cansaço, como medida de segurança?","","Encontrar um local seguro, parar e descansar.","Abrir a janela e aumentar o volume do rádio.","Beber café e continuar dirigindo.","Tentar fazer um cochilo rápido no volante.","Um pequeno descanso pode salvar a sua vida e a de outros."],["p1m4q90",4,0,"Qual é um dos sinais de alerta de que o sono está tomando o volante?","","Bocejos frequentes.","Pálpebras abertas.","Pensamentos concentrados.","Direção firme.","Bocejos, pálpebras pesadas e pensamentos dispersos são sinais de alerta."],["p1m4q91",4,0,"O que é fundamental manter, acima de tudo, em um sinistro sem vítimas?","","Manter a calma, respirar fundo e evitar reagir de forma impulsiva.","Gritar com o outro motorista.","Fugir do local imediatamente.","Acelerar a troca de informações sem calma.","Um momento de pausa pode evitar decisões erradas e piores consequências."],["p1m4q92",4,0,"O que a sonolência reduz no motorista, tornando a direção perigosa?","","Seus reflexos, sua atenção e sua capacidade de reagir a imprevistos.","A necessidade de frear.","A sua velocidade.","O consumo de combustível.","O efeito da sonolência é comparado ao de dirigir alcoolizado."],["p1m4q93",4,1,"Em um sinistro sem vítimas que esteja bloqueando o trânsito, qual a atitude correta a ser tomada após a troca de informações?","","Retirar os veículos da via e levá-los para um local mais seguro, como o acostamento.","Deixar os veículos onde estão até a chegada da polícia.","Ignorar o bloqueio e sinalizar a 5 metros.","Acelerar a fuga do local.","Mover os veículos ajuda a evitar novos sinistros e a liberar o fluxo."],["p1m4q94",4,1,"Qual atitude do motorista é citada como perigosa, pois ele perde o controle não do carro, mas de si mesmo?","","Dirigir com emoções alteradas como raiva, ansiedade ou tristeza.","Dirigir respeitando o limite de velocidade.","Dirigir seguindo o protocolo de sinistro.","Dirigir em estado mental equilibrado.","O motorista emocionalmente alterado perde a noção de risco e reage por impulso."],["p1m4q95",4,1,"O que você deve fazer antes de acionar o socorro especializado em um sinistro, como parte da \"Avaliação da Situação\"?","","Observar se há vazamentos de combustível, fumaça, fios elétricos soltos ou risco de incêndio/explosão.","Tentar apagar um vazamento de combustível.","Fazer procedimentos médicos na vítima.","Fugir do local.","Essas informações são cruciais para a sua segurança e para alertar o socorro."],["p1m4q96",4,1,"Em um sinistro com vítimas, qual é a obrigação legal do condutor, segundo o Código de Trânsito Brasileiro e o Código Penal?","","Permanecer no local e cooperar com as autoridades, pois fugir é crime de omissão de socorro.","Fugir imediatamente para não ser acusado.","Fazer procedimentos médicos na vítima.","Mover a vítima para o acostamento.","A omissão de socorro é uma infração grave e pode ser considerada crime."],["p1m4q97",4,1,"Qual a regra de ouro sobre a assistência à vítima, a fim de não agravar os ferimentos?","","\"Não remova, não movimente, não transporte.\"","\"Movimente apenas em caso de dor.\"","\"Movimente sempre para o acostamento.\"","\"Remova a vítima o mais rápido possível.\"","Mexer na vítima pode agravar muito os ferimentos, principalmente fraturas."],["p1m4q98",4,1,"Em um sinistro com vítimas, qual a principal ação que o condutor deve tomar para garantir a segurança de todos ao redor, além de chamar o socorro?","","Desligar o motor dos veículos envolvidos, se possível.","Retirar os pneus dos carros.","Retirar os documentos das vítimas.","Ligar para a seguradora.","Desligar o motor evita riscos como o de incêndio ou explosão."],["p1m4q99",4,1,"Ao ligar para o socorro em um sinistro com vítimas, o que é fundamental informar com clareza para agilizar o atendimento?","","Localização exata, número de vítimas e a situação delas (se estão presas, inconscientes, sangrando etc.).","Seu nome e CPF completo.","Apenas o tipo de veículo envolvido.","A cor da roupa das vítimas.","A precisão das informações é vital para que o socorro chegue preparado."],["p1m4q100",4,1,"No contexto de primeiros socorros em um sinistro, qual é o papel do condutor leigo que presta assistência?","","Dar apoio emocional, informar a vítima sobre a chegada do socorro e nunca tentar fazer procedimentos médicos.","Tentar fazer um procedimento médico.","Apenas observar a vítima sem falar nada.","Mover a vítima para o carro.","O melhor é proteger o local, sinalizar e aguardar os profissionais."],["p1m4q101",4,2,"O que um cochilo de apenas 3 ou 4 segundos a 80km/h faz você percorrer?","","Quase 100 metros sem controle nenhum do veículo, o equivalente a dirigir de olhos fechados por um quarteirão inteiro.","Apenas 10 metros com o controle total do carro.","Cerca de 30 metros, mas com o carro se autocontrolando.","Menos de 5 metros, sem risco.","A alta velocidade em combinação com o sono resulta em uma perda de controle por uma distância perigosamente longa."],["p1m4q102",4,2,"Qual a única
