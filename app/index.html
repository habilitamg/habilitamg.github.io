const BNQ=[["p1m1q1",1,0,"Ao ver a placa de “Área Escolar”, o que o motorista deve fazer?","A-33a","Reduzir a velocidade e redobrar a atenção com crianças e pedestres.","Seguir na mesma velocidade, já que é uma rua comum.","Buzinar para avisar os pedestres.","Acelerar para passar antes do sinal vermelho.","A placa alerta o condutor sobre o risco aumentado e exige prudência."],["p1m1q2",1,1,"Ao virar à direita ou à esquerda, qual atitude básica?","","Sinalizar a manobra antes de virar.","Virar em alta velocidade.","Parar sobre a faixa de pedestres.","Buzinar e entrar sem olhar.","O condutor deve sempre sinalizar a direção antes de virar para avisar os demais usuários da via e evitar acidentes."],["p1m1q3",1,1,"Cruzamento sem semáforo. Você vai virar à esquerda e há pedestres iniciando a travessia na faixa. Ao mesmo tempo, vem carro no sentido contrário. O que fazer?","","Parar, ceder passagem aos pedestres e também aos veículos do sentido contrário, só convertendo quando tudo estiver seguro e sinalizado.","Virar rápido no espaço entre eles.","Buzinar para todos saírem.","Forçar a entrada com farol alto.","Conforme estabelece o Art. 70 e o Art. 214, inciso IV do CTB, o pedestre que já iniciou a travessia na faixa tem prioridade absoluta, sendo infração grave não ceder-lhe passagem. Adicionalmente, o Art. 38, Parágrafo único, estabelece que o condutor que for realizar a manobra de conversão à esquerda deve ceder passagem aos pedestres e aos veículos que transitam em sentido contrário pela pista."],["p1m1q4",1,1,"Cruzamento sem sinalização entre uma rodovia e uma via local. Quem tem preferência?","","Quem trafega pela rodovia.","Quem vem mais rápido pela via local.","Quem buzina.","Quem chega primeiro.","Conforme estabelece o art. 29, inciso III, alínea \"a\" do CTB, quando veículos, transitando por fluxos que se cruzem, se aproximarem de local não sinalizado, terá preferência de passagem, no caso de apenas um fluxo ser proveniente de rodovia, aquele que estiver circulando por ela."],["p1m1q5",1,2,"Em um cruzamento, se o agente de trânsito ordenar ao condutor que avance, mas o semáforo estiver vermelho, qual ordem deve ser obedecida?","","Seguir a ordem do agente, avançando com cuidado.","Ficar parado por causa do vermelho.","Buzinar e exigir o verde.","Fazer retorno para evitar a ordem.","Conforme estabelece o art. 89, inciso I do CTB, a sinalização de trânsito segue uma ordem de prevalência hierárquica, sendo que as ordens do agente de trânsito prevalecem sobre as normas de circulação e outros sinais, incluindo as indicações do semáforo. Portanto, o condutor deve sempre obedecer à orientação do agente."],["p1m1q6",1,0,"Em um cruzamento de área escolar sem semáforo, onde há pedestres esperando para atravessar, qual é a conduta obrigatória do motorista, conforme o CTB?","","Parar e dar preferência de passagem aos pedestres.","Acelerar e passar antes.","Parar sobre a faixa para mostrar presença.","Buzinar para liberar a passagem.","Conforme estabelece o art. 214, inciso IV do CTB, deixar de dar preferência de passagem a pedestre ou a ciclista que se encontre na faixa a ele destinada ou que não haja faixa, mas que já tenha iniciado a travessia é infração gravíssima."],["p1m1q7",1,0,"Em um cruzamento não sinalizado, qual é a ordem de preferência de passagem entre os veículos?","","O veículo que vem pela direita.","Quem buzina mais.","Quem chegar primeiro e acelerar.","O maior veículo.","Conforme estabelece o Art. 29, inciso III do CTB, a preferência deve seguir uma ordem definida: primeiro, prevalecem os veículos que se deslocam sobre trilhos (inciso XII); em seguida, nos casos em que apenas um fluxo for proveniente de rodovia, a preferência é de quem estiver circulando pela rodovia (alínea 'a'); se for uma rotatória, a preferência é de quem estiver circulando por ela (alínea 'b'); e, por fim, quando nenhuma das regras anteriores se aplicar, a preferência de passagem será do veículo que vier pela direita do condutor (alínea 'c')."],["p1m1q8",1,0,"Em cruzamento sem sinalização, quem tem preferência?","","O veículo que vem pela sua direita.","O maior veículo sempre.","Quem buzina mais.","Quem vem pela esquerda.","Conforme estabelece o Art. 29, inciso III do CTB, a preferência deve seguir uma ordem definida: primeiro, prevalecem os veículos que se deslocam sobre trilhos (inciso XII); em seguida, nos casos em que apenas um fluxo for proveniente de rodovia, a preferência é de quem estiver circulando pela rodovia (alínea 'a'); se for uma rotatória, a preferência é de quem estiver circulando por ela (alínea 'b'); e, por fim, quando nenhuma das regras anteriores se aplicar, a preferência de passagem será do veículo que vier pela direita do condutor (alínea 'c')."],["p1m1q9",1,1,"Um condutor que está em uma estrada de terra, em via rural, não vê placa de sinalização e conduz o veículo com velocidade superior 60 km/h. A ação está correta?","","Errado. Em estrada (não pavimentada) a máxima é 60 km/h, reduzir ainda mais se houver poeira, buracos, animais ou pessoas.","Certo, porque não tem fiscalização.","Certo, se não tiver curva.","Certo, se for de dia.","Deve reduzir a velocidade por questão de segurança e por ter aderência menor dos pneus em vias não pavimentada. Art. 61, §1º inciso II, alínea \"c\" do CTB."],["p1m1q10",1,2,"Em um cruzamento com semáforo apagado, o que fazer?","","Reduzir a velocidade e utilizar a regra da direita","Avançar normalmente.","Parar apenas se quiser.","Acelerar para passar antes.","Deve-se aplicar as normas gerais de preferência."],["p1m1q11",1,1,"Faixa de pedestre elevada serve para:","","Forçar redução de velocidade e dar prioridade segura ao pedestre.","Enfeitar a rua sem função prática.","Servir de estacionamento temporário.","Facilitar ultrapassagens.","Dispositivo físico de acalmamento de tráfego."],["p1m1q12",1,0,"A presença de uma faixa de pedestres exige do motorista:","","Parar e dar preferência ao pedestre.","Acelerar para liberar logo a via.","Tocar buzina para o pedestre correr.","Virar o volante sobre a faixa.","Prioridade máxima ao pedestre."],["p1m1q13",1,0,"Faixa exclusiva de ônibus (horário válido):","","Não pode ser usada por carro, só cruzar para conversão onde permitido.","Pode ser usada para adiantar a viagem.","Pode estacionar “rapidinho”.","Pode trafegar à noite sempre.","Exclusividade melhora o transporte coletivo e a segurança."],["p1m1q14",1,1,"Motociclista em semáforo deve parar:","","No bolsão de motos, se existir, ou atrás da faixa de pedestres.","No meio dos carros.","Depois da faixa de pedestres, já na esquina.","Em cima da faixa de pedestres","O bolsão é espaço seguro, caso não exista, respeita-se a faixa."],["p1m1q15",1,0,"Como os veículos são identificados formalmente?","","São identificados por meio de placas externas dianterias e traseiras, com letras e números.","Com cores que o proprietário escolhe.","Com enfeites ou adesivos colocados pelo condutor.","O condutor coloca cada roda de uma cor.","A identificação de veículos por placas está prevista no art. 115 do CTB."],["p1m1q16",1,0,"Por que o motociclista deve sinalizar antes de virar para direita ou para a esquerda?","","Para avisar aos outros a sua intenção e evitar colisões.","Só por educação.","Para evitar multa apenas.","Para chamar atenção.","A sinalização é um ato de segurança, não apenas obrigação."],["p1m1q17",1,0,"Quais veículos têm apenas placa traseira?","","Motocicletas e motonetas.","Todos os carros de passeio.","Somente ônibus.","Apenas caminhões.","De acordo com o art. 115, § 6º do CTB"],["p1m1q18",1,0,"Qual é a função das faixas da esquerda em uma via de várias faixas?","","Servem para ultrapassagem e para veículos mais rápidos.","Para caminhões e ônibus.","Para veículos lentos.","Para estacionar.","Isso mantém o fluxo seguro e organizado."],["p1m1q19",1,2,"Quando há obras na via e sinalização provisória para acesso a imóveis, o condutor deve:","","Seguir as orientações dos agentes ou trabalhadores da obra.","Forçar a passagem.","Ignorar as barreiras.","Fazer manobra pela contramão.","A sinalização provisória garante segurança durante intervenções."],["p1m1q20",1,1,"Aproximação de rotatória sem placa de pare nem semáforo. O que fazer?","","Reduzir, observar e dar passagem a quem já circula dentro.","Entrar acelerando porque não tem placa.","Parar dentro da rotatória para decidir a saída.","Parar o veículo completamente.","Preferência interna é a regra. Art. 29, inciso III, alínea b do CTB"],["p1m1q21",1,1,"Como se classifica uma pista urbana e elevada, com acesso controlado, sem cruzamentos, com placas de 80 km/h?","","Via de trânsito rápido.","Via coletora.","Via local.","Estrada.","A classificação de vias encontra-se no anexo do CTB."],["p1m1q22",1,1,"Você está em uma via coletora (40 km/h) e vê placa uma 30 km/h . Qual conduta o motorista deve adotar?","","Obedecer o limite de 30 km/h, pois sinalização específica prevalece.","Manter 40 km/h da coletora.","Seguir na velocidade que entender melhor.","Ignorar porque é temporária.","Placa vigente regula a via naquele trecho."],["p1m1q23",1,1,"Em certa rotatória há placas dando preferência a quem se aproxima. Qual é a regra que vale?","","Vale a sinalização do local, pois essa prevalece.","Vale a regra geral sempre.","Vale quem buzina.","Vale quem está mais rápido.","Sinalização pode alterar a preferência local."],["p1m1q24",1,0,"Quando o semáforo passa para a cor amarela, o que um condutor consciente deve fazer?","","Reduzir a velocidade e preparar-se para parar.","Acelerar para aproveitar o sinal.","Parar bruscamente no meio da via.","Buzinar para os pedestres atravessarem rápido.","A interpretação correta do sinal é uma ação cognitiva essencial."],["p1m1q25",1,0,"Qual a conduta a ser adotada quando ver uma escola e alunos na calçada?","","Reduzir bem a velocidade e ficar atento a travessias.","Seguir no limite da via sem reduzir.","Buzinar para avisar.","Acelerar para passar rápido.","Devem ser respeitadas as sinalizações de trânsito e as áreas de segurança."],["p1m1q26",1,1,"No contexto da sinalização horizontal de estacionamentos, o que a cor azul (faixa azul) das vagas representa?","","Vaga destinada a pessoas com deficiência.","Vaga rotativa.","Vaga para idosos.","Vaga para carga e descarga.","O símbolo azul identifica vagas PCD. A sinalização de vagas especiais de estacionamento deve seguir o padrão de cor azul e ser complementada pela sinalização vertical e pelo símbolo internacional de acesso (para PCD) ou pelo Símbolo Internacional de Acesso para Idosos. A cor azul é universalmente utilizada para indicar estas vagas de uso preferencial ou exclusivo."],["p1m1q27",1,1,"Um motorista vê uma placa de curva perigosa. O que deve fazer?","","Reduzir a velocidade e manter controle do veículo.","Frear bruscamente no meio da curva.","Acelerar para sair logo.","Ignorar a sinalização.","A placa de \"Curva Perigosa\" é uma advertência da condição adversa da via. A Direção Defensiva exige que o motorista reduza a velocidade no trecho reto antes da curva para que, ao entrar nela, possa manter a estabilidade e evitar que a força centrífuga jogue o veículo para a contramão ou para fora da pista."],["p1m1q28",1,1,"Um motorista, dirigindo em excesso de velocidade, vê uma placa de curva perigosa e continua na mesma velocidade. Qual o risco?","","Perder o controle e causar um sinistro.","Melhorar o tempo de viagem.","Reduzir o consumo de combustível.","Evitar filas.","A placa de \"Curva Perigosa\" é uma advertência da condição adversa da via. A Direção Defensiva exige que o motorista reduza a velocidade no trecho reto antes da curva para que, ao entrar nela, possa manter a estabilidade e evitar que a força centrífuga jogue o veículo para a contramão ou para fora da pista."],["p1m1q29",1,2,"Carlos estaciona seu veículo de passeio em uma vaga com a placa contendo o texto “Exceto Carga e Descarga – 30 min”. Ele pode permanecer ali com o veículo?","","Não, pois a vaga é exclusiva para veículos de carga por até 30 minutos.","Sim, se não houver caminhões.","Sim, por menos de 10 minutos.","Sim, desde que com pisca-alerta ligado.","Conforme estabelece o Art. 181, inciso XVII do CTB, estacionar em desacordo com as condições regulamentadas especificamente pela placa (no caso, \"Exceto Carga e Descarga\") é infração grave, sujeita a multa e remoção do veículo. A sinalização vertical restringe o uso da vaga apenas para a finalidade de carga e descarga, vedando o estacionamento de veículos de passeio ou a permanência por motivos que não o manuseio de mercadorias."],["p1m1q30",1,2,"Um condutor vê a placa acima junto a outra com o texto “Exceto veículos de emergência”. O que isso significa?","R-14","A restrição não se aplica a veículos de emergência, como ambulâncias, em serviço.","Todos os veículos estão liberados.","Somente ônibus podem passar.","É uma placa de advertência.","Conforme as normas de Sinalização de Regulamentação do CONTRAN, a placa principal indica uma proibição. A placa adicional com a inscrição “Exceto veículos de emergência” atua como um painel complementar, que estabelece uma exceção à regra geral de proibição. Essa exceção é crucial para garantir que, em situações de urgência e emergência, o local esteja reservado e desimpedido para o acesso rápido e vital desses veículos."],["p1m1q31",1,2,"Cláudia está de moto e vê a placa acima. Ela pode seguir?","R-10","Não, pois motocicletas também são veículos automotores.","Sim, pois vale apenas para carros.","Sim, se estiver em baixa velocidade.","Apenas se for moradora da rua.","A proibição se aplica a todos os veículos automotores, incluindo motocicletas, motonetas e triciclos."],["p1m1q32",1,2,"Em curvas indicadas por uma placa como esta acima, por que é importante olhar para o ponto de saída da curva?","A-1b","Para orientar o traçado da direção e manter a trajetória estável.","Para observar o retrovisor direito.","Para reduzir o consumo de combustível.","Para verificar o velocímetro.","Antecipar o olhar ajuda a guiar o veículo com suavidade e segurança."],["p1m1q33",1,2,"Felipe segue pela faixa da direita e encontra a placa acima, seguida de “Fim da proibição de mudar de faixa”. O que isso significa?","R-8b","Que ele pode mudar de faixa a partir da segunda placa.","Que a proibição vale até o fim da via.","Que a manobra continua proibida.","Que só motos podem mudar de faixa.","A placa de “fim de proibição” define o ponto exato onde a manobra volta a ser permitida com segurança."],["p1m1q34",1,2,"Júlia conduz um ônibus e encontra a placa acima próxima a uma rotatória. Qual é o comportamento correto?","R-5a","Seguir em frente e utilizar a rotatória para mudar de sentido.","Fazer o retorno antes da rotatória.","Parar sobre a via.","Encostar no acostamento e manobrar.","A rotatória é o ponto adequado para retornar, respeitando a proibição localizada."],["p1m1q35",1,2,"O formato circular com borda vermelha da placa indica","","Uma proibição expressa ao condutor.","Uma informação turística.","Uma advertência temporária.","Um serviço de utilidade pública.","As placas circulares de fundo branco e borda vermelha pertencem à classe de regulamentação, sinalizando ordens obrigatórias."],["p1m1q36",1,2,"A placa com formato triangular invertido tem como função","","Facilitar o reconhecimento mesmo à distância e indicar atenção.","Diferenciar as placas de informação turística.","Servir apenas para fins estéticos.","Indicar uma área de estacionamento.","O triângulo invertido é símbolo internacional de advertência e cortesia no trânsito, facilmente identificado por qualquer condutor."],["p1m1q37",1,2,"O que acontece se o condutor ignorar essa placa e não parar onde for obrigado?","A-15","Ele comete infração gravíssima.","Ele será apenas advertido verbalmente.","Não acontece nada.","O veículo é removido imediatamente.","Deixar de parar diante da placa PARE é infração gravíssima (CTB art. 208)."],["p1m1q38",1,1,"O que essa placa está avisando?","A-17","Que a pista tem irregularidades no pavimento.","Que há um quebra-molas.","Que a pista é nova e lisa.","Que há obras à frente.","A placa alerta sobre buracos, remendos ou deformações na via."],["p1m1q39",1,1,"O que indica a placa acima - Cruz de Santo André?","A-41","O início de uma passagem de nível, onde a pista cruza com uma linha de trem.","Uma ponte sobre o rio.","Um cruzamento entre duas vias urbanas.","Um local de pedágio.","A placa alerta que o motorista está prestes a cruzar trilhos ferroviários e deve redobrar a atenção."],["p1m1q40",1,1,"O que indica a placa acima?","R-33","O sentido obrigatório de circulação na rotatória - Neste caso anti-horário.","O ponto de parada obrigatória.","A entrada proibida na via.","A preferência de pedestres.","O símbolo de setas circulares indica o sentido único que todos os veículos devem seguir na rotatória."],["p1m1q42",1,1,"O que o motorista deve fazer ao ver essa placa?","A-20a","Reduzir a velocidade e usar freio motor.","Acelerar para descer mais rápido.","Ligar o pisca-alerta.","Frear só quando o carro já estiver em alta velocidade.","A redução de velocidade antes da descida garante segurança e controle do veículo."],["p1m1q43",1,1,"Qual o significado da placa acima?","A-31","Indica a presença ou o cruzamento de máquinas agrícolas na pista.","Indica que o condutor deve ultrapassar sempre que possível, mesmo sem visibilidade.","Indica que o condutor deve ignorar o aviso e seguir em alta velocidade.","Indica que o condutor deve ultrapassar pelo acostamento.","Indica a presença ou o cruzamento de máquinas agrícolas na pista, comuns em zonas rurais, áreas de produção ou colheita, e alerta o condutor a reduzir a velocidade e manter distãncia segura."],["p1m1q44",1,1,"Por que a placa acima é importante em vias urbanas com semáforo?","R-25c","Porque ajuda a definir fluxos compatíveis com o tempo semafórico.","Porque indica estacionamento permitido.","Porque dispensa o uso da seta.","Porque reduz a visibilidade.","Garante harmonia entre sinalização vertical e semafórica, evitando conflitos."],["p1m1q45",1,2,"Qual é a diferença entre a curva indicada pela placa acima à esquerda e a da direita?","A-2a","A acima à esquerda indica uma curva menos acentuada.","A acima à esquerda indica uma curva muito mais fechada.","A acima à esquerda proíbe o tráfego de caminhões.","A acima à esquerda é usada apenas em rotatórias.","A-2a é usada para curvas suaves e a A-1a, para curvas acentuadas."],["p1m1q46",1,2,"Qual é a diferença entre a placa “Trânsito de pedestres” e a placa “Passagem sinalizada de pedestres”?","A-32a e A-32b","A primeira indica o trânsito frequente de pedestres, enquanto a segunda indica a presença de faixa de pedestres sinalizada.","Ambas têm o mesmo significado.","A primeira é obrigatória e a segunda é proibitiva.","A placa indica travessia de ciclistas.","A diferença está na representação da faixa no pictograma: a A-32b mostra o pedestre sobre a faixa sinalizada, enquanto a A-32a indica apenas a presença de pedestres circulando com frequência."],["p1m1q47",1,2,"Qual é o principal motivo de sinistros em locais com junções sucessivas contrárias, conforme sinalizado acima?","A-11a","Falta de atenção do motorista que não percebe os veículos entrando ou cruzando.","Defeito no veículo.","Falta de acostamento.","Má conservação da pintura da placa.","A distração é a causa mais comum de colisões laterais nesses pontos."],["p1m1q48",1,2,"Qual o principal erro que causa sinistro em cruzamentos como o da placa?","A-11a","Falta de atenção e avanço sem observar os outros veículos.","Usar o cinto de segurança.","Manter velocidade reduzida.","Parar para observar o trânsito.","A distração e o avanço apressado são causas comuns de colisão lateral."],["p1m1q49",1,1,"Qual o principal objetivo da restrição indicada pela placa acima?","R-38","Aumentar a segurança e preservar o fluxo adequado de veículos leves.","Reduzir a velocidade dos ônibus nas rodovias.","Induzir o uso de veículos particulares.","Garantir estacionamento público.","A restrição evita congestionamentos e riscos estruturais."],["p1m1q50",1,1,"Se a via deixa de ser duplicada e surge a placa acima, o que isso significa para o condutor?","R-28","Que haverá tráfego nos dois sentidos em um mesmo pavimento.","Que a via passa a ser exclusiva para ônibus.","Que deve parar o veículo.","Que o limite de velocidade aumenta.","Essa sinalização marca o fim da separação física de pistas."],["p1m1q51",1,0,"A placa “PARE” exige que o motorista:","R-1","Faça parada total e só siga após garantir segurança.","Diminua a marcha e buzine antes de cruzar.","Avance se tiver prioridade.","Pare apenas se houver pedestres.","Parar completamente é uma obrigação legal, mesmo se o cruzamento parecer livre."],["p1m1q52",1,0,"A placa “Sentido Proibido” serve para:","R-3","A entrada de veículos naquela via ou faixa é proibida, pois o tráfego flui no sentido contrário.","Avisar sobre obras na pista.","Indicar estacionamento regulamentado.","Mostrar a existência de pedágio.","É usada para manter a ordem de fluxo e evitar entrada em vias de sentido único no sentido contrário."],["p1m1q53",1,0,"A placa acima obriga o condutor a:","R-25a","Virar à esquerda no local indicado.","Seguir em frente.","Virar à direita.","Fazer retorno.","A seta curvada indica que o motorista deve obrigatoriamente virar à esquerda."],["p1m1q54",1,0,"A placa acima proíbe o motorista de:","R-4a","Fazer conversão à esquerda, inclusive retorno.","Fazer conversão à direita.","Parar o veículo.","Entrar em via preferencial.","A seta cortada para a esquerda representa a proibição de virar ou retornar nessa direção."],["p1m1q55",1,0,"A principal diferença entre a placa “Dê a Preferência” e a placa “PARE” é que:","","Na placa “dê a preferência” o condutor só para se houver necessidade, na placa “pare” a parada é obrigatória.","Ambas obrigam parada total.","A “Dê a Preferência” é usada em rodovias e a “PARE” apenas em cidades.","A “Dê a Preferência” indica via sem cruzamento.","“Dê a Preferência” indica atenção e redução de velocidade, com parada apenas se necessário, já “PARE” exige parada total."],["p1m1q56",1,0,"A principal função da placa acima é:","A-42a","Alertar o motorista sobre o início de uma pista dividida, aumentando a segurança do tráfego.","Informar que há pedágio adiante.","Indicar pista escorregadia.","Anunciar a presença de curvas perigosas.","A placa orienta o condutor sobre mudança física na via, melhorando a organização do tráfego."],["p1m1q57",1,0,"Ana dirige em pista simples e encontra a placa acima. Essa proibição deve ser seguida enquanto:","R-7","Houver essa sinalização na via.","O condutor achar que é seguro.","Houver espaço suficiente.","O veículo da frente mantiver a velocidade.","A sinalização de fim de proibição deve indicar claramente o término da restrição."],["p1m1q58",1,0,"André dirige em uma avenida e vê a placa acima. O que deve fazer?","R-8a","Permanecer na faixa em que está até o final da restrição.","Mudar de faixa com cuidado, se não houver veículos.","Encostar à direita para seguir devagar.","Ultrapassar pela direita.","A placa R-8a proíbe qualquer deslocamento lateral da esquerda para a direita enquanto durar o trecho sinalizado."],["p1m1q59",1,0,"Ao aproximar-se de uma interseção sinalizada com “Dê a Preferência”, o condutor deve:","R-2","Reduzir a velocidade, observar o tráfego na via principal e só avançar se for seguro.","Parar sobre a faixa de pedestres.","Seguir direto, pois tem prioridade.","Buzinar para indicar sua intenção de cruzar.","Essa placa exige comportamento prudente e observação antes de atravessar, sem necessidade de parada total."],["p1m1q60",1,0,"Ao dirigir em área rural e ver esta placa, o que o condutor deve prever?","A-31","Possível entrada ou saída lenta de tratores.","Alta velocidade no trecho.","Presença de pedestres.","Obras em pista.","A sinalização previne acidentes causados por diferença de velocidade entre veículos."],["p1m1q61",1,0,"Ao encontrar a placa “PARE” em um cruzamento, o condutor deve:","R-1","Parar completamente o veículo antes da linha de retenção e só seguir quando a via estiver livre.","Reduzir a velocidade e atravessar devagar se não houver veículos.","Parar apenas se houver outro veículo aproximando-se.","Aumentar a velocidade para não atrapalhar o fluxo.","A parada total é obrigatória mesmo sem trânsito no local. Essa placa indica um ponto de risco elevado."],["p1m1q62",1,0,"Ao encontrar a placa acima, o motorista deve:","R-25a","Sinalizar e virar à esquerda com segurança.","Seguir reto, sem reduzir a velocidade.","Virar à direita imediatamente.","Parar no acostamento.","A manobra deve ser feita com antecedência, respeitando pedestres e ciclistas."],["p1m1q63",1,2,"Ao ver a placa “60 km/h”, o condutor deve entender que:","R-19","Essa é a velocidade máxima permitida para aquele trecho da via.","É a velocidade obrigatória.","É apenas uma recomendação.","É a velocidade mínima.","A placa R-19 fixa o limite máximo permitido, não a velocidade obrigatória."],["p1m1q64",1,0,"Ao ver a placa “Dê a Preferência”, o motorista deve:","R-2","Reduzir a velocidade e deixar passar os veículos que vêm pela via principal.","Parar completamente o veículo, mesmo sem outros carros.","Avançar primeiro, pois tem prioridade.","Buzinar para sinalizar que vai passar.","A placa R-2 orienta o condutor a ceder a passagem, parando apenas se for necessário para evitar colisão."],["p1m1q65",1,0,"Ao ver a placa “Proibido Virar à Esquerda”, o motorista deve:","R-4a","Seguir em frente ou virar à direita, respeitando a proibição.","Fazer a conversão à esquerda com cuidado.","Parar o veículo no cruzamento.","Reduzir a velocidade e virar rapidamente.","Essa placa impede qualquer conversão à esquerda naquele ponto, devendo o condutor escolher outro trajeto permitido."],["p1m1q66",1,0,"Ao ver a placa com uma buzina cortada por uma faixa vermelha, o condutor deve entender que:","R-20","É proibido usar buzina ou qualquer sinal sonoro no local.","Deve buzinar para avisar pedestres.","Só pode buzinar durante o dia.","O uso da buzina é obrigatório.","A placa R-20 indica proibição de sons que possam causar incômodo ou perturbação."],["p1m1q67",1,0,"Ao ver a placa com uma seta preta apontando para baixo e à direita, como a figura acima, o condutor deve entender que:","R-24b","A passagem é obrigatória pelo lado direito do obstáculo.","Ele deve virar à esquerda.","É permitido passar por qualquer lado.","Deve parar o veículo.","A placa R-24b obriga o condutor a contornar o obstáculo pelo lado indicado."],["p1m1q68",1,0,"Ao ver esta placa, o motorista deve:","A-32a","Reduzir a velocidade e ficar atento à travessia de pessoas.","Aumentar a velocidade.","Buzinar para os pedestres saírem.","Seguir sem se preocupar.","O respeito ao pedestre é um dos pilares da segurança viária."],["p1m1q69",1,0,"Camila trafega atrás de um caminhão em um trecho com a placa acima. O que ela deve fazer?","R-7","Permanecer em sua faixa, mantendo distância segura.","Ultrapassar pela faixa da esquerda rapidamente.","Deslocar-se pelo acostamento.","Fazer sinal de luz pedindo passagem.","A segurança exige paciência, ultrapassar em trecho proibido pode causar colisões frontais."],["p1m1q70",1,0,"Carla vê a placa acima em uma ponte. Por que ela foi instalada ali?","R-8a","Para evitar que os veículos mudem de faixa em local estreito e causem colisões.","Porque há radar de velocidade.","Porque é área de pedágio.","Porque é trecho de ultrapassagem.","Em pontes e viadutos, mudar de faixa representa risco de choque lateral e deve ser evitado."],["p1m1q71",1,0,"Cláudia conduz um caminhão com carga de fardos empilhados e vê a placa acima antes de um viaduto. O que deve fazer?","R-15","Verificar se a carga ultrapassa o limite e não passar se estiver acima.","Acelerar para passar rápido.","Passar pela calçada lateral.","Pedir ajuda a outro motorista.","O condutor é responsável por garantir que o veículo e a carga estejam dentro dos limites de altura."],["p1m1q72",1,0,"Cláudia dirige um automóvel e vê a placa acima em uma rua do centro da cidade. Ela pode seguir?","R-9","Sim, pois a restrição é apenas para caminhões.","Não, a via é totalmente bloqueada.","Somente se for moradora.","Apenas se for horário noturno.","A placa R-9 restringe apenas o trânsito de caminhões, veículos de passeio, ônibus e motos podem transitar."],["p1m1q73",1,0,"Como o condutor deve agir ao entrar em uma rotatória sinalizada por essa placa?","A-12","Deve ceder passagem aos veículos que já circulam dentro dela.","Deve entrar sem olhar.","Deve parar no meio da pista.","Deve buzinar antes de entrar.","Nas rotatórias, a preferência é de quem já está circulando nelas. CTB art. 29, III, “c”."],["p1m1q74",1,0,"Em quais locais a placa acima é mais utilizada?","R-38","Em vias estreitas, áreas residenciais ou centros históricos.","Em rodovias de pista dupla.","Em estações rodoviárias.","Em faixas de ônibus.","Essas áreas não comportam veículos grandes com segurança."],["p1m1q75",1,0,"Em que locais a placa acima costuma ser instalada?","R-24b","Antes de canteiros centrais, ilhas, obras e divisores de pista.","Em estacionamentos subterrâneos.","Em faixas de pedestre.","Em zonas escolares.","Essa placa orienta o motorista a contornar obstáculos fixos ou temporários com segurança."],["p1m1q76",1,0,"Em que locais costuma ser instalada a placa acima?","R-28","No final de vias de mão única, indicando o início do duplo sentido.","Em pontes de pista dupla.","Em estacionamentos privados.","Em pedágios automáticos.","É usada na transição entre vias de mão única e mão dupla."],["p1m1q78",1,0,"Fernanda está em uma via de pista dupla e vê a placa acima. Qual é o significado dessa placa?","R-5a","É proibido fazer retorno à esquerda no local indicado.","É permitido virar à esquerda para estacionar.","É obrigatório virar à direita.","Indica fim de proibição.","Essa placa proíbe a manobra de retorno à esquerda, que pode causar risco a veículos vindos no sentido oposto."],["p1m1q79",1,0,"João para o carro por alguns seg ","Que há um posto policial.","Que é o fim da pista.","Essa placa prepara o condutor para parar completamente adiante."],["p1m1q92",1,0,"O que essa placa está avisando?","A-7a","Que há uma via entrando pela esquerda.","Que a pista é de mão dupla.","Que existe uma lombada.","Que é proibido virar à esquerda.","A placa indica que outra via se junta à estrada principal pela esquerda."],["p1m1q93",1,0,"O que essa placa indica ao condutor?","A-19","Que há uma depressão ou abaixamento na pista à frente.","Que existe uma lombada.","Que há pista irregular.","Que o pavimento é novo.","A placa alerta para um rebaixamento que pode causar impacto na suspensão do veículo."],["p1m1q94",1,0,"O que essa placa indica ao condutor?","A-12","Que há uma rotatória à frente.","Que a via é sem saída.","Que existe um retorno proibido.","Que há um quebra-molas.","A placa adverte que o condutor se aproxima de uma interseção circular (rotatória)."],["p1m1q95",1,0,"O que essa placa indica ao condutor?","A-20b","Que há uma subida forte à frente.","Que a pista está em declive.","Que há uma lombada.","Que existe um pedágio logo adiante.","A placa alerta sobre um trecho de aclive, ou seja, uma subida íngreme."],["p1m1q96",1,0,"O que essa placa indica?","A-9","Que a via se divide em duas direções à frente.","Que há um cruzamento com semáforo.","Que a pista é de mão dupla.","Que a via termina logo adiante.","A placa alerta que a estrada se divide e o condutor deve decidir o sentido com antecedência."],["p1m1q97",1,0,"O que essa placa indica?","A-14","Que há um semáforo à frente.","Que a via é preferencial.","Que há uma lombada dupla.","Que é permitido ultrapassar.","A placa alerta que o condutor se aproxima de um cruzamento com controle de semáforo."],["p1m1q98",1,0,"O que essa placa indica?","A-18","Que há uma lombada ou saliência na pista à frente.","Que há um buraco na via.","Que o trânsito está livre.","Que há pedágio.","A placa alerta o motorista sobre a presença de uma elevação na pista."],["p1m
