q12",2,0,"Parar o veículo sobre faixa de pedestre para embarque é:","","Proibido e perigoso, obriga pedestres a desviar para a via.","Permitido se o motor estiver ligado.","Permitido se o passageiro for criança.","Permitido só por um minuto.","Faixa é exclusiva para travessia segura. Art. 183 do CTB"],["p1m2q13",2,0,"Pedro, motociclista, quer mudar de faixa. Ele deve:","","Sinalizar antes, olhar pelos retrovisores e só mudar se for seguro.","Cortar logo para não perder espaço.","Mudar rápido sem avisar.","Esperar o outro buzinar.","O uso das setas é obrigatório e evita colisões laterais."],["p1m2q14",2,0,"Por que as infrações gravíssimas podem ter multa multiplicada?","","Pelo alto potencial de dano à vida e à coletividade.","Para arrecadar mais.","Porque são raras.","Para punir só quem é reincidente.","Refletem a gravidade da infração."],["p1m2q15",2,2,"Quais penalidades o CTB prevê?","","Advertência por escrito, multa, suspensão, cassação e curso de reciclagem.","Multa e apreensão do veículo.","Advertência e multa.","Prisão do condutor.","Penalidades previstas no art. 256 do CTB"],["p1m2q16",2,0,"Qual é o comportamento mais seguro ao dirigir perto de ciclistas?","","Reduzir a velocidade e manter uma distância mínima de 1,5 metro ao ultrapassar.","Acelerar para ultrapassar rapidamente.","Buzinar para o ciclista sair.","Passar bem perto do ciclista para não prejudicar o fluxo de veículos.","Essa distância está no art. 201 do CTB."],["p1m2q17",2,2,"Quando a responsabilidade por uma infração de trânsito é do proprietário do veículo?","","Quando a infração estiver ligada às condições do veículo ou à falta de licenciamento.","Quando o condutor não respeita a sinalização de trânsito.","Quando o condutor estaciona em vaga comum.","Quando o condutor utiliza farol baixo à noite.","Infrações ligadas à condição do veículo."],["p1m2q18",2,0,"Quem é o responsável pela maioria das infrações durante a condução?","","O condutor.","O fabricante.","O pedestre.","O guincho.","Regra geral, exceções no art. 257."],["p1m2q19",2,1,"A medida administrativa de remoção do veículo (art. 271) ocorre quando:","","A infração impede a circulação ou oferece risco, exigindo que o veículo seja recolhido pelo agente.","Há pneu calibrado.","Carro está limpo.","Motorista é habilitado.","Aplicável para ações que representam risco ou impedem o fluxo das vias."],["p1m2q20",2,1,"A medida administrativa de retenção do veículo (art. 270) significa:","","Fica parado até sanar a irregularidade no local, se possível.","Vai direto ao pátio do órgão de trânsito.","Que será aplicada multa em dobro.","Perda do veículo.","Retem-se o veículo pelo tempo suficiente para averiguar ou sanar uma situação."],["p1m2q21",2,1,"A suspensão do direito de dirigir pode ocorrer por infração específica quando:","","A própria infração prevê suspensão (ex.: álcool, corrida, ameaçar pedestres).","Somar 10 pontos.","Houver apenas advertência.","Qualquer infração leve.","Nas situações em que a infração, por expressa previsão legal, implicar a aplicação conjunta da penalidade de suspensão do direito de dirigir."],["p1m2q22",2,2,"Conduzir veículo não registrado e licenciado é infração:","","Gravíssima.","Leve.","Não é considerada infração.","Grave.","Exigência do licenciamento."],["p1m2q23",2,1,"Dirigir com CNH vencida há mais de 30 dias é:","","Infração gravíssima, com multa e retenção do veículo até ser apresentado condutor habilitado.","Permitido por 1 ano.","Infração leve e o condutor recebe advertência verbal.","Infração leve sem multa.","O condutor deve estar devidamente habilitado para dirigir veículos. Extrapolar o prazo e conduzir é uma infração, conforme art. 162, inciso V, do CTB."],["p1m2q24",2,1,"Dirigir com documento cassado ou com suspensão é:","","Infração gravíssima, com multa (três vezes), recolhimento do documento e retenção do veículo.","Permitido se for perto de casa.","Permitido, desde que ligue o pisca-alerta.","Infração leve.","Infração prevista no art. 162, inciso II, do CTB."],["p1m2q25",2,2,"Dirigir veículo de categoria superior à sua habilitação é:","","Infração gravíssima, com multa (duas vezes) e retenção do veículo.","Permitido aos domingos.","Infração média.","Sem problema se tiver cuidado.","Infração prevista no art. 162, inciso III, do CTB."],["p1m2q26",2,1,"É correto parar ou estacionar sobre faixa de pedestres?","","Não. Bloqueia a passagem e configura uma infração de trânsito.","Sim, se for após as 22h.","Sim, se não houver fiscalização.","Sim, se ligar o pisca-alerta.","O condutor deve observar as preferências da via e estacionar nos locais apropriados."],["p1m2q27",2,2,"De acordo com o CTB, qual é a natureza da infração cometida ao estacionar o veículo bloqueando o acesso a hidrantes, garagens, tampas de poço de visita ou galerias pluviais?","","Proibido, porque atrapalha serviços essenciais e causa risco.","Permitido com pisca-alerta.","Permitido à noite e domingos.","Permitido se o carro ficar ligado.","Conforme estabelece o Art. 181, inciso X do CTB, estacionar o veículo impedindo a movimentação de outro veículo ou o acesso a saídas de garagens e o Art. 181, inciso VI, que trata de estacionar em desacordo com as condições regulamentadas especificamente nas áreas de hidrantes de incêndio, ambos são classificados como infração média, sujeitos à multa e à medida administrativa de remoção do veículo. Bloquear tais acessos prejudica serviços públicos essenciais e o direito de acesso à propriedade."],["p1m2q28",2,1,"De acordo com o CTB, o que são as Medidas Administrativas e qual é a sua finalidade?","","Ações imediatas para reestabelecer a segurança que acompanham a autuação.","Apenas multas.","Punições criminais.","Acordos entre particulares.","Conforme estabelece o Art. 269 do CTB, as Medidas Administrativas (como retenção do veículo, remoção, ou recolhimento da CNH/CRLV) são ações de caráter complementar à penalidade (multa, suspensão, cassação) e têm como principal finalidade a pronta intervenção para coibir a infração, regularizar a situação e garantir a segurança no local."],["p1m2q29",2,1,"Se o comprador do veículo não transferir a propriedade em 30 dias, qual é a infração?","","infração média","Advertência por escrito automática.","Não acontece nada.","leve","Deixar de registrar no prazo legal."],["p1m2q30",2,1,"Vagas exclusivas para pessoa idosa ou com deficiência:","","Devem ser respeitadas, só usando com a credencial válida.","Podem ser usadas por qualquer um à noite.","Valem só em dias úteis.","Podem ser usadas por qualquer um por no máximo 5 minutos.","Devem ser respitadas as regras de estacionamento."],["p1m2q31",2,2,"Qual a consequência para o motorista com Permissão para dirigir que comete infração de trânsito gravíssima?","","Cancelamento da permissão e reinício do processo de habilitação.","Apenas pagar multa e seguir.","Suspensão de 30 dias.","Advertência por escrito.","Art. 148, §§ 3º e 4º."],["p1m2q32",2,0,"Usar o celular ao volante é:","","Um risco porque distrai o condutor e reduz o tempo de reação.","Uma ferramenta boa, pois aumenta a atenção na direção.","Uma ferramenta que ajuda a manter a calma no trânsito.","Permitido em ruas pouco movimentadas.","Além de ser infração, a distração por celular é uma das principais causas de sinistros."],["p1m2q33",2,1,"“Meu carro tem muitos sistemas, posso dispensar o cinto.” A leitura correta é:","","Nenhum sistema substitui o cinto, ele é indispensável.","Airbag já basta.","ABS faz o papel do cinto.","DRL evita todos os sinistros.","Sistemas são complementares ao cinto, sendo este indispensável e obrigatório."],["p1m2q34",2,1,"Cinto na gravidez:","","Deve ser usado, reduz riscos à gestante e ao bebê.","É proibido.","Só a faixa abdominal.","Apenas no banco dianteiro.","Sem cinto, há risco de lesões para a gestante e para o bebê."],["p1m2q35",2,0,"“Bebi uma taça de vinho, dá para dirigir?” Qual a resposta correta para esta pergunta?","","Não. Qualquer quantidade de álcool aumenta o risco de sinistros e é infração.","Sim, se for perto de casa.","Sim, se não tiver fiscalização.","Não, pois pode ser denunciado.","A legislação brasileira adota a tolerância zero para álcool na direção."],["p1m2q36",2,0,"Antônio estaciona em local proibido, em frente a uma esquina. Isso pode causar:","","Dificuldade de visão para outros motoristas e risco de sinistro.","Nenhum problema, se for rápido.","Apenas uma multa leve.","Maior segurança, por estar perto da esquina.","O condutor deve estarcionar em locais apropriados para aumentar a segurança das vias."],["p1m2q37",2,0,"Beber só uma latinha e dirigir é:","","Perigoso, pois reduz reflexos e aumenta o risco de sinistro.","Permitido se a rua estiver vazia.","Seguro se o motorista for experiente.","Correto se não houver fiscalização.","O álcool altera a capacidade psicomotora."],["p1m2q38",2,0,"Beber cerveja e dirigir só um pouco é:","","Risco grave de sinistro, pois o álcool reduz a capacidade do condutor.","Aceitável se for perto de casa.","Permitido em ruas vazias.","Certo se não houver fiscalização.","O álcool altera a capacidade psicomotora."],["p1m2q39",2,0,"Por que devemos respeitar a faixa de pedestre mesmo quando não há semáforo?","","Porque o pedestre tem prioridade de passagem.","Porque evita multa leve.","Porque o motorista perde tempo.","Porque melhora o trânsito.","Priorizar o pedestre é garantir segurança no trânsito e respeito."],["p1m2q40",2,0,"Por que não se deve usar o celular enquanto dirige?","","Porque tira a atenção e aumenta o risco de sinistros.","Porque pode não ter sinal para mandar mensagens.","Porque atrapalha a buzina.","Porque consome bateria do carro.","Distração é causa frequente de atropelamentos."],["p1m2q41",2,0,"Por que o uso do celular ao volante é perigoso?","","Porque tira a atenção dos olhos, da mente e das mãos.","Porque gasta bateria do celular.","Porque atrasa a entrega de mensagens.","Porque só incomoda os passageiros.","Distração visual, cognitiva e manual aumenta o risco."],["p1m2q42",2,0,"Por que olhar notificações no celular por “5 segundos” é perigoso?","","Porque nesse tempo, a 70 km/h, o carro percorre quase um campo de futebol sem controle.","Porque o celular pode desligar.","Porque só atrapalha em estrada.","Porque gasta internet.","Distância percorrida sem atenção é enorme."],["p1m2q43",2,0,"Por que respeitar a vaga reservada para pessoa com deficiência é importante?","","Porque é um direito garantido por lei e mostra respeito ao outro.","Porque deixa o estacionamento mais bonito.","Porque evita multas leves.","Porque só quem usa cadeira de rodas precisa.","A acessibilidade é um direito legal e uma atitude de empatia."],["p1m2q44",2,0,"Por que responder mensagem pelo celular dirigindo é perigoso?","","O condutor fica distraído e retitra as mãos do volante, sendo perigoso para todos usuários da via.","Só gasta bateria.","Só é ruim à noite.","Só atrapalha quem está atrás.","A distração aumenta o risco de sinistros."],["p1m2q45",2,0,"Qual a ideia da tolerância zero para álcool?","","Qualquer quantidade de álcool influencia na coordenação do condutor.","Que uma taça é liberada.","Que só vale para rodovia.","Que depende do humor do agente.","O álcool compromete a coordenação do condutor e o tempo de resposta, aumentando a possibilidade de sinistros de trânsito."],["p1m2q46",2,0,"Qual é a idade mínima para uma criança andar na garupa de moto?","","10 anos.","8 anos.","5 anos.","7 anos.","O CTB proíbe transportar criança menor de 10 anos em motocicletas. Art. 244, inciso V."],["p1m2q48",2,0,"Rosa vai atravessar a rua falando ao celular e quase é atropelada. O que ela fez de errado?","","Deixou de prestar atenção no trânsito.","Atravessou na faixa de pedestres.","Esperou o semáforo abrir.","Usou o celular apenas para ouvir música.","Todos os usuários da via devem prestar atenção aos arredores."],["p1m2q49",2,0,"Trafegar em velocidade incompatível com a segurança perto de escola ou hospital configura o quê?","","Configura crime de trânsito, conforme previstono art. 311 do CTB.","Apenas multa leve.","Infração média.","Só orientação verbal.","Trafegar em velocidade incompatível nesses locais é crime, conforme art. 311 do CTB."],["p1m2q50",2,0,"Um motociclista leva uma criança de 8 anos na garupa. Isso é:","","Proibido, configurando uma infração de trânsito.","Permitido se o trajeto for curto.","Permitido se a criança estiver com capacete.","Permitido dentro do bairro.","Criança menor de 10 anos não pode ser transportada em motocicletas, conforme art. 244, inciso V, do CTB."],["p1m2q51",2,0,"Um motociclista passa entre os carros em alta velocidade. Isso é:","","Um comportamento perigoso e proibido.","Um jeito normal de ganhar tempo.","Permitido se o trânsito estiver parado.","Permitido em qualquer situação.","Ultrapassar entre veículos aumenta muito o risco de sinistro."],["p1m2q52",2,0,"Um motorista sai de casa atrasado e decide dirigir acima da velocidade permitida para a via. Essa atitude:","","Aumenta o risco de sinistro e pode causar mortes.","Ajuda a economizar tempo com segurança.","É correta se a rua estiver vazia.","Evita multas por atraso.","As regras de velocidade da via devem ser respeitadas para garantir segurança para todos."],["p1m2q53",2,0,"Um motorista ultrapassa um ciclista muito perto e causa um tombo. Isso mostra falta de:","","Respeito às regras de trânsito e às vidas das pessoas.","Atenção com o carro.","Conhecimento da via.","Paciência.","A distância lateral de 1,5 m evita sinistros."],["p1m2q54",2,0,"Paulo bebeu cerveja antes de dirigir e disse que “só umas latinhas não fazem mal”. O que essa atitude representa?","","A atitude representa falta de percepção de risco e a desobediência à legislação, pois qualquer quantidade de álcool prejudica a capacidade psicomotora para dirigir.","Um erro sem importância, se ele dirigir devagar.","Algo permitido se não houver blitz.","Uma tradição comum e sem problema.","O álcool prejudica a coordenação motora e é causa principal de mortes no trânsito. Conforme estabelece o Art. 165 do CTB, dirigir sob a influência de álcool é infração gravíssima com penalidade de multa (dez vezes o valor) e suspensão do direito de dirigir. O CTB adota o princípio da Tolerância Zero (Lei Seca), no qual qualquer concentração de álcool por litro de sangue ou por litro de ar alveolar sujeita o condutor às penalidades administrativas e criminais. A crença de que \"pouco não faz mal\" demonstra um erro de avaliação e a falta de percepção do risco que o álcool causa na coordenação, atenção e tempo de reação."],["p1m2q55",2,2,"Cenário: Pedro dirige com seu filho de 12 anos no banco de trás sem o cinto de segurança em um trajeto curto. Pergunta: De acordo com o CTB e a Direção Defensiva, qual é a penalidade legal e o principal risco de segurança dessa atitude?","","A penalidade é infração grave, sujeita a multa e retenção do veículo. O principal risco é a projeção da criança em caso de colisão ou frenagem brusca.","Nada, pois o cinto só é obrigatório para crianças menores de 10 anos.","O carro é apreendido na hora, e Pedro perde a CNH por um ano.","Apenas o agente aplica uma advertência verbal, pois o trajeto era curto.","Conforme estabelece o Art. 167 do CTB, deixar de usar o cinto de segurança (obrigatório para todos os ocupantes, conforme Art. 65) é infração grave, sujeita a multa e retenção do veículo até a colocação do cinto. A crença de que \"trajeto curto não tem perigo\" é um erro de percepção de risco, pois a maioria dos acidentes ocorre perto de casa. Sem o cinto, em uma colisão ou frenagem brusca, a criança de 12 anos corre o risco de ser projetada contra o banco dianteiro ou para fora do veículo."],["p1m2q56",2,1,"Por que “dar só uma espiadinha” no celular, durante a condução de veículo a 70 km/h, é perigoso?","","Porque a 70 km/h, em 5 s o carro anda aproximadamente 97 m sem controle.","Porque o celular pode esquentar.","Porque só atrapalha o passageiro.","Porque o motor perde força.","Conforme estabelece o Art. 252, Parágrafo único do CTB, manusear telefone celular enquanto dirige é uma infração gravíssima. O risco é extremo porque a 70 km/h, o veículo percorre aproximadamente 58 metros em apenas 3 segundos de desatenção. Essa distância anula a margem de segurança e o tempo necessário para o condutor reagir (frear ou desviar) a qualquer imprevisto, levando a um risco máximo de colisão."],["p1m2q57",2,1,"Por que não se deve estacionar diante de rampas de acesso?","","Porque impede o uso por cadeirantes e carrinhos.","Porque o piso é escorregadio.","Porque é pouco usado.","Porque ninguém reclama.","Bloquear rampa é falta de respeito e infração."],["p1m2q58",2,1,"Por que não se deve usar o celular enquanto dirige?","","Porque tira a atenção e aumenta o risco de sinistros.","Porque é feio.","Porque atrapalha a buzina.","Porque consome bateria do carro.","Conforme estabelece o Art. 252, Parágrafo único do CTB, manusear telefone celular enquanto dirige é uma infração gravíssima. O risco é extremo porque a 70 km/h, o veículo percorre aproximadamente 58 metros em apenas 3 segundos de desatenção. Essa distância anula a margem de segurança e o tempo necessário para o condutor reagir (frear ou desviar) a qualquer imprevisto, levando a um risco máximo de colisão."],["p1m2q59",2,1,"Por que o uso do celular aumenta tanto o risco de sinistro?","","Porque desvia visão, pensamento e mãos do volante ao mesmo tempo.","Porque só atrapalha à noite.","Porque aumenta a potência do motor.","Porque reduz o barulho do carro.","Conforme estabelece o Art. 252, Parágrafo único do CTB, manusear telefone celular enquanto dirige é uma infração gravíssima. O risco é extremo porque a 70 km/h, o veículo percorre aproximadamente 58 metros em apenas 3 segundos de desatenção. Essa distância anula a margem de segurança e o tempo necessário para o condutor reagir (frear ou desviar) a qualquer imprevisto, levando a um risco máximo de colisão."],["p1m2q60",2,1,"Qual condição caracteriza crime de trânsito em razão da condução de veículo sob influência de álcool?","","O crime se caracteriza pela capacidade psicomotora alterada devido à influência de álcool, constatada por concentração igual ou superior a 0,3 miligrama de álcool por litro de ar alveolar (bafômetro) ou por sinais que indiquem essa alteração.","Qualquer valor no aparelho.","Apenas se houver sinistro.","Só com laudo médico.","Conforme estabelece o Art. 306, § 1º, inciso I do CTB, o crime de embriaguez ao volante é caracterizado pela concentração de álcool igual ou superior a 0,3 miligrama por litro de ar alveolar (0,34 mg/L é o valor a ser considerado após a margem de erro) ou por 0,6 decigrama de álcool por litro de sangue. O Art. 306, § 1º, inciso II, permite a comprovação do crime também por sinais que indiquem a alteração da capacidade psicomotora, como dificuldade de equilíbrio ou fala alterada, independentemente do teste do bafômetro. O crime é punido com detenção, multa e suspensão ou proibição de obter a CNH."],["p1m2q61",2,1,"Qual consequência administrativa de dirigir sob influência de álcool?","","Multa gravíssima (dez vezes) e suspensão do direito de dirigir por 12 meses.","Apenas advertência por escrito.","Multa simples, sem suspensão.","Perda do veículo automaticamente.","Penalidade do art. 165 do CTB."],["p1m2q62",2,1,"Qual é a diferença entre “velocidade máxima” e “velocidade segura”?","","A máxima é o limite legal, a segura é a adequada às condições do momento.","As duas são iguais sempre.","A segura é sempre maior.","A máxima é só uma sugestão.","Conforme dispõe o art. 61 do Código de Trânsito Brasileiro (CTB), a velocidade máxima é aquela estabelecida por meio de sinalização, ou, na ausência desta, pelos limites fixados pelo próprio Código. Já a velocidade segura é um conceito vinculado à Direção Defensiva, que orienta o condutor a ajustar sua velocidade às condições da via, do trânsito, do veículo e do clima, de forma a manter o controle do automóvel e prevenir acidentes."],["p1m2q63",2,1,"Recusar o bafômetro gera quais efeitos?","","Mesmas penalidades administrativas de dirigir sob a influência de álcool (multa x10 e suspensão por 12 meses).","Nenhuma penalidade.","Apenas multa leve.","Só vale à noite.","Conforme estabelece o Art. 165-A do CTB, a recusa do condutor em se submeter a qualquer dos procedimentos previstos (teste do bafômetro, exames clínicos) para a verificação de influência de álcool ou de substância psicoativa é considerada infração gravíssima. A penalidade aplicada é a mesma do Art. 165 (dirigir sob influência de álcool): multa (dez vezes o valor) e suspensão do direito de dirigir por 12 meses, além do recolhimento da CNH e retenção do veículo."],["p1m2q64",2,1,"Um pedestre usa o celular enquanto atravessa a via. O que pode acontecer?","","Ele pode se distrair e sofrer um sinistro.","Nada, pois está na faixa.","O motorista é o único responsável.","Isso é sempre permitido.","Conforme os princípios da Direção Defensiva, a distração causada pelo uso do celular (distração visual e cognitiva) anula a capacidade de previsão e a atenção difusa do pedestre. O Art. 69 do CTB exige que o pedestre tome as precauções de segurança ao atravessar. Ao usar o celular, o pedestre negligencia essa obrigação, falhando em ver e ouvir veículos, o que o expõe diretamente ao risco de ser atropelado, que é a forma mais letal de sinistro de trânsito."],["p1m2q65",2,2,"Qual das punições a seguir é um exemplo de Penalidade?","","Suspensão do direito de dirigir.","Retenção do veículo.","Remoção do carro para o pátio.","Recolhimento do documento de habilitação.","Suspensão e cassação são exemplos de Penalidade."],["p1m2q66",2,2,"Qual das ações a seguir é um exemplo de Medida Administrativa?","","Retenção do veículo.","Multa.","Advertência por escrito.","Cassação da CNH.","Retenção do veículo é uma ação imediata do agente, caracterizando Medida Administrativa."],["p1m2q67",2,0,"Qual é o prazo, em dias, que o novo proprietário tem para providenciar o registro da transferência do veículo após a venda?","","30 dias.","10 dias.","60 dias.","90 dias.","O novo proprietário tem até 30 dias para fazer o registro da transferência."],["p1m2q68",2,0,"Qual o prazo, em dias, que o condutor tem para providenciar a renovação da CNH a partir do seu vencimento?","","30 (trinta) dias.","60 dias.","10 dias.","90 dias.","O prazo para providenciar a renovação é de 30 dias após o vencimento."],["p1m2q69",2,0,"Qual item é listado como um equipamento obrigatório para carros que deve ser checado antes de sair?","","Estepe calibrado.","Extintor de incêndio.","Kit de primeiros socorros.","GPS.","Estepe calibrado, macaco e triângulo são equipamentos obrigatórios para carros."],["p1m2q70",2,0,"Qual item é listado como um equipamento obrigatório para motos que deve ser checado antes de sair?","","Capacete com viseira ou óculos de proteção.","Estepe calibrado.","Macaco.","Kit de ferramentas avançado.","O capacete com viseira/óculos de proteção é obrigatório para motos."],["p1m2q71",2,0,"Qual condição física e mental afeta reflexos, atenção e capacidade de decisão do condutor?","","Estar cansado ou emocionalmente abalado.","Estar com o carro limpo.","Estar com o som alto.","Estar com a janela aberta.","O estado físico e mental (cansaço, álcool, emoções) afeta a direção."],["p1m2q72",2,0,"A Pontuação na Carteira é uma consequência que acompanha uma infração de trânsito. O que ela soma ao condutor?","","Pontos na CNH que ficam registrados no prontuário.","O valor da multa a ser pago.","O número de crimes de trânsito.","O número de Medidas Administrativas.","A pontuação é o registro dos pontos na CNH."],["p1m2q73",2,0,"O que a Penalidade de Multa pode acompanhar, fazendo parte de um processo administrativo?","","A pontuação na carteira.","Um crime de trânsito.","Uma cassação definitiva.","Uma prisão.","A pontuação é uma consequência diferente que pode ser aplicada junto com a penalidade de multa."],["p1m2q74",2,0,"O que é essencial que esteja funcionando no veículo para que ele esteja em condições de segurança?","","Faróis, freios, retrovisores, buzina, pneus em bom estado e setas.","Ar-condicionado, GPS e airbag.","Câmera de ré e sensor de estacionamento.","Sistema de som e rastreador.","O essencial para dirigir inclui faróis, freios, pneus e retrovisores."],["p1m2q75",2,1,"O que acontece quando o limite de pontos na CNH é atingido dentro do período de 12 meses?","","O condutor pode responder a processo de suspensão do direito de dirigir.","O condutor deve pagar apenas uma multa extra.","Os pontos são zerados imediatamente.","O valor da multa é multiplicado.","Atingir o limite de pontos inicia o processo de suspensão da CNH."],["p1m2q76",2,1,"Em que momento ocorre a Medida Administrativa imposta pelo agente de trânsito?","","Na hora, no local da infração.","Depois que a infração é confirmada pelo órgão.","30 dias após a notificação.","12 meses após o registro dos pontos.","A Medida Administrativa é uma ação imediata do agente de trânsito."],["p1m2q77",2,1,"Qual das punições a seguir é listada como exemplo de Crime de Trânsito?","","Dirigir embriagado.","Reter o veículo.","Multa por estacionamento.","Advertência por escrito.","Dirigir embriagado e causar morte são exemplos de Crime de Trânsito."],["p1m2q78",2,1,"Qual a condição obrigatória para que o veículo esteja regularizado para circular, além de estar em boas condições de segurança?","","Ter o licenciamento do ano em dia e o IPVA pago.","Ter o seguro total.","Ter airbag instalado.","Estar com o tanque cheio.","O veículo precisa estar com licenciamento e IPVA em dia."],["p1m2q79",2,1,"O que a Penalidade pode incluir, além da multa e da advertência por escrito?","","Suspensão temporária do direito de dirigir ou até cassação definitiva da CNH.","Remoção do veículo para o pátio.","Recolhimento de documentos.","Retenção do veículo.","Suspensão e cassação são as penalidades mais graves."],["p1m2q80",2,1,"Qual é o principal risco atribuido ao excesso de velocidade?","","Reduz o tempo de reação do condutor a um imprevisto.","Apenas aumenta o consumo de combustível.","Apenas aumenta a distância para parar o veículo.","Apenas aumenta o estresse.","A redução do tempo de reação é citada como o principal fator de risco da velocidade."],["p1m2q81",2,1,"O que a Penalidade de Advertência por Escrito representa?","","Uma punição que vem depois da infração ser confirmada.","Uma ação imediata do agente.","A consequência de um crime.","A pontuação na carteira.","Advertência por escrito é um exemplo de Penalidade."],["p1m2q82",2,1,"Qual é o principal objetivo da classificação das infrações em quatro níveis de gravidade?","","Refletir o tamanho do risco que aquele comportamento oferece para a segurança de todos.","Apenas facilitar o cálculo da multa.","Apenas aumentar a pontuação.","Apenas diferenciar o agente de trânsito.","A classificação reflete o risco para a segurança."],["p1m2q83",2,1,"Quando o comportamento de um condutor ultrapassa a esfera administrativa e vira crime, qual a consequência que se aplica?","","Processo criminal, possibilidade de prisão e antecedentes na ficha criminal.","Apenas multa e pontos na carteira.","Apenas cassação da CNH.","Apenas medida administrativa de retenção.","O crime de trânsito envolve a esfera criminal, com processo e possibilidade de prisão."],["p1m2q84",2,1,"Dirigir sob influência de álcool ou drogas é listado como qual tipo de consequência, além de ser infração gravíssima?","","Crime de trânsito previsto no Código de Trânsito Brasileiro.","Apenas Medida Administrativa.","Apenas Penalidade de Cassação.","Apenas Pontuação de 7 pontos.","Dirigir sob influência de álcool ou drogas é também um crime de trânsito."],["p1m2q85",2,2,"O que a classificação das infrações em quatro níveis de gravidade reflete?","","Estudos, estatísticas de sinistros e análise de comportamentos que mais causam mortes e ferimentos.","Apenas a opinião do agente de trânsito.","Apenas o número de acidentes da semana.","Apenas o humor do condutor.","A classificação é baseada em dados e riscos reais."],["p1m2q86",2,2,"O que o sistema de punições no Brasil visa ativar quando o condutor comete uma ação errada no trânsito?","","Um sistema de proteção social que envolve punições administrativas, financeiras e até criminais.","Apenas a notificação da multa.","Apenas a advertência por escrito.","Apenas o processo de suspensão da CNH.","O erro ativa um sistema de proteção social abrangente."],["p1m2q87",2,0,"Antes de sair para uma viagem, o motorista verifica o estepe, o macaco e o triângulo. Qual o status desses itens para carros?","","Equipamento obrigatório para carros.","Acessório opcional.","Item de luxo.","Equipamento de segurança apenas para motos.","Estepe, macaco e triângulo são equipamentos obrigatórios para carros."],["p1m2q88",2,0,"Uma motociclista preparava-se para pilotar e garantiu que estava com o capacete e a viseira em perfeitas condições. Qual o status desse item para motos?","","Capacete com viseira ou óculos de proteção é equipamento obrigatório.","Acessório opcional.","Item de conforto.","Equipamento obrigatório apenas em rodovias.","O capacete com viseira/óculos de proteção é obrigatório para motos."],["p1m2q89",2,0,"O instrutor perguntou aos alunos qual era a primeira atitude que definia um condutor verdadeiramente responsável. Qual foi a resposta correta?","","Seguir as regras de trânsito.","Apenas evitar multas.","Decorar todas as leis.","Dirigir em alta velocidade.","Seguir as regras é a primeira atitude do condutor responsável."],["p1m2q90",2,0,"Fatores de Risco: Uma psicóloga do trânsito explicou que o motorista não dirige sozinho, pois seu estado mental afeta as decisões. Qual condição física e mental afeta reflexos, atenção e capacidade de decisão do condutor?","","Estar cansado, sob efeito de álcool ou emocionalmente abalado.","Estar com o carro limpo.","Estar com o som alto.","Estar com a janela aberta.","O estado físico e mental (cansaço, álcool, emoções) é o principal fator de risco que afeta a direção."],["p1m2q91",2,0,"João estava ao volante e usando o celular para checar uma mensagem. Qual é o tipo de infração que ele cometeu?","","Usar celular ao volante.","Transitar 20% acima da velocidade.","Estacionar afastado da guia.","Não usar cinto de segurança.","Usar celular ao volante é uma das infrações gravíssimas mais perigosas."],["p1m2q92",2,0,"Cada vez que o motorista comete uma infração, ele recebe a pontuação correspondente. O que a Pontuação na Carteira representa?","","Pontos na CNH que ficam registrados no prontuário.","O valor da multa a ser pago.","O número de crimes de trânsito.","O número de Medidas Administrativas.","A pontuação é o registro dos pontos na CNH."],["p1m2q93",2,0,"Após o processo administrativo, o condutor recebeu a multa para pagamento. O que a Penalidade de Multa pode acompanhar no processo administrativo?","","A pontuação na carteira.","Um crime de trânsito.","Uma cassação definitiva.","Uma prisão.","A pontuação é uma consequência diferente que pode ser aplicada junto com a penalidade de multa."],["p1m2q94",2,0,"Um mecânico revisou o carro e garantiu que tudo estava funcionando para uma viagem segura. Qual o conjunto de itens que deve estar funcionando para o veículo estar em condições de segurança?","","Faróis, freios, retrovisores, buzina, pneus em bom estado e setas.","Ar-condicionado, GPS e airbag.","Câmera de ré e sensor de estacionamento.","Sistema de som e rastreador.","Os itens essenciais de segurança incluem faróis, freios, pneus e retrovisores."],["p1m2q95",2,1,"Um motorista atingiu 40 pontos no período de 12 meses, sem nenhuma Gravíssima. O que acontece com ele após o limite de pontos ser atingido?","","O condutor pode responder a processo de suspensão do direito de dirigir.","O condutor deve pagar apenas uma multa extra.","Os pontos são zerados imediatamente.","O valor da multa é multiplicado.","Atingir o limite de pontos inicia o processo de suspensão do direito de dirigir."],["p1m2q96",2,1,"Um agente de trânsito parou um motorista com o licenciamento vencido e recolheu o documento. Em que momento ocorre a Medida Administrativa imposta pelo agente?","","Na hora, no local da infração.","Depois que a infração é confirmada pelo órgão.","30 dias após a notificação.","12 meses após o registro dos pontos.","A Medida Administrativa é uma ação imediata do agente no local."],["p1m2q97",2,1,"Um condutor foi pego dirigindo sob efeito de bebida alcoólica. Qual das punições a seguir é listada como exemplo de Crime de Trânsito?","","Dirigir embriagado.","Reter o veículo.","Multa por estacionamento.","Advertência por escrito.","Dirigir embriagado é classificado como Crime de Trânsito."],["p1m2q98",2,1,"Para circular legalmente, um veículo precisa estar com a manutenção em dia. Qual a condição legal obrigatória para que o veículo esteja regularizado, além de estar em boas condições de segurança?","","Ter o licenciamento do ano em dia e o IPVA pago.","Ter o seguro total.","Ter airbag instalado.","Estar com o tanque cheio.","O veículo precisa estar com licenciamento e IPVA em dia."],["p1m2q99",2,1,"Após o processo, a punição foi confirmada. O que a Penalidade pode incluir, além da multa e da advertência por escrito?","","Suspensão temporária do direito de dirigir ou até cassação definitiva da CNH.","Remoção do veículo para o pátio.","Recolhimento de documentos.","Retenção do veículo.","Suspensão e cassação são as penalidades mais graves no Código de Trânsito."],["p1m2q100",2,1,"Risco da Velocidade: Um instrutor explicou que o excesso de velocidade não aumenta apenas a distância de parada. Qual é o principal risco atribuído ao excesso de velocidade?","","Reduz o tempo de reação do condutor a um imprevisto.","Apenas aumenta o consumo de combustível.","Apenas aumenta a distância para parar o veículo.","Apenas aumenta o estresse.","A redução do tempo de reação é o principal fator de risco da velocidade, segundo o material."],["p1m2q101",2,0,"Por que o trânsito começa antes mesmo de ligar o carro?","","Porque a checagem prévia evita riscos e imprevistos","Porque o carro pode não pegar","Porque ajuda a economizar combustível","Porque deixa a viagem mais rápida","A checagem prévia garante segurança antes de sair."],["p1m2q102",2,0,"O que verificar os pneus diariamente ensina ao condutor?","","Que pequenos cuidados evitam grandes problemas","Que pneus duram menos","Que a revisão é opcional","Que multas nunca acontecem","Verificações simples evitam transtornos na viagem."],["p1m2q103",2,0,"O que pequenas distrações mostram no trânsito?","","Que segundos de descuido podem gerar grandes perigos","Que todos se distraem e tudo bem","Que o celular ajuda a dirigir","Que só motoristas novos se distraem","Dois segundos equivalem a muitos metros sem atenção."],["p1m2q104",2,0,"O que torna as bicicletas veículos que merecem atenção especial?","","A vulnerabilidade e necessidade de espaço seguro","Porque são mais lentas","Porque ocupam menos espaço","Porque têm prioridade total","Ciclistas são frágeis e exigem cuidado."],["p1m2q106",2,0,"Por que obedecer ao agente de trânsito é essencial?","","Porque ele organiza a via e garante segurança","Porque evita conversa","Porque agiliza o trajeto","Porque não há alternativa","A orientação do agente prioriza a segurança."],["p1m2q107",2,1,"Por que retornar em local proibido é perigoso?","","Porque reduz a visibilidade e aumenta risco de colisão","Porque aumenta o trajeto","Porque incomoda motoristas","Porque é manobra lenta","Lugares como curvas, pontes e túneis aumentam o risco."],["p1m2q108",2,1,"Por que infrações são classificadas em níveis?","","Para refletir o risco real do comportamento","Para definir valores fixos","Para dificultar o sistema","Para beneficiar motoristas experientes","A classificação considera o risco à segurança."],["p1m2q109",2,1,"Qual é o impacto social de cada decisão ao volante?","","Afeta diretamente a vida dos demais usuários","É irrelevante","Só afeta o motorista","Impacta apenas o trânsito local","Cada escolha influencia o coletivo."],["p1m2q110",2,1,"Por que parar em locais proibidos prejudica a segurança?","","Porque afeta pedestres, fluxo e serviços essenciais","Porque deixa o trânsito feio","Porque ocupa a calçada","Porque gera barulho","Estacionar errado compromete a segurança e a dinâmica da via."],["p1m2q111",2,1,"O que caracteriza a diferença entre erro e crime de trânsito?","","O nível de risco e o dano potencial causado","A presença de testemunhas","O tipo de rua","O modelo do veículo","Crimes envolvem perigo extremo e esfera penal."],["p1m2q112",2,2,"Por que “não existem pequenos erros” no trânsito?","","Porque cada escolha pode salvar ou tirar uma vida","Porque todas as infrações têm o mesmo peso","Porque o trânsito é imprevisível","Porque as multas são altas","Pequenos deslizes podem resultar em grandes riscos."],["p1m2q113",2,2,"Por que seguir regras melhora a convivência no trânsito?","","Porque cria previsibilidade e reduz conflitos","Porque deixa o trânsito lento","Porque facilita multas","Porque aumenta a burocracia","Regras organizam e evitam comportamentos imprevisíveis."],["p1m2q114",2,2,"Por que atitudes imprudentes geram efeito em cadeia?","","Porque influenciam o comportamento dos demais usuários","Porque só afetam o carro do motorista","Porque deixam o trânsito mais colorido","Porque tornam a viagem divertida","Um comportamento errado incentiva outros a repetirem."],["p1m2q115",2,0,"Por que é importante ler a notificação de multa com atenção?","","Para conferir se todos os dados estão corretos","Para decidir se vai pagar na hora","Para ver se dá para ignorar","Para saber se alguém já pagou","agir com responsabilidade começa entendendo o que ocorreu. Conferir dados como horário, placa e local evita injustiças e garante que o condutor tenha consciência plena da situação antes de qualquer decisão."],["p1m2q116",2,0,"O que fazer se os dados da multa estiverem incorretos?","","Contestar junto ao órgão responsável","Jogar a notificação fora","Ignorar até vencer","Esperar outra carta","o processo de multa possui etapas formais. Se houver erro, contestar é um direito e faz parte de agir corretamente e com responsabilidade, evitando assumir uma infração que não ocorreu."],["p1m2q117",2,0,"O que significa aprender com o erro após receber uma multa?","","Entender por que cometeu a infração e não repetir","Não dirigir mais","Culpar o agente de trânsito","Achar que é azar","o valor pedagógico da multa está justamente em promover mudança de comportamento. Reconhecer o erro e melhorar a conduta reforça a segurança de todos."],["p1m2q118",2,0,"Por que perder prazos no processo de multa é ruim?","","Você perde o direito de se defender","A multa some do sistema","O valor diminui","A contestação vira automática","responsabilidade inclui atenção aos procedimentos legais. Perder prazos impede o exercício do direito de defesa e faz com que o processo siga automaticamente."],["p1m2q119",2,0,"O que acontece quando se paga a multa com antecedência?","","Pode haver desconto de até 40%","O valor dobra","O processo é cancelado","O veículo é liberado de fiscalização","o pagamento antecipado é um benefício previsto para quem reconhece a infração e decide agir de forma consciente, recebendo desconto significativo."],["p1m2q120",2,0,"Por que não devemos entrar em desespero ao receber uma multa?","","Porque é possível entender, agir e aprender com ela","Porque multas não valem nada","Porque sempre é um engano","Porque alguém vai resolver","maturidade no trânsito envolve reconhecer a situação e tomar decisões equilibradas. A multa deve ser vista como oportunidade de ajuste, não motivo de desespero."],["p1m2q121",2,0,"Por que pequenas atitudes no trânsito são importantes?","","Porque tornam o condutor mais responsável","Porque deixam o trajeto mais rápido","Porque evitam qualquer multa","Porque garantem preferência sempre","pequenas escolhas diárias moldam o comportamento e constroem um trânsito mais seguro, pois atitudes responsáveis se somam e evitam riscos."],["p1m2q122",2,0,"Por que a faixa de pedestres nunca deve ser ocupada ao parar?","","Porque é espaço exclusivo do pedestre","Porque atrasa o trânsito","Porque atrapalha a placa","Porque desgasta pneus","a prioridade deve ser do pedestre e deve-se respeitar as áreas destinadas à sua segurança. Parar sobre a faixa impede a travessia e coloca vidas em risco."],["p1m2q123",2,0,"Por que não se deve parar afastado da guia além do permitido?","","Porque atrapalha fluxo e coloca passageiros em risco","Porque suja o pneu","Porque ocupa espaço","Porque é difícil de medir","decisões individuais afetam todos ao redor. Parar longe da guia dificulta embarque/desembarque, cria obstáculos e amplia riscos desnecessários."],["p1m2q124",2,0,"Por que manusear o celular ao volante é tão arriscado?","","Porque desvia o olhar por segundos e cria grande risco","Porque reduz bateria","Porque atrapalha notificações","Porque o carro vibra","Segundos de desatenção são suficientes para causar um sinistro, pois o trânsito muda rapidamente e exige atenção constante. Tirar os olhos da via interrompe essa atenção e multiplica o risco."],["p1m2q125",2,0,"Por que realizar freada brusca pode ser perigoso?","","Porque indica desatenção e risco de colisão","Porque desgasta freios","Porque acorda passageiros","Porque não é comum","Atitudes impulsivas ou tardias mostram falta de atenção ao ambiente. Frear bruscamente revela que o condutor não antecipou a situação, aumentando o risco de batidas traseiras e perda de controle."],["p1m2q126",2,0,"O que significa ser um motorista consciente?","","Colocar a vida das pessoas acima da pressa","Esperar nunca ser multado","Ser o mais rápido","Usar atalhos","Escolhas no trânsito têm impacto direto sobre outras pessoas. O motorista consciente age priorizando vidas, não a velocidade ou conveniência."],["p1m2q127",2,0,"Por que é importante aprender com a multa recebida?","","Porque ajuda a não repetir o erro","Porque aumenta a pontuação na CNH","Porque evita dirigir","Porque elimina futuros problemas automaticamente","erros no trânsito são oportunidades de reflexão. Entender por que a infração ocorreu permite corrigir o comportamento e evitar riscos futuros."],["p1m2q128",2,0,"Por que ler atentamente uma notificação de multa?","","Para confirmar se os dados estão corretos","Para descobrir quem fez a denúncia","Para reduzir o valor automaticamente","Para evitar usar o carro","O processo administrativo depende da conferência cuidadosa de informações. Se algo estiver errado, o condutor pode contestar dentro do prazo."],["p1m2q129",2,0,"O que significa agir com responsabilidade após receber uma multa?","","Ler, entender e corrigir o comportamento","Discutir com o agente","Desconsiderar a infração","Continuar dirigindo da mesma forma","a responsabilidade inclui compreender o erro, reconhecer seu impacto e ajustar as atitudes, para que não haja repetição do comportamento inadequado."],["p1m2q130",2,0,"O que fazer se você não era o condutor no momento da infração?","","Indicar quem dirigia","Assumir a culpa","Apagar a notificação","Esperar outra multa","a indicação do condutor é um direito e garante justiça no processo, evitando que o proprietário assuma um erro que não cometeu."],["p1m2q131",2,0,"O que acontece se o condutor perder prazos do processo?","","Perde o direito de se defender","O processo é cancelado automaticamente","Recebe desconto","Não recebe penalidade","É importante ficar atento aos prazos porque, uma vez encerrados, a defesa não pode mais ser apresentada, e a penalidade é mantida."],["p1m2q132",2,0,"Qual a vantagem de pagar a multa antecipadamente?","","Possibilidade de até 40% de desconto","Poder dirigir mais rápido","Evitar pontos automaticamente","Liberar a CNH do outro condutor","o pagamento antecipado garante desconto significativo e simplifica o processo, desde que o condutor opte por não recorrer."],["p1m2q133",2,0,"Por que saber agir certo no dia a dia é importante?","","Porque pequenas atitudes tornam o condutor responsável","Porque evita ter carro","Porque reduz o uso da via","Porque aumenta velocidade","pequenas escolhas, quando somadas, criam um trânsito mais seguro e mostram maturidade e responsabilidade."],["p1m2q134",2,0,"Por que paciência melhora o trânsito?","","Porque reduz conflitos e estresse","Porque aumenta a velocidade da via","Porque diminui vias congestionadas","Porque facilita estacionar","atitudes impulsivas geram conflitos e riscos. Paciência permite decisões melhores e convivência mais harmoniosa."],["p1m2q135",2,0,"O que significa colocar a vida acima da pressa?","","Escolher atitudes seguras","Dirigir sempre muito devagar","Desobedecer regras para não atrasar","Confiar apenas no próprio reflexo","pressa gera decisões perigosas. Priorizar a vida significa reduzir velocidade e agir com cautela."],["p1m2q136",2,0,"Por que o pedestre deve ter sua área respeitada?","","Porque a faixa é espaço dele","Porque ele anda devagar","Porque atrapalha o motorista","Porque não conhece trânsito","a faixa de pedestres é o espaço protegido do usuário mais vulnerável do trânsito. Desrespeitá-la coloca vidas em risco."],["p1m2q137",2,0,"Por que parar afastado da guia é proibido?","","Porque atrapalha o fluxo e causa risco","Porque deixa o carro bonito","Porque facilita ultrapassagens","Porque economiza combustível","paradas irregulares prejudicam a circulação e criam situações perigosas para pedestres e outros veículos."],["p1m2q138",2,1,"Por que agir com calma evita erros?","","Porque reduz decisões impulsivas","Porque diminui o tempo de viagem","Porque evita multas sempre","Porque torna a rua mais vazia","emoções fortes e pressa levam a escolhas arriscadas. Calma permite avaliar melhor o ambiente e agir com segurança."],["p1m2q139",2,1,"O que as infrações “pequenas” revelam?","","Que comportamentos comuns podem gerar riscos reais","Que são irrelevantes","Que podem ser ignoradas","Que não afetam ninguém","não existem “pequenos erros”, pois qualquer deslize pode desencadear um sinistro."],["p1m2q140",2,1,"Por que a pressa é mostrada como inimiga da segurança?","","Porque leva a decisões erradas e perigosas","Porque aumenta o consumo","Porque irrita passageiros","Porque reduz multas","comportamentos apressados, como avançar sinal amarelo, resultam em riscos graves."],["p1m2q141",2,1,"Qual a importância de entender o motivo das regras?","","Para mudar o comportamento e evitar sinistros","Para decorar artigos","Para discutir com agentes","Para ignorar sinalização","regras existem para proteger vidas; entender o porquê ajuda o condutor a adotá-las de forma consciente."],["p1m2q142",2,1,"Por que ler todos os detalhes da multa é essencial?","","Para confirmar placa, horário e local","Para pedir desconto maior","Para mudar o agente responsável","Para evitar que a multa desapareça","erros na notificação podem ser contestados. Conferir tudo assegura que a penalidade é legítima."],["p1m2q143",2,1,"Como pequenas atitudes transformam o motorista?","","Ele se torna mais consciente e seguro","Ele dirige mais rápido","Ele deixa de seguir regras","Ele evita todos os riscos automaticamente","atitudes cotidianas — como atenção e empatia — formam um condutor mais responsável no longo prazo."],["p1m2q144",2,1,"O que significa que “ninguém é perfeito, mas pode ser consciente”?","","Que todos erram, mas podem dirigir melhor","Que perfeição é obrigatória","Que dirigir bem é impossível","Que só especialistas dirigem direito","erros fazem parte do aprendizado, mas devem ser usados para melhorar o comportamento."],["p1m2q145",2,2,"Por que errar ao volante é tão perigoso?","","Porque erros acontecem rapidamente e afetam outros usuários","Porque erros são raros","Porque só iniciantes erram","Porque não há consequências reais","o trânsito é dinâmico e qualquer erro — mesmo pequeno — pode envolver várias pessoas e causar danos graves."],["p1m2q146",2,2,"Por que lidar corretamente com a multa é importante?","","Porque evita repetir comportamentos de risco","Porque libera o motorista automaticamente","Porque resolve problemas financeiros","Porque deixa a CNH “limpa” sempre","compreender o erro e corrigir o comportamento reduz a chance de reincidência e melhora a segurança."],["p1m2q147",2,0,"O que fazer ao receber uma multa?","","Ler, entender e agir com responsabilidade","Ignorar e esperar prescrever","Passar a dirigir mais rápido","Reclamar na internet","O documento reforça a importância de compreender a notificação antes de agir."],["p1m2q148",2,0,"Qual é a primeira atitude recomendada ao ler a notificação da multa?","","Conferir se os dados estão corretos","Jogar fora para evitar estresse","Esperar outra carta chegar","Pagar sem verificar nada","O texto destaca a conferência dos dados como ação inicial."],["p1m2q149",2,0,"O que significa aprender com o erro?","","Refletir e não repetir a infração","Evitar falar sobre o assunto","Culpar o agente de trânsito","Ignorar a situação","O valor da punição está na mudança de comportamento."],["p1m2q150",2,0,"Por que respeitar os prazos é importante?","","Para não perder o direito de defesa","Para ganhar descontos automáticos","Para evitar apreensão do veículo","Porque aumenta pontos","Perder o prazo elimina o direito de se defender."],["p1m2q151",2,0,"Por que parar na faixa de pedestres é proibido?","","Porque a faixa é espaço exclusivo do pedestre","Porque atrapalha outros motoristas","Porque estraga a pintura da via","Porque aumenta consumo","A faixa pertence ao pedestre."],["p1m2q152",2,0,"O que significa parar afastado mais de 50 cm da guia?","","Infração leve ou média","Apenas um erro estético","Situação permitida","Uma manobra de estacionamento especial","O anexo menciona essa infração e seus riscos."],["p1m2q153",2,0,"Por que não se deve embarcar ou desembarcar passageiros em locais proibidos?","","Porque atrapalha o fluxo e gera risco","Porque demora muito","Porque causa multas apenas leves","Porque é desconfortável","O texto reforça riscos ao passageiro e ao trânsito."],["p1m2q154",2,0,"Por que ignorar a sinalização em área de obras é perigoso?","","Porque coloca em risco quem trabalha no local","Porque causa pequenas multas","Porque reduz velocidade","Porque atrasa o condutor","Os trabalhadores ficam muito vulneraveis."],["p1m2q155",2,1,"Por que agir com empatia melhora o trânsito?","","Porque protege quem divide a via","Porque deixa o trânsito mais rápido","Porque evita multas","Porque dá vantagem ao motorista","Empatia é citada como elemento de convivência."],["p1m2q156",2,1,"O que significa entender o motivo das regras?","","Compreender por que uma norma protege vidas","Decorar o CTB","Questionar toda regra","Evitar ser fiscalizado","O documento reforça que regras existem por segurança."],["p1m2q157",2,1,"Por que manusear o celular é uma das infrações mais perigosas?","","Porque retira totalmente a atenção do condutor","Porque gasta bateria","Porque causa transtornos leves","Porque faz o carro tremer","O documento explica o risco dos 33 metros sem atenção."],["p1m2q158",2,1,"Por que não indicar o real condutor é prejudicial?","","Porque compromete a veracidade do processo","Porque dificulta estacionar","Porque atrasa o pagamento","Porque muda a placa do carro","O anexo explica a possibilidade de indicar o motorista."],["p1m2q159",2,1,"Por que a pressa aumenta erros?","","Porque leva a decisões impulsivas e perigosas","Porque reduz multas","Porque melhora reflexos","Porque gera mais atenção","O texto usa exemplos como o sinal amarelo e o pneu murcho."],["p1m2q160",2,2,"O que caracteriza um crime de trânsito?","","A imprudência que coloca vidas em risco real","Multas acima de certo valor","A opinião do agente","O tipo do veículo envolvido","O anexo diferencia infrações de crimes pelo risco gerado."],["p1m2q161",2,2,"Quando uma infração se torna crime?","","Quando a conduta coloca gravemente em risco outras pessoas","Quando envolve motocicletas","Quando ocorre à noite","Quando causa multa alta","O documento traz exemplos e explica essa diferença."],["p1m2q162",2,0,"No caminho para o trabalho, Ana ignora a notificação de multa que recebeu e pensa “vejo isso depois”. Isso é perigoso por quê?","","Porque existe prazo para cada etapa do processo","Porque a multa some sozinha","Porque a multa se resolve no banco","Porque não precisa ser lida","Nem ler nem agir a tempo faz a pessoa perder direitos."],["p1m2q163",2,0,"Leo recebe uma multa e decide pagar logo no início porque leu que isso é vantajoso. Qual é o benefício da ação?","","Até 40% de desconto","Parcelamento automático","Perdão total da multa","Aumento de prazo","O texto destaca o benefício do desconto antecipado."],["p1m2q164",2,0,"Paulo percebe que não era ele quem dirigia no momento da multa. O que ele pode fazer?","","Indicar o real condutor","Cancelar a multa","Transferir a placa do carro","Ignorar a notificação","A indicação do condutor é direito previsto."],["p1m2q165",2,0,"Camila está prestes a pedir revisão da multa, mas quase perde o prazo. Por que isso é um problema?","","Perder prazo faz perder o direito de defesa","Perder prazo aumenta pontuação","Perder prazo gera outra multa","Perder prazo cancela o recurso","Os prazos são essenciais para garantir defesa."],["p1m2q166",2,0,"Laura está conduzindo o carro e decide parar afastada do meio-fio. Por que isso é proibido?","","Porque atrapalha o fluxo e gera risco","Porque deixa o carro torto","Porque desgasta o pneu","Porque economiza tempo","Parar afastado da guia prejudica a circulação."],["p1m2q167",2,0,"Um motorista decide parar sobre a faixa enquanto o sinal está trocando. Isso é errado porque?","","Compromete a segurança do pedestre","Não deixa o carro bonito","Atrapalha a placa","Aumenta consumo","Parar sobre a faixa coloca pedestres em risco."],["p1m2q168",2,1,"André vê alguém parado no meio da rua “por um instante”. Paradas rápidas podem ser perigosas porque:","","Interrompem fluxo e criam risco","Deixam o carro vulnerável","Provocam multas mais caras","Pioram a economia do carro","As paradas inadequadas prejudicam o trânsito."],["p1m2q169",2,1,"Carla tenta justificar que “foi rapidinho” estacionar em local proibido. Atitudes assim são perigosas porque:","","Colocam terceiros em risco","Reduzem conforto do motorista","Atrapalham o trânsito apenas moralmente","Não são vistas por ninguém","O perigo está no risco para os outros."],["p1m2q170",2,1,"Um motorista resolve não verificar o carro antes de sair. O capítulo mostra que falhas assim podem causar:","","Sinistros evitáveis e prejuízos","Conforto extra","Multas automáticas","Consumo menor de combustível","Negligências geram riscos reais."],["p1m2q171",2,2,"Um instrutor quer explicar a diferença entre infração e crime segundo o material. Como descrever essa diferença?","","Crimes têm maior risco e geram processo criminal","Infrações são sempre leves","Crimes são apenas multas maiores","Infrações envolvem violência física","A distinção é risco e consequência jurídica."],["p1m3q1",3,1,"Ao ultrapassar ônibus, qual a conduta segura:","","Ultrapassar com espaço e tempo suficientes e só voltar ao ver o ônibus inteiro no retrovisor.","Voltar logo após utlrapassar a parte dianteira do ônibus.","Voltar antes de terminar a ultrapassagem.","Passar colado para acabar rápido.","Pontos cegos grandes exigem distância e visibilidade."],["p1m3q2",3,2,"Ao ultrapassar um ciclista, o motociclista deve:","","Reduzir a velocidade e manter 1,5 metro de distância lateral.","Acelerar para sair logo.","Passar colado para economizar espaço.","Buzinar alto para avisar.","Arts. 201 e 220, inciso XIII do CTB."],["p1m3q3",3,2,"De acordo com Código de Trânsito Brasileiro (CTB), os ciclomotores podem trafegar em rodovias ou vias de trânsito rápido?","","Não, é proibida a circulação de ciclomotores em vias de trânsito rápido.","Sim, se andar devagar.","Sim, se for domingo.","Sim, se usar colete refletivo.","Segundo o art. 57 do CTB, os ciclomotores devem circular pela direita da pista, sendo proibida sua circulação nas vias de trânsito rápido e sobre as calçadas."],["p1m3q4",3,2,"Em avenida com ciclofaixa contínua, o carro vai entrar à direita em uma rua. Não há semáforo. Quem tem preferência no conflito?","","O ciclista que segue na ciclofaixa, salvo sinal que o obrigue a parar.","O carro, por ser maior.","Quem buzinar primeiro.","Quem estiver mais rápido.","Ao mudar de direção, deve-se ceder preferência a ciclistas/pedestres, nos termos do art. 214 do CTB"],["p1m3q5",3,2,"Em avenida movimentada, você vê um motociclista equipado (capacete, luvas, jaqueta). O que isso indica?","","Redução de risco de lesões e atitude segura.","Vaidade do condutor.","Gasto sem necessidade.","Que pode correr mais.","EPI reduz a gravidade em caso de quedas e colisões."],["p1m3q6",3,2,"Em cruzamento sem sinalização, quem tem a preferência?","","O veículo que vem pela direita.","O veículo maior.","O mais rápido.","O que chegar primeiro.","É a chamada “regra da direita”, prevista no art. 29, inciso III, alínea \"c\" do CTB."],["p1m3q7",3,2,"Em retorno na via, o que é obrigatório?","","Escolher local sinalizado, sinalizar a manobra, avaliar visibilidade e dar preferência a pedestres e ciclistas.","Fazer onde der, bem rápido.","Parar no canteiro central e virar.","Usar o acostamento para cortar todo mundo.","Retorno exige planejamento e respeito ao projeto da via, conforme art. 39 do CTB."],["p1m3q8",3,2,"Em via com faixa exclusiva de ônibus à direita e área escolar à frente, sua conversão será à direita adiante. Conduta correta:","","Entrar na faixa exclusiva apenas no trecho e horário permitidos para fazer a conversão com segurança.","Usar toda a faixa exclusiva para ganhar tempo.","Parar na faixa exclusiva para embarque.","Cortar pela calçada para virar.","Conversões podem permitir cruzamento pontual da faixa exclusiva conforme a sinalização."],["p1m3q9",3,2,"Locais onde a ultrapassagem é proibida?","","Curvas, aclives sem visibilidade, passagens de nível, pontes/viadutos e faixas de pedestres, salvo sinal que autorize.","Só em rodovia.","Apenas à noite.","Em dias de chuva somente.","Pontos críticos com baixa visibilidade e alto risco."],["p1m3q10",3,2,"O que determina o CTB sobre proteção aos mais frágeis?","","Veículos maiores devem cuidar dos menores, motorizados protegem não motorizados.","Cada um por si.","Pedestres devem sempre sair da frente.","Carros têm prioridade em qualquer situação.","Hierarquia de proteção no trânsito, conforme art. 29, 2º."],["p1m3q11",3,2,"O que é compartilhamento da via?","","Uso conjunto e seguro por pedestres, ciclistas e veículos.","Quando carros e motos dividem acostamento.","Quando o pedestre anda na pista.","Quando se alterna o sentido da via.","Todos os usuários devem conviver de forma segura e respeitosa."],["p1m3q12",3,2,"Pedro passou no exame teórico, pegou a Licença de aprendizagem e quer treinar num carro próprio com o pai, sem instrutor. O que é correto?","","Não pode. Treino em via pública exige instrutor autorizado.","Pode desde que seja domingo.","Pode se o pai assinar uma autorização.","Pode se o bairro estiver vazio.","A formação de condutor de veículo automotor será realizada por instrutor autorizado, conforme art. 155 do CTB."],["p1m3q13",3,2,"Qual a função da via coletora?","","Leva o trânsito das ruas menores para as avenidas e vice-versa, máxima 40 km/h.","É igual à via rápida.","Só serve para bicicletas.","É usada apenas por caminhões.","Função de distribuir fluxo."],["p1m3q14",3,2,"Qual atitude evita aquaplanagem na chuva forte?","","Reduzir velocidade, não frear bruscamente e manter pneus em bom estado.","Acelerar para “furar” a água.","Frear de uma vez no molhado.","Ligar farol alto e acelerar.","Menos velocidade e pneus bons aumentam aderência."],["p1m3q15",3,2,"Quando houver a transferência de propriedade do veículo, é dever do comprador:","","Transferir o veículo em até 30 dias da assinatura do documento de compra e venda (art. 123, §1º).","Transferir em até 90 dias quando quiser.","Só avisar o banco.","Não precisa transferir.","Conforme disposto no Art. 123, § 1º do CTB, o dever do comprador, no caso de transferência de propriedade, é adotar as providências necessárias à expedição do novo Certificado de Registro do Veículo em um prazo máximo de 30 (trinta) dias. O descumprimento desse prazo sujeita o infrator à penalidade prevista no Art. 233 (infração média, multa e remoção do veículo)."],["p1m3q16",3,2,"Ultrapassar em curvas é permitido?","","Não, pois há risco de colisão frontal.","Sim, desde que o motorista saiba dirigir bem.","Sim, se o carro for potente.","Apenas à noite.","Locais sem visibilidade, como curvas, proíbem ultrapassagem."],["p1m3q17",3,2,"Você começou a derrapar numa curva. O que NÃO fazer?","","Frear bruscamente ou virar o volante de uma vez.","Soltar o acelerador suavemente e segurar firme o volante.","Manter calma e corrigir com cuidado.","Evitar movimentos bruscos.","Ações bruscas agravam a perda de controle."],["p1m3q18",3,0,"O que significa o termo via?","","É todo o espaço de circulação: pista, calçada, acostamento, canteiro, onde circulam veículos, pessoas e até animais.","É somente a pista de asfalto.","É só a parte do pedestre.","É só a rua da sua casa.","VIA - superfície por onde transitam veículos, pessoas e animais, compreendendo a pista, a calçada, o acostamento, ilha e canteiro central."],["p1m3q19",3,0,"A CNH é um documento de que tipo?","","Documento pessoal e intransferível, em versão física e digital, vale como identidade.","Documento que pode ser emprestado para amigo usar.","Documento que só vale no bairro da pessoa.","Documento que serve apenas para comprar combustível.","A CNH tem fé pública e é pessoal."],["p1m3q20",3,1,"A CNH precisa ser renovada conforme a idade do condutor. Para pessoa com menos de 50 anos, qual o prazo?","","A cada 10 anos.","A cada 5 anos.","A cada 3 anos.","Não renova nunca mais.","Conforme dispõe o Art. 147, § 2º, inciso I do CTB, o prazo de validade do exame de aptidão física e mental para a renovação da CNH é de 10 (dez) anos para os condutores com idade inferior a 50 (cinquenta) anos."],["p1m3q21",3,0,"A preferência em cruzamentos sem sinalização é de:","","Quem vem pela direita.","Quem vem pela esquerda.","O veículo maior.","O que buzinar primeiro.","A chamada “regra da direita” evita indecisões e colisões. Art. 29, inciso III, alínea c"],["p1m3q22",3,0,"A ultrapassagem correta para o motociclista deve ser realizada:","","Pela esquerda, com espaço e velocidade compatível.","Pela direita, porque “é mais rápido”.","Pelo acostamento, porque “é mais livre”.","Entre dois veículos, ziguezagueando.","Direita/acostamento são perigosos e infração."],["p1m3q23",3,0,"O acostamento serve para quê?","","Para emergência (pneu furado, pane) e, em vias rurais, também para pedestres e ciclistas quando não há calçada.","Para andar mais rápido e ultrapassar pela direita.","Para estacionar o dia todo.","Para vender comida.","Não é faixa de circulação normal, conforme anexo do CTB."],["p1m3q24",3,0,"Antes de entrar na rotatória, o condutor deve:","","Observar o fluxo interno e só entrar quando houver espaço seguro.","Forçar a entrada para não ficar esperando.","Parar dentro da rotatória.","Acelerar e buzinar.","A regra de segurança é esperar o momento certo, sem pressa."],["p1m3q25",3,0,"Quais as ações devem ser realizadas por um condutor antes de entrar na rotatória?","","Reduzir a velocidade, ligar a seta e olhar o fluxo para entrar com segurança.","Acelerar para “pegar embalo”.","Desligar as luzes para não chamar atenção.","Parar o carro dentro da faixa de pedestres.","Aproximação segura evita colisões."],["p1m3q26",3,0,"Antes de mudar de faixa com a moto, o que o condutor deve fazer?","","Ligar a seta com antecedência e checar espelhos e ponto cego.","Mudar rápido sem avisar, para não “perder a chance”.","Buzinar e jogar a moto para o lado.","Deitar a moto e cortar várias faixas de uma vez.","Antes de mudar de faixa com a moto, o condutor deve sinalizar a manobra e olhar nos retrovisores para garantir que é seguro, evitando colisões com outros veículos."],["p1m3q27",3,1,"Ao avistar ciclovia ou ciclofaixa, o condutor deve:","","Reduzir a velocidade e respeitar a passagem de ciclistas.","Acelerar para ultrapassar rapidamente a ciclovia ou ciclofaixa.","Ignorar os ciclistas","Buzinar para que os ciclistas saiam da via.","A ciclovia é espaço exclusivo dos ciclistas. O condutor deve respeitar o espaço dos ciclistas e reduzir a velocidade, garantindo a segurança de todos."],["p1m3q28",3,0,"Ao chegar perto de uma rotatória, qual regra principal seguir?","","Dar preferência a quem já está dentro da rotatória, entrando só quando houver espaço seguro.","Buzinar forte e entrar rápido para não perder a vez.","Entrar primeiro e depois ligar a seta.","Parar no meio da entrada para decidir.","A regra é dar prioridade aos veículos que já estão na rotatória. Isso evita colisões e garante que o tráfego dentro da rotatória flua de forma segura e organizada."],["p1m3q29",3,2,"Ao fazer uma conversão à direita ou esquerda em piso molhado, a moto deve:","","Entrar devagar, sem inclinar demais, mantendo a moto estável.","Deitar bem a moto e acelerar forte.","Frear dentro da curva com freio dianteiro travado.","Passar por cima da pintura molhada em alta velocidade.","Menos inclinação e controle preservam a aderência."],["p1m3q30",3,0,"Qual ação um condutor deve fazer ao mudar de faixa?","","Sinalizar com a seta (ou gesto) e conferir se é seguro.","Jogar o carro de uma vez.","Buzinar forte.","Ligar farol alto.","O condutor deve sinalizar e verificar os retrovisores para garantir que a mudança de faixa seja segura e evitar acidentes."],["p1m3q31",3,1,"Ao passar por um ciclista, o condutor deve:","","Manter pelo menos 1,5 m de distância lateral e reduzir a velocidade.","Passar colado para “caber”.","Buzinar forte e seguir sem espaço.","Jogar o veículo para cima para “educar”.","Distância salva vidas. Art. 201 do CTB"],["p1m3q32",3,1,"Ao realizar uma conversão à esquerda em via de mão dupla, o condutor deve:","","Aproximar-se do centro da via e ceder passagem a pedestres e veículos contrários.","Ir direto e virar sem sinalizar.","Aumentar a velocidade.","Parar sobre a faixa de pedestres.","A manobra deve ser feita com antecedência e cautela."],["p1m3q33",3,1,"Ao sair da rotatória, o condutor deve:","","Manter atenção a pedestres e ciclistas próximos à saída.","Acelerar para não perder tempo.","Usar o celular para se orientar.","Ignorar os pedestres.","Pedestres e ciclistas têm prioridade nas faixas junto às saídas."],["p1m3q34",3,0,"Ao sair de um estacionamento para a via pública, quem tem a preferência?","","Quem já circula na via.","O veículo que está saindo.","O maior carro.","Quem liga o pisca-alerta.","Preferência de quem está na via."],["p1m3q35",3,0,"Ao se aproximar de uma rotatória, o motorista deve:","","Reduzir a velocidade e aguardar a vez de entrar.","Entrar rapidamente.","Buzinar para avisar.","Passar pelo meio da ilha.","A regra é dar prioridade aos veículos que já estão na rotatória. Isso evita colisões e garante que o tráfego dentro da rotatória flua de forma segura e organizada."],["p1m3q36",3,0,"Ao ver agente de trânsito orientando fluxo na saída da escola, o condutor deve:","","Cumprir as ordens do agente, mesmo que a placa diga diferente.","Obedecer só ao semáforo.","Ignorar o agente e seguir a fila.","Buzinar para passar primeiro.","A ordem do agente prevalece para segurança."],["p1m3q37",3,0,"Ao ver um pedestre começando a atravessar fora da faixa, o motociclista deve:","","Reduzir a velocidade e garantir a passagem com segurança.","Acelerar para passar antes.","Buzinar forte.","Fazer ziguezague.","Mesmo fora da faixa, o pedestre tem prioridade."],["p1m3q38",3,0,"O passeio é destinado a quem?","","Para pedestres. Motorista só passa por ela para entrar em garagem, com cuidado e dando preferência ao pedestre.","Para motos pararem em fila.","Para carros desviarem do trânsito.","Para fazer retorno rápido.","O passeio é a parte da calçada ou da pista de rolamento, neste último caso, separada por pintura ou elemento físico separador, livre de interferências, destinada à circulação exclusiva de pedestres e, excepcionalmente, de ciclistas. Glossário do CTB"],["p1m3q39",3,0,"Os caminhões de coleta de lixo sinalizados trabalhando na via:","","Podem parar na via, mesmo que atrapalhem o trânsito, desde que estejam sinalizados e em operação","Devem sair para você passar.","Podem circular em alta velocidade para terminar a coleta mais rápido.","Devem sempre estacionar na calçada para não atrapalhar os veículos","Veículos de serviço essenciais, como caminhões de lixo, podem parar na via durante o trabalho, desde que devidamente sinalizados, garantindo segurança e funcionamento do serviço."],["p1m3q40",3,1,"Dentro da rotatória, qual é o comportamento correto?","","Manter velocidade moderada, ficar na faixa escolhida e não parar, salvo emergência.","Mudar de faixa toda hora para sair mais rápido.","Parar para conversar com outro motorista.","Acelerar forte para assustar motociclistas.","Conforme estabelece o art. 29, inciso III, alínea \"b\" do CTB, quando veículos se aproximam de um local não sinalizado (como uma rotatória sem sinalização de \"Dê a Preferência\"), a preferência de passagem é de quem estiver circulando por ela."],["p1m3q41",3,1,"Duas vias sem sinalização se cruzam e nenhuma é rodovia. O que vale?","","Regra da direita: ceder ao que vem pela direita.","Buzinar e passar.","Quem estiver na esquerda tem preferência.","Quem é maior tem prioridade.","Conforme estabelece o art. 29, inciso III, alínea \"c\" do CTB, quando veículos, transitando por fluxos que se cruzem, se aproximarem de local não sinalizado e nenhuma das vias for rodovia ou rotatória, terá preferência de passagem aquele que vier pela direita do condutor."],["p1m3q42",3,1,"Durante uma ultrapassagem, o condutor deve:","","Fazer a manobra pela esquerda, respeitando a sinalização e distância segura.","Passar o veículo pela direita, se houver espaço.","Acelerar perto de curvas.","Ignorar os limites de velocidade.","Conforme estabelece o art. 29, inciso IX do CTB, a ultrapassagem de outro veículo em movimento deverá ser feita pela esquerda, obedecida a sinalização regulamentar e respeitadas as normas de segurança. Além disso, o art. 30, inciso II, reforça que, ao ultrapassar, o condutor deve retornar à faixa de trânsito de origem, assim que a manobra for concluída com segurança."],["p1m3q43",3,2,"É permitido circular sobre a calçada?","","Apenas para entrar ou sair de imóvel ou estacionamento.","Sempre que não houver trânsito.","Para desviar de buracos.","Para fazer retorno.","Conforme estabelece o Art. 193 do CTB, transitar sobre calçadas ou passeios é infração gravíssima. A exceção ocorre na manobra de acesso a imóveis (garagens), pois o art. 29, inciso V do CTB permite o deslocamento lateral necessário para entrar ou sair, não caracterizando o \"transitar\" (uso longitudinal)."],["p1m3q44",3,0,"É permitido parar dentro de uma rotatória?","","Não, salvo em caso de emergência.","Sim, se estiver em dúvida sobre a saída.","Sim, se houver espaço.","Sempre que quiser.","Conforme estabelece o Art. 182, inciso VII do CTB, parar o veículo na área de cruzamento de vias (incluindo rotatórias) é uma infração média, sujeita a multa. A rotatória é uma área de interseção de fluxo de trânsito contínuo, e a parada no local compromete a segurança e a fluidez do tráfego."],["p1m3q45",3,1,"Em área com muitos pedestres e ciclistas, qual atitude básica do motorista?","","Reduzir a velocidade, manter distância e dar preferência ao mais vulnerável.","Buzinar para todos saírem.","Passar bem perto para caber.","Acelerar para sair logo.","Proteção à vida em primeiro lugar."],["p1m3q46",3,1,"Em área escolar com crianças saindo do colégio, o motorista deve:","","Reduzir a velocidade e estar pronto para parar.","Buzinar para abrir caminho e passar rápido.","Seguir no fluxo sem mudanças porque a rua é pública.","Parar na faixa de pedestres para embarque de aluno.","Conforme estabelece o art. 220, inciso XIV do CTB, deixar de reduzir a velocidade do veículo de forma compatível com a segurança do trânsito nas proximidades de escolas ou onde haja intensa movimentação de pedestres é considerado infração gravíssima. Essa exigência se justifica porque a presença de crianças (pedestres vulneráveis e muitas vezes imprevisíveis) requer o máximo de cautela e uma velocidade que permita a parada imediata para evitar acidentes."],["p1m3q47",3,1,"Em áreas de grande circulação de pessoas, o motorista deve:","","Reduzir a velocidade e manter distância segura.","Aumentar a velocidade para sair logo.","Ultrapassar com buzina.","Ligar o pisca-alerta.","Conforme estabelece o art. 220, inciso XIV do CTB, deixar de reduzir a velocidade do veículo de forma compatível com a segurança do trânsito nas proximidades de escolas ou onde haja intensa movimentação de pedestres é considerado infração gravíssima. Essa exigência se justifica porque a presença de crianças (pedestres vulneráveis e muitas vezes imprevisíveis) requer o máximo de cautela e uma velocidade que permita a parada imediata para evitar acidentes."],["p1m3q48",3,1,"Em um cruzamento onde há ciclofaixa, qual é a penalidade aplicada ao motociclista (ou qualquer condutor) que não parar para ceder a passagem ao ciclista?","","Comete infração gravíssima e põe vidas em risco.","Está certo se o sinal estiver verde.","Age certo se buzinar.","Pode seguir se estiver apressado.","Conforme estabelece o art. 214, inciso I do CTB, deixar de dar preferência de passagem a pedestre ou a ciclista quando estiverem na faixa a eles destinada ou que não haja sinalização, mas que já tenham iniciado a travessia, é considerado infração gravíssima. Nesse cenário, a ciclofaixa é a faixa destinada ao ciclista, e não ceder a preferência é uma conduta de alto risco e punível com multa gravíssima."],["p1m3q49",3,2,"Em um cruzamento com linha férrea (trilhos) sem cancela, com o Veículo Leve sobre Trilhos (VLT) se aproximando e pedestres aguardando, qual é a decisão correta e obrigatória do motorista?","","Parar antes dos trilhos e só cruzar depois da passagem completa do VLT.","Atravessar rápido antes dele.","Parar sobre os trilhos para “garantir lugar”.","Entrar na contramão para passar primeiro.","Conforme estabelece o art. 29, inciso XII do CTB, os veículos que se deslocam sobre trilhos (como trens ou VLTs) têm preferência de passagem absoluta sobre todos os demais."],["p1m3q50",3,0,"Em estrada sem acostamento, um pedestre caminha pelo bordo da pista. O que o motociclista deve fazer?","","Reduzir a velocidade, manter distância lateral e passar devagar.","Buzinar para ele sair.","Passar colado.","Acelerar para “livrar” rápido.","Pedestre tem prioridade na ausência de calçada."],["p1m3q51",3,0,"Em frente à escola, motociclista deve:","","Reduzir a velocidade, não trafegar entre carros e manter distância de pedestres.","Passar no corredor em alta velocidade.","Usar a calçada para “escapar do trânsito”.","Cortar pela direita em fila dupla.","Áreas escolares pedem máximo cuidado do motociclista."],["p1m3q52",3,0,"Em uma rotatória, quem tem a preferência?","","Quem já está circulando dentro dela.","Quem está entrando.","O veículo maior.","O mais rápido.","A prioridade é de quem já está na rotatória."],["p1m3q53",3,1,"Em uma via com várias faixas, onde a moto deve circular?","","Dentro de UMA faixa, bem posicionada para ser vista, sem andar entre carros em movimento.","Entre dois carros em movimento, aproveitando o espaço livre.","Somente no corredor, em alta velocidade.","Em cima da calçada, quando a rua estiver cheia.","A moto deve circular dentro da faixa, bem posicionada para ser vista, evitando andar entre veículos em movimento, garantindo segurança."],["p1m3q54",3,0,"Em via comum, por qual lado da pista o veículo deve trafegar?","","Pelo lado direito da via, salvo sinalização dizendo o contrário.","Pelo meio da pista, para ver melhor.","Pelo lado esquerdo, pois é mais rápido.","De qualquer jeito, se for devagar.","Regra geral de circulação pelo lado direito."],["p1m3q55",3,1,"Em vias de várias faixas, veículos grandes e lentos devem:","","Circular nas faixas da direita.","Circular à esquerda.","Ficar alternando de faixa.","Seguir pelo acostamento.","Veículos grandes e lentos devem usar a faixa da direita para não atrapalhar o fluxo dos mais rápidos e garantir segurança no trânsito."],["p1m3q56",3,0,"O que significa estacionar um veículo?","","Deixar o veículo parado por tempo maior do que o de embarque e desembarque, com ou sem condutor.","Só encostar por 10 segundos em cima da faixa.","Parar na esquina para ir ao mercado rapidinho.","Ligar o pisca-alerta e poder qualquer coisa.","Estacionar significa imobilizar o veículo por tempo indeterminado, sem interromper momentaneamente o trânsito, diferente de apenas parar para embarque ou desembarque."],["p1m3q57",3,1,"Fila dupla em frente à escola para embarque rápido é:","","Irregular e perigosa, atrapalha o trânsito e aumenta risco para pedestres.","Permitida se o pisca-alerta estiver ligado.","Permitida em horários de pico.","Permitida se o motorista não descer do carro.","A infração ocorre quando um veículo para ao lado de outro já estacionado na via, prejudicando o trânsito, a segurança e o fluxo de outros veículos, incluindo veículos de emergência. Art. 181, inciso XI"],["p1m3q58",3,0,"Motocicleta pode trafegar em ciclovia ou ciclofaixa?","","Não. Esses espaços são exclusivos de bicicletas.","Pode, se for devagar.","Pode, se ligar o pisca-alerta.","Pode, só para ultrapassar.","Exclusividade do ciclista, invadir é gravíssimo. Art. 193 do CTB."],["p1m3q59",3,0,"Na rotatória, o motociclista deve:","","Reduzir, sinalizar, e dar preferência a quem já está dentro da rotatória.","Entrar acelerando para “abrir caminho”.","Parar dentro da rotatória para escolher a saída.","Cortar pela calçada para sair logo.","Regra de preferência na rotatória."],["p1m3q60",3,1,"Na saída de alunos, um ônibus escolar parou no ponto. Nesse cenário, o que um condutor deve fazer?","","Reduzir a velocidade, manter distância, observar crianças e só avançar com segurança.","Ultrapassar rápido pela direita.","Colar na traseira para “empurrar” o fluxo.","Buzinar para que as crianças saiam logo.","Passageiros podem atravessar à frente do ônibus, prudência máxima."],["p1m3q61",3,1,"Um condutor dirige em uma rodovia, na faixa da esquerda, durante a noite com a pista molhada. Surge carro atrás querendo ultrapassar. O que ele deve fazer?","","Ir para a faixa da direita quando seguro, sem acelerar, e manter distância maiorem caso de chuva.","Acelerar para “segurar a esquerda”.","Frear de propósito.","Ir para o acostamento e parar.","O condutor deve manter-se na faixa da esquerda apenas quando necessário, e, ao perceber que há outro veículo atrás querendo ultrapassar, deve se deslocar para a faixa da direita, respeitando as normas de circulação e garantindo a segurança, especialmente em condições adversas, como pista molhada."],["p1m3q62",3,1,"O ciclomotor deve trafegar:","","Pela direita da pista, preferencialmente no centro da faixa mais à direita.","Entre duas faixas.","No corredor.","Pela contramão.","Posição à direita aumenta a segurança e previsibilidade."],["p1m3q63",3,0,"O motociclista deve trafegar:","","Dentro de uma faixa de rolamento, como qualquer outro veículo.","Entre duas faixas.","Pela calçada.","No acostamento sempre.","O motociclista deve sempre trafegar dentro da faixa, de forma visível aos outros motoristas, sem tentar passar entre os carros em movimento, pois isso aumenta o risco de acidentes. A segurança no trânsito depende do respeito às regras de circulação e do comportamento previsível no tráfego."],["p1m3q64",3,0,"O motociclista deve ultrapassar outro veículo:","","Pela esquerda, desde que haja espaço e sinalizando antes.","Pela direita, se for mais rápido.","Pelo acostamento.",
