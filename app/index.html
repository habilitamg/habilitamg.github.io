ecipação de riscos reduz sinistros."],["p1m3q263",3,0,"Uma função do airbag é:","","Evitar que o ocupante bata no volante, painel ou para-brisa.","Aumentar a potência do motor.","Economizar combustível.","Substituir os freios.","Diminui impactos em partes duras do veículo."],["p1m3q264",3,1,"A distância de frenagem depende principalmente de:","","Velocidade, condições da via, pneus, freios e forma de frear.","Idade do motorista.","Tipo de combustível.","Cor do veículo.","Fatores físicos determinam a capacidade de parada."],["p1m3q265",3,1,"A seta deve ser acionada:","","Em toda mudança de faixa, conversão, entrada/saída e ultrapassagem.","Só quando houver trânsito.","Apenas após a manobra.","Quando quiser educar outro condutor.","Comunicação clara entre condutores evita conflitos."],["p1m3q266",3,1,"Além de ver, ser visto depende de:","","Faróis e lanternas limpos e funcionando.","Faróis apagados para não incomodar.","Películas escuras no para-brisa.","Seta desligada para surpresa.","Comunicação visual clara evita interpretações erradas."],["p1m3q267",3,1,"Animais no veículo devem:","","Ficar presos em dispositivo ou caixa apropriada.","Circular soltos no painel.","Ir no colo do motorista.","Ficar com a cabeça para fora.","Os animais devem ficar presos para evitar distrações e projeções perigosas."],["p1m3q268",3,1,"Ao transportar carga em motocicleta, o cuidado essencial é:","","Respeitar peso/volume e não cobrir faróis/lanternas.","Prender nos guidões.","Deixar solta para acomodar.","Concentrar peso alto e atrás.","Excesso e mau arranjo alteram a condução e a visibilidade."],["p1m3q269",3,1,"Aquaplanagem pode ocorrer quando:","","Chove forte e a velocidade é alta.","Pista está seca.","Pneus novos e velocidade baixa.","Há vento lateral.","Aquaplanagem ocorre quando um filme de água separa pneu do asfalto."],["p1m3q270",3,1,"Área alagada na via:","","Não arrisque atravessar, busque rota segura.","Passe rápido para cortar a água.","Siga bem aproximado outro veículo.","Acelere com farol alto.","Enchentes escondem buracos e arrastam veículos."],["p1m3q271",3,1,"Banco do motorista deve permitir:","","Alcance total dos pedais e boa visão.","Pernas esticadas e encosto deitado.","Mãos soltas sem apoio.","Visão só do painel.","Ergonomia correta melhora o controle do condutor."],["p1m3q272",3,1,"Como reduzir ofuscamento ao dirigir contra o sol?","","Usar para-sol e óculos escuros, com velocidade menor.","Ligar farol alto.","Fechar os olhos por instantes.","Acelerar para passar rápido.","Deve ser utilizado o controle de luz e prudência."],["p1m3q273",3,1,"Condução noturna segura em rodovia pede:","","Velocidade reduzida e farol baixo ao cruzar veículos.","Farol alto constante.","Ignorar pedestres e animais.","Aproximar muito do veículo à frente.","Visibilidade menor exige prudência dos condutores."],["p1m3q274",3,1,"De dia, em rodovia com chuva e neblina, a sequência correta é:","","Reduzir velocidade, aumentar distância e usar farol baixo.","Manter velocidade e ligar farol alto.","Ligar apenas a luz alta e aumentar a velocidade.","Frear bruscamente e parar na faixa.","Baixa visibilidade exige adaptação de velocidade, espaço e iluminação adequada."],["p1m3q275",3,1,"Em área escolar, a conduta segura inclui:","","Reduzir velocidade e atenção total à sinalização e às crianças.","Manter velocidade da via.","Usar farol alto para alertar.","Buzinar para apressar travessias.","O condutor deve observar as preferências da via e manter a segurança de todos."],["p1m3q276",3,1,"Luz amarela (setas/alertas) indica:","","Comunicação de intenção ou situação de emergência.","Farol alto ligado.","Freio acionado.","Ré engatada.","Cor de advertência e de indicação."],["p1m3q277",3,1,"Luzes do veículo (faróis/lanternas/setas) são essenciais para:","","Ver, ser visto e se comunicar.","Enfeitar o carro.","Economizar bateria.","Evitar lavar o para-brisa.","A iluminação ajuda a reduzir riscos e sinistros."],["p1m3q278",3,1,"Em piso molhado, o motociclista deve frear:","","Com os dois freios, de modo progressivo e antecipado.","Apenas com o traseiro, forte e no fim.","Só com o dianteiro, para segurar a frente.","Alternando freios rápido para pulsar.","Técnica progressiva com ambos os freios reduz travamento e perda de controle."],["p1m3q279",3,1,"Na neblina/fumaça, a conduta segura é:","","Manter baixa velocidade e aumentar distância.","Usar farol alto.","Parar na faixa de rolamento.","Piscar farol para tirar a neblina.","A visibilidade fica muito reduzida nessas condições, por isso os movimentos devem ser suaves e o uso do farol baixo é o mais indicado."],["p1m3q280",3,2,"No entardecer, um carro trafega com para-brisa sujo e faróis apagados. A conduta segura é:","","Limpar o para-brisa e acender o farol baixo.","Manter como está para poupar o sistema de iluminação.","Ligar farol alto na cidade.","Usar apenas luz de posição.","Visibilidade é essencial para diminuição de riscos no trânsito."],["p1m3q281",3,2,"O que ocorre quando o motorista reage tardiamente ao perigo?","","Aumenta a distância total de parada.","Diminui o risco.","Melhora a frenagem.","Reduz a distância de reação.","Reação lenta amplia o espaço total percorrido até parar."],["p1m3q282",3,1,"O que separa o condutor cuidadoso do distraído?","","Atenção contínua e sem celular.","Pressa constante.","Farol alto a qualquer hora.","Mudar de faixa sem seta.","Atenção é chave para evitar sinistros."],["p1m3q283",3,1,"Para reduzir pontos cegos ao dirigir, a conduta adequada é:","","Ajustar retrovisores e checar com leve giro de cabeça antes da troca de faixa.","Olhar só o espelho interno.","Confiar no alerta sonoro do carro.","Usar farol alto para “afastar” veículos.","Ajuste + verificação direta ampliam percepção lateral e evitam colisões por mudança de faixa."],["p1m3q284",3,1,"Pessoas sem cinto no banco traseiro podem:","","Ser projetadas para a frente e ferir os da frente.","Proteger quem está à frente.","Melhorar a frenagem.","Evitar danos no painel.","Massa do corpo vira “projétil” interno."],["p1m3q285",3,1,"Por que duas pessoas no mesmo cinto é perigoso?","","O cinto não distribui forças corretamente e pode ferir ambos.","Fica mais confortável.","O airbag não inflará.","Evita multa.","Cada ocupante precisa de ancoragem própria."],["p1m3q286",3,1,"Por que não se deve dormir apoiado no encosto de cabeça?","","Ele é item de proteção, não de conforto, posição errada reduz eficácia.","Porque quebra fácil.","Porque atrapalha o som do carro.","Porque aumenta consumo.","Distância da nuca reduz proteção no impacto traseiro."],["p1m3q287",3,1,"Por que não usar almofadas, capas ou toalhas no banco?","","Facilitam o deslizamento do corpo e anulam o cinto.","Só sujam o estofado.","Esfriam o assento.","Atrapalham o ar-condicionado.","Aumenta risco do efeito submarino."],["p1m3q288",3,1,"Por que reduzir a velocidade “antes da curva” é mais seguro?","","Porque o carro mantém estabilidade e não perde aderência.","Porque economiza combustível.","Porque evita farol alto.","Porque melhora o conforto.","Curva exige tração equilibrada, o que só ocorre com menor velocidade."],["p1m3q289",3,2,"Quais cinco princípios sustentam a direção defensiva?","","Conhecimento, atenção, previsão, decisão, habilidade.","Pressa, potência, sorte, risco, ousadia.","Velocidade, coragem, ruído, farol alto, disputa.","Experiência, carisma, música, rotina, atalho.","Conjunto orienta o comportamento seguro."],["p1m3q290",3,2,"Quais fatores reduzem a aderência do veículo?","","Água, areia, óleo ou buracos na pista.","Pista seca e limpa.","Pneu calibrado corretamente.","Direção suave.","Superfícies instáveis aumentam o risco de derrapagem."],["p1m3q291",3,1,"Qual a diferença entre direção defensiva e preventiva?","","Defensiva protege, preventiva antecipa o risco.","Defensiva evita multas, preventiva é opcional.","Defensiva é usada em rodovias, preventiva em cidades.","Não há diferença entre elas.","A direção defensiva reage com segurança, a preventiva evita o perigo antes."],["p1m3q292",3,1,"Qual afirmação sobre viagens curtas é correta?","","O cinto deve ser usado em todas as viagens.","Em trajetos curtos, o cinto é dispensável.","Só usar o cinto após 10 km.","Utilizar o cinto apenas à noite.","Muitos sinistros ocorrem perto de casa."],["p1m3q293",3,1,"Qual calçado não é adequado para pilotar?","","Chinela e sandália sem calcanhar","Bota fechada com sola firme.","Tênis que envolve o pé.","Bota com sola antiderrapante.","Podem escapar dos pedais e prender."],["p1m3q294",3,0,"Qual checklist rápido antes de iniciar a viagem está correto?","","Espelhos, cintos, faróis, celular fora de uso e velocidade compatível.","Celular à mão, farol alto ligado e banco deitado.","Som alto, janela aberta e marcha alta.","Sem cinto, olhar o celular no semáforo.","Preparação simples reduz falhas humanas, melhora reação e comunicação visual."],["p1m3q295",3,1,"Qual combinação potencializa a eficácia do airbag frontal?","","Cinto correto + mãos bem posicionadas + apoio de cabeça ajustado.","Apenas airbag e banco deitado.","Só DRL ligado.","Apenas pneu novo.","Sistemas passivos funcionam em conjunto com postura adequada."],["p1m3q296",3,1,"Qual combinação resume a direção segura em curvas?","","Reduzir antes, volante suave e controle contínuo.","Frear forte dentro da curva.","Girar rápido e compensar depois.","Acelerar no meio da curva.","Antecipar e manter suavidade preservam aderência."],["p1m3q297",3,1,"Qual conduta legal sobre o cinto?","","Usar é obrigatório, não usar é infração grave.","Uso é opcional na cidade.","Só o motorista deve usar.","É obrigatório apenas em rodovia.","Obrigação geral e penalidade prevista."],["p1m3q298",3,1,"Qual decisão é mais segura ao iniciar ultrapassagem em pista simples?","","Só iniciar com visibilidade ampla, local permitido e espaço para retornar para a via de origem.","Iniciar no final de curva.","Forçar retorno sem espaço.","Ir pela direita por “agilidade”.","Condições rigorosas evitam conflitos frontais."],["p1m3q299",3,1,"Qual é a forma correta de verificar o ajuste do cinto?","","Sem torções, fecho íntegro e fita bem esticada.","Torcido para “travar mais”.","Fecho semiaberto.","Folgado para conforto.","Torções e folgas aumentam deslocamento do corpo."],["p1m3q300",3,1,"Qual exemplo mostra avaliação de riscos correta ao aproximar-se de escola?","","Reduzir velocidade, prever travessias e manter distância do veículo à frente.","Manter velocidade e buzinar para apressar pedestres.","Desviar rápido por outra faixa sem olhar.","Acelerar para “passar antes” de pedestres.","Ambientes com crianças têm risco elevado, prever, reduzir e manter distância é essencial."],["p1m3q301",3,2,"Qual relação direta existe entre velocidade e frenagem?","","Pequeno aumento na velocidade exige muito mais distância para parar.","A distância de frenagem sempre é igual.","Aumentar a velocidade não impacta no tempo de parada.","Só o freio influencia.","Crescimento exponencial da energia cinética."],["p1m3q302",3,1,"Qual resposta é a mais segura ao perceber óleo na pista?","","Reduzir a velocidade e manter a atenção na condução do veículo.","Frear forte.","Passar acelerando brusco.","Olhar para a mancha e travar.","Aderência limitada exige suavidade e preparo prévio."],["p1m3q303",3,1,"Sem cinto, o airbag pode:","","Causar ferimentos ao atingir a pessoa em alta velocidade.","Proteger ainda melhor.","Economizar combustível.","Não abrir.","Infla até ~300 km/h, o cinto deve conter o corpo."],["p1m3q304",3,1,"Sobre a buzina, qual leitura está correta segundo o CTB?","","Uso em toques breves como advertência, prolongado e fora de horário/local é infração leve.","Uso livre em qualquer horário urbano.","Obrigatória para mudar de faixa.","Permitida por tempo ilimitado em hospitais.","Art. 227 tipifica o uso adequado e as proibições."],["p1m3q305",3,1,"Sobre crianças no carro, a conduta segura é:","","Usar sempre dispositivo de retenção adequado.","Colocar no colo com cinto do adulto.","Sentar solta no banco traseiro.","Ficar à frente sem cadeirinha.","Proteção infantil é requisito de segurança."],["p1m3q306",3,1,"Ultrapassagem segura exige:","","Fazer pela esquerda, em local permitido, com espaço e visibilidade.","Pela direita, sempre.","Em curva sem visão.","Com farol alto ligado atrás do outro veículo.","Condições e local apropriado são indispensáveis para uma ultrapassagem segura."],["p1m3q307",3,1,"Um condutor percebe chuva forte iniciando. Qual a primeira atitude segura?","","Reduzir a velocidade e acionar o limpador de para-brisa.","Aumentar a velocidade para fugir da chuva.","Acender farol alto.","Frear bruscamente e parar na pista.","A percepção sensorial exige resposta motora adequada e preventiva."],["p1m3q308",3,1,"Usar o guidão da motocicleta como cabide para sacolas:","","Compromete a segurança e o controle.","Melhora equilíbrio.","Reduz esforço do piloto.","É neutro se for leve.","Peso no guidão altera direção e estabilidade do veículo."],["p1m3q309",3,1,"Uso correto do capacete inclui:","","Viseira abaixada ou óculos de proteção e fecho ajustado.","Viseira aberta e sem fecho.","Óculos de sol no lugar da viseira.","Sem selo de qualidade.","O motociclista deve usar a viseira ou óculos para evitar a queda de objetos nos olhos. O fecho do capacete evita a perda deste em caso de colisões."],["p1m3q310",3,1,"Uso correto do farol de neblina:","","Só em neblina, cerração, chuva forte, fumaça ou poeira.","Em dias claros, para estética.","Sempre com farol alto.","No lugar do farol baixo à noite.","O feixe baixo melhora visão próxima do solo em clima adverso."],["p1m3q311",3,0,"Ao abrir a porta do carro parado na rua, a atitude segura é:","","Conferir espelhos e olhar por cima do ombro para não atingir outros usuários da via.","Abrir rápido e descer logo.","Abrir no fluxo para parar o trânsito.","Pedir para outro veículo desviar.","Os condutores devem estar atentos aos arredores e à segurança da via."],["p1m3q312",3,0,"Ao cruzar com cadeirante em rampa de acesso, o que não fazer?","","Parar sobre a guia rebaixada ou bloquear a rampa.","Aguardar e manter distância segura.","Oferecer passagem livre e sinalizar.","Evitar estacionar em vaga PCD sem credencial.","Bloquear rampa tira autonomia e segurança."],["p1m3q313",3,0,"Ao ultrapassar um ciclista na via urbana, o que é correto?","","Reduzir a velocidade e manter 1,5 m de distância lateral.","Passar coladinho para não atrapalhar.","Buzinar e apertar o ciclista no meio-fio.","Fechar a passagem para ele descer.","O condutor deve respeitar os demais usuários da via e manter a segurança de todos."],["p1m3q314",3,0,"Carlos dirige à noite com o farol queimado. Isso representa:","","Um risco, pois diminui a visibilidade e aumenta o risco de sinistro.","Economia de energia para o carro.","Cuidado, se o condutor andar devagar.","Consciência, só estando errado se a via for sem iluminação.","A iluminação do veículo aumenta a visibilidade e reduz o risco de sinistros."],["p1m3q315",3,0,"Carlos dirige com o braço para fora da janela do carro. Qual o erro?","","Conduzir com parte do corpo para fora do veículo.","Ficar devagar demais na pista.","Não ligar o farol.","Ultrapassar pela direita.","Conduzir veículo com braço para fora configura infração de trânsito, conforme art. 252, inciso I, do CTB."],["p1m3q316",3,0,"Carlos dirige seu carro e usa o celular para mandar mensagem. Ele perde a atenção e bate no carro da frente. Esse fato é:","","Um sinistro de trânsito, que poderia ter sido evitado se ele não usasse o celular.","Um acidente inevitável, que acontece com qualquer pessoa.","Um problema de sorte, sem culpa de ninguém.","Um defeito do carro.","O uso do celular ao volante é comportamento de risco e causa evitável de sinistro."],["p1m3q317",3,0,"Chove forte. O que é correto fazer?","","Reduzir a velocidade e aumentar a distância dos demais veículos.","Ligar farol alto e acelerar.","Frear forte em cima da curva.","Seguir colado no carro da frente.","Adaptação às condições adversas evita sinistro."],["p1m3q318",3,0,"Como o motorista pode prevenir atropelamentos de crianças?","","Reduzindo a velocidade em áreas residenciais e perto de escolas.","Tocando buzina para avisar.","Estacionando em fila dupla.","Deixando o motor ligado e observando.","Crianças são imprevisíveis"],["p1m3q319",3,0,"Depois de um sinistro leve, os motoristas trocam informações de seguro e liberam a pista. O que essa atitude mostra?","","Responsabilidade e respeito ao trânsito.","Medo da polícia.","Desinteresse pelo veículo.","Falta de cuidado.","Conduta correta que demostra responsibilidade e preocupação com o fluxo da via."],["p1m3q320",3,0,"Dirigir “um pouco acima” da velocidade pode causar o quê?","","Sinistros mais graves, com lesões mais sérias.","Menos consumo de combustível.","Viagens sempre mais seguras.","Melhoria da visibilidade.","Energia do impacto cresce rápido com a velocidade."],["p1m3q321",3,0,"Em pista com óleo, o carro começa a deslizar. Qual ação correta?","","Tirar o pé do acelerador, segurar firme e evitar frear/bruscar manobras.","Pisar fundo no freio.","Vira todo o volante de uma vez.","Acelerar para “estabilizar”.","Aderência baixa exige suavidade."],["p1m3q322",3,0,"Em uma rua com escolas e idosos, qual a atitude correta?","","Reduzir e ficar atento a travessias inesperadas.","Manter a velocidade máxima.","Passar rápido para não “atrapalhar”.","Buzinar para avisar.","É importante ter atenção as vias que transitam crianças e idosos."],["p1m3q323",3,0,"Está garoando e a pista ficou escorregadia. O que o motorista deve fazer?","","Reduzir a velocidade e aumentar a distância do carro da frente.","Acelerar para sair logo da chuva.","Seguir colado para não “perder espaço”.","Frear só em cima da curva.","Condição adversa exige adaptação da velocidade."],["p1m3q324",3,0,"João dirige com o rádio alto e conversa animado com os amigos. Por causa do barulho, não ouve a buzina de outro carro. O que pode acontecer?","","Um sinistro, pois o som alto atrapalha a atenção e a audição.","Nada, se ele estiver com o cinto.","O rádio ajuda a relaxar e dirigir melhor.","Só é perigoso se for à noite.","O condutor deve manter o foco na direção."],["p1m3q325",3,0,"José dirige devagar na faixa da esquerda e causa fila atrás. Isso é perigoso porque:","","Pode irritar outros motoristas e provocar manobras arriscadas.","É sinal de que ele é prudente.","Ajuda a diminuir o trânsito.","Aumenta a segurança.","O condutor deve conduzir o veículo na velocidade permitida na via."],["p1m3q326",3,0,"Marcos dirige ouvindo música no fone de ouvido. Isso é perigoso porque:","","Ele não escuta buzinas ou sirenes.","O som melhora sua concentração.","Só causa problema em estrada.","Atrapalha apenas os passageiros.","O condutor deve manter o foco ao trânsito."],["p1m3q327",3,0,"Maria está aprendendo a dirigir. Ao ver um pedestre atravessar fora da faixa, ela decide frear para evitar o atropelamento. A ação dela foi correta?","","Agiu corretamente, evitando um sinistro.","Errou, porque o pedestre estava errado.","Deveria ter acelerado para não parar o trânsito.","Tinha o direito de seguir sem frear.","O condutor deve estar atento aos arredores e observar as preferências da via."],["p1m3q328",3,0,"Num cruzamento semaforizado, você percebe pedestres já iniciando a travessia no fim do sinal verde. Qual a conduta segura?","","Aguardar a liberação total da faixa antes de partir.","Acelerar no amarelo para sair.","Buzinar forte para abrir caminho.","Desviar pela faixa de ônibus.","O condutor deve observar as preferências da via e deixar os pedestres terminarem a travessia."],["p1m3q329",3,0,"O condutor do veículo à frente está aprendendo a dirigir e hesita para sair. Qual atitude?","","Aguardar com calma e manter distância.","Acelerar e passar bem perto.","Buzinar sem parar.","Xingá-lo pela janela.","Educação e tolerância criam um ambiente seguro no trânsito."],["p1m3q331",3,2,"O que diz a ideia da Visão Zero?","","Nenhuma morte no trânsito é aceitável.","Alguns acidentes são inevitáveis.","O pedestre é sempre culpado.","Só punir resolve.","Toda vida perdida é inaceitável."],["p1m3q332",3,1,"O que é velocidade segura?","","A velocidade ajustada às condições do momento (chuva, fluxo e visibilidade).","A velocidade máxima da placa, sempre.","A velocidade dos carros mais rápidos.","A maior velocidade que o carro alcança.","Pode ser igual ou menor que a máxima regulamentar, dependendo das condições da via."],["p1m3q333",3,1,"O que mais define a gravidade de uma batida?","","A velocidade do veículo no impacto.","A cor do carro.","A marca do pneu.","O número de portas.","A energia do impacto aumenta com a velocidade."],["p1m3q334",3,0,"O que o condutor deve fazer se uma pessoa com deficiência precisar embarcar ou desembarcar?","","Esperar com paciência, sem pressionar ou buzinar.","Acelerar para sair logo.","Ficar reclamando.","Passar bem próximo.","O condutor deve presar pela boa convivência entre todos os usuários da via."],["p1m3q335",3,0,"O que significa dizer que o trânsito é um espaço coletivo?","","Que todos compartilham as vias e têm deveres e direitos próprios.","Que só os motoristas decidem as regras.","Que é cada um por si.","Que quem paga imposto manda.","O trânsito é convivência social entre os usuários da via."],["p1m3q336",3,0,"O que significa empatia no trânsito?","","Colocar-se no lugar do outro e agir com respeito.","Reclamar quando alguém erra.","Ser sempre o primeiro a passar.","Ignorar o pedestre.","A empatia entender o ponto de vista de outra pessoa, entendendo seus sentimentos, pensamentos e perspectivas"],["p1m3q337",3,0,"Por que as crianças precisam de cadeirinhas diferentes conforme a idade?","","Porque o corpo cresce e precisa de proteção adequada para cada fase.","Porque é exigência do mercado.","Porque os fabricantes pedem.","Não precisa, pois todas são iguais.","Cada idade exige um tipo de sistema de retenção do corpo."],["p1m3q338",3,0,"Por que dirigir com empatia protege os vulneráveis?","","Porque reduz conflitos e aumenta a segurança de todos.","Porque evita multas leves.","Porque dá direito à preferência.","Porque deixa o trânsito mais rápido.","Entender o outro ajuda a evitar sinistros."],["p1m3q339",3,0,"Por que o ciclista é um usuário vulnerável?","","Porque está exposto e se desequilibra com facilidade.","Porque anda devagar.","Porque não conhece o CTB.","Porque atrapalha o trânsito.","Qualquer desequilíbrio pode causar ferimentos graves."],["p1m3q340",3,0,"Por que o motorista deve ver e ser visto ao se aproximar de travessias?","","Para antecipar movimentos e evitar atropelamentos.","Para mostrar “quem manda”.","Para economizar tempo.","Para disputar espaço com pedestres.","Comunicação e previsibilidade salvam vidas."],["p1m3q341",3,0,"Por que o motorista deve cuidar dos mais frágeis?","","Porque essa é a base da convivência segura e humana no trânsito.","Porque é obrigação apenas moral.","Porque ganha desconto na multa.","Porque evita atrasos.","A prioridade é proteger a vida, não o veículo."],["p1m3q342",3,0,"Por que o motorista não pode parar sobre calçadas?","","Porque atrapalha o caminho dos usuários da calçada.","Porque suja o pneu.","Porque só é proibido em rodovias.","Porque é falta de educação apenas.","A calçada é própria para a circulação de determinadas pessoas."],["p1m3q343",3,0,"Por que o motorista deve reduzir perto de escolas e praças?","","Porque há pedestres e crianças atravessando.","Porque a rua é estreita.","Porque é área sem fiscalização.","Porque pode estacionar melhor.","Crianças e pedestres são os mais frágeis no trânsito."],["p1m3q344",3,0,"Por que os pedestres são considerados vulneráveis?","","Porque andam expostos, sem proteção.","Porque andam sempre distraídos.","Porque gostam de correr risco.","Porque ocupam a rua indevidamente.","O pedestre não tem carroceria para proteger o corpo."],["p1m3q345",3,0,"Por que pedestres, ciclistas e motociclistas são “vulneráveis”?","","Porque estão mais expostos e sofrem mais em caso de impacto.","Porque “atrapalham” os carros.","Porque desrespeitam mais a lei.","Porque não usam a via.","Exposição física = maior gravidade em sinistros."],["p1m3q346",3,0,"Por que reduzir a velocidade em áreas cheias de gente?","","Para evitar sinistros com mortes e ferimentos graves.","Para economizar combustível.","Para “andar junto” com os outros.","Para não ser multado.","Velocidade segura protege o corpo humano, que tem limites."],["p1m3q347",3,0,"Por que reduzir a velocidade perto de escolas e hospitais?","","Porque há pedestres e pessoas vulneráveis.","Porque o radar pode multar.","Porque gasta menos combustível.","Porque o trânsito é lento.","Reduzir velocidade salva vidas."],["p1m3q348",3,0,"Qual conduta traduz educação no trânsito no dia a dia?","","Respeitar as normas e agir com empatia e tolerância.","Apenas decorar multas e valores.","Buscar vantagem em todo momento.","Ter conhecimento de onde ficam os semáforos com fiscalização de velocidade.","O condutor deve respeitar as regras e os demais usuários da via para garantir a segurança de todos e qualidade de vida."],["p1m3q349",3,0,"Qual deve ser a prioridade número um no trânsito?","","A vida das pessoas.","O tempo de viagem.","O valor do combustível.","O tamanho da via.","A prioridade para todos envolvidos com o trânsito é a proteção da vida."],["p1m3q350",3,0,"Qual é a atitude correta ao ver uma pessoa com muletas atravessando a rua?","","Parar e permitir a travessia com calma.","Acelerar para passar antes.","Buzinar para apressar.","Passar ao lado, bem perto.","Pessoas com mobilidade reduzida precisam de tempo e espaço, devendo ser respeitado pelos condutores."],["p1m3q351",3,0,"Qual é a meta principal do Pnatrans?","","Reduzir pela metade as mortes no trânsito até 2030.","Fazer novas estradas.","Aumentar o número de radares.","Criar mais multas.","O Pnatrans, criado pela Lei nº 13.614, de 2018, tem como objetivo reduzir a quantidade de mortes no trânsito."],["p1m3q352",3,0,"Um caminhoneiro dirige há muitas horas sem parar. Qual é o maior risco?","","O cansaço causar sono e provocar um sinistro de trânsito.","O caminhão gastar mais combustível.","A viagem demorar mais.","O pneu esquentar demais.","Os condutores devem garantir que possuem condições de conduzir o veículo de forma plena e segura."],["p1m3q353",3,0,"Um ciclista está à frente do veículo. O que o motorista deve fazer ao ultrapassar?","","Manter 1,5 metro de distância lateral.","Buzinar forte para avisar.","Passar colado para não atrapalhar o trânsito.","Acelerar rápido e seguir.","A distância lateral de 1,5 m evita sinistros."],["p1m3q354",3,0,"Um motorista vê uma criança soltar a bola e correr para a rua. O que ele deve fazer?","","Reduzir a velocidade e preparar-se para parar o veículo.","Buzinar e seguir em frente.","Continuar em alta velocidade para não atrapalhar.","Aumentar o som para chamar atenção.","O condutor deve estar atento aos arredores e pronto para intercorrências."],["p1m3q355",3,0,"Um motorista vê uma pessoa com deficiência atravessando. O que deve fazer?","","Parar totalmente e esperar.","Buzinar e acelerar.","Passar devagar ao lado.","Fazer sinal com o farol.","O condutor deve observar as preferências da via."],["p1m3q356",3,0,"Um pedestre começa a atravessar a faixa e o sinal abre para os carros. O que o motorista deve fazer?","","Esperar o pedestre terminar de atravessar.","Acelerar devagar para ele sair logo.","Buzinar para apressar o pedestre.","Passar bem perto dele.","O pedestre que já está na faixa tem prioridade na via."],["p1m3q357",3,0,"Um pedestre usa o celular enquanto atravessa a via. O que pode acontecer?","","Ele pode se distrair e sofrer um sinistro.","Nada, pois está na faixa.","O motorista é o único responsável.","Isso é sempre permitido.","A distração aumenta o risco de atropelamento."],["p1m3q358",3,0,"Uma motorista tenta ultrapassar em uma curva sem visibilidade. Essa ação é:","","Extremamente perigosa e proibida por lei.","Aceitável se ela estiver com pressa.","Permitida em pista dupla.","Correta se não vier carro no sentido contrário.","Além de ser uma conduta perigosa, é vedada pelo CTB, conforme art. 32."],["p1m3q359",3,0,"Você chega a uma faixa de pedestres e uma senhora começa a atravessar. O que fazer?","","Parar e esperar ela terminar a travessia.","Buzinar para ela se apressar.","Desviar pela direita.","Passar devagar só um pouquinho.","O condutor deve respeitar a prioridade do pedestre em travessia."],["p1m3q360",3,0,"Você começa uma ultrapassagem a um ciclista e um carro surge em sentido contrário. A atitude correta é:","","Desistir da ultrapassagem, reduzir a velocidade e retomar, mantendo a distância segura com 1,5 m do ciclista.","Completar a ultrapassagem mesmo sendo perigoso.","Buzinar e seguir entre o carro e o ciclista.","Forçar o ciclista a ir para o acostamento.","Os condutores devem garantir a segurança dos mais vulneráveis."],["p1m3q361",3,0,"Você está numa rua estreita e um pedestre atravessa fora da faixa. O que fazer?","","Reduzir e parar, garantindo a segurança dele.","Acelerar para mostrar que ele está errado.","Buzinar e seguir.","Passar bem perto para assustar.","O condutor deve respeitar as preferências da via."],["p1m3q362",3,0,"Você vê um caminhão manobrando numa esquina. O que fazer?","","Dar espaço, manter distância e aguardar a manobra.","Fechar a frente do veículo para passar primeiro.","Buzinar e colar na traseira.","Forçar a ultrapassagem pela direita.","O bom convívio no trânsito é um dos elementos da direção segura."],["p1m3q363",3,0,"Você vê um idoso atravessando devagar a rua. O que deve fazer?","","Reduzir a velocidade e esperar com paciência.","Buzinar para ele andar mais rápido.","Passar antes dele terminar.","Desviar pela calçada.","O condutor deve respeitar as preferências da via e garantir a segurança de todos."],["p1m3q364",3,0,"Você vê um ônibus sinalizando saída da parada. O que fazer?","","Facilitar a manobra, mantendo distância e deixando espaço.","Acelerar para passar antes.","Fechar o ônibus para ele não sair.","Buzinar e colar na traseira.","O bom convívio no trânsito é um dos elementos da direção segura."],["p1m3q365",3,0,"Você vê uma criança perto da rua atrás de uma bola. Qual atitude?","","Reduzir a velocidade e ficar pronto para parar.","Buzinar e seguir.","Acelerar para passar logo.","Ignorar, pois ela está na calçada.","Prevenção protege os mais vulneráveis."],["p1m3q366",3,1,"A meta do Pnatrans até 2030 é:","","Reduzir pela metade a quantidade de fatalidades no trânsito.","Zerar multas.","Aumentar velocidade nas vias.","Priorizar só carros.","A meta principal do Plano Nacional de Redução de Mortes e Lesões no Trânsito (PNATRANS) para o período de 2021 a 2030 é reduzir, no mínimo, à metade (50%) o índice nacional de mortos e de lesões graves no trânsito por grupo de habitantes, utilizando como referência os dados de 2020."],["p1m3q367",3,2,"Um motorista sai de um posto de combustível (área lindeira) sem observar o fluxo da via principal e entra na pista, forçando outro veículo a frear bruscamente. Qual foi o erro de conduta fundamental cometido pelo motorista que saiu do posto?","","Entrar na via sem dar a preferência de passagem aos veículos que já estavam circulando na pista.","Culpa do outro motorista que estava atrás.","Falha do freio do carro.","Azar por coincidência.","O condutor que for ingressar numa via, procedente de lote lindeiro (como um posto de combustível), deverá dar preferência aos veículos e pedestres que por ela estejam transitando."],["p1m3q368",3,1,"Ao ver neblina, o que é correto?","","Reduzir e ligar farol baixo.","Ligar farol alto.","Acelerar para “sair da neblina”.","Ligar pisca-alerta e seguir.","Reduzir a velocidade, acender o farol baixo (ou de neblina) e aumentar a distância de segurança do veículo à frente. Conforme estabelece o Art. 40, inciso II do CTB, o condutor deve usar luz baixa nas vias com iluminação pública ou em condições de chuva, neblina, cerração."],["p1m3q369",3,1,"Durante um engarrafamento, o motorista decide andar pelo acostamento. Qual o risco?","","Provocar sinistros e atrapalhar veículos de emergência.","Evitar atrasos sem causar perigo.","Melhorar o fluxo do trânsito.","Mostrar habilidade ao volante.","Conforme estabelece o Art. 193 do CTB, transitar com o veículo pelo acostamento é considerado infração gravíssima, sujeita à multa. O risco se deve ao fato de o acostamento ser destinado exclusivamente à parada de veículos em situação de emergência e, em estradas, ao trânsito de pedestres e bicicletas. Ao circular por lá, o motorista coloca em risco a vida de pessoas paradas e impede o uso do local por veículos de socorro, como ambulâncias."],["p1m3q370",3,1,"Em avenida com chuva intensa, qual é a velocidade segura?","","Aquela que permite controlar e parar o carro com segurança, mesmo abaixo do limite.","Sempre a da placa.","A mesma dos carros mais rápidos.","A maior possível sem frear.","Em condições de chuva, a aderência dos pneus é reduzida (aumentando o risco de aquaplanagem) e o tempo de frenagem aumenta, enquanto o campo de visão diminui. A Direção Defensiva exige a redução da velocidade para que o condutor consiga parar o veículo dentro do alcance da visibilidade dos faróis e manter o controle total do veículo"],["p1m3q371",3,1,"Em avenida molhada, qual combinação é mais segura?","","Reduzir a velocidade e manter distância maior.","Frear no último momento.","Acender farol alto e acelerar.","Seguir colado em veículo maior.","Em condições de chuva, a aderência dos pneus é reduzida (aumentando o risco de aquaplanagem) e o tempo de frenagem aumenta, enquanto o campo de visão diminui. A Direção Defensiva exige a redução da velocidade para que o condutor consiga parar o veículo dentro do alcance da visibilidade dos faróis e manter o controle total do veículo"],["p1m3q372",3,1,"Em cruzamento, qual atitude reduz o risco de impacto transversal?","","Diminuir a velocidade e observar bem antes de avançar.","Acelerar para “não atrapalhar”.","Passar “colado” em quem está à frente.","Confiar só no sinal verde.","Conforme os princípios da Direção Defensiva, a colisão transversal é o tipo mais perigoso em cruzamentos. O risco é drasticamente reduzido ao se adotar a regra de \"ver e ser visto\". O condutor deve reduzir a velocidade para garantir que terá tempo de reação e, principalmente, olhar para ambos os lados antes de atravessar, mesmo que a preferência seja dele, a fim de prever e evitar a imprudência de outros motoristas que possam desrespeitar a sinalização ou a preferência."],["p1m3q373",3,1,"Em um cruzamento sem sinal, quem deve passar primeiro?","","O veículo que vem pela direita.","O maior veículo.","O motorista mais apressado.","Quem buzinar primeiro.","A preferência é do veículo que vier pela direita do condutor, assumindo que nenhuma das vias seja rotatória ou rodovia e não haja veículos sobre trilhos."],["p1m3q374",3,1,"Em uma estrada molhada, o motorista pisa forte no freio e o carro derrapa. O que ele fez de errado?","","Não reduziu a velocidade e freou bruscamente.","Usou o farol baixo.","Estava com o cinto de segurança.","Seguiu o limite da via.","Em condições de chuva, a aderência dos pneus é reduzida (aumentando o risco de aquaplanagem) e o tempo de frenagem aumenta, enquanto o campo de visão diminui. A Direção Defensiva exige a redução da velocidade para que o condutor consiga parar o veículo dentro do alcance da visibilidade dos faróis e manter o controle total do veículo"],["p1m3q375",3,1,"Em via com corredor estreito, uma moto se aproxima pelo lado do veículo. Condutor do carro deve:","","Manter trajetória previsível, reduzir e sinalizar antes de qualquer mudança.","Jogar o carro para o meio para “fechar”.","Abrir porta sem olhar.","Buzinar e acelerar.","O motorista deve sinalizar e verificar antes de qualquer mudança de faixa e manter a distância lateral mesmo em condições de trânsito lento, garantindo a segurança do motociclista."],["p1m3q376",3,1,"Em via com velocidade máxima de 80 km/h, começou a chover forte. Qual decisão correta?","","Reduzir para uma velocidade segura (ex.: 70, 60 ou menos).","Manter 80 km/h, porque “está na placa”.","Acelerar para sair da chuva.","Ligar farol alto e seguir igual.","Em condições de chuva, a aderência dos pneus é reduzida (aumentando o risco de aquaplanagem) e o tempo de frenagem aumenta, enquanto o campo de visão diminui. A Direção Defensiva exige a redução da velocidade para que o condutor consiga parar o veículo dentro do alcance da visibilidade dos faróis e manter o controle total do veículo"],["p1m3q377",3,0,"José vê uma poça d’água grande e decide jogar o carro sobre ela para “brincar”. Isso é:","","É infração média e o principal risco é a aquaplanagem.","Um jeito de testar o carro.","Uma forma de limpar os pneus.","Uma diversão sem risco.","Conforme estabelece o Art. 171 do CTB, usar o veículo para arremessar água ou detritos sobre pedestres ou outros veículos é considerado infração média, sujeita a multa. Além da penalidade, a Direção Defensiva identifica o risco de aquaplanagem (perda de contato do pneu com o solo devido à camada de água), o que provoca a perda total de controle do veículo, pondo em risco a segurança."],["p1m3q378",3,1,"Marcos ultrapassa outro carro em local proibido. Qual o perigo maior nessa atitude?","","Colidir de frente com quem vem no sentido contrário.","Ser multado por excesso de velocidade.","Ser seguido por outros carros.","Gastar mais combustível.","Conforme estabelece o Art. 203, inciso V do CTB, ultrapassar pela contramão em locais proibidos (como faixas contínuas, curvas ou aclives) é infração gravíssima com penalidade de multa multiplicada por cinco e suspensão do direito de dirigir. O risco é máximo porque, ao invadir a contramão, o motorista não tem tempo ou espaço de reação caso um veículo se aproxime, levando a colisões frontais, que são o tipo de acidente mais letal."],["p1m3q379",3,1,"Motociclista passa rápido entre carros parados. O mais seguro é:","","Evitar a manobra e manter controle e distância.","Acelerar para sair antes.","Passar “colado” no retrovisor.","Alternar zigue-zague.","Conforme os princípios da Direção Defensiva, a alta velocidade no \"corredor\" é o maior risco. A segurança exige velocidade reduzida para dar tempo de reação, pois a qualquer momento, um motorista pode abrir a porta, iniciar uma troca de faixa inesperada, ou o trânsito pode voltar a fluir. O Art. 29, inciso II do CTB exige que se guarde distância de segurança, e a alta velocidade anula essa margem."],["p1m3q380",3,1,"No cruzamento, você tem a preferência, mas vê um pedestre já no meio da faixa. O que fazer?","","Ceder a passagem e aguardar a travessia.","Forçar a passagem para “ensinar a regra”.","Passar pela contramão.","Buzinar sem parar.","Conforme estabelece o Art. 70 do CTB, os pedestres que estiverem atravessando a via sobre as faixas a eles destinadas terão prioridade de passagem sobre os veículos. Mesmo que o motorista tivesse preferência sobre outros veículos, o Art. 214, inciso IV, define como infração gravíssima deixar de dar preferência a pedestre que já tenha iniciado a travessia. A segurança e a prioridade do pedestre são absolutas."],["p1m3q381",3,0,"Num cruzamento semaforizado, você percebe pedestres já iniciando a travessia no fim do sinal verde. Conduta segura:","","Aguardar a liberação total da faixa antes de partir.","Acelerar “no amarelo” para sair.","Buzinar forte para “abrir caminho”.","Desviar pela faixa de ônibus.","Conforme estabelece o Art. 70 do CTB, os pedestres que estiverem atravessando a via sobre as faixas a eles destinadas têm prioridade de passagem sobre os veículos. Além disso, o Art. 214, inciso IV, define como infração gravíssima deixar de dar preferência a pedestre que já tenha iniciado a travessia. A conduta segura exige a parada total, pois a preferência do pedestre é absoluta, independentemente da cor do semáforo."],["p1m3q383",3,1,"O motorista deve proteger quem no trânsito?","","Os mais frágeis: pedestres, ciclistas e motociclistas.","Somente quem tem carro.","Quem anda rápido.","Ninguém além dele mesmo.","Os condutores de veículos maiores são responsáveis pela segurança dos menores, os motorizados pelos não motorizados, e, juntos, todos são responsáveis pela segurança dos pedestres. Esta regra impõe a obrigação legal de o condutor do veículo maior (e mais perigoso) ter a máxima cautela e a responsabilidade de zelar pela integridade física dos usuários mais vulneráveis da via."],["p1m3q384",3,1,"O que diz a ideia da Visão Zero?","","Nenhuma morte no trânsito é aceitável.","Alguns acidentes são inevitáveis.","O pedestre é sempre culpado.","Só punir resolve.","A Visão Zero (criada na Suécia e adotada por diversos países) baseia-se na ética de que a vida e a saúde não devem ser sacrificadas pela mobilidade. Sua justificativa legal e filosófica é que, embora os motoristas cometam erros, o sistema viário (engenharia e legislação) deve ser projetado para absorver esses erros sem resultar em morte ou lesão grave. Embora não seja um Artigo do CTB, a ideia da Visão Zero é a filosofia central que orienta as metas de redução de sinistros de trânsito em todo o mundo, incluindo as diretrizes do Sistema Nacional de Trânsito (SNT) brasileiro."],["p1m3q385",3,1,"Por que ficar muito próximo ao carro à frente é perigoso?","","Porque diminui o tempo e a distância de reação.","Porque economiza combustível.","Porque ajuda a “puxar fila”.","Porque evita ultrapassagens.","Conforme estabelece o Art. 29, inciso II do CTB, o condutor deve guardar distância de segurança lateral e frontal, levando em conta a velocidade e as condições da via. A Direção Defensiva adverte que \"ficar colado\" elimina o tempo de reação (o tempo que leva para o motorista perceber o perigo e começar a frear) e o espaço de frenagem, resultando invariavelmente em colisão traseira, a qual é de responsabilidade do condutor de trás. A regra dos dois segundos é a técnica recomendada para garantir essa margem de segurança."],["p1m3q386",3,1,"Por que chamar de “sinistro” e não “acidente”?","","Porque a maioria dos eventos de trânsito é causada por falha humana ou previsível, e não por \"acaso\" (acidente).","Porque fica mais “bonito”.","Para confundir o motorista.","Porque não tem culpa de ninguém.","Conforme a Lei nº 14.599/2023, que alterou o Art. 291 do CTB (e regulamentações subsequentes), a terminologia \"sinistro de trânsito\" foi adotada para substituir \"acidente\". A justificativa é que a palavra \"acidente\" sugere algo imprevisível ou fortuito, desresponsabilizando os envolvidos. No entanto, mais de 90% dos eventos de trânsito são resultado de falhas humanas previsíveis e evitáveis (como desatenção, velocidade excessiva ou embriaguez). O termo \"sinistro\" traz a conotação de evento danoso e não acidental, reforçando a necessidade de responsabilidade compartilhada e a base da filosofia da Visão Zero."],["p1m3q387",3,1,"Por que o Brasil criou o PNATRANS?","","Para cumprir o compromisso da ONU de reduzir mortes no trânsito.","Para aumentar o número de radares.","Para multar mais motoristas.","Para priorizar o transporte de carga.","Conforme estabelecido pela Lei nº 13.614/2018, que adicionou o Art. 326-A ao CTB, o PNATRANS foi criado com o objetivo geral de reduzir, no mínimo, à metade o índice nacional de mortos e de lesões graves no trânsito em um período de 10 anos. O Plano adota a filosofia de Sistema Seguro e Visão Zero, reconhecendo que os erros humanos são inevitáveis, mas as mortes e ferimentos graves não são, sendo um esforço coletivo e planejado para salvar vidas e melhorar a segurança viária em todo o país."],["p1m3q388",3,1,"Por que o motorista deve ver e ser visto ao se aproximar de travessias?","","Para antecipar movimentos e evitar atropelamentos.","Para mostrar “quem manda”.","Para economizar tempo.","Para disputar espaço com pedestres.","Conforme os princípios da Direção Defensiva, a aplicação da regra \"ver e ser visto\" nas travessias é essencial para a previsão de acidentes. O motorista deve ver para garantir a prioridade do pedestre (Art. 70 do CTB) e evitar a infração (Art. 214, IV). Simultaneamente, o motorista precisa ser visto (utilizando luzes e buzina de forma breve, se necessário) para alertar os usuários vulneráveis. Isso compensa as condições adversas de luz, tempo ou obstáculos, garantindo tempo de reação para ambas as partes."],["p1m3q389",3,1,"Por que o PNATRANS é importante para o motorista comum?","","Porque pretende reduzir pela metade as mortes até 2030.","Porque libera todos de obedecer as regras.","Porque só fala de obras em rodovias.","Porque só vale para capitais.","Conforme estabelece o Art. 326-A do CTB, que instituiu o PNATRANS, a meta central é reduzir em 50% o índice de mortos e lesões graves no trânsito em 10 anos. Para o motorista comum, isso significa que as ações do plano , baseadas na filosofia do Sistema Seguro e da Visão Zero, impactam diretamente sua segurança ao promover melhorias na fiscalização, na educação e na infraestrutura das vias, criando um sistema de trânsito mais protetor que minimiza a chance de um erro humano resultar em tragédia."],["p1m3q390",3,1,"Por que o respeito às leis de trânsito é um ato de cidadania?","","Porque protege vidas e o bem coletivo.","Porque evita multas apenas.","Porque mostra quem é mais forte.","Porque dá vantagens.","Conforme estabelece o art. 26 do CTB, os usuários da via devem abster-se de todo ato que possa constituir perigo e devem atuar para a segurança de todos. O respeito às leis (e à sinalização) transcende a obrigação legal; é um ato de cidadania, pois garante a preservação da vida (principal valor do trânsito), o direito à integridade física de terceiros e a fluidez do espaço público. Agir com civilidade e cumprir as regras demonstra a consciência do motorista sobre sua responsabilidade compartilhada na construção de um ambiente social seguro e justo."],["p1m3q391",3,1,"Por que pedestres, ciclistas e motociclistas são vulneráveis?","","Porque estão mais expostos e sofrem mais em caso de impacto.","Porque “atrapalham” os carros.","Porque desrespeitam mais a lei.","Porque não usam a via.","A classificação como \"vulneráveis\" está baseada no baixo nível de proteção que possuem em relação a veículos maiores. O pedestre e o ciclista não têm nenhuma proteção estrutural. O motociclista conta apenas com equipamentos de proteção individual (capacete, roupas), que são insuficientes para absorver a energia de um impacto com um veículo de quatro rodas ou maio"],["p1m3q393",3,1,"Quando há neblina, o motorista deve:","","Reduzir a velocidade e ligar o farol baixo.","Acelerar para sair logo da neblina.","Usar o farol alto.","Ligar o pisca-alerta e seguir rápido.","Conforme estabelece o Art. 40, inciso II do CTB, o condutor deve usar luz baixa nas vias com iluminação pública ou em condições de chuva, neblina, cerração. O uso da luz alta é proibido por refletir nas partículas de água, piorando a visibilidade. Além disso, o Art. 220, inciso III, define como infração grave deixar de reduzir a velocidade sob neblina ou cerração, e a Direção Defensiva exige o aumento da distância de segurança (Art. 29, II) para compensar o maior tempo de reação necessário nessas condições adversas."],["p1m3q394",3,1,"Quem é considerado usuário vulnerável?","","Pedestres, ciclistas, motociclistas e pessoas com deficiência.","Somente motoristas novos.","Passageiros de ônibus.","Agentes de trânsito.","A classificação como \"vulneráveis\" está baseada no baixo nível de proteção que possuem em relação a veículos maiores. O pedestre e o ciclista não têm nenhuma proteção estrutural. O motociclista conta apenas com equipamentos de proteção individual (capacete, roupas), que são insuficientes para absorver a energia de um impacto com um veículo de quatro rodas ou maior. Por isso, o Art. 29, § 2º do CTB estabelece o princípio da responsabilidade compartilhada, onde os condutores de veículos maiores têm a obrigação legal de zelar pela segurança desses usuários mais frágeis."],["p1m3q395",3,1,"Quem tem prioridade de passagem em cruzamento sem sinalização?","","O veículo que estiver à direita.","O veículo maior.","O mais apressado.","Quem estiver de motocicleta.","Conforme estabelece o Art. 29, inciso III, alínea \"c\" do CTB, quando veículos se aproximam de um local não sinalizado, e nenhuma das regras de prioridade mais alta (rodovia ou rotatória) se aplica, a preferência de passagem é sempre de quem vier pela direita do condutor. Esta é a regra geral para a maioria dos cruzamentos urbanos sem sinalização."],["p1m3q396",3,0,"Um amigo pede para você ir mais rápido na estrada. Qual é a atitude correta a ser adotada?","","Manter velocidade segura, sem ceder à pressão.","Acelerar para agradar.","Ultrapassar em curva.","Ignorar a sinalização.","Conforme estabelece o art. 28 do CTB, o condutor deve, a todo momento, ter domínio de seu veículo, dirigindo com a atenção e os cuidados indispensáveis à segurança do trânsito. A velocidade deve ser compatível com as condições da via e do veículo, não excedendo o limite máximo legal. Ceder à pressão de terceiros, como amigos (o chamado \"fator humano\"), e \"apertar o passo\" compromete a segurança, pois a velocidade excessiva é uma das maiores causas de sinistros de trânsito."],["p1m3q397",3,1,"Um carro para na pista para conversar com outro motorista. Essa atitude:","","Aumenta o risco de sinistro e atrapalha o trânsito.","É permitida se o pisca-alerta estiver ligado.","É segura se for por pouco tempo.","Evita enganos de rota.","Conforme estabelece o art. 182, inciso XI do CTB, parar o veículo na pista de rolamento das estradas, das rodovias ou em vias de trânsito rápido é considerado infração gravíssima (sujeita a multa e remoção do veículo). No entanto, o ato de parar para conversar em vias urbanas de fluxo normal, obstruindo o trânsito (não se tratando de emergência ou embarque/desembarque), é geralmente enquadrado como parada indevida no leito da via, constituindo infração média. O principal risco é a criação de um obstáculo inesperado que pode causar sinistros graves de colisão traseira."],["p1m3q398",3,1,"Um condutor fala com o passageiro e se distrai. Quando percebe, o semáforo já ficou vermelho e ele freia bruscamente para conseguir parar. Essa atitude mostra:","","Falta de atenção, uma das principais causas de sinistros.","Habilidade para conversar e dirigir.","Que ele confia na sorte.","Que o sinal demorou demais.","Conforme os princípios da Direção Defensiva, a principal causa de sinistros é a falha humana, sendo a falta de atenção (distração por conversas) um erro de negligência. O condutor falhou na previsão ao não observar a mudança do semáforo (luz amarela) a tempo. O Art. 28 do CTB exige que o motorista tenha, a todo momento, domínio de seu veículo e dirija com a atenção indispensável, e a necessidade de frear bruscamente é a prova de que essa atenção foi perdida, pondo em risco a segurança do trânsito."],["p1m3q399",3,1,"Um condutor pisa forte no freio para brincar com o passageiro. O que ele está fazendo?","","Um comportamento de risco que pode causar colisão traseira.","Uma manobra segura se o carro for novo.","Um gesto de humor no trânsito.","Um exercício de direção.","Conforme estabelece o art. 175 do CTB, utilizar-se do veículo para demonstrar ou exibir manobra perigosa, arrancada brusca, derrapagem ou frenagem com deslizamento ou arrastamento de pneus é considerada infração gravíssima com penalidade de multa multiplicada por dez e suspensão do direito de dirigir. Pisar forte no freio sem necessidade é uma manobra perigosa que demonstra imprudência, coloca os passageiros em risco e pode causar uma colisão traseira, caracterizando uma Direção Não Defensiva."],["p1m3q400",3,1,"Um motociclista faz zigue-zague entre os carros no trânsito. Essa atitude:","","É perigosa e pode causar colisões.","É aceitável em baixa velocidade.","Mostra habilidade no trânsito.","Evita atrasos com segurança.","Conforme estabelece o art. 175 do CTB, utilizar-se do veículo para demonstrar ou exibir manobra perigosa mediante zigue-zague ou arrastamento de pneus, é considerado infração gravíssima, sujeita a multa (multiplicada por dez) e suspensão do direito de dirigir. O zigue-zague é uma manobra que demonstra imprudência, impede que os condutores prevejam o movimento da motocicleta e coloca em risco extremo a segurança de todos os usuários da via."],["p1m3q401",3,1,"Um motociclista passa entre os carros em alta velocidade. O que pode acontecer?","","Um sinistro grave, pois reduz o espaço e aumenta o risco de colisão.","Nada, se ele for experiente.","É permitido quando o trânsito está parado.","É mais seguro do que esperar na pista.","O condutor deve observar o trânsito e manter a velocidade da via."],["p1m3q402",3,1,"Um motorista percebe que a pista está com óleo e continua rápido. O que pode ocorrer?","","O carro derrapar e causar um sinistro.","Nada, se ele for experiente.","Melhor aderência dos pneus.","Viagem mais tranquila.","O óleo na pista atua como um lubrificante, reduzindo drasticamente o atrito entre os pneus e o pavimento. A alta velocidade, nessas condições, torna impossível manter a aderência e o controle do veículo (Direção Defensiva), aumentando drasticamente o risco de derrapagem em curvas e frenagens, levando a um sinistro grave."],["p1m3q403",3,1,"Um motorista tenta atravessar uma poça d’água grande em alta velocidade. O que pode ocorrer?","","Perder o controle do veículo e causar sinistro.","Limpar o carro com a água.","Economizar tempo.","Melhorar o desempenho do motor.","Conforme estabelece a Direção Defensiva, a alta velocidade ao atravessar uma poça d'água grande cria o fenômeno da aquaplanagem. O risco ocorre porque os pneus não conseguem drenar toda a água, formando uma camada de água entre o pneu e o asfalto. Essa condição anula a aderência e o atrito, resultando na perda total de contato com o pavimento. A conduta de não reduzir a velocidade em condições adversas (água na pista) é uma falha de previsão e negligência, aumentando o risco de sinistros graves."],["p1m3q404",3,1,"Um motorista vê uma blitz e tenta fazer retorno para escapar. Essa ação mostra:","","Falta de responsabilidade e risco de causar sinistro.","Inteligência para evitar multa.","Atitude comum e sem perigo.","Direito do motorista.","A tentativa de retorno brusco para fugir da blitz é um ato de imprudência (Direção Não Defensiva) que, além de ser punível pela manobra, coloca em risco a segurança do trânsito ao forçar outros veículos a frear e ao criar uma situação de desordem na via."],["p1m3q405",3,1,"Um motorista vê uma pessoa com deficiência atravessando. O que deve fazer?","","Parar totalmente e esperar.","Reduzir e buzinar.","Passar devagar ao lado.","Fazer sinal com o farol.","Conforme estabelece o Art. 70 do CTB, os pedestres que estiverem atravessando a via têm prioridade de passagem sobre os veículos. Essa prioridade é reforçada pelo Art. 214, inciso III, que estabelece como infração gravíssima deixar de dar preferência a pedestres portadores de deficiência física, crianças, idosos e gestantes. O motorista deve parar o veículo, garantindo a segurança e o direito de locomoção do pedestre vulnerável."],["p1m3q406",3,1,"Você entra numa via, com muitos comércios e travessias. Qual decisão segura?","","Ajustar a velocidade ao fluxo e ficar atento a travessias.","Manter a velocidade da última via.","Acelerar para não prender o tráfego.","Ignorar pedestres fora da faixa.","O condutor deve estar atento ao tipo de via que circula."],["p1m3q407",3,1,"Você vê um caminhão manobrando numa esquina. O que fazer?","","Dar espaço, manter distância e aguardar a manobra.","Fechar a frente para “passar primeiro”.","Buzinar e colar na traseira.","Forçar a ultrapassagem pela direita.","Veículos longos precisam de espaço para manobras. A Direção Defensiva exige que o motorista preveja a dificuldade da manobra e pare o veículo, evitando o risco de ser atingido pela traseira ou lateral do caminhão no chamado \"falso traçado\" da curva, onde o veículo de grande porte invade a faixa adjacente para completar a manobra."],["p1m3q408",3,1,"Cenário: Você avista um carro parado no meio da pista após sofrer uma colisão leve (sinistro sem vítimas). Pergunta: De acordo com o CTB, qual é a conduta obrigatória do motorista envolvido (ou de quem presta socorro) em relação ao veículo imobilizado?","","Retirar os veículos para local seguro.","Deixar parado até a polícia chegar.","Discutir no meio da pista.","Ir embora sem falar nada.","Conforme estabelece o Art. 178 do CTB (e, principalmente, o Art. 176, inciso VII), o condutor envolvido em sinistro tem o dever de adotar providências para remover o veículo do local, quando possível, a fim de restabelecer a segurança e a fluidez da via."],["p1m3q409",3,2,"Ao iniciar uma pista dupla, o motociclista deve","","Manter-se na faixa correta, com distância lateral segura e atenção às conversões.","Transitar entre os carros para economizar tempo.","Trafegar sobre o canteiro.","Ultrapassar pela direita de outros veículos.","Conforme estabelece o Art. 29, inciso IV do CTB, em pistas de rolamento que comportem várias faixas de circulação no mesmo sentido, as faixas da direita são destinadas ao deslocamento dos veículos mais lentos e de maior porte, enquanto as da esquerda são para ultrapassagem e veículos de maior velocidade. Como regra de segurança e Direção Defensiva, o motociclista deve iniciar o trânsito na faixa mais à direita e só usar a faixa da esquerda para ultrapassar."],["p1m3q410",3,2,"Depois de uma batida leve, dois motoristas começam a discutir no meio da pista, atrapalhando o trânsito. Qual seria a atitude correta?","","Sinalizar o local, tirar os veículos da via e conversar com calma em local seguro.","Deixar os carros parados até a polícia chegar.","Gritar para mostrar quem tem razão.","Ir embora sem falar nada.","Após sinistros sem feridos, o CTB determina a liberação da via e a preservação da segurança. O condutor envolvido em sinistro tem o dever de adotar providências para remover o veículo do local, quando possível, a fim de restabelecer a segurança e a fluidez da via."],["p1m3q411",3,2,"Durante a chuva, o carro de um motorista começa a deslizar. O que ele deve fazer?","","Tirar o pé do acelerador e segurar firme o volante, sem frear bruscamente.","Pisar forte no freio.","Virar o volante de uma vez.","Acelerar para endireitar o carro.","Conforme os princípios da Direção Defensiva, quando o veículo perde aderência (desliza), o motorista deve evitar reações bruscas. Pisar no freio ou virar a direção abruptamente agrava a situação. A atitude correta é tirar o pé do acelerador (para reduzir a velocidade e transferir o peso para as rodas dianteiras) e manter o volante firme e apontado para onde se deseja ir."],["p1m3q412",3,2,"O que o condutor deve fazer ao se aproximar de uma passagem de nível sem barreira?","","Reduzir a velocidade, parar, olhar para os dois lados e só atravessar se for seguro.","Acelerar para atravessar rapidamente.","Buzinar e seguir direto.","Parar sobre os trilhos e observar.","A travessia só deve ser feita após se certificar de que não há trem se aproximando."],["p1m3q413",3,2,"Qual atitude demonstra direção defensiva em um declive acentuado?","","Reduzir a marcha antes da descida, manter controle e não frear continuamente.","Descer em ponto morto e frear só no final.","Acelerar para ganhar tempo.","Ligar o pisca-alerta durante toda a descida.","A condução segura depende do controle de velocidade e uso correto do freio-motor."],["p1m3q414",3,2,"Qual é a posição correta das mãos no volante durante curvas seguidas?","","As duas mãos firmes no volante, ajustando o movimento conforme a curva.","Uma mão só no volante e outra no celular.","Uma mão no câmbio e outra no volante.","Mãos cruzadas em cima do volante.","O controle firme com as duas mãos garante estabilidade e precisão."],["p1m3q415",3,2,"Se o motorista errar a bifurcação, o que deve fazer?","","Seguir até um local seguro para retornar.","Dar ré imediatamente.","Fazer conversão no meio da pista.","Parar no cruzamento.","Nunca retorne de forma perigosa e espere um ponto permitido e seguro"],["p1m3q416",3,2,"Um motorista percebe que outro cometeu um erro no trânsito. Qual deve ser sua reação?","","Manter a calma e evitar discutir ou revidar.","Fechar o outro carro para ensinar uma lição.","Buzinar de forma insistente.","Gritar para mostrar que tem razão.","Os condutores devem manter o bom convívio no trânsito."],["p1m3q417",3,0,"Um motorista troca de faixa sem olhar o retrovisor e causa uma freada brusca atrás. O que ele fez de errado?","","Falta de atenção e verificação antes da manobra.","Errou o momento de acelerar.","Não ligou o farol alto.","Estava devagar demais.","O condutor deve estar sempre atento aos arredores."],["p1m3q418",3,0,"Ao se aproximar da linha férrea, o motorista deve:","","Parar o veículo antes dos trilhos, mesmo que o trem ainda esteja longe.","Parar sobre os trilhos para enxergar melhor.","Passar rapidamente para não atrapalhar.","Esperar o trem parar para atravessar junto.","O local correto para parar é antes dos trilhos, garantindo total visibilidade."],["p1m3q419",3,0,"Como deve agir o motociclista em local com trânsito de pedestres?","","Reduzir a velocidade e respeitar a distância lateral.","Passar entre os pedestres.","Acelerar para não perder o equilíbrio.","Subir na calçada.","Motociclistas também devem garantir segurança aos pedestres."],["p1m3q420",3,0,"Em uma estrada com muitas curvas, qual atitude mostra um motorista prudente?","","Manter distância do carro da frente e velocidade permitida e segura.","Ficar colado no carro da frente.","Ligar o pisca-alerta e andar devagar no meio da pista.","Frear toda hora.","A distância ajuda a evitar colisões se o carro da frente frear."],["p1m3q421",3,0,"Em uma pista dupla, o condutor deve:","","Circular sempre no lado direito, usando a esquerda apenas para ultrapassagem.","Circular em qualquer faixa, conforme desejar.","Usar o canteiro central para estacionar.","Andar na contramão para economizar tempo.","O trânsito em pista dupla segue o mesmo princípio das vias de mão dupla — sempre à direita."],["p1m3q422",3,0,"Em vias com pista dividida, o motorista deve:","","Permanecer em sua faixa e respeitar a sinalização horizontal.","Utilizar o canteiro central para retorno.","Inverter o sentido quando desejar.","Trafegar entre os dois sentidos.","O canteiro central não é área de manobra, o retorno deve ocorrer apenas em locais permitidos."],["p1m3q423",3,0,"O que muda para o motorista quando a pista dupla termina?","","É preciso redobrar a atenção, pois o tráfego passa a ocorrer em sentidos opostos na mesma pista.","A pista fica mais larga.","O trânsito passa a ser de sentido único.","O limite de velocidade aumenta.","O retorno à pista simples aumenta o risco de colisões frontais se o condutor não redobrar a atenção."],["p1m3q424",3,0,"O que o motociclista deve fazer ao enfrentar uma subida íngreme?","","Reduzir a marcha e acelerar de forma contínua, sem trancos.","Subir em ponto morto.","Frear no meio da subida.","Parar e empurrar a moto.","A aceleração constante e o uso de marcha adequada evitam quedas."],["p1m3q425",3,0,"O que o motociclista deve fazer ao entrar em uma pista dividida?","","Manter-se visível, respeitar a faixa e as regras de circulação.","Acelerar para ultrapassar outros veículos.","Transitar entre as faixas para se posicionar.","Usar o acostamento para segurança.","A segurança do motociclista depende da posição estável e previsível no fluxo de tráfego."],["p1m3q426",3,0,"O que o motorista nunca deve fazer ao encontrar um trator à frente?","","Ultrapassar em local sem visibilidade.","Reduzir a velocidade.","Aguardar local seguro para a ultrapassagem.","Acionar a seta.","A ultrapassagem em locais indevidos é uma das principais causas de sinistros fatais."],["p1m3q427",3,0,"O que o motorista nunca deve fazer em uma passagem de nível sem barreira?","","Parar sobre os trilhos ou tentar atravessar enquanto o trem se aproxima.","Aguardar com calma o trem passar.","Acionar o freio antes dos trilhos.","Verificar se há sinal sonoro de trem.","Ficar sobre os trilhos é extremamente perigoso, o trem tem prioridade absoluta."],["p1m3q428",3,0,"O que pode acontecer se o motorista fizer as curvas rápidas demais?","","O carro pode sair da pista ou tombar.","O carro fica mais econômico.","O pneu esfria mais rápido.","Nada acontece.","O excesso de velocidade é a principal causa de acidentes em curvas."],["p1m3q429",3,0,"O que pode acontecer se o motorista passar muito rápido sobre uma lombada?","","Danos na suspensão, perda de controle ou sinistro, dependendo da velocidade.","Melhora no desempenho do veículo.","Nenhum risco.","Economia de combustível.","A travessia brusca pode causar sinistro ou quebra de peças do veículo."],["p1m3q430",3,0,"Por que é importante manter distância dos tratores?","","Porque eles são lentos e podem fazer manobras inesperadas.","Porque eles andam rápido.","Porque usam farol alto.","Porque sempre param no acostamento.","Tratores têm menor estabilidade e precisam de espaço para manobrar com segurança."],["p1m3q431",3,0,"Por que é importante reduzir a velocidade em pista irregular?","","Para evitar perda de controle e danos ao veículo.","Para economizar combustível.","Para não sujar o carro.","Porque é proibido dirigir rápido.","Buracos e desníveis podem causar acidentes e avarias na suspensão e pneus."],["p1m3q432",3,0,"Por que é perigoso buzinar quando há animais na pista?","","Porque o som pode assustar o animal e fazê-lo correr na direção do veículo.","Porque o som atrai outros animais.","Porque o buzinaço é proibido em toda a zona rural.","Porque gasta bateria.","O ruído repentino pode causar reações imprevisíveis e aumentar o risco de sinistro."],["p1m3q433",3,0,"Por que é perigoso descer em ponto morto?","","Porque o motorista perde o controle e os freios esquentam mais rápido.","Porque o carro gasta mais combustível.","Porque o motor pode desligar.","Porque o ar-condicionado para de funcionar.","Descer em ponto morto é perigoso, pois o carro fica sem freio-motor."],["p1m3q434",3,0,"Por que é perigoso tentar passar antes do trem?","","Porque o trem é muito pesado, demora a frear e pode causar tragédias.","Porque o trem anda devagar e não há risco.","Porque há câmeras que multam quem faz isso.","Porque o trem sempre para antes da linha.","Um trem pode levar até 1 km para parar totalmente, nunca tente atravessar antes dele."],["p1m3q435",3,0,"Por que não é bom subir uma ladeira em marcha alta?","","Porque o motor perde força e o carro pode falhar.","Porque gasta mais combustível.","Porque o carro fica mais leve.","Porque os freios não funcionam.","Marcha alta exige mais força do motor, dificultando a subida."],["p1m3q436",3,0,"Por que o uso excessivo da buzina é considerado prejudicial à convivência no trânsito?","","Porque causa poluição sonora e confundir os demais condutores.","Porque gasta bateria.","Porque aumenta o consumo de combustível.","Porque danifica os pneus.","O ruído excessivo é fator de estresse urbano e compromete a harmonia social."],["p1m3q437",3,0,"Qual comportamento é mais seguro antes de começar um trecho em declive?","","Reduzir a marcha e manter velocidade baixa.","Colocar o carro em ponto morto.","Frear forte o tempo todo.","Desligar o motor.","A marcha reduzida ajuda o freio-motor a controlar o carro."],["p1m3q438",3,0,"Quando o motorista se aproxima de um local com essa sinalização, deve:","A-40","Reduzir a velocidade e parar se a cancela estiver baixada ou descendo.","Acelerar para cruzar antes que a barreira feche.","Buzinar para o guarda liberar a passagem.","Parar sobre os trilhos.","A cancela indica a aproximação de trem, o motorista deve esperar até a liberação completa."],["p1m3q439",3,0,"Quando o pedestre inicia a travessia, o motorista deve:","A-32a","Parar o veículo e aguardar a passagem completa.","Seguir ao lado do pedestre.","Passar rápido antes que ele termine.","Buzinar para apressar a travessia.","A prioridade é do pedestre que já iniciou a travessia."],["p1m3q440",3,0,"Um motorista entra em uma rua sem saída e percebe que há crianças brincando no final. O que deve fazer?","","Reduzir a velocidade e realizar o retorno com muito cuidado.","Acelerar para sair rápido.","Usar a buzina para afastar as crianças.","Estacionar na calçada.","O espaço reduzido exige paciência e atenção redobrada a pedestres e crianças."],["p1m3q441",3,1,"Ao dirigir em uma estrada com várias curvas acentuadas, o condutor deve:","","Manter velocidade segura, sem ultrapassar nas curvas.","Acelerar nas saídas para compensar o tempo.","Ultrapassar veículos lentos dentro da curva.","Reduzir apenas nas retas.","A ultrapassagem em curva é proibida e altamente perigosa."],["p1m3q442",3,1,"Ao fazer várias curvas seguidas, o que o motorista deve observar com atenção?","","O traçado da estrada e os carros que vêm no sentido contrário.","O celular.","O rádio do carro.","Se vai chover.","Olhar o caminho ajuda a prever as curvas e dirigir com mais segurança."],["p1m3q443",3,1,"Durante uma longa descida, o que pode acontecer se o motorista usar só o freio de pé o tempo todo?","","O freio pode esquentar e perder a eficiência.","O carro vai parar mais rápido.","O motor economiza energia.","Nada acontece.","O superaquecimento reduz a força de frenagem e causa risco de pane."],["p1m3q444",3,2,"Em uma curva acentuada à esquerda, a força centrífuga (gerada ao entrar em curva) atua de que forma?","","Empurrando o veículo para fora da curva, em direção ao lado direito da via.","Empurrando o veículo para o centro da curva.","Ajudando o veículo a fazer a curva.","Mantendo o veículo parado.","A força centrífuga tende a lançar o veículo para fora da trajetória curva."],["p1m3q445",3,1,"Em uma curva leve à esquerda, qual é o ponto mais seguro para iniciar a retomada de velocidade?","","Na saída da curva, quando a via estiver visível e livre.","No meio da curva.","Logo na entrada da curva.","Durante a frenagem.","Acelerar apenas quando o veículo estiver estabilizado evita derrapagens."],["p1m3q446",3,1,"O que o condutor deve fazer se o carro ganhar velocidade demais na descida?","","Reduzir a marcha e controlar com o freio-motor.","Desligar o motor.","Frear bruscamente.","Jogar o carro para o acostamento.","A força do motor ajuda a segurar o carro, evitando desgaste dos freios."],["p1m3q447",3,1,"Por que é perigoso ultrapassar em trechos com curvas em “S”?","","Porque não há boa visibilidade da pista contrária.","Porque o carro pode quebrar o câmbio.","Porque o pneu gasta mais.","Porque o carro fica mais lento.","As curvas tiram a visão do motorista, aumentando o risco de colisão."],["p1m3q448",3,1,"Por que há limite de comprimento em algumas vias?","","Porque curvas fechadas, pontes e túneis podem não comportar veículos longos.","Porque veículos longos causam poluição.","Porque isso reduz o consumo de combustível.","Porque impede o trânsito de motocicletas.","O raio de curvatura e a geometria da via determinam a necessidade de limitação de comprimento."],["p1m3q449",3,1,"Qual é o risco mais comum em curvas acentuadas à esquerda?","","Perda de aderência dos pneus e saída da faixa de rolamento.","Aquaplanagem em linha reta.","Falta de combustível.","Redução da visibilidade noturna.","Entrar rápido demais pode levar o veículo a invadir a faixa contrária ou sair da pista."],["p1m3q450",3,1,"Se houver um caminhão entrando lentamente pela esquerda, o que deve fazer o motorista de carro?","","Diminuir a velocidade e esperar o caminhão completar a manobra.","Tentar ultrapassar rápido.","Buzinar e seguir colado.","Jogar o carro para o acostamento.","Respeitar o tempo do caminhão é atitude prudente e segura."],["p1m3q451",3,1,"Para dirigir ônibus escolar, coletivo ou produto perigoso, o que além da categoria é exigido?","","Curso especializado com treinamento prático- ambulância exige curso a cada 5 anos.","Apenas colete refletivo.","Autorização do chefe por escrito.","Só experiência de 2 anos.","Cursos específicos."],["p1m3q452",3,0,"Qual o prazo de validade da Permissão Para Dirigir (PPD), que é a sua primeira habilitação?","","1 (um) ano.","6 (seis) meses.","2 (dois) anos.","O prazo é de 5 anos, como a CNH definitiva.","A PPD é a sua \"habilitação provisória\" e é válida por um ano inteiro, funcionando como um período de experiência para o condutor novato."],["p1m3q453",3,0,"Na Categoria B, que é a mais procurada, qual é o limite de peso total (PBT) do veículo que você pode dirigir?","","3.500 kg (três mil e quinhentos quilos).","4.500 kg (quatro mil e quinhentos quilos).","1.000 kg (mil quilos).","Não há limite de peso, desde que não seja ônibus ou caminhão.","O limite de peso para veículos da Categoria B, como carros de passeio e utilitários leves, é de 3.500 kg."],["p1m3q454",3,1,"Se você acabou de pegar a sua PPD (Permissão Para Dirigir), qual é a regra mais importante sobre infrações que você deve seguir para conseguir a CNH definitiva?","","Não cometer nenhuma infração grave, gravíssima ou ser reincidente em infração média.","Não cometer nenhuma infração gravíssima.","Não cometer mais de duas infrações leves.","Cometer apenas infrações de natureza leve.","Durante o período da PPD, é proibido cometer infração grave, gravíssima ou repetir uma infração média. É o seu período de responsabilidade redobrada."],["p1m3q455",3,0,"As vias urbanas são divididas em tipos. Qual delas é conhecida como a rua do seu bairro, onde ficam as casas e a velocidade máxima permitida é mais baixa, de 30 km/h?","","Vias Locais.","Vias Coletoras.","Vias Arteriais.","Vias de Trânsito Rápido.","As Vias Locais são as ruazinhas tranquilas do bairro, as áreas de convivência, e a velocidade máxima permitida é de 30km/h."],["p1m3q456",3,0,"Na Categoria A, que é a do \"Mundo das Duas Rodas\", qual tipo de veículo você está autorizado a conduzir?","","Motocicletas, motonetas, ciclomotores e triciclos motorizados.","Apenas motocicletas e triciclos motorizados.","Carros de passeio e picapes leves.","Veículos de duas ou três rodas com mais de $50$ cilindradas.","A Categoria A libera você para pilotar todos os veículos motorizados de duas ou três rodas, como motos, scooters e triciclos."],["p1m3q457",3,1,"Nas Rodovias, qual é uma dica essencial de segurança para que outros motoristas percebam sua presença mais facilmente?","","Manter o farol baixo sempre ligado, mesmo durante o dia.","Usar o farol alto apenas nos túneis.","Usar as luzes de neblina o tempo todo.","Buzinar rapidamente antes de ultrapassar.","Manter o farol baixo aceso, mesmo de dia, ajuda outros motoristas a verem seu veículo de longe e com mais facilidade, aumentando a segurança."],["p1m3q458",3,0,"Se você está dirigindo na cidade, qual é a velocidade máxima permitida em uma Via Arterial, que liga os bairros principais e tem vários semáforos e faixas de pedestres?","","60km/h.","80km/h.","30km/h.","40km/h.","As Vias Arteriais são importantes avenidas com bastante fluxo, e o limite de velocidade é de 60km/h."],["p1m3q459",3,0,"O que a Direção Defensiva ensina você a fazer para proteger sua vida e a dos outros?","","Manter a atenção, antecipar imprevistos e prever situações de risco.","Dirigir sempre no limite máximo de velocidade.","Confiar apenas na preferência que você tem na via.","Fazer revisões somente quando o veículo apresentar algum problema grave.","A Direção Defensiva se baseia em manter a atenção, antecipar o que pode dar errado e proteger a vida de todos no trânsito."],["p1m3q460",3,1,"Um carro popular ou um SUV se encaixa na Categoria B, mas ele deve respeitar um limite máximo de lugares, sem contar o motorista. Quantos lugares são permitidos?","","8 lugares, sem contar o motorista.","9 lugares, contando o motorista.","5 lugares, sem contar o motorista.","10 lugares, contando o motorista.","O limite da Categoria B é de veículos com até 8 lugares, além do motorista. Veículos maiores, como vans e ônibus, exigem categorias específicas (D)."],["p1m3q461",3,2,"Ao dirigir em uma Estrada de Terra (não pavimentada), um risco que aumenta muito e exige que você triplique a distância do veículo da frente é:","","A poeira levantada, que prejudica a sua visibilidade.","A possibilidade de encontrar animais selvagens.","O asfalto escorregadio após a chuva.","A falta de postos de gasolina e áreas de descanso.","Em estrada de terra, a poeira que sobe reduz muito a visibilidade. Por isso, aumentar a distância do carro da frente é crucial para a segurança."],["p1m3q462",3,0,"Se você escolheu a Categoria A ao tirar sua primeira CNH, qual o tipo de veículo que essa categoria permite pilotar?","","Veículos de duas ou três rodas com motor (motocicletas, motonetas, ciclomotores e triciclos).","Apenas motos de alta cilindrada.","Carros de passeio e utilitários leves.","Veículos de até 8 lugares, sem contar o motorista.","A Categoria A é o \"Mundo das Duas Rodas\" e inclui todos os veículos motorizados de duas ou três rodas."],["p1m3q463",3,0,"Para conseguir a CNH definitiva, qual infração gravíssima você não pode cometer durante o período de 1 ano da PPD?","","Nenhuma infração gravíssima.","Apenas uma infração gravíssima é permitida.","Apenas infrações gravíssimas relacionadas à velocidade.","Nenhuma, mas pode cometer 2 infrações graves.","Para ter a CNH definitiva, você não pode cometer nenhuma infração de natureza gravíssima ou grave."],["p1m3q464",3,0,"O que as Rodovias Pavimentadas (asfaltadas ou de concreto) oferecem para permitir velocidades maiores?","","Boa aderência dos pneus, drenagem adequada e sinalização completa.","Mais postos de gasolina e áreas de descanso.","Baixa aderência dos pneus, forçando a reduzir a velocidade.","Pista de terra batida para maior atrito.","Rodovias pavimentadas garantem a segurança em alta velocidade pela boa aderência, drenagem e sinalização."],["p1m3q465",3,0,"O que significa a sigla PPD, que você recebe após ser aprovado em todos os exames?","","Permissão Para Dirigir.","Permissão de Prática Defensiva.","Punição Por Distração.","Plano de Prioridade de Direção.","A PPD é a sua \"habilitação provisória\", válida por 1 ano."],["p1m3q466",3,0,"Para quem a Direção Defensiva se dedica a proteger no trânsito?","","A sua vida e a vida de todos os outros.","Apenas o motorista, protegendo-o de multas.","Somente os pedestres e ciclistas.","Apenas a vida do motorista e do veículo.","A direção segura é um conjunto de hábitos para proteger a sua vida E a dos outros, valorizando o respeito e a empatia."],["p1m3q467",3,0,"Qual o limite máximo de velocidade em uma Via Arterial, a avenida que liga os principais bairros da cidade?","","60km/h.","$80~km/h$.","$40~km/h$.","$110~km/h$.","As Vias Arteriais têm semáforos e faixas de pedestres, e a velocidade regulamentada é de 60km/h."],["p1m3q468",3,0,"Em qual categoria se enquadra um triciclo motorizado, que tem três rodas e motor?","","Categoria A.","Categoria B.","Categoria C.","Categoria D.","A Categoria A permite dirigir veículos de duas ou três rodas com motor, incluindo triciclos motorizados."],["p1m3q469",3,0,"Qual é o tipo de via que tem como característica ser uma grande avenida expressa que corta a cidade, sem semáforos nem cruzamentos diretos?","","Vias de Trânsito Rápido.","Vias Coletoras.","Vias Locais.","Rodovias.","As Vias de Trânsito Rápido (limite de 80km/h) são os grandes eixos urbanos com maior fluidez."],["p1m3q470",3,0,"Se você está dirigindo em uma via urbana próxima a escolas, hospitais ou faixas de pedestres, qual deve ser sua atitude de segurança?","","Reduzir a velocidade e ter atenção redobrada.","Manter a velocidade máxima da via para evitar retenções.","Usar o farol alto para sinalizar sua presença.","Parar em fila dupla para buscar informações.","O material orienta a reduzir a velocidade em Áreas Sensíveis, pois a vida de outras pessoas depende da sua cautela."],["p1m3q471",3,
